<style>
  :root {
    --bg: #10161A;
    --surface: #1A2226;
    --surface-2: #212B30;
    --line: #2C373C;
    --green: #2F6FED;
    --green-dim: #1E3A73;
    --amber: #F2A93B;
    --red: #E1584F;
    --text: #F3F6F1;
    --text-muted: #93A19C;
    --radius: 3px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .stat, .num, h1, h2 {
    font-family: 'Oswald', 'Arial Narrow', sans-serif;
  }
  #root { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; position: relative; }

  /* ---------- Login ---------- */
  .login-screen {
    flex: 1; display: flex; flex-direction: column; justify-content: center;
    padding: 32px 28px; gap: 28px;
  }
  .login-screen .brand-block { text-align: left; }
  .brand-logo { width: 320px; max-width: 88%; height: auto; display: block; }
  .tagline { color: var(--text-muted); margin: 18px 0 0; font-size: 14px; letter-spacing: 0.3px; }
  .login-form { display: flex; flex-direction: column; gap: 12px; }
  .login-form label { font-size: 13px; color: var(--text-muted); }
  input[type=text], input[type=password] {
    background: var(--surface); border: 1px solid var(--line); color: var(--text);
    padding: 14px 14px; border-radius: var(--radius); font-size: 17px; font-family: inherit;
    outline: none;
  }
  input[type=text]:focus, input[type=password]:focus { border-color: var(--green); }
  .btn {
    border: none; border-radius: var(--radius); padding: 14px 18px; font-size: 15px;
    font-weight: 600; font-family: 'Inter', sans-serif; cursor: pointer;
    transition: transform 0.08s ease, background 0.15s ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--green); color: #F3F6F1; }
  .btn-primary:hover { background: #4A82F0; }
  .btn-primary:disabled { background: var(--green-dim); color: #5C6E93; cursor: not-allowed; }
  .btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
  .error-text { color: var(--red); font-size: 13px; min-height: 16px; }
  .link-btn {
    background: none; border: none; color: var(--text-muted); font-size: 13px;
    text-decoration: underline; cursor: pointer; padding: 0; text-align: left; font-family: 'Inter', sans-serif;
  }

  /* ---------- Admin ---------- */
  .admin-field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .admin-field-grid label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--text-muted); }
  .admin-field-grid label.span2 { grid-column: 1 / -1; }
  .admin-field-grid input, .admin-field-grid select {
    background: var(--surface-2); border: 1px solid var(--line); color: var(--text);
    padding: 10px 10px; border-radius: var(--radius); font-size: 14px; font-family: inherit; outline: none;
    width: 100%; min-width: 0;
  }
  .admin-field-grid input:focus, .admin-field-grid select:focus { border-color: var(--green); }
  .admin-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .admin-row {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px 14px; display: flex; justify-content: space-between; align-items: center;
  }
  .admin-row-name { font-size: 14px; font-weight: 500; }
  .admin-row-dni { font-size: 12px; color: var(--text-muted); font-weight: 400; }
  .admin-row-meta { font-size: 12px; color: var(--text-muted); margin-top: 4px; display: flex; align-items: center; gap: 8px; }
  .admin-row-asist { font-size: 11px; color: var(--text-muted); margin-top: 4px; opacity: 0.8; }
  .admin-row-actions { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .estado-select {
    font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; border-radius: 20px;
    padding: 5px 10px 5px 12px; border: 1px solid transparent; cursor: pointer; outline: none;
    appearance: none; -webkit-appearance: none;
  }
  .estado-select.estado-activo { background: rgba(47,111,237,0.18); color: var(--green); }
  .estado-select.estado-pausado { background: rgba(242,169,59,0.18); color: var(--amber); }
  .estado-select.estado-baja { background: rgba(225,88,79,0.18); color: var(--red); }
  .estado-select option { background: var(--surface-2); color: var(--text); }

  /* ---------- Admin tabs ---------- */
  .admin-tabs { display: flex; gap: 6px; margin: 4px 0 20px; border-bottom: 1px solid var(--line); }
  .admin-tab {
    background: none; border: none; color: var(--text-muted); font-size: 13px; font-weight: 500;
    padding: 10px 4px; cursor: pointer; font-family: 'Inter', sans-serif; position: relative; margin-right: 18px;
  }
  .admin-tab.active { color: var(--text); }
  .admin-tab.active::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--green);
  }

  /* ---------- Resumen ---------- */
  .resumen-atencion-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
  .resumen-atencion-item {
    display: flex; align-items: center; gap: 12px; width: 100%;
    background: var(--surface); border: none; border-left: 3px solid var(--line);
    border-radius: var(--radius); padding: 12px 14px; cursor: pointer; text-align: left;
    font-family: 'Inter', sans-serif;
  }
  .resumen-atencion-item.sev-urgente { border-left-color: var(--red); }
  .resumen-atencion-item.sev-atencion { border-left-color: var(--amber); }
  .resumen-atencion-num {
    font-family: 'Oswald', sans-serif; font-size: 22px; font-weight: 700; color: var(--text);
    min-width: 28px;
  }
  .sev-urgente .resumen-atencion-num { color: var(--red); }
  .sev-atencion .resumen-atencion-num { color: var(--amber); }

  function seedPlanesIniciales() {
    const tabla = {
      'START':          { 1: 55000, 2: 70000, 3: 80000,  4: 90000,  5: 100000 },
      'PERFORMANCE 2':  {           2: 85000, 3: 95000,  4: 105000, 5: 115000 },
      'PERFORMANCE 3':  {           2: 95000, 3: 105000, 4: 115000, 5: 120000 },
      'PRO':            { null: 125000 },
    };
    const filas = [];
    Object.entries(tabla).forEach(([plan, porDias]) => {
      Object.entries(porDias).forEach(([diasStr, precio]) => {
        const dias = diasStr === 'null' ? null : parseInt(diasStr, 10);
        filas.push({ id: plan + '-' + (dias ?? 'null'), plan, dias, precio });
      });
    });
    return filas;
  }

  function seedConfigInicial() {
    return [{ clave: 'matricula_precio', valor: 30000 }];
  }

  function precioDe(plan, dias) {
    if (!state.data || !state.data.planes) return null;
    const exacto = state.data.planes.find(p => p.plan === plan && p.dias === dias);
    if (exacto) return exacto.precio;
    const integral = state.data.planes.find(p => p.plan === plan && p.dias === null);
    return integral ? integral.precio : null;
  }

  function matriculaPrecio() {
    if (!state.data || !state.data.config) return 30000;
    const fila = state.data.config.find(c => c.clave === 'matricula_precio');
    return fila ? fila.valor : 30000;
  }

  let state = {
    data: null,
    cliente: null,
    view: 'perfil',
    selectedDate: null,
    mode: 'login', // login | adminPin | admin
    loginError: '',
    pinError: '',
    adminFormError: '',
    adminFormNotice: '',
    adminTab: 'resumen', // resumen | clientes | cuotas | asistencias
    editingDni: null,      // dni del cliente en edición, null = alta nueva
    asistenciasFecha: null,
    clienteBusqueda: '',
    rutinasAbiertoDni: null,
  };

  function isoDate(d) {
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  // Lunes de la semana a la que pertenece una fecha (ISO string)
  function mondayOf(fechaIso) {
    const d = new Date(fechaIso + 'T00:00:00');
    const dow = d.getDay(); // 0 domingo .. 6 sábado
    const diff = dow === 0 ? -6 : 1 - dow;
    d.setDate(d.getDate() + diff);
    return d;
  }

  // Días hábiles reservables: de hoy a viernes de esta semana.
  // Si hoy es sábado o domingo, muestra la semana próxima completa (lunes a viernes).
  function bookableWeekdays() {
    return fullBookableWeek().filter(d => d >= todayMidnight());
  }

  function todayMidnight() {
    const t = new Date();
    t.setHours(0, 0, 0, 0);
    return t;
  }

  // Los 5 días (lunes a viernes) de la semana reservable, incluyendo los que ya pasaron
  function fullBookableWeek() {
    const today = todayMidnight();
    const dow = today.getDay();
    let monday = new Date(today);
    if (dow === 0) monday.setDate(today.getDate() + 1);
    else if (dow === 6) monday.setDate(today.getDate() + 2);
    else monday.setDate(today.getDate() - (dow - 1));

    const out = [];
    for (let i = 0; i < 5; i++) {
      const d = new Date(monday);
      d.setDate(monday.getDate() + i);
      out.push(d);
    }
    return out;
  }

  // Total de reservas activas de un cliente dentro de la semana (lun-vie) de 'fechaIso'
  function reservasEnSemana(data, dni, fechaIso) {
    const monday = mondayOf(fechaIso);
    const friday = new Date(monday);
    friday.setDate(monday.getDate() + 4);
    const mondayIso = isoDate(monday);
    const fridayIso = isoDate(friday);
    return data.reservas.filter(r =>
      r.dni === dni && r.estado !== 'cancelado' && r.fecha >= mondayIso && r.fecha <= fridayIso);
  }

  // Cuántos turnos por semana tiene derecho a reservar este cliente
  function limiteSemanalDe(cliente) {
    if (cliente.limiteSemanalOverride != null) return cliente.limiteSemanalOverride;
    if (!cliente.estimulos) return Infinity; // PRO u otros planes integrales
    return cliente.estimulos.fuerza + cliente.estimulos.resistencia + cliente.estimulos.velocidad;
  }

  function clienteDbToJs(row, rutinasPorDni) {
    return {
      dni: row.dni, password: row.password, nombre: row.nombre, email: row.email, telefono: row.telefono,
      plan: row.plan, precio: row.precio, dias: row.dias,
      estimulos: row.estimulo_fuerza === null ? null : {
        fuerza: row.estimulo_fuerza, resistencia: row.estimulo_resistencia, velocidad: row.estimulo_velocidad,
      },
      estado: row.estado,
      limiteSemanalOverride: row.limite_semanal_override,
      matricula: { pagada: row.matricula_pagada, fechaPago: row.matricula_fecha_pago },
      pausadoDesde: row.pausado_desde,
      rutinas: (rutinasPorDni && rutinasPorDni[row.dni]) || [],
    };
  }

  function clienteJsToDb(c) {
    return {
      dni: c.dni, password: c.password, nombre: c.nombre, email: c.email || null, telefono: c.telefono || null,
      plan: c.plan, precio: c.precio, dias: c.dias,
      estimulo_fuerza: c.estimulos ? c.estimulos.fuerza : null,
      estimulo_resistencia: c.estimulos ? c.estimulos.resistencia : null,
      estimulo_velocidad: c.estimulos ? c.estimulos.velocidad : null,
      estado: c.estado,
      limite_semanal_override: c.limiteSemanalOverride,
      matricula_pagada: !!(c.matricula && c.matricula.pagada),
      matricula_fecha_pago: c.matricula ? c.matricula.fechaPago : null,
      pausado_desde: c.pausadoDesde,
    };
  }

  function pagoDbToJs(p) {
    return {
      id: p.id, dni: p.dni, fechaPago: p.fecha_pago, duracionId: p.duracion_id, dias: p.dias,
      monto: p.monto, metodoPago: p.metodo_pago, fechaVencimiento: p.fecha_vencimiento,
    };
  }

  function pagoJsToDb(p) {
    return {
      id: p.id, dni: p.dni, fecha_pago: p.fechaPago, duracion_id: p.duracionId, dias: p.dias,
      monto: p.monto, metodo_pago: p.metodoPago, fecha_vencimiento: p.fechaVencimiento,

  async function sembrarPlanesIniciales() {
    const planesSeed = seedPlanesIniciales();
    const configSeed = seedConfigInicial();
    await sb.from('planes').insert(planesSeed);
    await sb.from('config').insert(configSeed);
  }

  async function refreshData() {
    const [clientesRes, reservasRes, pagosRes, rutinasRes, planesRes, configRes] = await Promise.all([
      sb.from('clientes').select('*'),
      sb.from('reservas').select('*'),
      sb.from('pagos').select('*'),
      sb.from('rutinas').select('*'),
      sb.from('planes').select('*'),
      sb.from('config').select('*'),
    ]);

    if (clientesRes.error || reservasRes.error || pagosRes.error || rutinasRes.error || planesRes.error || configRes.error) {
      const primerError = clientesRes.error || reservasRes.error || pagosRes.error || rutinasRes.error || planesRes.error || configRes.error;
      console.error('Error leyendo Supabase:', primerError.message || primerError);
      showToast('Error de base de datos: ' + (primerError.message || 'desconocido'));
      state.data = state.data || { clientes: [], reservas: [], pagos: [], planes: [], config: [] };
      return;
    }

    // Primera vez que se usa la tabla de planes: sembramos el catálogo de precios
    // (esto sí hace falta siempre — son datos reales, no de prueba)
    if (planesRes.data.length === 0) {
      await sembrarPlanesIniciales();
      return refreshData();
    }

    const rutinasPorDni = {};
    rutinasRes.data.forEach(r => {
      (rutinasPorDni[r.dni] = rutinasPorDni[r.dni] || []).push({ id: r.id, titulo: r.titulo, url: r.url, fecha: r.fecha });
    });

    state.data = {
      clientes: clientesRes.data.map(row => clienteDbToJs(row, rutinasPorDni)),
      reservas: reservasRes.data.map(r => ({ id: r.id, dni: r.dni, fecha: r.fecha, hora: r.hora, estado: r.estado })),
      pagos: pagosRes.data.map(pagoDbToJs),
      planes: planesRes.data.map(p => ({ id: p.id, plan: p.plan, dias: p.dias, precio: p.precio })),
      config: configRes.data.map(c => ({ clave: c.clave, valor: c.valor })),
    };
  }

  function asistenciaMesResumen(data, dni) {
    const hoy = new Date();

    const anioActual = hoy.getFullYear();

      if (r.dni !== dni || r.estado !== 'asistio') return false;
      const d = new Date(r.fecha + 'T00:00:00');
      return d.getMonth() === mesActual && d.getFullYear() === anioActual;
    }).sort((a, b) => b.fecha.localeCompare(a.fecha));
    return { cantidad: asistencias.length, ultima: asistencias[0] ? asistencias[0].fecha : null };
  }

  // ---------------- Admin: Cuotas ----------------
  function ultimoPagoDe(data, dni) {
    const pagos = data.pagos.filter(p => p.dni === dni).sort((a, b) => b.fechaVencimiento.localeCompare(a.fechaVencimiento));
    return pagos[0] || null;
  }

  function estadoCuenta(data, dni) {
    const ultimo = ultimoPagoDe(data, dni);
    if (!ultimo) return { estado: 'Sin pagos', vencimiento: null, ultimo: null };
    const hoy = isoDate(new Date());
    return { estado: hoy > ultimo.fechaVencimiento ? 'Vencido' : 'Al día', vencimiento: ultimo.fechaVencimiento, ultimo };
  }

  const DIAS_AVISO_VENCIMIENTO = 7;

  // Como estadoCuenta pero con prioridad de atención: 0 = urgente (vencido/sin pagos),
  // 1 = vence pronto (dentro de los próximos 7 días), 2 = tranquilo (al día, con margen)
  function cuotaDisplay(data, dni) {
    const cuenta = estadoCuenta(data, dni);
    if (cuenta.estado === 'Vencido') return { ...cuenta, label: 'Vencido', pill: 'pill-red', prioridad: 0, diasRestantes: null };
    if (cuenta.estado === 'Sin pagos') return { ...cuenta, label: 'Sin pagos', pill: 'pill-red', prioridad: 0, diasRestantes: null };
    const hoy = todayMidnight();
    const venc = new Date(cuenta.vencimiento + 'T00:00:00');
    const diasRestantes = Math.round((venc - hoy) / 86400000);
    if (diasRestantes <= DIAS_AVISO_VENCIMIENTO) {
      return { ...cuenta, label: 'Vence pronto', pill: 'pill-amber', prioridad: 1, diasRestantes };
    }
    return { ...cuenta, label: 'Al día', pill: 'pill-green', prioridad: 2, diasRestantes };
  }

  async function registrarNuevoPago(dni, duracionId, metodoPago) {
    const dur = DURACIONES.find(d => d.id === duracionId);
    const cliente = state.data.clientes.find(c => c.dni === dni);
    if (!dur || !cliente) return;
    const hoy = new Date();
    hoy.setHours(0, 0, 0, 0);
    const venc = new Date(hoy);
    venc.setDate(venc.getDate() + dur.dias);
    const monto = Math.round((cliente.precio || 0) * dur.factor);
    const nuevoPago = {
      id: 'pago-' + dni + '-' + Date.now(),
      dni, fechaPago: isoDate(hoy), duracionId, dias: dur.dias, monto, metodoPago,
      fechaVencimiento: isoDate(venc),
    };
    const { error } = await sb.from('pagos').insert(pagoJsToDb(nuevoPago));
    if (error) { showToast('No se pudo registrar el pago.'); console.error(error); return; }
    await refreshData();
    showToast('Pago registrado: ' + dur.label + ' · vence ' + formatFechaCorta(isoDate(venc)));
    renderApp();
  }

  async function eliminarPago(pagoId) {
    const { error } = await sb.from('pagos').delete().eq('id', pagoId);
    if (error) { showToast('No se pudo eliminar el pago.'); console.error(error); return; }
    await refreshData();
    showToast('Pago eliminado');
    renderApp();
  }

  async function guardarPrecioPlan(id, valorTexto) {
    const precio = parseInt(String(valorTexto).replace(/[^\d]/g, ''), 10);
    if (!precio || precio <= 0) {
      showToast('Ingresá un precio válido.');
      return;
    }
    const { error } = await sb.from('planes').update({ precio }).eq('id', id);
    if (error) { showToast('No se pudo guardar.'); console.error(error); return; }
    await refreshData();
    showToast('Precio actualizado');
    renderApp();
  }

  async function guardarPrecioMatricula(valorTexto) {
    const valor = parseInt(String(valorTexto).replace(/[^\d]/g, ''), 10);
    if (!valor || valor <= 0) {
      showToast('Ingresá un precio válido.');
      return;
    }
    const { error } = await sb.from('config').update({ valor }).eq('clave', 'matricula_precio');
    if (error) { showToast('No se pudo guardar.'); console.error(error); return; }
    await refreshData();
    showToast('Precio de matrícula actualizado');
    renderApp();
  }

  // ---------------- Admin: Asistencias ----------------
  function renderAdminAsistencias(data) {
    const fecha = state.asistenciasFecha || isoDate(new Date());
    const hoy = isoDate(new Date());
    const esFuturo = fecha > hoy;

    const turnosDelDia = data.reservas.filter(r => r.fecha === fecha && r.estado !== 'cancelado');

    const agruparPorHora = (lista) => {
      const map = {};
      lista.forEach(r => { (map[r.hora] = map[r.hora] || []).push(r); });
      return Object.keys(map).sort().map(hora => ({ hora, items: map[hora] }));
    };

    // Chips de acceso rápido: Hoy / Mañana
    const manana = new Date(hoy + 'T00:00:00');
    manana.setDate(manana.getDate() + 1);
    const atajos = `
      <div class="asist-atajos">
        <button class="date-chip ${fecha===hoy?'active':''}" data-fecha-atajo="${hoy}">Hoy</button>
        <button class="date-chip ${fecha===isoDate(manana)?'active':''}" data-fecha-atajo="${isoDate(manana)}">Mañana</button>
      </div>`;

    if (esFuturo) {
      // Modo vista previa: solo para ver quién se anotó, sin botones de confirmar
      const grupos = agruparPorHora(turnosDelDia);
      const totalHtml = turnosDelDia.length
        ? `<div class="kv-row"><span class="k">Total anotados</span><span class="v">${turnosDelDia.length} ${turnosDelDia.length===1?'persona':'personas'}</span></div>`
        : '';
      const listaHtml = grupos.length
        ? grupos.map(g => `
            <div class="asist-group">
              <div class="asist-group-header">${g.hora} <span class="asist-group-count">${g.items.length} ${g.items.length===1?'persona':'personas'}</span></div>
              ${g.items.map(r => {
                const cliente = data.clientes.find(c => c.dni === r.dni);
                return `<div class="asist-row"><span class="asist-nombre-solo">${cliente ? cliente.nombre : r.dni}</span></div>`;
              }).join('')}
            </div>`).join('')
        : `<div class="empty-state">Todavía nadie se anotó para este día.</div>`;

      return `
        <p class="sub">Vista previa — todavía no pasó, solo podés ver quién se anotó</p>
        ${atajos}
        <input type="date" id="asistFechaInput" value="${fecha}" class="date-input" />
        <div class="profile-card" style="margin-bottom:16px;">${totalHtml || '<div class="pago-detalle">Todavía nadie se anotó para este día.</div>'}</div>
        ${listaHtml}
      `;
    }

    // Modo confirmación: hoy o fechas pasadas
    const pendientes = turnosDelDia.filter(r => r.estado === 'reservado');
    const confirmados = turnosDelDia.filter(r => r.estado !== 'reservado');

    const renderGrupo = (hora, items) => {
      const filasHtml = items.map(r => {
        const cliente = data.clientes.find(c => c.dni === r.dni);
        const nombre = cliente ? cliente.nombre : r.dni;
        return `
          <div class="asist-row">
            <span class="asist-nombre-solo">${nombre}</span>
            <div class="asist-actions">
              <button class="asist-btn asist-si ${r.estado==='asistio'?'active':''}" data-asist-id="${r.id}" data-asist-val="asistio">Asistió</button>
              <button class="asist-btn asist-no ${r.estado==='no_asistio'?'active':''}" data-asist-id="${r.id}" data-asist-val="no_asistio">No asistió</button>
            </div>
          </div>`;
      }).join('');
      return `
        <div class="asist-group">
          <div class="asist-group-header">${hora} <span class="asist-group-count">${items.length} ${items.length===1?'persona':'personas'}</span></div>
          ${filasHtml}
        </div>`;
    };

    const pendientesHtml = pendientes.length
      ? agruparPorHora(pendientes).map(g => renderGrupo(g.hora, g.items)).join('')
      : `<div class="empty-state">No quedan turnos sin confirmar para este día.</div>`;

    const confirmadosHtml = confirmados.length
      ? `<details class="cuota-aldiacolapso">
           <summary>Ya confirmados (${confirmados.length})</summary>
           <div style="margin-top:10px;">${agruparPorHora(confirmados).map(g => renderGrupo(g.hora, g.items)).join('')}</div>
         </details>`
      : '';

    return `
        <p class="sub">Marcá quién vino a cada turno</p>
        ${atajos}
        <input type="date" id="asistFechaInput" value="${fecha}" class="date-input" />
        ${pendientesHtml}
        ${confirmadosHtml}
    `;
  }

  // ---------------- Render: Turnos ----------------
  function renderTurnos(cliente, data, selectedDate) {
    const dates = fullBookableWeek();
    const hoy = todayMidnight();
    const dchips = dates.map(d => {
      const iso = isoDate(d);
      const active = iso === selectedDate ? 'active' : '';
      const pasado = d < hoy;
      return `<div class="date-chip ${active} ${pasado?'past':''}" ${pasado?'':`data-date="${iso}"`}>
                <span class="dow">${DIAS_CORTO[d.getDay()]}</span>
                <span class="dnum">${d.getDate()}</span>
              </div>`;
    }).join('');

    const bloqueado = cliente.estado !== 'Activo';
    const misReservasHoy = data.reservas.filter(r => r.dni === cliente.dni && r.fecha === selectedDate && r.estado !== 'cancelado');
    const limiteDiarioAlcanzado = misReservasHoy.length >= MAX_TURNOS_POR_DIA;

    const reservasSemana = reservasEnSemana(data, cliente.dni, selectedDate);
    const limiteSemanal = limiteSemanalDe(cliente);
    const limiteSemanalAlcanzado = reservasSemana.length >= limiteSemanal;

    const slots = HORARIOS.map(hora => {
      const ocupados = data.reservas.filter(r => r.fecha === selectedDate && r.hora === hora && r.estado !== 'cancelado').length;
      const disponibles = CUPO - ocupados;
      const miReserva = misReservasHoy.find(r => r.hora === hora);
      let btn;
      if (miReserva) {
        btn = `<button class="slot-btn booked" data-desmarcar-id="${miReserva.id}">Desmarcar</button>`;
      } else if (bloqueado) {
        btn = `<button class="slot-btn" disabled>Reservar</button>`;
      } else if (disponibles <= 0) {
        btn = `<button class="slot-btn" disabled>Completo</button>`;
      } else if (limiteSemanalAlcanzado) {
        btn = `<button class="slot-btn" disabled>Límite semanal</button>`;
      } else if (limiteDiarioAlcanzado) {
        btn = `<button class="slot-btn" disabled>Límite diario</button>`;
      } else {
        btn = `<button class="slot-btn" data-hora="${hora}">Reservar</button>`;
      }
      return `
        <div class="slot-row">
          <span class="hora">${hora}</span>
          <span class="avail ${disponibles<=0?'full':''}">${disponibles<=0?'Completo':disponibles+' de '+CUPO+' libres'}</span>
          ${btn}
        </div>`;
    }).join('');

    return `
      <div class="view">
        <h2>Turnos</h2>
        <p class="sub">Elegí el día y la hora que te queda mejor</p>
        <div class="date-scroll">${dchips}</div>
        ${bloqueado ? `<div class="banner"><b>Membresía ${cliente.estado.toLowerCase()}</b>No podés reservar hasta regularizar tu membresía.</div>` : ''}
        ${(!bloqueado && limiteSemanalAlcanzado) ? `<div class="banner" style="border-color:var(--amber); background:rgba(242,169,59,0.1);"><b style="color:var(--amber);">Límite semanal alcanzado</b>Ya reservaste los ${limiteSemanal} turnos que te corresponden esta semana según tu plan. Si necesitás uno extra por una situación puntual, hablalo con tu profe.</div>` : (!bloqueado && limiteDiarioAlcanzado) ? `<div class="banner" style="border-color:var(--amber); background:rgba(242,169,59,0.1);"><b style="color:var(--amber);">Límite diario alcanzado</b>Ya tenés ${MAX_TURNOS_POR_DIA} turnos este día. Desmarcá uno si querés cambiarlo por otro horario.</div>` : ''}
        <div class="slots-list">${slots}</div>
      </div>
    `;
  }

  // ---------------- Render: Mis reservas ----------------
  function renderMisReservas(cliente, data) {
    const todas = data.reservas.filter(r => r.dni === cliente.dni && r.estado !== 'cancelado');
    const hoy = isoDate(new Date());

    const proximas = todas.filter(r => r.fecha >= hoy).sort((a,b) => (a.fecha+a.hora).localeCompare(b.fecha+b.hora));
    const historial = todas.filter(r => r.fecha < hoy).sort((a,b) => (b.fecha+b.hora).localeCompare(a.fecha+a.hora));

    const card = (r, permitirCancelar) => {
      const d = new Date(r.fecha + 'T00:00:00');
      const dow = DIAS_SEMANA[d.getDay()];
      let estadoPill = '';
      if (r.estado === 'asistio') estadoPill = '<span class="pill pill-green">Asistió</span>';
      else if (r.estado === 'no_asistio') estadoPill = '<span class="pill pill-red">No asistió</span>';
      else estadoPill = '<span class="pill pill-amber">Reservado</span>';
      const puedeCancelar = permitirCancelar && r.estado === 'reservado';
      return `
        <div class="res-card">
          <div class="info">
            <div class="date-line">${r.hora} · ${d.getDate()}/${d.getMonth()+1}</div>
            <div class="day-line">${dow}</div>
          </div>
          <div class="right">
            ${estadoPill}
            ${puedeCancelar ? `<button class="cancel-link" data-id="${r.id}">Cancelar</button>` : ''}
          </div>
        </div>`;
    };

    if (todas.length === 0) {
      return `
        <div class="view">
          <h2>Mis reservas</h2>
          <p class="sub">Tus próximos turnos</p>
          <div class="empty-state">Todavía no reservaste ningún turno.<br>Andá a la pestaña "Turnos" para anotarte.</div>
        </div>`;
    }

    const proximasHtml = proximas.length
      ? proximas.map(r => card(r, true)).join('')
      : `<div class="empty-state" style="padding:24px 20px;">No tenés turnos próximos.</div>`;

    const historialHtml = historial.length
      ? `<h2 style="font-size:16px; margin-top:24px;">Historial</h2>` + historial.map(r => card(r, false)).join('')
      : '';

    return `
      <div class="view">
        <h2>Mis reservas</h2>
        <p class="sub">Tus próximos turnos</p>
        ${proximasHtml}
        ${historialHtml}
      </div>`;
  }

  function renderApp() {
    const root = document.getElementById('root');

    if (state.mode === 'adminPin') {
      root.innerHTML = renderAdminPin(state.pinError);
      document.getElementById('pinBtn').onclick = onPinSubmit;
      document.getElementById('pinInput').addEventListener('keydown', e => { if (e.key === 'Enter') onPinSubmit(); });
      document.getElementById('backToLoginBtn').onclick = () => { state.mode = 'login'; state.pinError = ''; renderApp(); };
      return;
    }

    if (state.mode === 'admin') {
      root.innerHTML = renderAdmin(state.data, state.adminFormError, state.adminFormNotice);

      root.querySelectorAll('[data-admin-tab]').forEach(btn => {
        btn.onclick = () => {
          state.adminTab = btn.dataset.adminTab;
          renderApp();
        };
      });

      document.getElementById('backToLoginBtn2').onclick = () => { state.mode = 'login'; state.editingDni = null; renderApp(); };

      if (state.adminTab === 'clientes') {
        wireAdminForm();
        root.querySelectorAll('[data-del-dni]').forEach(btn => {
          btn.onclick = () => eliminarCliente(btn.dataset.delDni);
        });
        root.querySelectorAll('[data-estado-dni]').forEach(sel => {
          sel.onchange = () => cambiarEstadoCliente(sel.dataset.estadoDni, sel.value);
        });
        root.querySelectorAll('[data-matricula-dni]').forEach(btn => {
          btn.onclick = () => registrarMatricula(btn.dataset.matriculaDni);
        });
        root.querySelectorAll('[data-toggle-rutinas]').forEach(btn => {
          btn.onclick = () => {
            const dni = btn.dataset.toggleRutinas;
            state.rutinasAbiertoDni = state.rutinasAbiertoDni === dni ? null : dni;
            renderApp();
          };
        });
        root.querySelectorAll('[data-add-rutina]').forEach(btn => {
          btn.onclick = () => {
            const dni = btn.dataset.addRutina;
            agregarRutina(dni);
          };
        });
        root.querySelectorAll('[data-del-rutina]').forEach(btn => {
          btn.onclick = () => {
            const [dni, rutinaId] = btn.dataset.delRutina.split('|');
            eliminarRutina(dni, rutinaId);
          };
        });
        root.querySelectorAll('[data-edit-dni]').forEach(btn => {
          btn.onclick = () => {
            state.editingDni = btn.dataset.editDni;
            state.adminFormError = ''; state.adminFormNotice = '';
            renderApp();
          };
        });
        const cancelBtn = document.getElementById('cancelEditBtn');
        if (cancelBtn) cancelBtn.onclick = () => { state.editingDni = null; renderApp(); };

        const buscarInput = document.getElementById('clienteBuscar');
        if (buscarInput) {
          buscarInput.oninput = (e) => {
            state.clienteBusqueda = e.target.value;
            renderApp();
            const el = document.getElementById('clienteBuscar');
            if (el) {
              el.focus();
              const pos = el.value.length;
              el.setSelectionRange(pos, pos);
            }
          };
        }
      }

      if (state.adminTab === 'asistencias') {
        document.getElementById('asistFechaInput').onchange = (e) => {
          state.asistenciasFecha = e.target.value;
          renderApp();
        };
        root.querySelectorAll('[data-fecha-atajo]').forEach(btn => {
          btn.onclick = () => {
            state.asistenciasFecha = btn.dataset.fechaAtajo;
            renderApp();
          };
        });
        root.querySelectorAll('.asist-btn').forEach(btn => {
          btn.onclick = () => marcarAsistencia(btn.dataset.asistId, btn.dataset.asistVal);
        });
      }

      if (state.adminTab === 'cuotas') {
        root.querySelectorAll('[data-registrar-pago]').forEach(btn => {
          btn.onclick = () => {
            const dni = btn.dataset.registrarPago;
            const durSel = document.querySelector(`[data-duracion-dni="${dni}"]`);
            const metSel = document.querySelector(`[data-metodo-dni="${dni}"]`);
            registrarNuevoPago(dni, durSel.value, metSel.value);
          };
        });
        root.querySelectorAll('[data-eliminar-pago]').forEach(btn => {
          btn.onclick = () => eliminarPago(btn.dataset.eliminarPago);
        });
      }

      if (state.adminTab === 'planes') {
        root.querySelectorAll('[data-guardar-plan]').forEach(btn => {
          btn.onclick = () => {
            const id = btn.dataset.guardarPlan;
            const input = document.querySelector(`[data-plan-id="${id}"]`);
            guardarPrecioPlan(id, input.value);
          };
        });
        const matriculaBtn = document.getElementById('guardarMatriculaBtn');
        if (matriculaBtn) {
          matriculaBtn.onclick = () => {
            const input = document.getElementById('matriculaPrecioInput');
            guardarPrecioMatricula(input.value);
          };
        }
      }

      if (state.adminTab === 'resumen') {
        const backupBtn = document.getElementById('backupBtn');
        if (backupBtn) backupBtn.onclick = descargarBackup;
        root.querySelectorAll('[data-jump-tab]').forEach(btn => {
          btn.onclick = () => { state.adminTab = btn.dataset.jumpTab; renderApp(); };
        });
      }
      return;
    }

    if (!state.cliente) {
      root.innerHTML = renderLogin(state.loginError);
      document.getElementById('loginBtn').onclick = onLogin;
      document.getElementById('passInput').addEventListener('keydown', e => { if (e.key === 'Enter') onLogin(); });
      document.getElementById('adminLinkBtn').onclick = () => { state.mode = 'adminPin'; renderApp(); };
      return;
    }

    let body = '';
    if (state.view === 'perfil') body = renderPerfil(state.cliente, state.data);
    else if (state.view === 'rutina') body = renderRutina(state.cliente);
    else if (state.view === 'turnos') body = renderTurnos(state.cliente, state.data, state.selectedDate);
    else body = renderMisReservas(state.cliente, state.data);

    root.innerHTML = `
      <div class="app-header">
        <div class="who">
          <span class="name">${state.cliente.nombre}</span>
          <span class="plan">${state.cliente.plan}</span>
        </div>
        <div class="header-right">
          ${pillForEstado(state.cliente.estado)}
          <button class="logout-btn" id="logoutBtn" title="Cerrar sesión">Salir</button>
        </div>
      </div>
      ${body}
      ${renderNav(state.view)}
    `;

    document.getElementById('logoutBtn').onclick = onLogout;

    root.querySelectorAll('.nav-btn').forEach(btn => {
      btn.onclick = () => { state.view = btn.dataset.view; renderApp(); };
    });

    if (state.view === 'perfil') {
      const cambiarBtn = document.getElementById('cambiarPassBtn');
      if (cambiarBtn) cambiarBtn.onclick = cambiarMiPassword;
    }

    if (state.view === 'turnos') {
      root.querySelectorAll('.date-chip:not(.past)').forEach(chip => {
        chip.onclick = () => { state.selectedDate = chip.dataset.date; renderApp(); };
      });
      root.querySelectorAll('.slot-btn[data-hora]').forEach(btn => {
        btn.onclick = () => reservarTurno(btn.dataset.hora);
      });
      root.querySelectorAll('.slot-btn[data-desmarcar-id]').forEach(btn => {
        btn.onclick = () => cancelarReserva(btn.dataset.desmarcarId);
      });
    }
    if (state.view === 'reservas') {
      root.querySelectorAll('.cancel-link').forEach(btn => {
        btn.onclick = () => cancelarReserva(btn.dataset.id);
      });
    }
  }

  function onLogout() {
    state.cliente = null;
    state.view = 'perfil';
    state.loginError = '';
    renderApp();
  }

  async function cambiarMiPassword() {
    const actual = document.getElementById('passActual').value;
    const nueva = document.getElementById('passNueva').value;
    const repetir = document.getElementById('passNuevaRepetir').value;
    const errorEl = document.getElementById('cambiarPassError');

    const ok = await verifyPassword(actual, state.cliente.password);
    if (!ok) {
      errorEl.textContent = 'Tu contraseña actual no es correcta.';
      return;
    }
    if (!nueva || nueva.length < 4) {
      errorEl.textContent = 'La contraseña nueva tiene que tener al menos 4 caracteres.';
      return;
    }
    if (nueva !== repetir) {
      errorEl.textContent = 'Las dos contraseñas nuevas no coinciden.';
      return;
    }

    const nuevoHash = await hashPassword(nueva);
    const { error } = await sb.from('clientes').update({ password: nuevoHash }).eq('dni', state.cliente.dni);
    if (error) {
      errorEl.textContent = 'No se pudo guardar. Probá de nuevo.';
      console.error(error);
      return;
    }
    await refreshData();
    state.cliente = state.data.clientes.find(c => c.dni === state.cliente.dni) || state.cliente;
    errorEl.textContent = '';
    showToast('Contraseña actualizada');
    renderApp();
  }

  async function onLogin() {
    const dni = document.getElementById('dniInput').value.trim();
    const pass = document.getElementById('passInput').value;
    const found = state.data.clientes.find(c => c.dni === dni);
    if (!found) {
      state.loginError = 'No encontramos ese DNI. Verificalo o hablá con recepción.';
      renderApp();
      return;
    }
    const ok = await verifyPassword(pass, found.password);
    if (!ok) {
      state.loginError = 'Contraseña incorrecta.';
      renderApp();
      return;
    }
    // Si todavía tenía la contraseña vieja en texto plano, la protegemos ahora
    // que sabemos que es correcta, sin que el cliente note nada.
    if (!esPasswordHasheada(found.password)) {
      const nuevoHash = await hashPassword(pass);
      const { error: errUpgrade } = await sb.from('clientes').update({ password: nuevoHash }).eq('dni', dni);
      if (errUpgrade) {
        console.error('No se pudo proteger la contraseña automáticamente:', errUpgrade.message);
      } else {
        found.password = nuevoHash;
      }
    }
    state.cliente = found;
    state.loginError = '';
    state.view = 'perfil';
    state.selectedDate = isoDate(bookableWeekdays()[0]);
    renderApp();
  }

  async function onPinSubmit() {
    const val = document.getElementById('pinInput').value;
    const ok = await verifyPassword(val, ADMIN_PIN_HASH);
    if (!ok) {
      state.pinError = 'Clave incorrecta.';
      renderApp();
      return;
    }
    state.pinError = '';
    state.adminFormError = '';
    state.adminFormNotice = '';
    state.mode = 'admin';
    state.adminTab = 'resumen';
    renderApp();
  }

  function wireAdminForm() {
    const planSel = document.getElementById('fPlan');
    const diasSel = document.getElementById('fDias');
    const preview = document.getElementById('fPrecioPreview');
    const updatePreview = () => {
      const esPro = planSel.value === 'PRO';
      diasSel.disabled = esPro;
      const dias = esPro ? null : parseInt(diasSel.value, 10);
      const precio = precioDe(planSel.value, dias);
      preview.textContent = precio ? money(precio) + ' / mes' : 'Combinación no válida';
    };
    planSel.onchange = updatePreview;
    diasSel.onchange = updatePreview;
    updatePreview();
    document.getElementById('addClienteBtn').onclick = onAddCliente;
  }

  async function onAddCliente() {
    const dniField = document.getElementById('fDni');
    const dni = dniField.value.trim();
    const password = document.getElementById('fPass').value.trim();
    const nombre = document.getElementById('fNombre').value.trim();
    const email = document.getElementById('fEmail').value.trim();
    const telefono = document.getElementById('fTelefono').value.trim();
    const plan = document.getElementById('fPlan').value;
    const esPro = plan === 'PRO';
    const dias = esPro ? null : parseInt(document.getElementById('fDias').value, 10);
    const fuerza = parseInt(document.getElementById('fFuerza').value, 10) || 0;
    const resistencia = parseInt(document.getElementById('fResistencia').value, 10) || 0;
    const velocidad = parseInt(document.getElementById('fVelocidad').value, 10) || 0;
    const estado = document.getElementById('fEstado').value;
    const limiteRaw = document.getElementById('fLimiteSemanal').value.trim();
    const limiteSemanalOverride = limiteRaw === '' ? null : parseInt(limiteRaw, 10);

    if (!dni || !nombre || (!state.editingDni && !password)) {
      state.adminFormError = state.editingDni
        ? 'Completá al menos DNI y nombre.'
        : 'Completá al menos DNI, contraseña y nombre.';
      state.adminFormNotice = '';
      renderApp();
      return;
    }

    const precio = precioDe(plan, dias);
    const datosComunes = {
      nombre, email, telefono, plan, precio,
      dias: esPro ? null : dias,
      estimulos: esPro ? null : { fuerza, resistencia, velocidad },
      estado,
      limiteSemanalOverride,
    };

    if (state.editingDni) {
      const cActual = state.data.clientes.find(x => x.dni === state.editingDni);
      const estadoAnterior = cActual.estado;
      const nuevoPassword = password ? await hashPassword(password) : cActual.password;
      const candidato = { ...cActual, ...datosComunes, password: nuevoPassword };
      const nota = aplicarTransicionEstado(candidato, estadoAnterior, estado);
      const { error } = await sb.from('clientes').update(clienteJsToDb(candidato)).eq('dni', state.editingDni);
      if (error) { state.adminFormError = 'No se pudo guardar (' + error.message + ')'; renderApp(); return; }
      await refreshData();
      state.editingDni = null;
      state.adminFormError = '';
      state.adminFormNotice = `${nombre} se actualizó correctamente.${nota}`;
      renderApp();
      return;
    }

    if (state.data.clientes.some(c => c.dni === dni)) {
      state.adminFormError = 'Ya existe un cliente con ese DNI.';
      state.adminFormNotice = '';
      renderApp();
      return;
    }
    const matriculaPagada = document.getElementById('fMatriculaPagada').checked;
    const passwordHash = await hashPassword(password);
    const nuevoCliente = {
      dni, ...datosComunes, password: passwordHash,
      matricula: { pagada: matriculaPagada, fechaPago: matriculaPagada ? isoDate(new Date()) : null },
      pausadoDesde: estado === 'Pausado' ? isoDate(new Date()) : null,
    };
    const { error: errCliente } = await sb.from('clientes').insert(clienteJsToDb(nuevoCliente));
    if (errCliente) { state.adminFormError = 'No se pudo crear (' + errCliente.message + ')'; renderApp(); return; }

    let notaPago = '';
    const duracionPago = document.getElementById('fDuracionPago').value;
    if (duracionPago) {
      const dur = DURACIONES.find(d => d.id === duracionPago);
      const metodoPago = document.getElementById('fMetodoPago').value;
      const hoy = new Date();
      hoy.setHours(0, 0, 0, 0);
      const venc = new Date(hoy);
      venc.setDate(venc.getDate() + dur.dias);
      const monto = Math.round((precio || 0) * dur.factor);
      const nuevoPago = {
        id: 'pago-' + dni + '-' + Date.now(),
        dni, fechaPago: isoDate(hoy), duracionId: dur.id, dias: dur.dias, monto, metodoPago,
        fechaVencimiento: isoDate(venc),
      };
      const { error: errPago } = await sb.from('pagos').insert(pagoJsToDb(nuevoPago));
      if (!errPago) notaPago = ` Pago inicial registrado (${dur.label}, vence ${formatFechaCorta(isoDate(venc))}).`;
    }

    await refreshData();
    state.adminFormError = '';
    state.adminFormNotice = `${nombre} se agregó correctamente.${notaPago}`;
    renderApp();
  }

  function descargarBackup() {
    const blob = new Blob([JSON.stringify(state.data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'origo-backup-' + isoDate(new Date()) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Descargando copia de seguridad...');
  }

  async function marcarAsistencia(reservaId, valor) {
    const r = state.data.reservas.find(x => x.id === reservaId);
    if (!r) return;
    const nuevoEstado = (r.estado === valor) ? 'reservado' : valor; // tocar de nuevo lo deshace
    const { error } = await sb.from('reservas').update({ estado: nuevoEstado }).eq('id', reservaId);
    if (error) { showToast('No se pudo actualizar.'); console.error(error); return; }
    await refreshData();
    renderApp();
  }

  async function eliminarCliente(dni) {
    const { error } = await sb.from('clientes').delete().eq('dni', dni);
    if (error) { showToast('No se pudo eliminar.'); console.error(error); return; }
    await refreshData();
    showToast('Cliente eliminado');
    renderApp();
  }

  function aplicarTransicionEstado(c, estadoAnterior, nuevoEstado) {
    if (nuevoEstado === estadoAnterior) return '';
    if (nuevoEstado === 'Baja') {
      c.matricula = { pagada: false, fechaPago: null };
      c.pausadoDesde = null;
      return ' Se reinició su matrícula: va a tener que pagarla de nuevo si vuelve.';
    }
    if (nuevoEstado === 'Pausado') {
      c.pausadoDesde = isoDate(new Date());
      return ' Empieza a correr el plazo de pausa (máximo 3 meses).';
    }
    if (nuevoEstado === 'Activo') {
      c.pausadoDesde = null;
    }
    return '';
  }

  async function cambiarEstadoCliente(dni, nuevoEstado) {
    const cActual = state.data.clientes.find(x => x.dni === dni);
    if (!cActual) return;
    const estadoAnterior = cActual.estado;
    const candidato = { ...cActual, estado: nuevoEstado };
    const nota = aplicarTransicionEstado(candidato, estadoAnterior, nuevoEstado);
    const { error } = await sb.from('clientes').update(clienteJsToDb(candidato)).eq('dni', dni);
    if (error) { showToast('No se pudo actualizar.'); console.error(error); return; }
    await refreshData();
    showToast(cActual.nombre + ' ahora está ' + nuevoEstado.toLowerCase() + '.' + nota);
    renderApp();
  }

  async function registrarMatricula(dni) {
    const c = state.data.clientes.find(x => x.dni === dni);
    if (!c) return;
    const { error } = await sb.from('clientes')
      .update({ matricula_pagada: true, matricula_fecha_pago: isoDate(new Date()) })
      .eq('dni', dni);
    if (error) { showToast('No se pudo registrar.'); console.error(error); return; }
    await refreshData();
    showToast('Matrícula registrada para ' + c.nombre);
    renderApp();
  }

  async function agregarRutina(dni) {
    const tituloInput = document.getElementById('rutinaTitulo-' + dni);
    const urlInput = document.getElementById('rutinaUrl-' + dni);
    const titulo = tituloInput.value.trim();
    let url = urlInput.value.trim();
    if (!titulo || !url) {
      showToast('Completá el título y el link.');
      return;
    }
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
    const { error } = await sb.from('rutinas').insert({
      id: 'rutina-' + Date.now(), dni, titulo, url, fecha: isoDate(new Date()),
    });
    if (error) { showToast('No se pudo agregar la rutina.'); console.error(error); return; }
    await refreshData();
    showToast('Rutina agregada');
    renderApp();
  }

  async function eliminarRutina(dni, rutinaId) {
    const { error } = await sb.from('rutinas').delete().eq('id', rutinaId);
    if (error) { showToast('No se pudo eliminar.'); console.error(error); return; }
    await refreshData();
    showToast('Rutina eliminada');
    renderApp();
  }

  function diasPausado(c) {
    if (!c.pausadoDesde) return null;
    const hoy = new Date();
    hoy.setHours(0, 0, 0, 0);
    const desde = new Date(c.pausadoDesde + 'T00:00:00');
    return Math.round((hoy - desde) / 86400000);
  }

  async function reservarTurno(hora) {
    const reservasHoy = state.data.reservas.filter(r =>
      r.dni === state.cliente.dni && r.fecha === state.selectedDate && r.estado !== 'cancelado');
    if (reservasHoy.length >= MAX_TURNOS_POR_DIA) {
      showToast('Ya reservaste ' + MAX_TURNOS_POR_DIA + ' turnos ese día. Desmarcá uno primero.');
      return;
    }
    const limiteSemanal = limiteSemanalDe(state.cliente);
    const reservasSemana = reservasEnSemana(state.data, state.cliente.dni, state.selectedDate);
    if (reservasSemana.length >= limiteSemanal) {
      showToast('Ya alcanzaste tu límite semanal de turnos según tu plan.');
      return;
    }
    const nueva = {
      id: 'r' + Date.now() + Math.random().toString(36).slice(2,7),
      dni: state.cliente.dni,
      fecha: state.selectedDate,
      hora,
      estado: 'reservado',
    };
    const { error } = await sb.from('reservas').insert(nueva);
    if (error) { showToast('No se pudo reservar. Probá de nuevo.'); console.error(error); return; }
    await refreshData();
    showToast('Turno reservado: ' + hora + ' hs');
    renderApp();
  }

  async function cancelarReserva(id) {
    const { error } = await sb.from('reservas').update({ estado: 'cancelado' }).eq('id', id);
    if (error) { showToast('No se pudo cancelar.'); console.error(error); return; }
    await refreshData();
    showToast('Reserva cancelada');
    renderApp();
  }

  async function init() {
    await refreshData();
    renderApp();
  }

  init();
})();
</script>
</body>
</html>
