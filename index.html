  function avisoListoHtml(formNotice) {
    return formNotice ? `<div class="banner" style="border-color:var(--green); background:rgba(47,111,237,0.1);"><b style="color:var(--green);">Listo</b>${formNotice}</div>` : '';
  }

  function confirmarEliminarHtml(c) {
    return `
      <div class="banner" style="margin:0;">
        <b>¿Eliminar a ${esc(c.nombre)}?</b>Se borra el cliente con sus datos de acceso y no se puede deshacer. Si solo dejó de venir, conviene pasarlo a "Baja".
        <div style="display:flex; gap:10px; margin-top:12px;">
          <button class="btn btn-ghost" data-del-no="1" style="flex:1;">Cancelar</button>
          <button class="btn btn-primary" data-del-si="${c.dni}" style="flex:1; background:var(--red);">Sí, eliminar</button>
        </div>
      </div>`;
  }

  // Tarjeta de un cliente en la lista: toda la tarjeta abre su ficha
  function tarjetaCliente(data, c) {
    const asist = asistenciaMesResumen(data, c.dni);
    const asistTexto = asist.cantidad > 0
      ? `${asist.cantidad} ${asist.cantidad === 1 ? 'asistencia' : 'asistencias'} este mes · última ${formatFechaCorta(asist.ultima)}`
      : 'Sin asistencias este mes';

    const pills = [pillForEstado(c.estado)];
    if (esPrueba(c.dni)) {
      pills.push('<span class="pill pill-amber">Usuario de prueba</span>');
    } else if (c.estado !== 'Baja') {
      const cuenta = cuotaDisplay(data, c.dni);
      pills.push(`<span class="pill ${cuenta.pill}">${textoCuotaCorto(cuenta)}</span>`);
      if (matriculaActiva() && !(c.matricula && c.matricula.pagada)) pills.push('<span class="pill pill-red">Matrícula impaga</span>');
    }

    let pausaHtml = '';
    if (c.estado === 'Pausado' && c.pausadoDesde) {
      const dias = diasPausado(c);
      const vencida = dias > MAX_DIAS_PAUSA;
      pausaHtml = `<span class="cli-meta" style="${vencida ? 'color:var(--red); font-weight:600;' : ''}">${
        vencida ? `Pausado hace ${dias} días — superó el límite de 3 meses` : `Pausado hace ${dias} días (máximo ${MAX_DIAS_PAUSA})`}</span>`;
    }

    return `
      <button class="cli-card ${c.estado === 'Baja' ? 'baja' : ''}" data-ficha-dni="${c.dni}">
        <span class="cli-avatar">${esc(iniciales(c.nombre))}</span>
        <span class="cli-main">
          <span class="cli-nombre">${esc(c.nombre)}</span>
          <span class="cli-meta">${esc(textoPlan(c))} · ${asistTexto}</span>
          ${pausaHtml}
          <span class="cli-pills">${pills.join('')}</span>
        </span>
        <span class="cli-chevron">${ICONOS.der}</span>
      </button>`;
  }

  function renderAdminClientes(data, formError, formNotice) {
    if (state.fichaDni) {
      const cliente = data.clientes.find(c => c.dni === state.fichaDni);
      if (cliente) return renderFichaCliente(data, cliente, formError, formNotice);
      cerrarFicha(); // el cliente ya no existe
    }

    const q = state.clienteBusqueda.trim().toLowerCase();
    const orden = { Activo: 0, Pausado: 1, Baja: 2 };
    const clientesFiltrados = (q
      ? data.clientes.filter(c => c.nombre.toLowerCase().includes(q) || c.dni.includes(q))
      : data.clientes
    ).slice().sort((a, b) => (orden[a.estado] ?? 3) - (orden[b.estado] ?? 3) || a.nombre.localeCompare(b.nombre, 'es'));

    const tarjetas = clientesFiltrados.map(c => tarjetaCliente(data, c)).join('')
      || `<div class="empty-state">${q ? `Ningún cliente coincide con "${esc(state.clienteBusqueda)}".` : 'Todavía no hay clientes cargados.'}</div>`;

    const altaHtml = state.nuevoClienteAbierto ? `
        <div class="profile-card" style="margin-bottom:20px;">
          <div class="cuota-top" style="margin-bottom:14px;">
            <div class="cuota-nombre" style="font-size:16px;">Nuevo cliente</div>
            <button class="cancel-link" id="cerrarNuevoBtn">Cerrar</button>
          </div>
          ${formClienteHtml(null, formError)}
        </div>` : `
        <button class="btn btn-primary" id="nuevoClienteBtn" style="width:100%; margin-bottom:20px;">+ Nuevo cliente</button>`;

    return `
        <p class="sub">Tocá un cliente para ver su ficha completa</p>
        ${avisoListoHtml(formNotice)}
        ${altaHtml}
        <h2 style="font-size:16px;">Clientes (${clientesFiltrados.length}${q ? ' de ' + data.clientes.length : ''})</h2>
        <input type="text" id="clienteBuscar" class="date-input" placeholder="Buscar por nombre o DNI..." value="${esc(state.clienteBusqueda)}" style="margin-bottom:12px;">
        <div class="cli-list">${tarjetas}</div>
    `;
  }

  // ---------------- Admin: Ficha del cliente ----------------
  function renderFichaCliente(data, c, formError, formNotice) {
    const tab = state.fichaTab || 'resumen';
    const prueba = esPrueba(c.dni);
    const cuenta = cuotaDisplay(data, c.dni);
    const mias = data.reservas.filter(r => r.dni === c.dni && r.estado !== 'cancelado');
    const ctx = {
      prueba, cuenta, mias,
      pagos: pagosDe(data, c.dni),
      rutinas: c.rutinas || [],
      proximas: mias.filter(r => estadoEfectivo(r) === 'reservado').sort((a, b) => (a.fecha + a.hora).localeCompare(b.fecha + b.hora)),
      asistencias: mias.filter(r => estadoEfectivo(r) === 'asistio'),
    };

    const contacto = [
      c.telefono ? `<a href="tel:${esc(String(c.telefono).replace(/[^\d+]/g, ''))}">${esc(c.telefono)}</a>` : '',
      c.email ? `<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>` : '',
    ].filter(Boolean).join(' · ');

    const pills = [];
    if (prueba) pills.push('<span class="pill pill-amber">Usuario de prueba</span>');
    else if (c.estado !== 'Baja') {
      pills.push(`<span class="pill ${cuenta.pill}">${textoCuotaCorto(cuenta)}</span>`);
      if (matriculaActiva() && !(c.matricula && c.matricula.pagada)) pills.push('<span class="pill pill-red">Matrícula impaga</span>');
    }

    let pausaHtml = '';
    if (c.estado === 'Pausado' && c.pausadoDesde) {
      const dias = diasPausado(c);
      const vencida = dias > MAX_DIAS_PAUSA;
      pausaHtml = `<div class="cli-meta" style="margin:-6px 0 14px; ${vencida ? 'color:var(--red); font-weight:600;' : ''}">${
        vencida ? `Pausado hace ${dias} días — superó el límite de 3 meses` : `Pausado hace ${dias} días (máximo ${MAX_DIAS_PAUSA})`}</div>`;
    }

    const tabs = [['resumen', 'Resumen'], ['pagos', 'Pagos'], ['asistencias', 'Asistencias'], ['rutinas', 'Rutinas'], ['editar', 'Editar']];
    const nombresOrigen = { cuotas: 'Volver a Cuotas', asistencias: 'Volver a Turnos', pro: 'Volver a Pro' };

    let cuerpo;
    if (tab === 'pagos') cuerpo = fichaPagos(data, c, ctx);
    else if (tab === 'asistencias') cuerpo = fichaAsistencias(data, c, ctx);
    else if (tab === 'rutinas') cuerpo = fichaRutinas(data, c, ctx);
    else if (tab === 'editar') cuerpo = fichaEditar(data, c, formError, formNotice);
    else cuerpo = fichaResumen(data, c, ctx);

    return `
      <div class="ficha">
        <button class="link-btn" id="fichaVolverBtn">← ${nombresOrigen[state.fichaOrigen] || 'Todos los clientes'}</button>
        <div class="ficha-head">
          <span class="cli-avatar grande">${esc(iniciales(c.nombre))}</span>
          <div class="ficha-head-info">
            <div class="ficha-nombre">${esc(c.nombre)}</div>
            <div class="cli-meta">DNI ${esc(c.dni)} · ${esc(textoPlan(c))}</div>
            ${contacto ? `<div class="cli-meta ficha-contacto">${contacto}</div>` : ''}
          </div>
        </div>
        <div class="ficha-estado">
          <select class="estado-select estado-${c.estado.toLowerCase()}" data-estado-dni="${c.dni}" aria-label="Estado del cliente">
            <option value="Activo" ${c.estado==='Activo'?'selected':''}>Activo</option>
            <option value="Pausado" ${c.estado==='Pausado'?'selected':''}>Pausado</option>
            <option value="Baja" ${c.estado==='Baja'?'selected':''}>Baja</option>
          </select>
          ${pills.join('')}
        </div>
        ${pausaHtml}
        <div class="seg ficha-tabs">
          ${tabs.map(([id, label]) => `<button class="seg-btn ${tab === id ? 'active' : ''}" data-ficha-tab="${id}">${label}</button>`).join('')}
        </div>
        ${cuerpo}
      </div>`;
  }

  function rutinaHost(url) {
    try { return new URL(url).hostname.replace(/^www\./, ''); } catch (e) { return ''; }
  }

  function fichaResumen(data, c, ctx) {
    const hoyIso = isoDate(new Date());
    const esteMes = ctx.asistencias.filter(r => r.fecha.slice(0, 7) === hoyIso.slice(0, 7)).length;
    const limite = limiteSemanalDe(c);
    const turnosSemana = reservasEnSemana(data, c.dni, hoyIso).length;
    const racha = rachaSemanas(ctx.asistencias);
    const ultimoPago = ctx.pagos[0] || null;

    const matriculaHtml = !matriculaActiva() ? '' : (c.matricula && c.matricula.pagada)
      ? `<div class="kv-row"><span class="k">Matrícula</span><span class="v">Pagada el ${formatFechaCorta(c.matricula.fechaPago)}</span></div>`
      : `<div class="kv-row"><span class="k">Matrícula</span><span class="v" style="color:var(--red);">Sin pagar · <button class="cancel-link" data-matricula-dni="${c.dni}">Registrar (${money(matriculaPrecio())})</button></span></div>`;

    const turnosHtml = ctx.proximas.length
      ? ctx.proximas.slice(0, 3).map(r => `<div class="kv-row"><span class="k">${fechaLarga(r.fecha)}</span><span class="v">${String(r.hora).slice(0, 5)} hs</span></div>`).join('')
        + (ctx.proximas.length > 3 ? `<div class="pago-detalle" style="margin-top:4px;">y ${ctx.proximas.length - 3} más</div>` : '')
      : `<div class="pago-detalle">No tiene turnos reservados.</div>`;

    const r0 = ctx.rutinas[0];
    const rutinaHtml = r0 ? `
          <div class="rutina-adm-top" style="margin-top:4px;">
            <div style="min-width:0;">
              <div class="rutina-card-titulo">${esc(r0.titulo)}</div>
              <div class="rutina-card-fecha">${r0.fecha ? 'Cargada el ' + formatFecha(r0.fecha) : ''}</div>
            </div>
            <a class="btn btn-primary rutina-abrir" href="${esc(r0.url)}" target="_blank" rel="noopener">Abrir</a>
          </div>` : `<div class="pago-detalle">Todavía no tiene rutinas cargadas.</div>`;

    const proHtml = !esPro(c) ? '' : `
        <div class="cuota-card ficha-card">
          <div class="cuota-nombre" style="margin-bottom:10px;">Control diario · últimos 7 días</div>
          ${data.registrosProListo ? tablaUltimosDiasPro(data, c.dni, hoyIso) : '<div class="pago-detalle">El control diario todavía no está activado en la base.</div>'}
        </div>`;

    const estimulosHtml = c.estimulos ? `
          <div class="estimulos-grid" style="margin:6px 0 4px;">
            <div class="estimulo-chip"><span class="num">${c.estimulos.fuerza}</span>Fuerza / sem</div>
            <div class="estimulo-chip"><span class="num">${c.estimulos.resistencia}</span>Resist. / sem</div>
            <div class="estimulo-chip"><span class="num">${c.estimulos.velocidad}</span>Veloc. / sem</div>
          </div>` : '';

    return `
        <div class="asis-stats">
          <div class="asis-stat"><span class="num">${esteMes}</span><span class="lbl">${esteMes === 1 ? 'asistencia' : 'asistencias'} este mes</span></div>
          <div class="asis-stat"><span class="num">${turnosSemana}${isFinite(limite) ? `<small>/${limite}</small>` : ''}</span><span class="lbl">turnos esta semana</span></div>
          <div class="asis-stat"><span class="num">${racha}</span><span class="lbl">${racha === 1 ? 'semana seguida' : 'semanas seguidas'}</span></div>
        </div>

        <div class="cuota-card ficha-card">
          <div class="cuota-top">
            <div class="cuota-nombre">Cuota</div>
            <span class="pill ${ctx.cuenta.pill}">${ctx.cuenta.label}</span>
          </div>
          ${ctx.prueba ? `<div class="pago-detalle" style="margin-bottom:6px;">Usuario de prueba: no figura en Cuotas ni suma en lo cobrado.</div>` : ''}
          <div class="kv-row"><span class="k">Plan</span><span class="v">${esc(c.plan)} · ${money(c.precio || 0)} / mes</span></div>
          ${cuotaEspecialDe(c.dni) ? `<div class="kv-row"><span class="k">Cuota especial</span><span class="v" style="color:var(--amber);">El plan vale ${money(precioDe(c.plan, c.dias) || 0)}</span></div>` : ''}
          ${infoVencimientoHtml(ctx.cuenta)}
          ${ultimoPago ? `<div class="kv-row"><span class="k">Último pago</span><span class="v">${formatFecha(ultimoPago.fechaPago)} · ${money(ultimoPago.monto || 0)}</span></div>` : ''}
          ${matriculaHtml}
          <button class="slot-btn" data-ir-tab="pagos" style="width:100%; margin-top:10px;">Registrar pago o ver historial</button>
        </div>

        <div class="cuota-card ficha-card">
          <div class="cuota-top">
            <div class="cuota-nombre">Próximos turnos</div>
            <button class="cancel-link" data-ir-tab="asistencias">Ver asistencias</button>
          </div>
          ${turnosHtml}
        </div>

        <div class="cuota-card ficha-card">
          <div class="cuota-top">
            <div class="cuota-nombre">Rutinas${ctx.rutinas.length ? ' (' + ctx.rutinas.length + ')' : ''}</div>
            <button class="cancel-link" data-ir-tab="rutinas">${ctx.rutinas.length ? 'Ver todas' : 'Cargar una'}</button>
          </div>
          ${rutinaHtml}
        </div>
        ${proHtml}
        <div class="cuota-card ficha-card">
          <div class="cuota-top">
            <div class="cuota-nombre">Plan contratado</div>
            <button class="cancel-link" data-ir-tab="editar">Editar</button>
          </div>
          <div class="kv-row"><span class="k">Días presenciales</span><span class="v">${c.dias ? c.dias + ' por semana' : 'Integral — sin días fijos'}</span></div>
          ${estimulosHtml}
          <div class="kv-row"><span class="k">Turnos por semana</span><span class="v">${isFinite(limite) ? limite + (c.limiteSemanalOverride != null ? ' (excepción)' : '') : 'Sin límite'}</span></div>
        </div>`;
  }

  function fichaPagos(data, c, ctx) {
    const totalPagado = ctx.pagos.reduce((sum, p) => sum + (p.monto || 0), 0);
    return `
        <div class="cuota-card ficha-card">
          <div class="cuota-top">
            <div class="cuota-nombre">Estado de la cuota</div>
            <span class="pill ${ctx.cuenta.pill}">${ctx.cuenta.label}</span>
          </div>
          ${ctx.prueba ? `<div class="pago-detalle" style="margin-bottom:6px;">Usuario de prueba: sus pagos no figuran en Cuotas ni suman en lo cobrado.</div>` : ''}
          ${infoVencimientoHtml(ctx.cuenta)}
        </div>

        <div class="cuota-card ficha-card">
          <div class="cuota-nombre">Registrar un pago</div>
          ${formRegistrarPagoHtml(data, c)}
        </div>

        <div class="cuota-card ficha-card">
          <div class="cuota-top">
            <div class="cuota-nombre">Historial de pagos</div>
            <span class="pago-detalle">${ctx.pagos.length} ${ctx.pagos.length === 1 ? 'pago' : 'pagos'}</span>
          </div>
          ${ctx.pagos.length
            ? filasHistorialPagos(ctx.pagos, true) + `<div class="pago-total"><span>Total pagado</span><span>${money(totalPagado)}</span></div>`
            : `<div class="pago-detalle">Todavía no tiene ningún pago registrado.</div>`}
        </div>`;
  }

  function fichaAsistencias(data, c, ctx) {
    const proximasHtml = ctx.proximas.length ? `
        <div class="cuota-card ficha-card">
          <div class="cuota-nombre" style="margin-bottom:4px;">Próximos turnos (${ctx.proximas.length})</div>
          ${ctx.proximas.map(r => `<div class="kv-row"><span class="k">${fechaLarga(r.fecha)}</span><span class="v">${String(r.hora).slice(0, 5)} hs</span></div>`).join('')}
        </div>` : '';
    return proximasHtml + renderReservasAsistencias(c, data, ctx.mias, ctx.asistencias, { admin: true });
  }

  function fichaRutinas(data, c, ctx) {
    const tarjetas = ctx.rutinas.map((r, i) => {
      const host = rutinaHost(r.url);
      const confirmando = state.confirmarRutinaId === r.id;
      return `
        <div class="rutina-adm">
          <div class="rutina-adm-top">
            <div style="min-width:0;">
              <div class="rutina-card-titulo">${esc(r.titulo)}</div>
              <div class="rutina-card-fecha">${[r.fecha ? 'Cargada el ' + formatFecha(r.fecha) : '', esc(host)].filter(Boolean).join(' · ')}</div>
            </div>
            <a class="btn btn-primary rutina-abrir" href="${esc(r.url)}" target="_blank" rel="noopener">Abrir</a>
          </div>
          <div class="rutina-adm-acciones">
            ${(i === 0 && ctx.rutinas.length > 1) ? '<span class="pill pill-green">La más nueva</span>' : '<span></span>'}
            ${confirmando
              ? `<span>¿Eliminarla? <button class="cancel-link" data-del-rutina="${c.dni}|${r.id}" style="color:var(--red);">Sí, eliminar</button> · <button class="cancel-link" data-del-rutina-no="1">Cancelar</button></span>`
              : `<button class="cancel-link" data-pedir-del-rutina="${r.id}">Eliminar</button>`}
          </div>
        </div>`;
    }).join('');

    return `
        ${ctx.rutinas.length
          ? `<p class="sub" style="margin-bottom:12px;">${ctx.rutinas.length} ${ctx.rutinas.length === 1 ? 'rutina cargada' : 'rutinas cargadas'}, de la más nueva a la más vieja</p>${tarjetas}`
          : `<div class="empty-state" style="padding:28px 20px;">Todavía no tiene rutinas cargadas.</div>`}

        <div class="cuota-card ficha-card" style="margin-top:16px;">
          <div class="cuota-nombre" style="margin-bottom:10px;">Cargar una rutina nueva</div>
          <div class="rutina-add-form" style="margin-top:0;">
            <input type="text" id="rutinaTitulo-${c.dni}" placeholder="Título (ej: Fuerza - Octubre)">
            <input type="text" id="rutinaUrl-${c.dni}" placeholder="Link de Google Sheets / Drive">
            <button class="btn btn-primary" data-add-rutina="${c.dni}">Agregar rutina</button>
          </div>
          <div class="pago-detalle" style="margin-top:10px; line-height:1.5;">El cliente la ve al instante en su pestaña "Rutina". Para que pueda abrirla, el archivo tiene que estar compartido como "cualquier persona con el enlace".</div>
        </div>`;
  }

  function fichaEditar(data, c, formError, formNotice) {
    return `
        ${avisoListoHtml(formNotice)}
        <div class="profile-card" style="margin-bottom:16px;">
          ${formClienteHtml(c, formError)}
        </div>
        ${state.confirmarEliminarDni === c.dni ? confirmarEliminarHtml(c) : `
        <div class="cuota-card ficha-card">
          <div class="cuota-nombre">Eliminar cliente</div>
          <div class="pago-detalle" style="margin:4px 0 10px; line-height:1.5;">Borra al cliente y sus datos de acceso. Si solo dejó de venir, conviene pasarlo a "Baja".</div>
          <button class="cancel-link" data-del-dni="${c.dni}" style="color:var(--red);">Eliminar a ${esc(c.nombre)}</button>
        </div>`}`;
  }

  // Botones de la pestaña Clientes (lista y ficha)
  function wireClientes(root) {
    const on = (sel, fn) => root.querySelectorAll(sel).forEach(el => { el.onclick = () => fn(el); });
    if (document.getElementById('addClienteBtn')) wireAdminForm();

    on('#nuevoClienteBtn', () => { state.nuevoClienteAbierto = true; state.adminFormError = ''; state.adminFormNotice = ''; renderApp(); });
    on('#cerrarNuevoBtn', () => { state.nuevoClienteAbierto = false; state.adminFormError = ''; renderApp(); });

    on('#fichaVolverBtn', () => {
      const origen = state.fichaOrigen || 'clientes';
      cerrarFicha();
      state.adminFormNotice = '';
      state.adminTab = origen;
      state.fichaOrigen = 'clientes';
      renderApp();
      window.scrollTo(0, state.listaScrollY || 0);
    });
    on('[data-ficha-tab]', el => { abrirFicha(state.fichaDni, el.dataset.fichaTab); renderApp(); actualizarPorDetras(); });
    on('[data-ir-tab]', el => { abrirFicha(state.fichaDni, el.dataset.irTab); renderApp(); window.scrollTo(0, 0); });
    on('#cancelEditBtn', () => { abrirFicha(state.fichaDni, 'resumen'); renderApp(); window.scrollTo(0, 0); });

    root.querySelectorAll('[data-estado-dni]').forEach(sel => {
      sel.onchange = () => cambiarEstadoCliente(sel.dataset.estadoDni, sel.value);
    });
    on('[data-matricula-dni]', el => registrarMatricula(el.dataset.matriculaDni));

    // Rutinas: "Eliminar" primero pregunta
    on('[data-add-rutina]', el => agregarRutina(el.dataset.addRutina));
    on('[data-pedir-del-rutina]', el => { state.confirmarRutinaId = el.dataset.pedirDelRutina; renderApp(); });
    on('[data-del-rutina-no]', () => { state.confirmarRutinaId = null; renderApp(); });
    on('[data-del-rutina]', el => {
      const [dni, rutinaId] = el.dataset.delRutina.split('|');
      eliminarRutina(dni, rutinaId);
    });

    // Eliminar cliente: "Eliminar" solo abre la pregunta; recién "Sí, eliminar" borra
    on('[data-del-dni]', el => { state.confirmarEliminarDni = el.dataset.delDni; renderApp(); });
    on('[data-del-si]', el => { el.disabled = true; eliminarCliente(el.dataset.delSi); });
    on('[data-del-no]', () => { state.confirmarEliminarDni = null; renderApp(); });

    on('[data-cal-mes]', el => { state.fichaMes = el.dataset.calMes; renderApp(); });
    wirePagos(root);

    const buscarInput = document.getElementById('clienteBuscar');
    if (buscarInput) {
      buscarInput.oninput = (e) => {
        state.clienteBusqueda = e.target.value;
        renderApp();
        const el = document.getElementById('clienteBuscar');
        if (el) {
          el.focus();
          const pos = el.value.length;
          el.setSelectionRange(pos, pos);
        }
      };
    }
  }

  // Botones para registrar y deshacer pagos (pestaña Cuotas y pestaña Pagos de la ficha)
  function wirePagos(root) {
    root.querySelectorAll('[data-registrar-pago]').forEach(btn => {
      btn.onclick = () => {
        const dni = btn.dataset.registrarPago;
        const durSel = document.querySelector(`[data-duracion-dni="${dni}"]`);
        const metSel = document.querySelector(`[data-metodo-dni="${dni}"]`);
        const notaInput = document.querySelector(`[data-comprobante-dni="${dni}"]`);
        registrarNuevoPago(dni, durSel.value, metSel.value, notaInput ? notaInput.value : '');
      };
    });
    // Al cambiar la duración se actualiza el período que cubriría el pago
    root.querySelectorAll('[data-duracion-dni]').forEach(sel => {
      sel.onchange = () => {
        const dni = sel.dataset.duracionDni;
        const previo = periodoNuevoPago(state.data, dni, sel.value);
        const el = document.querySelector(`[data-preview-dni="${dni}"]`);
        if (el) el.textContent = textoPeriodoPago(previo.base, previo.venc, previo.dur);
        const cliente = state.data.clientes.find(c => c.dni === dni);
        const montoEl = document.querySelector(`[data-monto-dni="${dni}"]`);
        if (montoEl && cliente) montoEl.textContent = money(montoDe(cliente.precio, previo.dur));
      };
    });
    root.querySelectorAll('[data-eliminar-pago]').forEach(btn => {
      btn.onclick = () => eliminarPago(btn.dataset.eliminarPago);
    });
  }

  // ---------------- Admin: Cuotas ----------------
  function ultimoPagoDe(data, dni) {
    const pagos = data.pagos.filter(p => p.dni === dni).sort((a, b) => b.fechaVencimiento.localeCompare(a.fechaVencimiento));
    return pagos[0] || null;
  }

  // ---- Plazo de pago ----
  // Cantidad de días que hay para pagar la cuota, contando el día del
  // vencimiento. Con 10: una cuota que vence el 1 se puede pagar hasta el 10
  // sin figurar vencida. Se cambia desde la pestaña Planes.
  const DIAS_PARA_PAGAR_DEFECTO = 10;
  function diasParaPagar() {
    const fila = state.data && state.data.config ? state.data.config.find(c => c.clave === 'dias_para_pagar') : null;
    const n = fila ? parseInt(fila.valor, 10) : NaN;
    return n >= 1 ? n : DIAS_PARA_PAGAR_DEFECTO;
  }

  function sumarDias(fechaIso, n) {
    const d = new Date(fechaIso + 'T00:00:00');
    d.setDate(d.getDate() + n);
    return isoDate(d);
  }

  // Último día para pagar una cuota que venció en 'vencIso'
  function limitePago(vencIso) {
    return sumarDias(vencIso, diasParaPagar() - 1);
  }

  function formatFecha(iso) {
    const [y, m, d] = iso.split('-');
    return d + '/' + m + '/' + y;
  }

  function diasEntre(desdeIso, hastaIso) {
    return Math.round((new Date(hastaIso + 'T00:00:00') - new Date(desdeIso + 'T00:00:00')) / 86400000);
  }

  // Estados posibles:
  //  'Sin pagos'          nunca pagó
  //  'Al día'             todavía no llegó (o es hoy) el vencimiento
  //  'En período de pago' ya venció pero está dentro del plazo para pagar
  //  'Vencido'            se pasó del plazo
  function estadoCuenta(data, dni) {
    const ultimo = ultimoPagoDe(data, dni);
    if (!ultimo) return { estado: 'Sin pagos', vencimiento: null, limite: null, ultimo: null };
    const hoy = isoDate(new Date());
    const vencimiento = ultimo.fechaVencimiento;
    const limite = limitePago(vencimiento);
    let estado = 'Al día';
    if (hoy > limite) estado = 'Vencido';
    else if (hoy > vencimiento) estado = 'En período de pago';
    return { estado, vencimiento, limite, ultimo };
  }

  const DIAS_AVISO_VENCIMIENTO = 7;

  // Como estadoCuenta pero con prioridad de atención: 0 = urgente (vencido/sin pagos),
  // 1 = por vencer o en período de pago, 2 = tranquilo (al día, con margen)
  function cuotaDisplay(data, dni) {
    const cuenta = estadoCuenta(data, dni);
    if (cuenta.estado === 'Vencido') return { ...cuenta, label: 'Vencido', pill: 'pill-red', prioridad: 0, diasRestantes: null };
    if (cuenta.estado === 'Sin pagos') return { ...cuenta, label: 'Sin pagos', pill: 'pill-red', prioridad: 0, diasRestantes: null };
    const hoyIso = isoDate(new Date());
    if (cuenta.estado === 'En período de pago') {
      return { ...cuenta, label: 'Para pagar', pill: 'pill-amber', prioridad: 1, diasRestantes: diasEntre(hoyIso, cuenta.limite) };
    }
    const diasRestantes = diasEntre(hoyIso, cuenta.vencimiento);
    if (diasRestantes <= DIAS_AVISO_VENCIMIENTO) {
      return { ...cuenta, label: 'Vence pronto', pill: 'pill-amber', prioridad: 1, diasRestantes };
    }
    return { ...cuenta, label: 'Al día', pill: 'pill-green', prioridad: 2, diasRestantes };
  }

  // Desde qué fecha cuenta el próximo pago de un cliente:
  //  - si está al día o dentro del plazo de pago, sigue desde el vencimiento
  //    anterior (no pierde días por pagar antes ni corre la fecha por pagar unos días después)
  //  - si nunca pagó o se pasó del plazo, cuenta desde hoy
  function baseProximoPago(data, dni) {
    const cuenta = estadoCuenta(data, dni);
    if (cuenta.ultimo && cuenta.estado !== 'Vencido') return new Date(cuenta.vencimiento + 'T00:00:00');
    return todayMidnight();
  }

  function periodoNuevoPago(data, dni, duracionId) {
    const dur = duracionPorId(duracionId);
    const base = baseProximoPago(data, dni);
    const venc = calcularVencimiento(base, dur);
    return { dur, base, venc };
  }

  // Inicio del período que cubre un pago ya registrado
  function inicioPeriodo(p) {
    return sumarDias(p.fechaVencimiento, -(p.dias || 0));
  }

  function pagosDe(data, dni) {
    return data.pagos.filter(p => p.dni === dni)
      .sort((a, b) => (b.fechaVencimiento + b.fechaPago).localeCompare(a.fechaVencimiento + a.fechaPago));
  }

  async function registrarNuevoPago(dni, duracionId, metodoPago, comprobante) {
    const cliente = state.data.clientes.find(c => c.dni === dni);
    if (!duracionPorId(duracionId) || !cliente) return;
    const { dur, base, venc } = periodoNuevoPago(state.data, dni, duracionId);
    const diasReales = Math.round((venc - base) / 86400000);
    const monto = montoDe(cliente.precio, dur);
    const nota = String(comprobante || '').trim().slice(0, 80);
    const nuevoPago = {
      id: 'pago-' + dni + '-' + Date.now(),
      dni, fechaPago: isoDate(new Date()), duracionId, dias: diasReales, monto, metodoPago,
      fechaVencimiento: isoDate(venc),
      comprobante: nota || null,
    };
    let { error } = await sb.from('pagos').insert(pagoJsToDb(nuevoPago));
    let comprobanteNoGuardado = false;
    if (error && nuevoPago.comprobante) {
      // Lo más probable: la columna "comprobante" todavía no existe. Se registra el pago igual.
      console.error(error);
      const reintento = await sb.from('pagos').insert(pagoJsToDb({ ...nuevoPago, comprobante: null }));
      error = reintento.error;
      comprobanteNoGuardado = !reintento.error;
    }
    if (error) { showToast('No se pudo registrar el pago' + (error.message ? ': ' + error.message : '.')); console.error(error); return; }
    await refreshData();
    showToast(comprobanteNoGuardado
      ? 'Pago registrado. El comprobante no se pudo guardar.'
      : 'Pago registrado: ' + dur.label + ' · vence ' + formatFechaCorta(isoDate(venc)));
    renderApp();
  }

  async function guardarDiasParaPagar(valorTexto) {
    const valor = parseInt(String(valorTexto).replace(/[^\d]/g, ''), 10);
    if (!valor || valor < 1 || valor > 31) {
      showToast('Ingresá un número de días entre 1 y 31.');
      return;
    }
    const existe = state.data.config.some(c => c.clave === 'dias_para_pagar');
    const { error } = existe
      ? await sb.from('config').update({ valor }).eq('clave', 'dias_para_pagar')
      : await sb.from('config').insert({ clave: 'dias_para_pagar', valor });
    if (error) { showToast('No se pudo guardar.'); console.error(error); return; }
    await refreshData();
    showToast('Plazo de pago actualizado');
    renderApp();
  }

  // Descarga todos los pagos en un archivo que abre Excel (CSV separado por punto y coma)
  function descargarPagosExcel() {
    const celda = (v) => {
      let t = String(v == null ? '' : v);
      if (/^[=+\-@]/.test(t)) t = "'" + t; // que Excel no lo tome como fórmula
      return /[;"\n\r]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
    };
    const filas = [['Fecha de pago', 'Cliente', 'DNI', 'Plan actual', 'Duración', 'Monto', 'Método de pago', 'Período desde', 'Período hasta', 'Comprobante']];
    pagosReales(state.data)
      .sort((a, b) => (a.fechaPago + a.id).localeCompare(b.fechaPago + b.id))
      .forEach(p => {
        const c = state.data.clientes.find(x => x.dni === p.dni);
        const dur = duracionPorId(p.duracionId);
        filas.push([
          formatFecha(p.fechaPago), c ? c.nombre : '(cliente eliminado)', p.dni, c ? c.plan : '',
          dur ? dur.label : (p.duracionId || ''), p.monto, p.metodoPago || '',
          formatFecha(inicioPeriodo(p)), formatFecha(p.fechaVencimiento), p.comprobante || '',
        ]);
      });
    const csv = '\uFEFF' + filas.map(f => f.map(celda).join(';')).join('\r\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'origo-pagos-' + isoDate(new Date()) + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Descargando historial de pagos...');
  }

  // Lista de pagos de un cliente (se usa en Cuotas del administrador y en el perfil del cliente)
  function filasHistorialPagos(pagos, conDeshacer) {
    return pagos.map((p, i) => {
      const dur = duracionPorId(p.duracionId);
      return `
        <div class="pago-fila">
          <div>
            <div class="p1">${formatFecha(p.fechaPago)} · ${dur ? dur.label : ''}</div>
            <div class="p2">${esc(p.metodoPago || '')} · cubre del ${formatFechaCorta(inicioPeriodo(p))} al ${formatFechaCorta(p.fechaVencimiento)}${p.comprobante ? '<br>Comprobante: ' + esc(p.comprobante) : ''}${(conDeshacer && i === 0) ? `<br><button class="cancel-link" data-eliminar-pago="${p.id}">Deshacer este pago</button>` : ''}</div>
          </div>
          <span class="monto">${money(p.monto)}</span>
        </div>`;
    }).join('');
  }

  async function eliminarPago(pagoId) {
    const { error } = await sb.from('pagos').delete().eq('id', pagoId);
    if (error) { showToast('No se pudo eliminar el pago.'); console.error(error); return; }
    await refreshData();
    showToast('Pago eliminado');
    renderApp();
  }

  async function guardarPrecioPlan(id, valorTexto) {
    const precio = parseInt(String(valorTexto).replace(/[^\d]/g, ''), 10);
    if (!precio || precio <= 0) {
      showToast('Ingresá un precio válido.');
      return;
    }
    const { error } = await sb.from('planes').update({ precio }).eq('id', id);
    if (error) { showToast('No se pudo guardar.'); console.error(error); return; }
    await refreshData();
    showToast('Precio actualizado');
    renderApp();
  }

  async function guardarPrecioMatricula(valorTexto) {
    const valor = parseInt(String(valorTexto).replace(/[^\d]/g, ''), 10);
    if (!valor || valor <= 0) {
      showToast('Ingresá un precio válido.');
      return;
    }
    const { error } = await sb.from('config').update({ valor }).eq('clave', 'matricula_precio');
    if (error) { showToast('No se pudo guardar.'); console.error(error); return; }
    await refreshData();
    showToast('Precio de matrícula actualizado');
    renderApp();
  }

  // Renglones de vencimiento de una cuenta (pestaña Cuotas y ficha del cliente)
  function infoVencimientoHtml(cuenta) {
    const dias = (n) => ' (' + n + (n === 1 ? ' día)' : ' días)');
    if (!cuenta.ultimo) return `<div class="pago-detalle">Todavía no tiene ningún pago registrado.</div>`;
    if (cuenta.estado === 'En período de pago') {
      return `
          <div class="kv-row"><span class="k">Venció</span><span class="v">${formatFechaCorta(cuenta.vencimiento)}</span></div>
          <div class="kv-row"><span class="k">Puede pagar hasta</span><span class="v">${formatFechaCorta(cuenta.limite)}${dias(cuenta.diasRestantes)}</span></div>`;
    }
    if (cuenta.estado === 'Vencido') {
      return `
          <div class="kv-row"><span class="k">Venció</span><span class="v">${formatFechaCorta(cuenta.vencimiento)}</span></div>
          <div class="kv-row"><span class="k">El plazo para pagar terminó</span><span class="v">${formatFechaCorta(cuenta.limite)}</span></div>`;
    }
    return `<div class="kv-row"><span class="k">Vence</span><span class="v">${formatFechaCorta(cuenta.vencimiento)}${dias(cuenta.diasRestantes)}</span></div>`;
  }

  // Controles para registrar un pago de un cliente (pestaña Cuotas y ficha del cliente)
  function formRegistrarPagoHtml(data, c) {
    // Si el período no arranca un día 1, queda elegido el pago que lo ordena
    const base = baseProximoPago(data, c.dni);
    const previo = periodoNuevoPago(data, c.dni, sugerenciaFinDeMes(base) || '1m');
    return `
          <div class="pago-registrar">
            <select class="duracion-select" data-duracion-dni="${c.dni}">
              ${opcionesDuracionHtml(base, c.precio || 0)}
            </select>
            <select class="metodo-select" data-metodo-dni="${c.dni}">
              ${METODOS_PAGO.map(m => `<option value="${m}">${m}</option>`).join('')}
            </select>
          </div>
          <input type="text" class="pago-nota-input" data-comprobante-dni="${c.dni}" maxlength="80" placeholder="Comprobante o nota (opcional)" autocomplete="off">
          <div class="pago-monto"><span>A cobrar</span><b data-monto-dni="${c.dni}">${money(montoDe(c.precio, previo.dur))}</b></div>
          <div class="pago-preview" data-preview-dni="${c.dni}" style="margin-top:2px;">${textoPeriodoPago(previo.base, previo.venc, previo.dur)}</div>
          <button class="slot-btn" data-registrar-pago="${c.dni}" style="width:100%; margin-top:8px;">Registrar pago</button>`;
  }

  // Cómo viene la cobranza del mes en curso: un activo "tiene el mes pago"
  // cuando su cuota llega hasta el día 1 del mes siguiente. No cuenta
  // pausados, bajas ni usuarios de prueba.
  function cobranzaDelMes(data) {
    const hoy = todayMidnight();
    const finDeMesIso = isoDate(primerDiaMesSiguiente(hoy));
    const activos = clientesReales(data).filter(c => c.estado === 'Activo');
    const faltan = [];
    activos.forEach(c => {
      const ultimo = ultimoPagoDe(data, c.dni);
      if (ultimo && ultimo.fechaVencimiento >= finDeMesIso) return;
      // El próximo pago que le corresponde
      const base = baseProximoPago(data, c.dni);
      const dur = duracionPorId(sugerenciaFinDeMes(base) || '1m');
      faltan.push({ c, dur, monto: montoDe(c.precio, dur), hasta: ultimo ? ultimo.fechaVencimiento : null });
    });
    const limiteIso = isoDate(new Date(hoy.getFullYear(), hoy.getMonth(), diasParaPagar()));
    return {
      total: activos.length,
      pagaron: activos.length - faltan.length,
      faltan,
      faltaCobrar: faltan.reduce((sum, f) => sum + f.monto, 0),
      limiteIso,
      plazoCerrado: isoDate(hoy) > limiteIso,
    };
  }

  function renderAdminCuotas(data) {
    const card = (c) => {
      const cuenta = cuotaDisplay(data, c.dni);
      const pagos = pagosDe(data, c.dni);
      const totalPagado = pagos.reduce((sum, p) => sum + (p.monto || 0), 0);
      const historialHtml = pagos.length ? `
          <details class="pago-hist">
            <summary>Historial de pagos (${pagos.length})</summary>
            ${filasHistorialPagos(pagos, true)}
            <div class="pago-total"><span>Total pagado</span><span>${money(totalPagado)}</span></div>
          </details>` : '';

      return `
        <div class="cuota-card">
          <div class="cuota-top">
            <button class="nombre-link cuota-nombre" data-ficha-dni="${c.dni}">${c.nombre}</button>
            <span class="pill ${cuenta.pill}">${cuenta.label}</span>
          </div>
          ${infoVencimientoHtml(cuenta)}
          ${historialHtml}
          ${formRegistrarPagoHtml(data, c)}
        </div>`;
    };

    // Los usuarios de prueba no aparecen acá ni suman en lo cobrado
    const clientes = clientesReales(data);
    const urgentes = clientes.filter(c => cuotaDisplay(data, c.dni).prioridad === 0);
    const proximos = clientes.filter(c => cuotaDisplay(data, c.dni).prioridad === 1);
    const alDia = clientes.filter(c => cuotaDisplay(data, c.dni).prioridad === 2);

    const seccion = (titulo, lista) => lista.length
      ? `<h2 style="font-size:15px; margin-top:20px;">${titulo} (${lista.length})</h2><div class="cuota-list">${lista.map(card).join('')}</div>`
      : '';

    const alDiaHtml = alDia.length
      ? `<details class="cuota-aldiacolapso">
           <summary>Al día — sin nada pendiente (${alDia.length})</summary>
           <div class="cuota-list" style="margin-top:10px;">${alDia.map(card).join('')}</div>
         </details>`
      : '';

    const vencidos = urgentes.length;

    // Cobrado en el mes en curso
    const mesHoy = isoDate(new Date()).slice(0, 7);
    const pagosMes = pagosReales(data).filter(p => p.fechaPago.slice(0, 7) === mesHoy);
    const cobradoMes = pagosMes.reduce((sum, p) => sum + (p.monto || 0), 0);

    const nombreMes = MESES[new Date().getMonth()].toLowerCase();
    const cob = cobranzaDelMes(data);
    const cobPill = cob.total === 0 ? ''
      : cob.faltan.length === 0 ? '<span class="pill pill-green">Todo liquidado</span>'
      : cob.plazoCerrado ? `<span class="pill pill-red">El plazo cerró el ${formatFechaCorta(cob.limiteIso)}</span>`
      : `<span class="pill pill-amber">Plazo: hasta el ${formatFechaCorta(cob.limiteIso)}</span>`;
    const faltanHtml = cob.faltan.length ? `
          <details class="pago-hist" style="margin-top:6px;">
            <summary>Ver quiénes faltan (${cob.faltan.length})</summary>
            ${cob.faltan.slice().sort((a, b) => a.c.nombre.localeCompare(b.c.nombre, 'es')).map(f => `
            <div class="pago-fila">
              <div>
                <button class="nombre-link p1" data-ficha-dni="${f.c.dni}">${esc(f.c.nombre)}</button>
                <div class="p2">${f.hasta ? 'Tiene pago hasta el ' + formatFechaCorta(f.hasta) : 'Sin pagos'} · le corresponde: ${f.dur.corto || f.dur.label}</div>
              </div>
              <span class="monto">${money(f.monto)}</span>
            </div>`).join('')}
          </details>` : '';

    return `
        <p class="sub">Estado de cuentas${vencidos ? ' — ' + vencidos + ' necesitan atención' : ''}</p>
        <div class="cuota-card" style="margin-bottom:12px;">
          <div class="cuota-top">
            <div class="cuota-nombre">Cobranza de ${nombreMes}</div>
            ${cobPill}
          </div>
          <div class="asis-semana-top" style="margin-top:10px;"><span>Activos con el mes pago</span><span>${cob.pagaron} de ${cob.total}</span></div>
          <div class="asis-bar" style="margin-bottom:10px;"><i style="width:${cob.total ? Math.round(cob.pagaron / cob.total * 100) : 0}%"></i></div>
          <div class="kv-row"><span class="k">Cobrado en ${nombreMes}</span><span class="v">${money(cobradoMes)}</span></div>
          <div class="kv-row"><span class="k">Falta cobrar (aprox.)</span><span class="v">${money(cob.faltaCobrar)}</span></div>
          <div class="kv-row"><span class="k">Pagos registrados este mes</span><span class="v">${pagosMes.length}</span></div>
          ${faltanHtml}
        </div>
        <button class="btn btn-ghost" id="exportPagosBtn" style="width:100%;">Descargar historial de pagos (Excel)</button>
        ${seccion('Necesitan atención', urgentes)}
        ${seccion('Por vencer o para pagar', proximos)}
        ${alDiaHtml}
    `;
  }

  // ---------------- Admin: Turnos (novedades, semana y día) ----------------
  // "Novedades" = reservas y cancelaciones posteriores a la última vez que se
  // tocó "Ya las vi" en este dispositivo (se guarda en el navegador).
  const CLAVE_NOVEDADES = 'origo_novedades_vistas';
  const NOVEDADES_DIAS_MAX = 7;

  function novedadesVistasHasta() {
    if (state.novedadesDesde) return state.novedadesDesde;
    let guardado = 0;
    try { guardado = parseInt(localStorage.getItem(CLAVE_NOVEDADES), 10) || 0; } catch (e) {}
    // Primera vez en este dispositivo: se empieza a contar desde ahora
    state.novedadesDesde = guardado > 0 ? guardado : Date.now();
    if (!guardado) { try { localStorage.setItem(CLAVE_NOVEDADES, String(state.novedadesDesde)); } catch (e) {} }
    return state.novedadesDesde;
  }

  function marcarNovedadesVistas() {
    state.novedadesDesde = Date.now();
    try { localStorage.setItem(CLAVE_NOVEDADES, String(state.novedadesDesde)); } catch (e) {}
  }

  function novedadesTurnos(data) {
    const desde = Math.max(novedadesVistasHasta(), Date.now() - NOVEDADES_DIAS_MAX * 86400000);
    const lista = [];
    reservasReales(data).forEach(r => {
      const cancelada = r.estado === 'cancelado';
      // Una reserva cancelada sin fecha de cancelación (la deshizo la app sola) no se avisa
      if (r.creadoEn && r.creadoEn > desde && !state.misAcciones['n-' + r.id] && (!cancelada || r.canceladoEn)) {
        lista.push({ clave: 'n-' + r.id, tipo: r.porAdmin ? 'anotado' : 'reserva', t: r.creadoEn, r });
      }
      if (cancelada && r.canceladoEn && r.canceladoEn > desde && !state.misAcciones['c-' + r.id]) {
        lista.push({ clave: 'c-' + r.id, tipo: 'cancelacion', t: r.canceladoEn, r });
      }
    });
    return lista.sort((a, b) => b.t - a.t);
  }

  function nombreDeDni(data, dni) {
    const c = data.clientes.find(x => x.dni === dni);
    return c ? c.nombre : 'DNI ' + dni;
  }

  function textoNovedad(data, e) {
    const verbo = e.tipo === 'cancelacion' ? 'canceló' : e.tipo === 'anotado' ? 'fue anotado desde administración' : 'reservó';
    return nombreDeDni(data, e.r.dni) + ' ' + verbo + ': ' + fechaLarga(e.r.fecha).toLowerCase() + ' a las ' + String(e.r.hora).slice(0, 5);
  }

  function haceCuanto(t) {
    const min = Math.round((Date.now() - t) / 60000);
    if (min < 1) return 'recién';
    if (min < 60) return 'hace ' + min + ' min';
    if (min < 60 * 24) return 'hace ' + Math.round(min / 60) + ' h';
    return formatFechaCorta(isoDate(new Date(t)));
  }

  // Cartel por las novedades que llegan mientras administración está abierta
  function avisarNovedades() {
    if (state.mode !== 'admin' || !state.data) return;
    const todas = novedadesTurnos(state.data);
    const nuevas = todas.filter(e => !state.novedadesAvisadas[e.clave]);
    todas.forEach(e => { state.novedadesAvisadas[e.clave] = true; });
    if (!state.novedadesListas) { state.novedadesListas = true; return; } // lo que ya estaba al entrar no se anuncia
    if (nuevas.length === 1) showToast(textoNovedad(state.data, nuevas[0]));
    else if (nuevas.length > 1) showToast(nuevas.length + ' novedades en Turnos');
  }

  // Sábado y domingo no hay turnos: se pasa al lunes siguiente
  function aDiaHabil(iso) {
    const d = new Date(iso + 'T00:00:00');
    if (d.getDay() === 6) d.setDate(d.getDate() + 2);
    if (d.getDay() === 0) d.setDate(d.getDate() + 1);
    return isoDate(d);
  }

  function fechaAdminTurnos() {
    return aDiaHabil(state.asistenciasFecha || isoDate(new Date()));
  }

  function renderAdminAsistencias(data) {
    const fecha = fechaAdminTurnos();
    const hoyIso = isoDate(new Date());
    const vista = state.turnosVista === 'semana' ? 'semana' : 'dia';
    const lunes = mondayOf(fecha);
    const dias = [0, 1, 2, 3, 4].map(i => { const d = new Date(lunes); d.setDate(lunes.getDate() + i); return d; });
    const activas = reservasReales(data).filter(r => r.estado !== 'cancelado');
    const cuantos = (iso, hora) => activas.filter(r => r.fecha === iso && (hora === undefined || r.hora === hora)).length;

    // ---- Novedades ----
    const novedades = novedadesTurnos(data);
    const NOV_MAX = 8;
    const novedadesHtml = novedades.length ? `
        <div class="cuota-card" style="margin-bottom:14px; border-left:3px solid var(--green);">
          <div class="cuota-top">
            <div class="cuota-nombre">${novedades.length === 1 ? '1 novedad' : novedades.length + ' novedades'}</div>
            <button class="cancel-link" id="novedadesVistasBtn">Ya las vi</button>
          </div>
          ${novedades.slice(0, NOV_MAX).map(e => `
          <button class="nov-fila ${e.tipo}" data-ir-dia="${e.r.fecha}" data-ir-hora="${String(e.r.hora).slice(0, 5)}">
            <span class="n1"><b>${esc(nombreDeDni(data, e.r.dni))}</b> ${e.tipo === 'cancelacion' ? 'canceló' : e.tipo === 'anotado' ? 'fue anotado desde administración' : 'reservó'}
              <span class="n2">${fechaLarga(e.r.fecha)} a las ${String(e.r.hora).slice(0, 5)}</span></span>
            <span class="cuando">${haceCuanto(e.t)}</span>
          </button>`).join('')}
          ${novedades.length > NOV_MAX ? `<div class="pago-detalle" style="padding-top:8px;">y ${novedades.length - NOV_MAX} más</div>` : ''}
        </div>` : '';
    const faltaSqlHtml = data.novedadesCompletas === false
      ? `<div class="pago-detalle" style="margin:-4px 0 14px; line-height:1.5;">Las cancelaciones todavía no se avisan acá: falta agregar unas columnas en Supabase.</div>` : '';

    // ---- Navegación de semana ----
    const ultimo = dias[4];
    const tituloSemana = dias[0].getMonth() === ultimo.getMonth()
      ? `${dias[0].getDate()} al ${ultimo.getDate()} de ${MESES[ultimo.getMonth()].toLowerCase()}`
      : `${dias[0].getDate()}/${dias[0].getMonth() + 1} al ${ultimo.getDate()}/${ultimo.getMonth() + 1}`;
    const navHtml = `
        <div class="turnos-nav">
          <button class="cal-nav" data-turnos-semana="-1" aria-label="Semana anterior">${ICONOS.izq}</button>
          <span class="titulo">${tituloSemana}</span>
          <button class="cal-nav" data-turnos-semana="1" aria-label="Semana siguiente">${ICONOS.der}</button>
        </div>`;
    const segHtml = `
        <div class="seg">
          <button class="seg-btn ${vista === 'dia' ? 'active' : ''}" data-turnos-vista="dia">Día</button>
          <button class="seg-btn ${vista === 'semana' ? 'active' : ''}" data-turnos-vista="semana">Semana</button>
        </div>`;

    if (vista === 'semana') {
      const cabecera = '<div></div>' + dias.map(d => `
          <div class="sg-head ${isoDate(d) === hoyIso ? 'hoy' : ''}">${DIAS_CORTO[d.getDay()]}<b>${d.getDate()}</b></div>`).join('');
      const filas = HORARIOS.map(hora => `<div class="sg-hora">${hora}</div>` + dias.map(d => {
        const iso = isoDate(d);
        const nn = cuantos(iso, hora);
        const alfa = nn === 0 ? 0 : Math.min(1, 0.14 + 0.86 * nn / CUPO);
        return `<button class="sg-celda ${nn >= CUPO ? 'lleno' : ''} ${turnoYaEmpezo(iso, hora) ? 'pasado' : ''}" data-ir-dia="${iso}" data-ir-hora="${hora}"
                  style="${nn ? `background:rgba(47,111,237,${alfa.toFixed(2)});` : ''}" aria-label="${fechaLarga(iso)} ${hora}: ${nn} de ${CUPO}">${nn || ''}</button>`;
      }).join('')).join('');
      const totalSemana = dias.reduce((sum, d) => sum + cuantos(isoDate(d)), 0);
      return `
        <p class="sub">Ocupación de cada horario. Tocá un casillero para ver quiénes son.</p>
        ${novedadesHtml}${faltaSqlHtml}
        ${segHtml}
        ${navHtml}
        <div class="sg">${cabecera}${filas}</div>
        <div class="pago-detalle" style="margin-top:12px;">${totalSemana} ${totalSemana === 1 ? 'turno reservado' : 'turnos reservados'} en la semana. El número es la cantidad de personas; cada horario tiene ${CUPO} lugares.</div>
      `;
    }

    // ---- Vista de día ----
    const tira = dias.map(d => {
      const iso = isoDate(d);
      const nn = cuantos(iso);
      return `<button class="sem-dia ${iso === fecha ? 'active' : ''} ${iso === hoyIso ? 'hoy' : ''}" data-turnos-dia="${iso}">
                <span class="dow">${DIAS_CORTO[d.getDay()]}</span>
                <span class="dnum">${d.getDate()}</span>
                <span class="cuenta">${nn ? nn + (nn === 1 ? ' turno' : ' turnos') : ''}</span>
              </button>`;
    }).join('');

    const delDia = activas.filter(r => r.fecha === fecha);
    const empezados = delDia.filter(r => estadoEfectivo(r) !== 'reservado');
    const nAsistieron = empezados.filter(r => estadoEfectivo(r) === 'asistio').length;
    const nFaltaron = empezados.filter(r => estadoEfectivo(r) === 'no_asistio').length;
    const resumenHtml = `
        <div class="asis-stats">
          <div class="asis-stat"><span class="num">${delDia.length}</span><span class="lbl">${delDia.length === 1 ? 'anotado' : 'anotados'}</span></div>
          <div class="asis-stat"><span class="num">${nAsistieron}</span><span class="lbl">${nAsistieron === 1 ? 'asistió' : 'asistieron'}</span></div>
          <div class="asis-stat"><span class="num">${nFaltaron}</span><span class="lbl">${nFaltaron === 1 ? 'faltó' : 'faltaron'}</span></div>
        </div>`;

    const candidatos = clientesReales(data).filter(c => c.estado === 'Activo').sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));

    const fila = (hora) => {
      const items = delDia.filter(r => r.hora === hora)
        .sort((a, b) => nombreDeDni(data, a.dni).localeCompare(nombreDeDni(data, b.dni), 'es'));
      const empezo = turnoYaEmpezo(fecha, hora);
      const lleno = items.length >= CUPO;
      const anotando = state.anotarEn === hora;

      const personas = items.map(r => {
        const ef = estadoEfectivo(r);
        const clase = ef === 'no_asistio' ? 'falto' : ef === 'reservado' ? 'porvenir' : '';
        return `<button class="persona ${clase} ${state.reservaAbierta === r.id ? 'abierta' : ''}" data-persona="${r.id}">${esc(nombreDeDni(data, r.dni))}</button>`;
      }).join('');

      const abierta = items.find(r => r.id === state.reservaAbierta);
      let accionesHtml = '';
      if (abierta) {
        const ef = estadoEfectivo(abierta);
        const existe = data.clientes.some(c => c.dni === abierta.dni);
        accionesHtml = `
          <div class="th-acciones">
            <span class="quien">${esc(nombreDeDni(data, abierta.dni))}${ef === 'reservado' ? '' : ef === 'no_asistio' ? ' · figura que faltó' : ' · figura que asistió'}</span>
            ${empezo ? `
            <button class="asist-btn asist-si ${ef==='asistio'?'active':''}" data-asist-id="${abierta.id}" data-asist-val="asistio">Asistió</button>
            <button class="asist-btn asist-no ${ef==='no_asistio'?'active':''}" data-asist-id="${abierta.id}" data-asist-val="no_asistio">No asistió</button>` : ''}
            <button class="asist-btn" data-cancelar-admin="${abierta.id}">Cancelar turno</button>
            ${existe ? `<button class="asist-btn" data-ficha-dni="${abierta.dni}">Ver ficha</button>` : ''}
          </div>`;
      }

      let anotarHtml = '';
      if (anotando) {
        const yaEstan = items.map(r => r.dni);
        const opciones = candidatos.filter(c => !yaEstan.includes(c.dni)).map(c => {
          const limite = limiteSemanalDe(c);
          const enSemana = reservasEnSemana(data, c.dni, fecha).length;
          const enDia = delDia.filter(r => r.dni === c.dni).length;
          const aviso = enDia >= MAX_TURNOS_POR_DIA ? `ya tiene ${enDia} turnos este día`
            : (isFinite(limite) && enSemana >= limite) ? `ya usó sus ${limite} turnos de la semana` : '';
          return `<button class="anotar-op" data-anotar-dni="${c.dni}" data-buscar="${esc(c.nombre.toLowerCase())} ${c.dni}">
                    <span>${esc(c.nombre)}</span><small class="${aviso ? 'aviso' : ''}">${aviso || esc(c.plan)}</small>
                  </button>`;
        }).join('');
        anotarHtml = `
          <div class="anotar" data-anotar-panel="${hora}">
            <input type="text" id="anotarBuscar" placeholder="Buscar cliente por nombre o DNI" autocomplete="off">
            <div id="anotarLista">${opciones || '<div class="pago-detalle" style="padding:10px 0;">No hay más clientes activos para anotar.</div>'}</div>
            <div class="pago-detalle" id="anotarResto" style="padding-top:8px;"></div>
          </div>`;
      }

      const botonAnotar = lleno ? '' : `<button class="cancel-link" data-anotar-hora="${hora}">${anotando ? 'Cerrar' : '+ Anotar'}</button>`;
      if (items.length === 0) {
        return `
        <div class="th vacio" data-th="${hora}">
          <div class="th-top"><span class="th-hora">${hora}</span><span class="th-cuenta">Sin anotados</span>${botonAnotar}</div>
          ${anotarHtml}
        </div>`;
      }
      return `
        <div class="th" data-th="${hora}">
          <div class="th-top">
            <span class="th-hora">${hora}</span>
            <span class="th-bar"><i style="width:${Math.min(100, Math.round(items.length / CUPO * 100))}%"></i></span>
            <span class="th-cuenta">${items.length} de ${CUPO}</span>
            ${botonAnotar}
          </div>
          <div class="th-personas">${personas}</div>
          ${accionesHtml}
          ${anotarHtml}
        </div>`;
    };

    return `
        <p class="sub">Cada turno cuenta como asistencia cuando empieza. Tocá un nombre para marcar una falta o cancelarle el turno.</p>
        ${novedadesHtml}${faltaSqlHtml}
        ${segHtml}
        ${navHtml}
        <div class="sem">${tira}</div>
        <p class="turnos-dia" style="margin-bottom:10px;">${fechaCompleta(fecha)}${fecha === hoyIso ? ' (hoy)' : ''}</p>
        ${resumenHtml}
        ${HORARIOS.map(fila).join('')}
        <label class="pago-detalle" style="display:block; margin-top:16px;">Ir a otra fecha
          <input type="date" id="asistFechaInput" value="${fecha}" class="date-input" style="margin:6px 0 0;" />
        </label>
    `;
  }

  // Anota a un cliente en un turno desde administración. Respeta el cupo del
  // horario, pero no los límites del plan (si lo anota el profe es una excepción).
  async function anotarDesdeAdmin(dni, fecha, hora) {
    const cliente = state.data.clientes.find(c => c.dni === dni);
    if (!cliente) return;
    const frescas = await reservasFrescasDelDia(fecha);
    if (!frescas) { showToast('No se pudo comprobar el cupo. Probá de nuevo.'); return; }
    if (frescas.some(r => r.dni === dni && r.hora === hora && r.estado !== 'cancelado')) {
      state.anotarEn = null;
      await refreshData();
      showToast(cliente.nombre + ' ya estaba en ese turno.');
      renderApp();
      return;
    }
    if (ocupadosEnTurno({ reservas: frescas }, fecha, hora, null) >= CUPO) {
      state.anotarEn = null;
      await refreshData();
      showToast('Ese turno ya está completo.');
      renderApp();
      return;
    }
    const nueva = { id: 'r' + Date.now() + Math.random().toString(36).slice(2,7), dni, fecha, hora, estado: 'reservado' };
    // "por_admin" deja registrado que lo anotó administración (si la base ya tiene esa columna)
    let res = state.data.novedadesCompletas === false ? null : await sb.from('reservas').insert({ ...nueva, por_admin: true });
    if (!res || res.error) res = await sb.from('reservas').insert(nueva);
    if (res.error) { showToast('No se pudo anotar' + (res.error.message ? ': ' + res.error.message : '.')); console.error(res.error); return; }
    state.misAcciones['n-' + nueva.id] = true;
    state.anotarEn = null;
    await refreshData();
    showToast(cliente.nombre + ' anotado a las ' + hora);
    renderApp();
  }

  async function cancelarDesdeAdmin(id) {
    const r = state.data.reservas.find(x => x.id === id);
    if (!r) return;
    const { error } = await marcarCancelada(id);
    if (error) { showToast('No se pudo cancelar.'); console.error(error); return; }
    state.misAcciones['c-' + id] = true;
    state.reservaAbierta = null;
    await refreshData();
    showToast('Turno de ' + nombreDeDni(state.data, r.dni) + ' cancelado');
    renderApp();
  }

  // Botones de la pestaña Turnos de administración
  function wireTurnosAdmin(root) {
    const on = (sel, fn) => root.querySelectorAll(sel).forEach(el => { el.onclick = () => fn(el); });
    const cerrar = () => { state.anotarEn = null; state.reservaAbierta = null; };
    on('[data-turnos-vista]', el => { state.turnosVista = el.dataset.turnosVista; cerrar(); renderApp(); });
    on('[data-turnos-semana]', el => {
      const d = new Date(fechaAdminTurnos() + 'T00:00:00');
      d.setDate(d.getDate() + 7 * parseInt(el.dataset.turnosSemana, 10));
      state.asistenciasFecha = isoDate(d);
      cerrar(); renderApp();
    });
    on('[data-turnos-dia]', el => { state.asistenciasFecha = el.dataset.turnosDia; cerrar(); renderApp(); });
    // Casillero de la semana o novedad: abre ese día y lleva al horario
    on('[data-ir-dia]', el => {
      state.asistenciasFecha = el.dataset.irDia;
      state.turnosVista = 'dia';
      cerrar(); renderApp();
      const destino = document.querySelector(`[data-th="${el.dataset.irHora}"]`);
      if (destino) destino.scrollIntoView({ block: 'center' });
    });
    on('#novedadesVistasBtn', () => { marcarNovedadesVistas(); renderApp(); });
    const fechaInput = document.getElementById('asistFechaInput');
    if (fechaInput) fechaInput.onchange = (e) => { if (e.target.value) { state.asistenciasFecha = e.target.value; cerrar(); renderApp(); } };

    on('[data-persona]', el => {
      state.reservaAbierta = state.reservaAbierta === el.dataset.persona ? null : el.dataset.persona;
      state.anotarEn = null;
      renderApp();
    });
    on('.asist-btn[data-asist-id]', el => marcarAsistencia(el.dataset.asistId, el.dataset.asistVal));
    on('[data-cancelar-admin]', el => { el.disabled = true; cancelarDesdeAdmin(el.dataset.cancelarAdmin); });

    on('[data-anotar-hora]', el => {
      state.anotarEn = state.anotarEn === el.dataset.anotarHora ? null : el.dataset.anotarHora;
      state.reservaAbierta = null;
      renderApp();
      const campo = document.getElementById('anotarBuscar');
      if (campo) campo.focus();
    });
    // El buscador filtra la lista sin redibujar la pantalla (así no se pierde el foco)
    const buscar = document.getElementById('anotarBuscar');
    if (buscar) {
      const MAX = 6;
      const filtrar = () => {
        const q = buscar.value.trim().toLowerCase();
        let vistos = 0, total = 0;
        document.querySelectorAll('#anotarLista .anotar-op').forEach(op => {
          const coincide = !q || op.dataset.buscar.includes(q);
          if (coincide) total++;
          const mostrar = coincide && vistos < MAX;
          if (mostrar) vistos++;
          op.style.display = mostrar ? '' : 'none';
        });
        const resto = document.getElementById('anotarResto');
        if (resto) resto.textContent = total > vistos ? `Hay ${total - vistos} más: escribí para afinar la búsqueda.` : (total === 0 && q ? 'Ningún cliente activo coincide.' : '');
      };
      buscar.oninput = filtrar;
      filtrar();
    }
    on('[data-anotar-dni]', el => {
      const hora = el.closest('[data-anotar-panel]').dataset.anotarPanel;
      document.querySelectorAll('#anotarLista .anotar-op').forEach(b => { b.disabled = true; });
      anotarDesdeAdmin(el.dataset.anotarDni, fechaAdminTurnos(), hora);
    });
  }

  function formatFechaCorta(iso) {
    const [y,m,d] = iso.split('-');
    return d + '/' + m;
  }

            ${extra ? `<div class="s2">${extra}</div>` : ''}
          </div>
          <button class="cancel-link" data-del-registro="${x.id}">Borrar</button>

    const rpeBody = abierto !== 'rpe' ? '' : `

        <div class="well-anchors" style="margin-bottom:14px;"><span>0 es reposo</span><span>10 es el máximo</span></div>

  // Abre o cierra una tarjeta de "Mi día". Al abrir una ya cargada, arranca
  // con los valores guardados para poder corregirlos.
  function toggleCardPro(tipo) {
    const hoy = isoDate(new Date());
    const r = resumenDiaPro(state.data, state.cliente.dni, hoy);
    const abiertoAhora = state.proAbierto || null;
    if (abiertoAhora === tipo) { state.proAbierto = null; renderApp(); return; }
    state.proAbierto = tipo;
    state.proDraft = {};
    if (tipo === 'wellness' && r.wellness) state.proDraft.wellness = Object.assign({}, r.wellness.detalle);
    if (tipo === 'tqr' && r.tqr) state.proDraft.tqr = r.tqr.valor;
    renderApp();
  }

  function mostrarErrorPro(msg) {
    const el = document.getElementById('proError');
    if (el) el.textContent = msg;
  }

  // Guarda un registro del día. Wellness y TQR son uno por día (si ya existe se
  // actualiza); RPE admite varias sesiones por día.
  async function guardarRegistroPro(tipo, valor, detalle, unoPorDia) {
    const hoy = isoDate(new Date());
    const dni = state.cliente.dni;
    const existente = unoPorDia ? registrosDe(state.data, dni, hoy, tipo)[0] : null;
    const res = existente
      ? await sb.from('registros_pro').update({ valor, detalle }).eq('id', existente.id)
      : await sb.from('registros_pro').insert({
          id: 'g' + Date.now() + Math.random().toString(36).slice(2, 7), dni, fecha: hoy, tipo, valor, detalle,
        });
    if (res.error) { mostrarErrorPro('No se pudo guardar. Probá de nuevo.'); console.error(res.error); return false; }
    await refreshData();
    return true;
  }

  async function guardarWellness() {
    const d = state.proDraft.wellness || {};
    if (!WELLNESS_ITEMS.every(i => d[i.id])) { mostrarErrorPro('Te falta responder alguna de las 5 preguntas.'); return; }
    const detalle = {};
    WELLNESS_ITEMS.forEach(i => { detalle[i.id] = d[i.id]; });
    const total = WELLNESS_ITEMS.reduce((sum, i) => sum + d[i.id], 0);
    if (!(await guardarRegistroPro('wellness', total, detalle, true))) return;
    state.proDraft = {};
    // Para seguir de corrido: si falta el TQR, se abre esa tarjeta
    state.proAbierto = resumenDiaPro(state.data, state.cliente.dni, isoDate(new Date())).tqr ? null : 'tqr';
    showToast('Wellness guardado');
    renderApp();
    window.scrollTo(0, 0);
  }

  async function guardarTqr() {
    const v = state.proDraft.tqr;
    if (v == null) { mostrarErrorPro('Elegí un número de la escala.'); return; }
    if (!(await guardarRegistroPro('tqr', v, {}, true))) return;
    state.proDraft = {};
    state.proAbierto = null;
    showToast('TQR guardado');
    renderApp();
    window.scrollTo(0, 0);
  }

  async function guardarRpe() {
    const v = state.proDraft.rpe;
    if (v == null) { mostrarErrorPro('Elegí un número de la escala.'); return; }
    const minTexto = document.getElementById('rpeMinutos').value.trim();
    const actividad = document.getElementById('rpeActividad').value.trim().slice(0, 60);
    let minutos = null;
    if (minTexto !== '') {
      minutos = parseInt(minTexto, 10);
      if (!/^\d+$/.test(minTexto) || minutos <= 0 || minutos > 600) { mostrarErrorPro('La duración tiene que ser un número de minutos (por ejemplo 60).'); return; }
    }
    const detalle = {};
    if (minutos) detalle.minutos = minutos;
    if (actividad) detalle.actividad = actividad;
    if (!(await guardarRegistroPro('rpe', v, detalle, false))) return;
    state.proDraft = {};
    state.proAbierto = null;
    showToast('Sesión guardada');
    renderApp();
    window.scrollTo(0, 0);
  }

  async function borrarRegistroPro(id) {
    const reg = (state.data.registrosPro || []).find(x => x.id === id);
    if (!reg || reg.dni !== state.cliente.dni) return;
    const { error } = await sb.from('registros_pro').delete().eq('id', id);
    if (error) { showToast('No se pudo borrar.'); console.error(error); return; }
    await refreshData();
    showToast('Sesión borrada');
    renderApp();
  }

  // ---------------- Render: Rutina ----------------
  function renderRutina(cliente) {
