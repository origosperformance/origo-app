  function renderAdminTabs(tab) {
    const tabs = [
      { id: 'resumen', label: 'Resumen' },
      { id: 'clientes', label: 'Clientes' },
      { id: 'planes', label: 'Planes' },
      { id: 'cuotas', label: 'Cuotas' },
      { id: 'asistencias', label: 'Turnos' },
      { id: 'pro', label: 'Pro' },
    ];
    const novedades = state.data ? novedadesTurnos(state.data).length : 0;
    return `
      <div class="admin-tabs">
        ${tabs.map(t => `<button class="admin-tab ${t.id===tab?'active':''}" data-admin-tab="${t.id}">${t.label}${
          (t.id === 'asistencias' && novedades > 0) ? `<span class="tab-badge">${novedades}</span>` : ''}</button>`).join('')}
      </div>`;
  }

  function renderAdmin(data, formError, formNotice) {
    let body;
    if (state.adminTab === 'cuotas') body = renderAdminCuotas(data);
    else if (state.adminTab === 'asistencias') body = renderAdminAsistencias(data);
    else if (state.adminTab === 'resumen') body = renderAdminResumen(data);
    else if (state.adminTab === 'planes') body = renderAdminPlanes(data);
    else if (state.adminTab === 'pro') body = renderAdminPro(data);
    else body = renderAdminClientes(data, formError, formNotice);

    return `
      <div class="view" style="padding-bottom:40px;">
        <h2>Administración</h2>
        ${renderAdminTabs(state.adminTab)}
        ${body}
        <button class="link-btn" id="backToLoginBtn2" style="margin-top:24px;">← Salir de administración</button>
        <div class="pago-detalle" id="versionApp" style="margin-top:16px;">Versión ${VERSION_APP}</div>
      </div>
    `;
  }

  // ---------------- Admin: Pro (control diario) ----------------
  function renderAdminPro(data) {
    const hoy = isoDate(new Date());
    const fecha = state.proFecha || hoy;
    const ayerD = new Date(hoy + 'T00:00:00');
    ayerD.setDate(ayerD.getDate() - 1);
    const ayer = isoDate(ayerD);

    if (!data.registrosProListo) {
      return `
        <p class="sub">Control diario de los clientes PRO</p>
        <div class="banner"><b>Falta activar esta sección</b>Todavía no existe la tabla "registros_pro" en Supabase. Hay que crearla una sola vez para que los clientes PRO puedan cargar Wellness, TQR y RPE.</div>`;
    }

    const pros = clientesReales(data).filter(c => esPro(c) && c.estado !== 'Baja')
      .sort((a, b) => a.nombre.localeCompare(b.nombre));

    const controles = `
      <div class="asist-atajos">
        <button class="date-chip ${fecha===hoy?'active':''}" data-pro-fecha="${hoy}">Hoy</button>
        <button class="date-chip ${fecha===ayer?'active':''}" data-pro-fecha="${ayer}">Ayer</button>
      </div>
      <input type="date" id="proFechaInput" value="${fecha}" max="${hoy}" class="date-input" />`;

    if (pros.length === 0) {
      return `
        <p class="sub">Control diario de los clientes PRO</p>
        <div class="empty-state">No hay clientes con plan PRO.</div>`;
    }

    const conWellness = pros.filter(c => resumenDiaPro(data, c.dni, fecha).wellness).length;

    const tarjetas = pros.map(c => {
      const r = resumenDiaPro(data, c.dni, fecha);
      const wellDetalle = r.wellness
        ? `<div class="pro-admin-linea">${WELLNESS_ITEMS.map(i => `${i.corto} <b>${r.wellness.detalle[i.id] ?? '–'}</b>`).join(' · ')}</div>`
        : '';
      const sesiones = r.rpes.map(x => {
        const extra = textoSesionRpe(x);
        return `<div class="pro-admin-linea">RPE <b>${x.valor}</b>${extra ? ' · ' + extra : ''}</div>`;
      }).join('');
      return `
        <div class="pro-admin-card">
          <button class="nombre-link pro-admin-nombre" data-ficha-dni="${c.dni}">${c.nombre}</button>
          <div class="asis-stats" style="margin-bottom:10px;">
            <div class="asis-stat"><span class="num ${r.wellness ? 'color' : ''}" ${r.wellness ? `style="--c:${colorPro('wellness', r.wellness.valor)}"` : ''}>${r.wellness ? r.wellness.valor : '–'}</span><span class="lbl">Wellness (de ${WELLNESS_MAX})</span></div>
            <div class="asis-stat"><span class="num ${r.tqr ? 'color' : ''}" ${r.tqr ? `style="--c:${colorPro('tqr', r.tqr.valor)}"` : ''}>${r.tqr ? r.tqr.valor : '–'}</span><span class="lbl">TQR (6 a 20)</span></div>
            <div class="asis-stat"><span class="num">${r.carga !== null ? r.carga : (r.rpes.length ? r.rpes.map(x => x.valor).join(', ') : '–')}</span><span class="lbl">${r.carga !== null ? 'Carga del día' : 'RPE (0 a 10)'}</span></div>
          </div>
          ${wellDetalle}
          ${sesiones}
          <details class="cuota-aldiacolapso" style="margin-top:10px;">
            <summary>Últimos 7 días</summary>
            <div style="margin-top:12px;">${tablaUltimosDiasPro(data, c.dni, fecha)}</div>
          </details>
        </div>`;
    }).join('');

    return `
        <p class="sub">Control diario de los clientes PRO</p>
        ${controles}
        <div class="profile-card" style="margin-bottom:16px; padding:8px 16px;">
          <div class="kv-row"><span class="k">Cargaron el wellness</span><span class="v">${conWellness} de ${pros.length}</span></div>
        </div>
        ${tarjetas}
    `;
  }

  // ---------------- Admin: Planes ----------------
  function renderAdminPlanes(data) {
    const grupos = {};
    (data.planes || []).slice().sort((a, b) => (a.dias ?? 99) - (b.dias ?? 99)).forEach(p => {
      (grupos[p.plan] = grupos[p.plan] || []).push(p);
    });

    const ordenPlanes = ['START', 'PERFORMANCE 2', 'PERFORMANCE 3', 'PRO'];
    const planesHtml = ordenPlanes.filter(p => grupos[p]).map(plan => {
      const filas = grupos[plan].map(p => `
        <div class="plan-row">
          <span class="plan-row-dias">${p.dias ? p.dias + (p.dias === 1 ? ' día/sem' : ' días/sem') : 'Integral'}</span>
          <input type="text" inputmode="numeric" class="plan-precio-input" data-plan-id="${p.id}" value="${p.precio}">
          <button class="cancel-link" data-guardar-plan="${p.id}">Guardar</button>
        </div>`).join('');
      return `
        <div class="cuota-card">
          <div class="cuota-nombre" style="margin-bottom:8px;">${plan}</div>
          ${filas}
        </div>`;
    }).join('');

    const matricula = matriculaPrecio();

    return `
        <p class="sub">Precios de los planes — se aplican al instante a los clientes nuevos y a los que registren un pago</p>
        ${planesHtml}
        <div class="cuota-card">
          <div class="cuota-top">
            <div class="cuota-nombre">Matrícula</div>
            <span class="pill ${matriculaActiva() ? 'pill-green' : 'pill-amber'}">${matriculaActiva() ? 'Se cobra' : 'No se cobra'}</span>
          </div>
          ${matriculaActiva() ? `
          <div class="plan-row">
            <span class="plan-row-dias">Alta de membresía</span>
            <input type="text" inputmode="numeric" class="plan-precio-input" id="matriculaPrecioInput" value="${matricula}">
            <button class="cancel-link" id="guardarMatriculaBtn">Guardar</button>
          </div>
          <div class="pago-detalle" style="margin-top:8px;">Figura en cada cliente y al cargar uno nuevo. <button class="cancel-link" id="toggleMatriculaBtn" data-activar="0">Dejar de cobrarla</button></div>`
          : `
          <div class="pago-detalle">Por ahora no se cobra: no aparece en los clientes, al cargar uno nuevo ni en el resumen. <button class="cancel-link" id="toggleMatriculaBtn" data-activar="1">Volver a cobrarla</button></div>`}
        </div>
        <div class="cuota-card" style="margin-top:10px;">
          <div class="cuota-nombre" style="margin-bottom:8px;">Plazo de pago</div>
          <div class="plan-row">
            <span class="plan-row-dias">Días para pagar la cuota</span>
            <input type="text" inputmode="numeric" class="plan-precio-input" id="diasParaPagarInput" value="${diasParaPagar()}">
            <button class="cancel-link" id="guardarDiasParaPagarBtn">Guardar</button>
          </div>
          <div class="pago-detalle" style="margin-top:8px;">Se cuenta desde el día del vencimiento. Con ${diasParaPagar()} ${diasParaPagar() === 1 ? 'día' : 'días'}, una cuota que vence el 1 se puede pagar hasta el ${diasParaPagar()} sin figurar vencida.</div>
        </div>
        <div class="banner" style="border-color:var(--line); background:var(--surface-2); margin-top:16px;">
          <b style="color:var(--text-muted);">Ojo</b>Cambiar un precio acá no le modifica la cuota a nadie que ya esté pagando — solo se usa para calcularle el monto a un cliente nuevo o la próxima vez que alguien registre un pago.
        </div>
    `;
  }

  // ---------------- Admin: Resumen ----------------
  function renderAdminResumen(data) {
    // Los usuarios de prueba no cuentan en ningún número del resumen
    const clientes = clientesReales(data);
    const reservas = reservasReales(data);
    const activos = clientes.filter(c => c.estado === 'Activo');
    const pausados = clientes.filter(c => c.estado === 'Pausado');
    const bajas = clientes.filter(c => c.estado === 'Baja');

    const facturacionProyectada = activos.reduce((sum, c) => sum + (c.precio || 0), 0);

    const cuentasDisplay = clientes.map(c => cuotaDisplay(data, c.dni));
    const vencidos = cuentasDisplay.filter(e => e.estado === 'Vencido').length;
    const sinPagos = cuentasDisplay.filter(e => e.estado === 'Sin pagos').length;
    const vencePronto = cuentasDisplay.filter(e => e.prioridad === 1).length;

    const hoy = isoDate(new Date());
    const turnosHoy = reservas.filter(r => r.fecha === hoy && r.estado !== 'cancelado').length;
    const asistieronHoy = reservas.filter(r => r.fecha === hoy && estadoEfectivo(r) === 'asistio').length;

    const pausasVencidas = pausados.filter(c => diasPausado(c) > MAX_DIAS_PAUSA).length;
    const sinMatricula = matriculaActiva() ? clientes.filter(c => !(c.matricula && c.matricula.pagada)).length : 0;

    // Lista de cosas que requieren una decisión o acción, ordenadas por urgencia
    const itemsAtencion = [
      { count: vencidos + sinPagos, label: (vencidos+sinPagos)===1 ? 'cliente con la cuenta vencida o sin pagos' : 'clientes con la cuenta vencida o sin pagos', tab: 'cuotas', sev: 'urgente' },
      { count: pausasVencidas, label: pausasVencidas===1 ? 'pausa superó el límite de 3 meses' : 'pausas superaron el límite de 3 meses', tab: 'clientes', sev: 'urgente' },
      { count: vencePronto, label: vencePronto===1 ? 'cliente con la cuota por vencer o para pagar' : 'clientes con la cuota por vencer o para pagar', tab: 'cuotas', sev: 'atencion' },
      { count: sinMatricula, label: sinMatricula===1 ? 'cliente sin matrícula pagada' : 'clientes sin matrícula pagada', tab: 'clientes', sev: 'atencion' },
    ].filter(i => i.count > 0);

    const atencionHtml = itemsAtencion.length
      ? itemsAtencion.map(i => `
          <button class="resumen-atencion-item sev-${i.sev}" data-jump-tab="${i.tab}">
            <span class="resumen-atencion-num">${i.count}</span>
            <span class="resumen-atencion-label">${i.label}</span>
            <span class="resumen-atencion-arrow">Ver →</span>
          </button>`).join('')
      : `<div class="resumen-todobien">Todo en orden — no hay nada urgente para hoy.</div>`;

    return `
        <p class="sub">Qué necesita tu atención hoy</p>

        <div class="resumen-atencion-list">${atencionHtml}</div>

        <div class="resumen-hero">
          <div class="resumen-hero-label">Facturación proyectada este mes</div>
          <div class="resumen-hero-num">${money(facturacionProyectada)}</div>
          <div class="resumen-hero-sub">${activos.length} activos · ${pausados.length} pausados · ${bajas.length} de baja</div>
        </div>

        <button class="resumen-hoy-card" data-jump-tab="asistencias">
          <div class="resumen-hoy-top">
            <span class="resumen-hoy-titulo">Hoy</span>
            <span class="resumen-hoy-ver">Ver en Turnos →</span>
          </div>
          <div class="resumen-hoy-stats">
            <div class="resumen-hoy-stat"><span class="resumen-hoy-num">${turnosHoy}</span><span class="resumen-hoy-txt">reservados</span></div>
            <div class="resumen-hoy-stat"><span class="resumen-hoy-num">${asistieronHoy}</span><span class="resumen-hoy-txt">asistieron</span></div>
          </div>
        </button>

        <h2 style="font-size:16px; margin-top:24px;">Datos</h2>
        <button class="btn btn-ghost" id="backupBtn" style="width:100%;">Descargar copia de seguridad (.json)</button>
    `;
  }

  function asistenciaMesResumen(data, dni) {
    const hoy = new Date();
    const mesActual = hoy.getMonth();
    const anioActual = hoy.getFullYear();
    const asistencias = data.reservas.filter(r => {
      if (r.dni !== dni || estadoEfectivo(r) !== 'asistio') return false;
      const d = new Date(r.fecha + 'T00:00:00');
      return d.getMonth() === mesActual && d.getFullYear() === anioActual;
    }).sort((a, b) => b.fecha.localeCompare(a.fecha));
    return { cantidad: asistencias.length, ultima: asistencias[0] ? asistencias[0].fecha : null };
  }

  // ---------------- Admin: Clientes (lista + ficha) ----------------
  function iniciales(nombre) {
    const p = String(nombre || '').trim().split(/\s+/).filter(Boolean);
    return ((p[0] || '?')[0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase();
  }

  function textoPlan(c) {
    return c.plan + ' · ' + (c.dias ? c.dias + (c.dias === 1 ? ' día/sem' : ' días/sem') : 'Integral');
  }

  function textoCuotaCorto(cuenta) {
    return ({ 'Al día': 'Cuota al día', 'Vence pronto': 'Cuota vence pronto', 'Para pagar': 'Cuota para pagar',
              'Vencido': 'Cuota vencida', 'Sin pagos': 'Sin pagos' })[cuenta.label] || cuenta.label;
  }

  function abrirFicha(dni, tab) {
    if (state.fichaDni !== dni) state.fichaMes = null;
    state.adminTab = 'clientes';
    state.fichaDni = dni;
    state.fichaTab = tab || 'resumen';
    state.editingDni = state.fichaTab === 'editar' ? dni : null;
    state.confirmarEliminarDni = null;
    state.confirmarRutinaId = null;
    state.adminFormError = '';
    state.adminFormNotice = '';
  }

  function cerrarFicha() {
    state.fichaDni = null;
    state.fichaTab = 'resumen';
    state.fichaMes = null;
    state.editingDni = null;
    state.confirmarEliminarDni = null;
    state.confirmarRutinaId = null;
  }

  // Formulario de datos del cliente. Se usa para el alta (editing = null) y en la pestaña Editar de la ficha.
  function formClienteHtml(editing, formError) {
    return `
          <div class="admin-field-grid">
            <label>DNI<input type="text" id="fDni" inputmode="numeric" placeholder="Ej: 12345678" value="${editing?editing.dni:''}" ${editing?'disabled':''}></label>
            <label>Contraseña<input type="text" id="fPass" placeholder="${editing?'Dejar en blanco para no cambiarla':'Elegí una contraseña'}" value=""></label>
            <label class="span2">Nombre y apellido<input type="text" id="fNombre" placeholder="Ej: María Gómez" value="${editing?editing.nombre:''}"></label>
            <label>Email<input type="text" id="fEmail" placeholder="Ej: maria@mail.com" value="${editing?editing.email||'':''}"></label>
            <label>Teléfono<input type="text" id="fTelefono" placeholder="Ej: 341-1234567" value="${editing?editing.telefono||'':''}"></label>
            <label>Plan
              <select id="fPlan">
                <option value="START" ${editing&&editing.plan==='START'?'selected':''}>START</option>
                <option value="PERFORMANCE 2" ${editing&&editing.plan==='PERFORMANCE 2'?'selected':''}>PERFORMANCE 2</option>
                <option value="PERFORMANCE 3" ${editing&&editing.plan==='PERFORMANCE 3'?'selected':''}>PERFORMANCE 3</option>
                <option value="PRO" ${editing&&editing.plan==='PRO'?'selected':''}>PRO</option>
              </select>
            </label>
            <label>Días presenciales / sem
              <select id="fDias" ${editing&&editing.plan==='PRO'?'disabled':''}>
                <option value="1" ${editing&&editing.dias===1?'selected':''}>1</option>
                <option value="2" ${editing&&editing.dias===2?'selected':''}>2</option>
                <option value="3" ${(!editing&&true)||(editing&&editing.dias===3)?'selected':''}>3</option>
                <option value="4" ${editing&&editing.dias===4?'selected':''}>4</option>
                <option value="5" ${editing&&editing.dias===5?'selected':''}>5</option>
              </select>
            </label>
            <label>Estímulos Fuerza<input type="number" id="fFuerza" min="0" max="10" value="${editing&&editing.estimulos?editing.estimulos.fuerza:0}"></label>
            <label>Estímulos Resistencia<input type="number" id="fResistencia" min="0" max="10" value="${editing&&editing.estimulos?editing.estimulos.resistencia:0}"></label>
            <label>Estímulos Velocidad<input type="number" id="fVelocidad" min="0" max="10" value="${editing&&editing.estimulos?editing.estimulos.velocidad:0}"></label>
            <label>Estado
              <select id="fEstado">
                <option value="Activo" ${!editing||editing.estado==='Activo'?'selected':''}>Activo</option>
                <option value="Pausado" ${editing&&editing.estado==='Pausado'?'selected':''}>Pausado</option>
                <option value="Baja" ${editing&&editing.estado==='Baja'?'selected':''}>Baja</option>
              </select>
            </label>
            <label class="span2">Límite semanal de turnos (excepción)
              <input type="number" id="fLimiteSemanal" min="0" max="20" placeholder="Vacío = automático según estímulos contratados"
                value="${editing&&editing.limiteSemanalOverride!=null?editing.limiteSemanalOverride:''}">
            </label>
            <label class="span2">Cuota especial por mes (excepción)
              <input type="text" inputmode="numeric" id="fCuotaEspecial" placeholder="Vacío = el precio de su plan" autocomplete="off"
                value="${editing && cuotaEspecialDe(editing.dni) ? cuotaEspecialDe(editing.dni) : ''}">
            </label>
            <label class="span2" style="flex-direction:row; align-items:center; gap:8px;">
              <input type="checkbox" id="fPrueba" style="width:auto;" ${editing&&esPrueba(editing.dni)?'checked':''}>
              Usuario de prueba (para mostrar la app: nunca figura con deuda ni cuenta en los números)
            </label>
          </div>
          ${!editing ? `
          <div class="divider"></div>
          <div class="admin-field-grid">
            <label>Pago inicial
              <select id="fDuracionPago">
                <option value="">Sin pago inicial (registrar después)</option>
                ${opcionesDuracionHtml(todayMidnight(), null)}
              </select>
            </label>
            <label>Método de pago
              <select id="fMetodoPago">
                ${METODOS_PAGO.map(m => `<option value="${m}">${m}</option>`).join('')}
              </select>
            </label>
            ${matriculaActiva() ? `
            <label class="span2" style="flex-direction:row; align-items:center; gap:8px;">
              <input type="checkbox" id="fMatriculaPagada" style="width:auto;">
              Matrícula pagada (${money(matriculaPrecio())})
            </label>` : ''}
          </div>
          ` : ''}
          <div class="divider"></div>
          <div class="kv-row"><span class="k">Cuota calculada</span><span class="v" id="fPrecioPreview">—</span></div>
          ${!editing ? `<div class="kv-row"><span class="k">Pago inicial</span><span class="v" id="fPagoInicialMonto">—</span></div>
          <div class="pago-detalle" id="fPagoInicialDetalle" style="margin-bottom:6px;"></div>` : ''}
          <div class="error-text">${formError || ''}</div>
          <div style="display:flex; gap:10px; margin-top:10px;">
            <button class="btn btn-primary" id="addClienteBtn" style="flex:1;">${editing ? 'Guardar cambios' : 'Agregar cliente'}</button>
            ${editing ? `<button class="btn btn-ghost" id="cancelEditBtn">Cancelar</button>` : ''}
          </div>`;
