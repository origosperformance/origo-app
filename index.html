  // ---------------- Render: Turnos ----------------
  // Los horarios se muestran agrupados por franja. Para cambiar dónde corta
  // cada una alcanza con tocar estas horas.
  const FRANJAS = [
    { nombre: 'Mañana', desde: 0,  hasta: 12 },
    { nombre: 'Tarde',  desde: 13, hasta: 18 },
    { nombre: 'Noche',  desde: 19, hasta: 23 },
  ];
  // Con esta cantidad de lugares libres (o menos) el horario se marca "Quedan N"
  const POCOS_LUGARES = 2;

  function fechaCompleta(iso) {
    const d = new Date(iso + 'T00:00:00');
    return DIAS_SEMANA[d.getDay()] + ' ' + d.getDate() + ' de ' + MESES[d.getMonth()].toLowerCase();
  }

  function renderTurnos(cliente, data, selectedDate) {
    const hoy = todayMidnight();
    const misActivas = data.reservas.filter(r => r.dni === cliente.dni && r.estado !== 'cancelado');
    const misDelDia = misActivas.filter(r => r.fecha === selectedDate);

    const semana = fullBookableWeek().map(d => {
      const iso = isoDate(d);
      const pasado = d < hoy;
      const clases = [iso === selectedDate ? 'active' : '', pasado ? 'past' : '', d.getTime() === hoy.getTime() ? 'hoy' : '',
        misActivas.some(r => r.fecha === iso) ? 'conturno' : ''].filter(Boolean).join(' ');
      return `<button class="sem-dia ${clases}" ${pasado ? 'disabled' : `data-date="${iso}"`}>
                <span class="dow">${DIAS_CORTO[d.getDay()]}</span>
                <span class="dnum">${d.getDate()}</span>
                <span class="marca"></span>
              </button>`;
    }).join('');

    // ¿Puede reservar otro turno este día? Si no, por qué.
    const bloqueado = cliente.estado !== 'Activo';
    const limiteSemanal = limiteSemanalDe(cliente);
    const usadosSemana = reservasEnSemana(data, cliente.dni, selectedDate).length;
    const limiteSemanalAlcanzado = usadosSemana >= limiteSemanal;
    const limiteDiarioAlcanzado = misDelDia.length >= MAX_TURNOS_POR_DIA;
    const puedeReservar = !bloqueado && !limiteSemanalAlcanzado && !limiteDiarioAlcanzado;

    let estadoHtml = '';
    if (bloqueado) {
      estadoHtml = `<div class="banner" style="margin-top:10px;"><b>Membresía ${cliente.estado.toLowerCase()}</b>No podés reservar hasta regularizar tu membresía.</div>`;
    } else if (limiteSemanalAlcanzado) {
      estadoHtml = `<p class="turnos-estado aviso">Ya reservaste tus ${limiteSemanal} turnos de esta semana. Si necesitás uno más, hablalo con tu profe.</p>`;
    } else if (limiteDiarioAlcanzado) {
      estadoHtml = `<p class="turnos-estado aviso">Ya tenés ${MAX_TURNOS_POR_DIA} turnos este día. Cancelá uno si querés cambiarlo.</p>`;
    } else if (isFinite(limiteSemanal)) {
      const quedan = limiteSemanal - usadosSemana;
      estadoHtml = `<p class="turnos-estado">${quedan === 1 ? 'Te queda 1 turno' : 'Te quedan ' + quedan + ' turnos'} para reservar esta semana.</p>`;
    } else {
      estadoHtml = `<p class="turnos-estado">Tocá un horario para reservarlo.</p>`;
    }

    // Los horarios que ya empezaron no se muestran (solo afecta al día de hoy)
    const visibles = HORARIOS.filter(h => !turnoYaEmpezo(selectedDate, h));
    const boton = (hora) => {
      const libres = CUPO - ocupadosEnTurno(data, selectedDate, hora, cliente.dni);
      const mia = misDelDia.some(r => r.hora === hora);
      let clase, sub, apagado = false;
      if (mia) { clase = 'mio'; sub = 'Tu turno'; }
      else if (libres <= 0) { clase = 'lleno'; sub = 'Completo'; apagado = true; }
      else {
        clase = libres <= POCOS_LUGARES ? 'pocos' : 'libre';
        sub = libres <= POCOS_LUGARES ? (libres === 1 ? 'Queda 1' : 'Quedan ' + libres) : '';
        if (!puedeReservar) { clase += ' nodisp'; apagado = true; }
      }
      return `<button class="slot ${clase} ${state.slotElegido === hora ? 'elegido' : ''}" data-slot="${hora}" data-libres="${Math.max(0, libres)}" ${apagado ? 'disabled' : ''}>
                <span class="h">${hora}</span><span class="s">${sub}</span>
              </button>`;
    };
    const grupos = FRANJAS.map(f => {
      const horas = visibles.filter(h => { const n = parseInt(h, 10); return n >= f.desde && n <= f.hasta; });
      return horas.length ? `<div class="slots-grupo">${f.nombre}</div><div class="slots-grid">${horas.map(boton).join('')}</div>` : '';
    }).join('');
    const quedanOtrosDias = fullBookableWeek().some(d => isoDate(d) > selectedDate);

    return `
      <div class="view">
        ${tituloVista('turnos', 'Turnos', 'Elegí el día y el horario')}
        <div class="sem">${semana}</div>
        <p class="turnos-dia">${fechaCompleta(selectedDate)}</p>
        ${estadoHtml}
        ${visibles.length > 0
          ? `${grupos}
             <div class="slots-leyenda">
               <span><i class="mio"></i>Tu turno</span>
               <span><i class="pocos"></i>Últimos lugares</span>
               <span><i class="lleno"></i>Completo</span>
             </div>`
          : `<div class="empty-state">Ya no quedan turnos para este día.<br>${quedanOtrosDias ? 'Elegí otro día de la semana.' : 'Desde el sábado vas a poder reservar los de la semana que viene.'}</div>`}
      </div>
    `;
  }

  // Barra que aparece al tocar un horario: recién ahí se confirma la reserva (o la cancelación)
  function barraTurno(cliente, data) {
    const hora = state.slotElegido;
    const fecha = state.selectedDate;
    if (!hora || state.view !== 'turnos' || turnoYaEmpezo(fecha, hora)) return '';
    const d = new Date(fecha + 'T00:00:00');
    const cuando = DIAS_SEMANA[d.getDay()] + ' ' + d.getDate() + ' a las ' + hora;
    const mia = data.reservas.find(r => r.dni === cliente.dni && r.fecha === fecha && r.hora === hora && r.estado !== 'cancelado');
    if (mia) {
      return `
        <div class="turno-barra">
          <div><div class="tb1">${cuando}</div><div class="tb2">Ya tenés este turno</div></div>
          <button class="btn btn-ghost" id="cancelarTurnoBtn" data-id="${mia.id}">Cancelar turno</button>
        </div>`;
    }
    const libres = CUPO - ocupadosEnTurno(data, fecha, hora, cliente.dni);
    if (libres <= 0) return '';
    return `
      <div class="turno-barra">
        <div><div class="tb1">${cuando}</div><div class="tb2">${libres === 1 ? 'Queda 1 lugar' : 'Quedan ' + libres + ' lugares'}</div></div>
        <button class="btn btn-primary" id="confirmarTurnoBtn">Reservar turno</button>
      </div>`;
  }

  // ---------------- Render: Mis reservas ----------------
  // Semanas seguidas (lunes a domingo) con al menos una asistencia. Si en la
  // semana en curso todavía no vino, se cuenta desde la anterior para que la
  // racha no se "rompa" cada lunes.
  function rachaSemanas(asistencias) {
    const semanas = new Set(asistencias.map(r => isoDate(mondayOf(r.fecha))));
    const cursor = mondayOf(isoDate(new Date()));
    if (!semanas.has(isoDate(cursor))) cursor.setDate(cursor.getDate() - 7);
    let n = 0;
    while (semanas.has(isoDate(cursor))) { n++; cursor.setDate(cursor.getDate() - 7); }
    return n;
  }

  function mesShift(ym, delta) {
    const [y, m] = ym.split('-').map(Number);
    const d = new Date(y, m - 1 + delta, 1);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  }

  function fechaLarga(iso) {
    const d = new Date(iso + 'T00:00:00');
    return DIAS_SEMANA[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth() + 1);
  }

  // "Hoy", "Mañana" o el día con nombre
  function diaCercano(iso) {
    const hoy = todayMidnight();
    const d = new Date(iso + 'T00:00:00');
    const dif = Math.round((d - hoy) / 86400000);
    const texto = DIAS_SEMANA[d.getDay()].toLowerCase() + ' ' + d.getDate() + ' de ' + MESES[d.getMonth()].toLowerCase();
    if (dif === 0) return 'Hoy, ' + texto;
    if (dif === 1) return 'Mañana, ' + texto;
    return texto.charAt(0).toUpperCase() + texto.slice(1);
  }

  function renderMisReservas(cliente, data) {
    const mias = data.reservas.filter(r => r.dni === cliente.dni && r.estado !== 'cancelado');
    const proximas = mias.filter(r => estadoEfectivo(r) === 'reservado')
      .sort((a,b) => (a.fecha+a.hora).localeCompare(b.fecha+b.hora));
    const asistencias = mias.filter(r => estadoEfectivo(r) === 'asistio');

    const sig = proximas[0];
    const proximoHtml = sig ? `
        <div class="prox">
          <div>
            <div class="et">Tu próximo turno</div>
            <div class="hora">${String(sig.hora).slice(0, 5)}</div>
            <div class="dia">${diaCercano(sig.fecha)}</div>
          </div>
          <button class="cancel-link" data-cancelar-id="${sig.id}">Cancelar</button>
        </div>` : `
        <div class="prox-vacio">
          <p>No tenés turnos reservados.${cliente.estado === 'Activo' ? ' Elegí un día y un horario para tu próximo entrenamiento.' : ''}</p>
          ${cliente.estado === 'Activo' ? `<button class="btn btn-primary" id="irATurnosBtn" style="width:100%;">Reservar un turno</button>` : ''}
        </div>`;

    const otrosHtml = proximas.slice(1).map(r => `
        <div class="res-card">
          <div class="info">
            <div class="date-line">${String(r.hora).slice(0,5)} hs</div>
            <div class="day-line">${diaCercano(r.fecha)}</div>
          </div>
          <button class="cancel-link" data-cancelar-id="${r.id}">Cancelar</button>
        </div>`).join('');

    return `
      <div class="view">
        ${tituloVista('reservas', 'Mis reservas', 'Tus turnos y tu asistencia')}
        ${proximoHtml}
        ${otrosHtml}
        <div class="reservas-seccion">Tu asistencia</div>
        ${renderReservasAsistencias(cliente, data, mias, asistencias, { compacto: true })}
      </div>`;
  }

  // 'opts.admin' = se está mirando desde la ficha del cliente en administración
  function renderReservasAsistencias(cliente, data, mias, asistencias, opts) {
    const admin = !!(opts && opts.admin);
    const compacto = !!(opts && opts.compacto); // vista del cliente: menos números, detalle plegado
    const hoyIso = isoDate(new Date());
    const mesHoy = hoyIso.slice(0, 7);

    // --- Números generales ---
    const esteMes = asistencias.filter(r => r.fecha.slice(0, 7) === mesHoy).length;
    const total = asistencias.length;
    const racha = rachaSemanas(asistencias);

    // --- Semana en curso contra el límite del plan ---
    const limite = limiteSemanalDe(cliente);
    const turnosSemana = reservasEnSemana(data, cliente.dni, hoyIso).length;
    const semanaHtml = isFinite(limite) && limite > 0 ? `
      <div class="asis-semana">
        <div class="asis-semana-top"><span>Turnos de esta semana</span><span>${turnosSemana} de ${limite}</span></div>
        <div class="asis-bar"><i style="width:${Math.min(100, Math.round(turnosSemana / limite * 100))}%"></i></div>
      </div>` : '';

    // --- Calendario del mes elegido ---
    const fechasMias = mias.map(r => r.fecha).sort();
    const mesMin = fechasMias.length ? (fechasMias[0].slice(0, 7) < mesHoy ? fechasMias[0].slice(0, 7) : mesHoy) : mesHoy;
    const ultimaFecha = fechasMias.length ? fechasMias[fechasMias.length - 1].slice(0, 7) : mesHoy;
    const mesMax = ultimaFecha > mesHoy ? ultimaFecha : mesHoy;
    let mes = (admin ? state.fichaMes : state.asistMes) || mesHoy;
    if (mes < mesMin) mes = mesMin;
    if (mes > mesMax) mes = mesMax;

    const [anio, mesNum] = mes.split('-').map(Number);
    const diasEnMes = new Date(anio, mesNum, 0).getDate();
    const offset = (new Date(anio, mesNum - 1, 1).getDay() + 6) % 7; // semana empieza en lunes

    const porDia = {};
    mias.filter(r => r.fecha.slice(0, 7) === mes).forEach(r => {
      (porDia[r.fecha] = porDia[r.fecha] || []).push(estadoEfectivo(r));
    });

    let celdas = ['L','M','M','J','V','S','D'].map(d => `<div class="cal-dow">${d}</div>`).join('');
    for (let i = 0; i < offset; i++) celdas += '<div></div>';
    for (let dia = 1; dia <= diasEnMes; dia++) {
      const iso = mes + '-' + String(dia).padStart(2, '0');
      const estados = porDia[iso] || [];
      const dow = new Date(anio, mesNum - 1, dia).getDay();
      let cls = '';
      if (estados.includes('asistio')) cls = 'asistio';
      else if (estados.includes('no_asistio')) cls = 'falto';
      else if (estados.includes('reservado')) cls = 'reservado';
      if (dow === 0 || dow === 6) cls += ' finde';
      if (iso === hoyIso) cls += ' hoy';
      celdas += `<div class="cal-day ${cls}">${dia}</div>`;
    }

    const calendarioHtml = `
      <div class="cal-card">
        <div class="cal-head">
          <button class="cal-nav" data-cal-mes="${mesShift(mes, -1)}" ${mes <= mesMin ? 'disabled' : ''} aria-label="Mes anterior">${ICONOS.izq}</button>
          <span class="cal-mes">${MESES[mesNum - 1]} ${anio}</span>
          <button class="cal-nav" data-cal-mes="${mesShift(mes, 1)}" ${mes >= mesMax ? 'disabled' : ''} aria-label="Mes siguiente">${ICONOS.der}</button>
        </div>
        <div class="cal-grid">${celdas}</div>
        <div class="cal-leyenda">
          <span><i class="asistio"></i>${admin ? 'Asistió' : 'Asististe'}</span>
          <span><i class="reservado"></i>Turno reservado</span>
          <span><i class="falto"></i>${admin ? 'Faltó' : 'Faltaste'}</span>
        </div>
      </div>`;

    // --- Detalle del mes elegido ---
    const delMes = mias
      .filter(r => r.fecha.slice(0, 7) === mes && estadoEfectivo(r) !== 'reservado')
      .sort((a,b) => (b.fecha+b.hora).localeCompare(a.fecha+a.hora));
    const asistDelMes = delMes.filter(r => estadoEfectivo(r) === 'asistio').length;
    const nombreMes = MESES[mesNum - 1].toLowerCase();
    const listaHtml = delMes.length
      ? `<div class="asis-lista-titulo">${asistDelMes} ${asistDelMes === 1 ? 'asistencia' : 'asistencias'} en ${nombreMes}</div>` +
        delMes.map(r => `
          <div class="asis-fila">
            <div>
              <div class="dia">${fechaLarga(r.fecha)}</div>
              <div class="hora">${String(r.hora).slice(0,5)} hs</div>
            </div>
            ${estadoEfectivo(r) === 'asistio'
              ? '<span class="pill pill-green">Asistió</span>'
              : '<span class="pill pill-red">No asistió</span>'}
          </div>`).join('')
      : `<div class="empty-state" style="padding:28px 20px;">No hay asistencias registradas en ${nombreMes}.</div>`;

    // --- Datos sueltos ---
    let extrasHtml = '';
    if (total > 0) {
      const conteoHoras = {};
      asistencias.forEach(r => { const h = String(r.hora).slice(0,5); conteoHoras[h] = (conteoHoras[h] || 0) + 1; });
      const horaFrecuente = Object.keys(conteoHoras).sort((a,b) => conteoHoras[b] - conteoHoras[a] || a.localeCompare(b))[0];
      const ultima = asistencias.slice().sort((a,b) => (b.fecha+b.hora).localeCompare(a.fecha+a.hora))[0];
      extrasHtml = `
        <div class="profile-card" style="padding:8px 16px; margin:18px 0 0;">
          <div class="kv-row"><span class="k">Último entrenamiento</span><span class="v">${fechaLarga(ultima.fecha)}</span></div>
          <div class="kv-row"><span class="k">${admin ? 'Horario más frecuente' : 'Tu horario más frecuente'}</span><span class="v">${horaFrecuente} hs</span></div>
        </div>`;
    }

    if (compacto) {
      return `
      <div class="asis-stats">
        <div class="asis-stat"><span class="num">${esteMes}</span><span class="lbl">${esteMes === 1 ? 'entrenamiento' : 'entrenamientos'} este mes</span></div>
        <div class="asis-stat"><span class="num">${racha}</span><span class="lbl">${racha === 1 ? 'semana seguida' : 'semanas seguidas'}</span></div>
      </div>
      ${calendarioHtml}
      ${semanaHtml}
      <details class="cuota-aldiacolapso" style="margin-top:6px;">
        <summary>Ver el detalle de ${nombreMes}</summary>
        ${listaHtml}
        ${extrasHtml}
        ${total > 0 ? `<div class="pago-detalle" style="margin-top:12px;">Desde que empezaste: ${total} ${total === 1 ? 'entrenamiento' : 'entrenamientos'}.</div>` : ''}
      </details>`;
    }

    return `
      <div class="asis-stats">
        <div class="asis-stat"><span class="num">${esteMes}</span><span class="lbl">este mes</span></div>
        <div class="asis-stat"><span class="num">${total}</span><span class="lbl">en total</span></div>
        <div class="asis-stat"><span class="num">${racha}</span><span class="lbl">${racha === 1 ? 'semana seguida' : 'semanas seguidas'}</span></div>
      </div>
      ${semanaHtml}
      ${calendarioHtml}
      ${listaHtml}
      ${extrasHtml}`;
  }

  function renderNav(view) {
    const items = [
      ...(esPro(state.cliente) ? [{id:'midia', label:'Mi día'}] : []),
      {id:'perfil', label:'Perfil'},
      {id:'rutina', label:'Rutina'},
      {id:'turnos', label:'Turnos'},
      {id:'reservas', label:'Mis reservas'},
    ];
    return `
      <div class="bottom-nav">
        ${items.map(it => `
          <button class="nav-btn ${view===it.id?'active':''}" data-view="${it.id}">
            ${ICONOS[it.id]}<span>${it.label}</span>
          </button>`).join('')}
      </div>`;
  }

  function renderApp() {
    const root = document.getElementById('root');
    diaDibujado = isoDate(new Date());

    if (state.mode === 'adminPin') {
      root.innerHTML = renderAdminPin(state.pinError);
      document.getElementById('pinBtn').onclick = onPinSubmit;
      document.getElementById('pinInput').addEventListener('keydown', e => { if (e.key === 'Enter') onPinSubmit(); });
      document.getElementById('backToLoginBtn').onclick = () => { state.mode = 'login'; state.pinError = ''; renderApp(); };
      return;
    }

    if (state.mode === 'admin') {
      root.innerHTML = renderAdmin(state.data, state.adminFormError, state.adminFormNotice);

      root.querySelectorAll('[data-admin-tab]').forEach(btn => {
        btn.onclick = () => {
          cerrarFicha();
          state.fichaOrigen = 'clientes';
          state.adminTab = btn.dataset.adminTab;
          state.anotarEn = null;
          state.reservaAbierta = null;
          renderApp();
          actualizarPorDetras();
        };
      });

      // La pestaña activa se acomoda moviendo solo la barra de pestañas hacia el
      // costado: así la pantalla no salta arriba cada vez que se toca un botón.
      const tabActiva = root.querySelector('.admin-tab.active');
      if (tabActiva) {
        const barra = tabActiva.parentElement;
        barra.scrollLeft = Math.max(0, (tabActiva.offsetLeft - barra.offsetLeft) - (barra.clientWidth - tabActiva.offsetWidth) / 2);
      }

      document.getElementById('backToLoginBtn2').onclick = () => { state.mode = 'login'; cerrarFicha(); state.fichaOrigen = 'clientes'; state.nuevoClienteAbierto = false; state.anotarEn = null; state.reservaAbierta = null; renderApp(); };

      // Cualquier nombre o tarjeta de cliente abre su ficha
      root.querySelectorAll('[data-ficha-dni]').forEach(btn => {
        btn.onclick = () => {
          state.fichaOrigen = state.adminTab;
          state.listaScrollY = window.scrollY;
          abrirFicha(btn.dataset.fichaDni, 'resumen');
          renderApp();
          window.scrollTo(0, 0);
          actualizarPorDetras();
        };
      });

      if (state.adminTab === 'clientes') wireClientes(root);

      if (state.adminTab === 'asistencias') wireTurnosAdmin(root);

      if (state.adminTab === 'pro') {
        const proFechaInput = document.getElementById('proFechaInput');
        if (proFechaInput) proFechaInput.onchange = (e) => { state.proFecha = e.target.value || null; renderApp(); };
        root.querySelectorAll('[data-pro-fecha]').forEach(btn => {
          btn.onclick = () => { state.proFecha = btn.dataset.proFecha; renderApp(); };
        });
      }

      if (state.adminTab === 'cuotas') {
        wirePagos(root);
        const exportBtn = document.getElementById('exportPagosBtn');
        if (exportBtn) exportBtn.onclick = descargarPagosExcel;
      }

      if (state.adminTab === 'planes') {
        root.querySelectorAll('[data-guardar-plan]').forEach(btn => {
          btn.onclick = () => {
            const id = btn.dataset.guardarPlan;
            const input = document.querySelector(`[data-plan-id="${id}"]`);
            guardarPrecioPlan(id, input.value);
          };
        });
        const diasBtn = document.getElementById('guardarDiasParaPagarBtn');
        if (diasBtn) diasBtn.onclick = () => guardarDiasParaPagar(document.getElementById('diasParaPagarInput').value);
        const toggleMatriculaBtn = document.getElementById('toggleMatriculaBtn');
        if (toggleMatriculaBtn) toggleMatriculaBtn.onclick = () => guardarMatriculaActiva(toggleMatriculaBtn.dataset.activar === '1');
        const matriculaBtn = document.getElementById('guardarMatriculaBtn');
        if (matriculaBtn) {
          matriculaBtn.onclick = () => {
            const input = document.getElementById('matriculaPrecioInput');
            guardarPrecioMatricula(input.value);
          };
        }
      }

      if (state.adminTab === 'resumen') {
        const backupBtn = document.getElementById('backupBtn');
        if (backupBtn) backupBtn.onclick = descargarBackup;
        root.querySelectorAll('[data-jump-tab]').forEach(btn => {
          btn.onclick = () => { state.adminTab = btn.dataset.jumpTab; renderApp(); };
        });
      }
      return;
    }

    if (!state.cliente) {
      root.innerHTML = renderLogin(state.loginError);
      document.getElementById('loginBtn').onclick = onLogin;
      document.getElementById('passInput').addEventListener('keydown', e => { if (e.key === 'Enter') onLogin(); });
      document.getElementById('adminLinkBtn').onclick = () => { state.mode = 'adminPin'; renderApp(); };
      return;
    }

    if (state.view === 'midia' && !esPro(state.cliente)) state.view = 'perfil';

    let body = '';
    if (state.view === 'perfil') body = renderPerfil(state.cliente, state.data);
    else if (state.view === 'midia') body = renderMiDia(state.cliente, state.data);
    else if (state.view === 'rutina') body = renderRutina(state.cliente);
    else if (state.view === 'turnos') body = renderTurnos(state.cliente, state.data, state.selectedDate);
    else body = renderMisReservas(state.cliente, state.data);

    root.innerHTML = `
      <div class="app-header">
        <div class="who">
          <span class="name">${state.cliente.nombre}</span>
          <span class="plan">${state.cliente.plan}</span>
        </div>
        <div class="header-right">
          ${pillForEstado(state.cliente.estado)}
          <button class="logout-btn" id="logoutBtn" title="Cerrar sesión">Salir</button>
        </div>
      </div>
      ${body}
      ${state.view === 'turnos' ? barraTurno(state.cliente, state.data) : ''}
      ${renderNav(state.view)}
    `;

    document.getElementById('logoutBtn').onclick = onLogout;

    root.querySelectorAll('.nav-btn').forEach(btn => {
      btn.onclick = () => {
        state.view = btn.dataset.view;
        state.slotElegido = null;
        // Si la app quedó abierta de un día para el otro, no dejar seleccionado un día que ya pasó
        if (state.view === 'turnos' && state.selectedDate < isoDate(new Date())) state.selectedDate = primerDiaConTurnos();
        renderApp();
        actualizarPorDetras();
      };
    });

    if (state.view === 'midia') {
      root.querySelectorAll('[data-pro-toggle]').forEach(btn => {
        btn.onclick = () => toggleCardPro(btn.dataset.proToggle);
      });
      // Elegir una opción solo marca el botón y actualiza el borrador: no se
      // vuelve a dibujar la pantalla, así no salta el scroll mientras se completa.
      root.querySelectorAll('[data-well-item]').forEach(item => {
        const def = WELLNESS_ITEMS.find(i => i.id === item.dataset.wellItem);
        item.querySelectorAll('.cara-btn').forEach(btn => {
          btn.onclick = () => {
            const n = parseInt(btn.dataset.val, 10);
            state.proDraft.wellness = state.proDraft.wellness || {};
            state.proDraft.wellness[def.id] = n;
            item.querySelectorAll('.cara-btn').forEach(b => b.classList.toggle('active', b === btn));
            item.querySelector('.caras').classList.add('elegida');
            const desc = item.querySelector('.well-desc');
            desc.textContent = def.ref[n];
            desc.classList.add('elegida');
            desc.style.setProperty('--c', colorPro('item', n));
            // Total del día: se pinta cuando están las cinco respuestas
            const d = state.proDraft.wellness;
            const listo = WELLNESS_ITEMS.every(i => d[i.id]);
            const total = WELLNESS_ITEMS.reduce((sum, i) => sum + (d[i.id] || 0), 0);
            const caja = document.getElementById('wellTotalCaja');
            document.getElementById('wellTotal').textContent = listo ? total : '–';
            document.getElementById('wellTotalBarra').style.width = (listo ? Math.round(total / WELLNESS_MAX * 100) : 0) + '%';
            caja.classList.toggle('listo', listo);
            if (listo) {
              caja.style.setProperty('--c', colorPro('wellness', total));
              document.getElementById('wellTotalCara').innerHTML = caraPro('wellness', total);
            }
            mostrarErrorPro('');
          };
        });
      });
      root.querySelectorAll('[data-escala]').forEach(grupo => {
        const tipo = grupo.dataset.escala;
        const escala = tipo === 'tqr' ? TQR_ESCALA : RPE_ESCALA;
        grupo.querySelectorAll('.tile').forEach(btn => {
          btn.onclick = () => {
            const n = parseInt(btn.dataset.val, 10);
            state.proDraft[tipo] = n;
            grupo.querySelectorAll('.tile').forEach(b => b.classList.toggle('active', b === btn));
            const el = document.getElementById('eleccion-' + tipo);
            el.classList.add('listo');
            el.style.setProperty('--c', colorPro(tipo, n));
            el.querySelector('.cara-total').innerHTML = caraPro(tipo, n);
            el.querySelector('.num').textContent = n;
            el.querySelector('.txt').textContent = etiquetaEscala(escala, n);
            mostrarErrorPro('');
          };
        });
      });
      const gw = document.getElementById('guardarWellnessBtn'); if (gw) gw.onclick = guardarWellness;
      const gt = document.getElementById('guardarTqrBtn'); if (gt) gt.onclick = guardarTqr;
      const gr = document.getElementById('guardarRpeBtn'); if (gr) gr.onclick = guardarRpe;
      ['rpeMinutos', 'rpeActividad'].forEach(id => {
        const campo = document.getElementById(id);
        if (campo) campo.oninput = () => mostrarErrorPro('');
      });
      root.querySelectorAll('[data-del-registro]').forEach(btn => {
        btn.onclick = () => borrarRegistroPro(btn.dataset.delRegistro);
      });
    }

    if (state.view === 'perfil') {
      const cambiarBtn = document.getElementById('cambiarPassBtn');
      if (cambiarBtn) cambiarBtn.onclick = cambiarMiPassword;
    }

    if (state.view === 'turnos') {
      root.querySelectorAll('.sem-dia[data-date]').forEach(dia => {
        dia.onclick = () => { state.selectedDate = dia.dataset.date; state.slotElegido = null; renderApp(); };
      });
      // Tocar un horario solo lo elige; se reserva (o cancela) desde la barra de abajo
      root.querySelectorAll('.slot[data-slot]').forEach(btn => {
        btn.onclick = () => { state.slotElegido = state.slotElegido === btn.dataset.slot ? null : btn.dataset.slot; renderApp(); };
      });
      const confirmar = document.getElementById('confirmarTurnoBtn');
      if (confirmar) confirmar.onclick = () => {
        const hora = state.slotElegido;
        confirmar.disabled = true;
        state.slotElegido = null;
        reservarTurno(hora);
      };
      const cancelar = document.getElementById('cancelarTurnoBtn');
      if (cancelar) cancelar.onclick = () => { cancelar.disabled = true; state.slotElegido = null; cancelarReserva(cancelar.dataset.id); };
    }
    if (state.view === 'reservas') {
      root.querySelectorAll('[data-cancelar-id]').forEach(btn => {
        btn.onclick = () => cancelarReserva(btn.dataset.cancelarId);
      });
      const irATurnos = document.getElementById('irATurnosBtn');
      if (irATurnos) irATurnos.onclick = () => {
        state.view = 'turnos';
        if (state.selectedDate < isoDate(new Date())) state.selectedDate = primerDiaConTurnos();
        renderApp();
        window.scrollTo(0, 0);
      };
      root.querySelectorAll('[data-cal-mes]').forEach(btn => {
        btn.onclick = () => { state.asistMes = btn.dataset.calMes; renderApp(); };
      });
    }
  }

  function onLogout() {
    state.cliente = null;
    state.view = 'perfil';
    state.slotElegido = null;
    state.asistMes = null;
    state.proAbierto = undefined;
    state.proDraft = {};
    state.loginError = '';
    renderApp();
  }

  async function cambiarMiPassword() {
    const actual = document.getElementById('passActual').value;
    const nueva = document.getElementById('passNueva').value;
    const repetir = document.getElementById('passNuevaRepetir').value;
    const errorEl = document.getElementById('cambiarPassError');

    const ok = await verifyPassword(actual, state.cliente.password);
    if (!ok) {
      errorEl.textContent = 'Tu contraseña actual no es correcta.';
      return;
    }
    if (!nueva || nueva.length < 4) {
      errorEl.textContent = 'La contraseña nueva tiene que tener al menos 4 caracteres.';
      return;
    }
    if (nueva !== repetir) {
      errorEl.textContent = 'Las dos contraseñas nuevas no coinciden.';
      return;
    }

    const nuevoHash = await hashPassword(nueva);
    const { error } = await sb.from('clientes').update({ password: nuevoHash }).eq('dni', state.cliente.dni);
    if (error) {
      errorEl.textContent = 'No se pudo guardar. Probá de nuevo.';
      console.error(error);
      return;
    }
    await refreshData();
    state.cliente = state.data.clientes.find(c => c.dni === state.cliente.dni) || state.cliente;
    errorEl.textContent = '';
    showToast('Contraseña actualizada');
    renderApp();
  }

  let ingresoEnCurso = false;
  async function onLogin() {
    if (ingresoEnCurso) return;
    ingresoEnCurso = true;
    try { await ingresar(); } finally { ingresoEnCurso = false; }
  }

  async function ingresar() {
    const dni = document.getElementById('dniInput').value.trim();
    const pass = document.getElementById('passInput').value;
    const btn = document.getElementById('loginBtn');
    if (btn) { btn.disabled = true; btn.textContent = 'Ingresando…'; }
    // Se vuelve a leer la base antes de entrar: así un cliente recién cargado
    // (o con la contraseña recién cambiada) entra aunque tuviera la página abierta.
    await refreshData();
    const found = state.data.clientes.find(c => c.dni === dni);
    if (!found) {
      state.loginError = 'No encontramos ese DNI. Verificalo o hablá con recepción.';
      renderApp();
      return;
    }
    const ok = await verifyPassword(pass, found.password);
    if (!ok) {
      state.loginError = 'Contraseña incorrecta.';
      renderApp();
      return;
    }
    // Si todavía tenía la contraseña vieja en texto plano, la protegemos ahora
    // que sabemos que es correcta, sin que el cliente note nada.
    if (!esPasswordHasheada(found.password)) {
      const nuevoHash = await hashPassword(pass);
      const { error: errUpgrade } = await sb.from('clientes').update({ password: nuevoHash }).eq('dni', dni);
      if (errUpgrade) {
        console.error('No se pudo proteger la contraseña automáticamente:', errUpgrade.message);
      } else {
        found.password = nuevoHash;
      }
    }
    state.cliente = found;
    state.loginError = '';
    // Los clientes PRO entran directo a su control diario
    state.view = esPro(found) ? 'midia' : 'perfil';
    state.proAbierto = undefined;
    state.proDraft = {};
    state.selectedDate = primerDiaConTurnos();
    renderApp();
  }

  async function onPinSubmit() {
    const val = document.getElementById('pinInput').value;
    const ok = await verifyPassword(val, ADMIN_PIN_HASH);
    if (!ok) {
      state.pinError = 'Clave incorrecta.';
      renderApp();
      return;
    }
    await refreshData(); // administración siempre arranca con los datos del momento
    state.novedadesAvisadas = {};
    state.novedadesListas = false;
    state.pinError = '';
    state.adminFormError = '';
    state.adminFormNotice = '';
    state.mode = 'admin';
    state.adminTab = 'resumen';
    avisarNovedades(); // toma nota de lo que ya había, para avisar solo lo que llegue después
    renderApp();
  }

  function wireAdminForm() {
    const planSel = document.getElementById('fPlan');
    const diasSel = document.getElementById('fDias');
    const preview = document.getElementById('fPrecioPreview');
    const especialInput = document.getElementById('fCuotaEspecial');
    const updatePreview = () => {
      const esPro = planSel.value === 'PRO';
      diasSel.disabled = esPro;
      const dias = esPro ? null : parseInt(diasSel.value, 10);
      const precioPlan = precioDe(planSel.value, dias);
      const especial = parseInt(String(especialInput ? especialInput.value : '').replace(/[^\d]/g, ''), 10) || 0;
      const precio = especial > 0 ? especial : precioPlan;
      preview.textContent = especial > 0
        ? money(especial) + ' / mes · especial' + (precioPlan ? ' (el plan vale ' + money(precioPlan) + ')' : '')
        : (precioPlan ? money(precioPlan) + ' / mes' : 'Combinación no válida');
      // Monto y período del pago inicial (solo en el alta)
      const durSel = document.getElementById('fDuracionPago');
      const montoEl = document.getElementById('fPagoInicialMonto');
      const detalleEl = document.getElementById('fPagoInicialDetalle');
      if (durSel && montoEl && detalleEl) {
        const dur = durSel.value ? duracionPorId(durSel.value) : null;
        if (!dur || !precio) {
          montoEl.textContent = dur ? '—' : 'Sin pago';
          detalleEl.textContent = '';
        } else {
          const hoy = todayMidnight();
          montoEl.textContent = money(montoDe(precio, dur));
          detalleEl.textContent = textoPeriodoPago(hoy, calcularVencimiento(hoy, dur), dur);
        }
      }
    };
    planSel.onchange = updatePreview;
    diasSel.onchange = updatePreview;
    const durPagoSel = document.getElementById('fDuracionPago');
    if (durPagoSel) durPagoSel.onchange = updatePreview;
    if (especialInput) especialInput.oninput = updatePreview;
    updatePreview();
    document.getElementById('addClienteBtn').onclick = onAddCliente;
  }

  async function onAddCliente() {
    const dniField = document.getElementById('fDni');
    const dni = dniField.value.trim();
    const password = document.getElementById('fPass').value.trim();
    const nombre = document.getElementById('fNombre').value.trim();
    const email = document.getElementById('fEmail').value.trim();
    const telefono = document.getElementById('fTelefono').value.trim();
    const plan = document.getElementById('fPlan').value;
    const esPro = plan === 'PRO';
    const dias = esPro ? null : parseInt(document.getElementById('fDias').value, 10);
    const fuerza = parseInt(document.getElementById('fFuerza').value, 10) || 0;
    const resistencia = parseInt(document.getElementById('fResistencia').value, 10) || 0;
    const velocidad = parseInt(document.getElementById('fVelocidad').value, 10) || 0;
    const estado = document.getElementById('fEstado').value;
    const limiteRaw = document.getElementById('fLimiteSemanal').value.trim();
    const limiteSemanalOverride = limiteRaw === '' ? null : parseInt(limiteRaw, 10);
    const marcarPrueba = document.getElementById('fPrueba').checked;
    const notaPrueba = (okMarca) => !okMarca
      ? ' Ojo: no se pudo guardar la marca de usuario de prueba, probá de nuevo.'
      : (marcarPrueba ? ' Quedó como usuario de prueba.' : '');

    if (!dni || !nombre || (!state.editingDni && !password)) {
      state.adminFormError = state.editingDni
        ? 'Completá al menos DNI y nombre.'
        : 'Completá al menos DNI, contraseña y nombre.';
      state.adminFormNotice = '';
      renderApp();
      return;
    }

    // Cuota: la especial si se cargó una, si no la del plan
    const especialTexto = document.getElementById('fCuotaEspecial').value.trim();
    const cuotaEspecial = especialTexto === '' ? null : parseInt(especialTexto.replace(/[.\s$]/g, ''), 10);
    if (especialTexto !== '' && (!/^[\d.\s$]+$/.test(especialTexto) || !(cuotaEspecial > 0))) {
      state.adminFormError = 'La cuota especial tiene que ser un monto en pesos (por ejemplo 100000), o quedar vacía.';
      state.adminFormNotice = '';
      renderApp();
      return;
    }
    const precio = cuotaEspecial || precioDe(plan, dias);
    const notaCuota = (ok, antes) => !ok ? ' Ojo: no se pudo guardar la cuota especial, probá de nuevo.'
      : (cuotaEspecial && cuotaEspecial !== antes) ? ` Cuota especial: ${money(cuotaEspecial)} por mes.`
      : (!cuotaEspecial && antes) ? ' Volvió a la cuota de su plan.' : '';
    const datosComunes = {
      nombre, email, telefono, plan, precio,
      dias: esPro ? null : dias,
      estimulos: esPro ? null : { fuerza, resistencia, velocidad },
      estado,
      limiteSemanalOverride,
    };

    if (state.editingDni) {
      const cActual = state.data.clientes.find(x => x.dni === state.editingDni);
      const estadoAnterior = cActual.estado;
      const nuevoPassword = password ? await hashPassword(password) : cActual.password;
      const candidato = { ...cActual, ...datosComunes, password: nuevoPassword };
      const nota = aplicarTransicionEstado(candidato, estadoAnterior, estado);
      const { error } = await sb.from('clientes').update(clienteJsToDb(candidato)).eq('dni', state.editingDni);
      if (error) { state.adminFormError = 'No se pudo guardar (' + error.message + ')'; renderApp(); return; }
      const dniEditado = state.editingDni;
      const eraPrueba = esPrueba(dniEditado);
      const cuotaAntes = cuotaEspecialDe(dniEditado);
      await guardarMarcaPrueba(dniEditado, marcarPrueba);
      await guardarCuotaEspecial(dniEditado, cuotaEspecial);
      await refreshData();
      // Se confirma contra lo que realmente quedó guardado en la base
      const okMarca = esPrueba(dniEditado) === marcarPrueba;
      state.adminFormError = '';
      state.adminFormNotice = `${nombre} se actualizó correctamente.${nota}${
        !okMarca ? notaPrueba(false) : (marcarPrueba !== eraPrueba ? (marcarPrueba ? ' Quedó como usuario de prueba.' : ' Dejó de ser usuario de prueba.') : '')}${
        notaCuota(cuotaEspecialDe(dniEditado) === cuotaEspecial, cuotaAntes)}`;
      renderApp();
      return;
    }

    if (state.data.clientes.some(c => c.dni === dni)) {
      state.adminFormError = 'Ya existe un cliente con ese DNI.';
      state.adminFormNotice = '';
      renderApp();
      return;
    }
    // La casilla solo existe si la matrícula se está cobrando
    const casillaMatricula = document.getElementById('fMatriculaPagada');
    const matriculaPagada = !!casillaMatricula && casillaMatricula.checked;
    const passwordHash = await hashPassword(password);
    const nuevoCliente = {
      dni, ...datosComunes, password: passwordHash,
      matricula: { pagada: matriculaPagada, fechaPago: matriculaPagada ? isoDate(new Date()) : null },
      pausadoDesde: estado === 'Pausado' ? isoDate(new Date()) : null,
    };
    const { error: errCliente } = await sb.from('clientes').insert(clienteJsToDb(nuevoCliente));
    if (errCliente) { state.adminFormError = 'No se pudo crear (' + errCliente.message + ')'; renderApp(); return; }

    let notaPago = '';
    const duracionPago = document.getElementById('fDuracionPago').value;
    if (duracionPago) {
      const dur = duracionPorId(duracionPago);
      const metodoPago = document.getElementById('fMetodoPago').value;
      const hoy = new Date();
      hoy.setHours(0, 0, 0, 0);
      const venc = calcularVencimiento(hoy, dur);
      const diasReales = Math.round((venc - hoy) / 86400000);
      const monto = montoDe(precio, dur);
      const nuevoPago = {
        id: 'pago-' + dni + '-' + Date.now(),
        dni, fechaPago: isoDate(hoy), duracionId: dur.id, dias: diasReales, monto, metodoPago,
        fechaVencimiento: isoDate(venc),
      };
      const { error: errPago } = await sb.from('pagos').insert(pagoJsToDb(nuevoPago));
      notaPago = errPago
        ? ' Ojo: el pago inicial no se pudo registrar, cargalo desde su ficha.'
        : ` Pago inicial registrado (${dur.label}, ${money(monto)}, vence ${formatFechaCorta(isoDate(venc))}).`;
      if (errPago) console.error(errPago);
    }

    if (marcarPrueba) await guardarMarcaPrueba(dni, true);
    if (cuotaEspecial) await guardarCuotaEspecial(dni, cuotaEspecial);
    await refreshData();
    state.adminFormError = '';
    state.nuevoClienteAbierto = false;
    state.adminFormNotice = `${nombre} se agregó correctamente.${notaPago}${marcarPrueba ? notaPrueba(esPrueba(dni)) : ''}${
      cuotaEspecial ? notaCuota(cuotaEspecialDe(dni) === cuotaEspecial, null) : ''}`;
    renderApp();
  }

  function descargarBackup() {
    const blob = new Blob([JSON.stringify(state.data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'origo-backup-' + isoDate(new Date()) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Descargando copia de seguridad...');
  }

  async function marcarAsistencia(reservaId, valor) {
    const r = state.data.reservas.find(x => x.id === reservaId);
    if (!r) return;
    // "No asistió" tocado de nuevo se deshace (vuelve a contar como asistencia automática).
    // "Asistió" deja la asistencia confirmada a mano.
    let nuevoEstado;
    if (valor === 'no_asistio') nuevoEstado = (r.estado === 'no_asistio') ? 'reservado' : 'no_asistio';
    else nuevoEstado = 'asistio';
    if (nuevoEstado === r.estado) return;
    const { error } = await sb.from('reservas').update({ estado: nuevoEstado }).eq('id', reservaId);
    if (error) { showToast('No se pudo actualizar.'); console.error(error); return; }
    await refreshData();
    renderApp();
  }

  async function eliminarCliente(dni) {
    state.confirmarEliminarDni = null;
    if (state.fichaDni === dni) { cerrarFicha(); state.fichaOrigen = 'clientes'; }
    const { error } = await sb.from('clientes').delete().eq('dni', dni);
    if (error) { showToast('No se pudo eliminar.'); console.error(error); return; }
    // Sus registros de control diario se borran con él (si la tabla existe)
    if (state.data.registrosProListo) await sb.from('registros_pro').delete().eq('dni', dni);
    // Y su cuota especial y su marca de usuario de prueba, para que no las herede otro cliente con el mismo DNI
    if (state.data.config.some(c => c.clave === CLAVE_CUOTA + dni)) {
      await sb.from('config').update({ valor: 0 }).eq('clave', CLAVE_CUOTA + dni);
      await sb.from('config').delete().eq('clave', CLAVE_CUOTA + dni);
    }
    if (state.data.config.some(c => c.clave === CLAVE_PRUEBA + dni)) {
      await sb.from('config').update({ valor: 0 }).eq('clave', CLAVE_PRUEBA + dni);
      await sb.from('config').delete().eq('clave', CLAVE_PRUEBA + dni);
    }
    await refreshData();
    showToast('Cliente eliminado');
    renderApp();
  }

  function aplicarTransicionEstado(c, estadoAnterior, nuevoEstado) {
    if (nuevoEstado === estadoAnterior) return '';
    if (nuevoEstado === 'Baja') {
      c.pausadoDesde = null;
      if (!matriculaActiva()) return '';
      c.matricula = { pagada: false, fechaPago: null };
      return ' Se reinició su matrícula: va a tener que pagarla de nuevo si vuelve.';
    }
    if (nuevoEstado === 'Pausado') {
      c.pausadoDesde = isoDate(new Date());
      return ' Empieza a correr el plazo de pausa (máximo 3 meses).';
    }
    if (nuevoEstado === 'Activo') {
      c.pausadoDesde = null;
    }
    return '';
  }

  async function cambiarEstadoCliente(dni, nuevoEstado) {
    const cActual = state.data.clientes.find(x => x.dni === dni);
    if (!cActual) return;
    const estadoAnterior = cActual.estado;
    const candidato = { ...cActual, estado: nuevoEstado };
    const nota = aplicarTransicionEstado(candidato, estadoAnterior, nuevoEstado);
    const { error } = await sb.from('clientes').update(clienteJsToDb(candidato)).eq('dni', dni);
    if (error) { showToast('No se pudo actualizar.'); console.error(error); return; }
    await refreshData();
    showToast(cActual.nombre + ' ahora está ' + nuevoEstado.toLowerCase() + '.' + nota);
    renderApp();
  }

  async function registrarMatricula(dni) {
    const c = state.data.clientes.find(x => x.dni === dni);
    if (!c) return;
    const { error } = await sb.from('clientes')
      .update({ matricula_pagada: true, matricula_fecha_pago: isoDate(new Date()) })
      .eq('dni', dni);
    if (error) { showToast('No se pudo registrar.'); console.error(error); return; }
    await refreshData();
    showToast('Matrícula registrada para ' + c.nombre);
    renderApp();
  }

  async function agregarRutina(dni) {
    const tituloInput = document.getElementById('rutinaTitulo-' + dni);
    const urlInput = document.getElementById('rutinaUrl-' + dni);
    const titulo = tituloInput.value.trim();
    let url = urlInput.value.trim();
    if (!titulo || !url) {
      showToast('Completá el título y el link.');
      return;
    }
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
    const { error } = await sb.from('rutinas').insert({
      id: 'rutina-' + Date.now(), dni, titulo, url, fecha: isoDate(new Date()),
    });
    if (error) { showToast('No se pudo agregar la rutina.'); console.error(error); return; }
    await refreshData();
    showToast('Rutina agregada');
    renderApp();
  }

  async function eliminarRutina(dni, rutinaId) {
    const { error } = await sb.from('rutinas').delete().eq('id', rutinaId);
    if (error) { showToast('No se pudo eliminar.'); console.error(error); return; }
    state.confirmarRutinaId = null;
    await refreshData();
    showToast('Rutina eliminada');
    renderApp();
  }

  function diasPausado(c) {
    if (!c.pausadoDesde) return null;
    const hoy = new Date();
    hoy.setHours(0, 0, 0, 0);
    const desde = new Date(c.pausadoDesde + 'T00:00:00');
    return Math.round((hoy - desde) / 86400000);
  }

  // Reservas de un día leídas en ese momento desde la base (null si no se pudo leer)
  async function reservasFrescasDelDia(fecha) {
    const { data, error } = await sb.from('reservas').select('*').eq('fecha', fecha);
    if (error || !data) { console.error('No se pudo leer el cupo:', error); return null; }
    return data;
  }

  // Evita que dos toques seguidos en "Reservar" anoten dos veces
  let reservaEnCurso = false;
  async function reservarTurno(hora) {
    if (reservaEnCurso) return;
    reservaEnCurso = true;
    try { await reservarTurnoInterno(hora); } finally { reservaEnCurso = false; }
  }

  async function reservarTurnoInterno(hora) {
    if (turnoYaEmpezo(state.selectedDate, hora)) {
      showToast('Ese turno ya empezó. Elegí uno más tarde.');
      renderApp();
      return;
    }
    const reservasHoy = state.data.reservas.filter(r =>
      r.dni === state.cliente.dni && r.fecha === state.selectedDate && r.estado !== 'cancelado');
    if (reservasHoy.length >= MAX_TURNOS_POR_DIA) {
      showToast('Ya reservaste ' + MAX_TURNOS_POR_DIA + ' turnos ese día. Desmarcá uno primero.');
      return;
    }
    const limiteSemanal = limiteSemanalDe(state.cliente);
    const reservasSemana = reservasEnSemana(state.data, state.cliente.dni, state.selectedDate);
    if (reservasSemana.length >= limiteSemanal) {
      showToast('Ya alcanzaste tu límite semanal de turnos según tu plan.');
      return;
    }
    // El cupo se vuelve a consultar en la base en este momento: lo que el
    // cliente ve en pantalla puede tener varios minutos.
    const dni = state.cliente.dni;
    const fecha = state.selectedDate;
    const antes = await reservasFrescasDelDia(fecha);
    if (!antes) { showToast('No se pudo comprobar el cupo. Probá de nuevo.'); return; }
    if (antes.some(r => r.dni === dni && r.hora === hora && r.estado !== 'cancelado')) {
      await refreshData();
      showToast('Ya tenías reservado ese turno.');
      renderApp();
      return;
    }
    if (ocupadosEnTurno({ reservas: antes }, fecha, hora, dni) >= CUPO) {
      await refreshData();
      showToast('Ese turno se acaba de completar. Elegí otro horario.');
      renderApp();
      return;
    }
    const nueva = {
      id: 'r' + Date.now() + Math.random().toString(36).slice(2,7),
      dni,
      fecha,
      hora,
      estado: 'reservado',
    };
    const { error } = await sb.from('reservas').insert(nueva);
    if (error) { showToast('No se pudo reservar. Probá de nuevo.'); console.error(error); return; }
    // Segundo control: si otro cliente anotó en el mismo instante y el turno
    // quedó pasado de cupo, esta reserva se deshace. (El usuario de prueba no
    // ocupa lugar, así que no puede pasarse.)
    if (!esPrueba(dni)) {
      const despues = await reservasFrescasDelDia(fecha);
      if (despues && ocupadosEnTurno({ reservas: despues }, fecha, hora, dni) > CUPO) {
        await sb.from('reservas').update({ estado: 'cancelado' }).eq('id', nueva.id);
        await refreshData();
        showToast('Ese turno se completó justo antes. Elegí otro horario.');
        renderApp();
        return;
      }
    }
    await refreshData();
    showToast('Turno reservado: ' + hora + ' hs');
    renderApp();
  }

  async function cancelarReserva(id) {
    const reserva = state.data.reservas.find(x => x.id === id);
    if (reserva && turnoYaEmpezo(reserva.fecha, reserva.hora)) {
      showToast('Ese turno ya empezó y no se puede cancelar.');
      renderApp();
      return;
    }
    const { error } = await marcarCancelada(id);
    if (error) { showToast('No se pudo cancelar.'); console.error(error); return; }
    await refreshData();
    showToast('Turno cancelado');
    renderApp();
  }

  async function init() {
    await refreshData();
    renderApp();
  }

  init();
})();
</script>
</body>
