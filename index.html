    }

    const r = resumenDiaPro(data, cliente.dni, hoy);
    // Al entrar, las tres tarjetas arrancan cerradas: se abre la que el cliente toque
    const abierto = state.proAbierto || null;
    const draft = state.proDraft;
    const pendiente = '<span class="pill pill-amber">Pendiente</span>';

    // --- Wellness: una carita por pregunta ---
    const dw = draft.wellness || {};
    const totalDraft = WELLNESS_ITEMS.reduce((sum, i) => sum + (dw[i.id] || 0), 0);
    const completo = WELLNESS_ITEMS.every(i => dw[i.id]);
    const wellnessBody = abierto !== 'wellness' ? '' : `
      <div class="pro-card-body">
        <p class="pro-ayuda">¿Cómo llegás hoy? Tocá una carita en cada una.</p>
        ${WELLNESS_ITEMS.map(i => `
          <div class="well-item" data-well-item="${i.id}">
            <div class="well-top">
              <span class="well-label">${i.label}</span>
              <span class="well-desc ${dw[i.id] ? 'elegida' : ''}" ${dw[i.id] ? `style="--c:${colorPro('item', dw[i.id])}"` : ''}>${dw[i.id] ? i.ref[dw[i.id]] : ''}</span>
            </div>
            <div class="caras ${dw[i.id] ? 'elegida' : ''}">
              ${[1,2,3,4,5].map(nn => `<button class="cara-btn ${dw[i.id] === nn ? 'active' : ''}" data-val="${nn}" style="--c:${colorPro('item', nn)}" aria-label="${i.label}: ${i.ref[nn]}">${cara(nn)}</button>`).join('')}
            </div>
          </div>`).join('')}
        <div class="well-total ${completo ? 'listo' : ''}" id="wellTotalCaja" ${completo ? `style="--c:${colorPro('wellness', totalDraft)}"` : ''}>
          <span class="cara-total" id="wellTotalCara">${completo ? caraPro('wellness', totalDraft) : cara(3)}</span>
          <div class="datos">
            <div class="fila"><span>Tu wellness de hoy</span><span><b id="wellTotal">${completo ? totalDraft : '–'}</b> de ${WELLNESS_MAX}</span></div>
            <div class="barra"><i id="wellTotalBarra" style="width:${completo ? Math.round(totalDraft / WELLNESS_MAX * 100) : 0}%"></i></div>
          </div>
        </div>
        <div class="error-text" id="proError"></div>
        <button class="btn btn-primary" id="guardarWellnessBtn" style="width:100%; margin-top:6px;">Guardar wellness</button>
      </div>`;

    // --- TQR ---
    const tqrBody = abierto !== 'tqr' ? '' : `
      <div class="pro-card-body">
        <p class="pro-ayuda">¿Qué tan recuperado te sentís desde tu último entrenamiento?</p>
        ${renderEscala('tqr', TQR_ESCALA, draft.tqr, 5)}
        <div class="well-anchors"><span>6 es lo peor</span><span>20 es lo mejor</span></div>
        <div class="error-text" id="proError"></div>
        <button class="btn btn-primary" id="guardarTqrBtn" style="width:100%; margin-top:10px;">Guardar TQR</button>
      </div>`;

    // --- RPE ---
    const sesionesHtml = r.rpes.map(x => {
      const extra = textoSesionRpe(x);
      return `
        <div class="pro-sesion">
          <div>
            <div class="s1">RPE ${valorColor('rpe', x.valor)} <span style="font-weight:400; color:var(--text-muted);">${etiquetaEscala(RPE_ESCALA, x.valor).toLowerCase()}</span></div>
            ${extra ? `<div class="s2">${extra}</div>` : ''}
          </div>
          <button class="cancel-link" data-del-registro="${x.id}">Borrar</button>
        </div>`;
    }).join('');
    const rpeBody = abierto !== 'rpe' ? '' : `
      <div class="pro-card-body">
        ${sesionesHtml}
        <p class="pro-ayuda">¿Qué tan duro fue el entrenamiento? Cargá una sesión por cada entrenamiento del día, también los de afuera de ORIGO.</p>
        ${renderEscala('rpe', RPE_ESCALA, draft.rpe, 6)}
        <div class="well-anchors" style="margin-bottom:14px;"><span>0 es reposo</span><span>10 es el máximo</span></div>
        <div class="pro-campos">
          <label>Duración (min)<input type="text" inputmode="numeric" id="rpeMinutos" placeholder="Ej: 60" autocomplete="off"></label>
          <label>¿Qué hiciste?<input type="text" id="rpeActividad" maxlength="60" placeholder="Ej: entrenamiento con el club" autocomplete="off"></label>
        </div>
        <div class="error-text" id="proError"></div>
        <button class="btn btn-primary" id="guardarRpeBtn" style="width:100%; margin-top:6px;">Guardar sesión</button>
      </div>`;

    const card = (tipo, tit, desc, estadoHtml, body) => `
      <div class="pro-card">
        <button class="pro-card-head" data-pro-toggle="${tipo}" aria-expanded="${abierto === tipo}">
          <div><div class="t">${tit}</div><div class="d">${desc}</div></div>
          <span class="estado">${estadoHtml}<span class="flecha">${ICONOS.der}</span></span>
        </button>
        ${body}
      </div>`;

    return `
      <div class="view">
        ${titulo}
        <div class="pro-seccion">Antes de entrenar</div>
        ${card('wellness', 'Wellness', 'Cómo llegás hoy',
            r.wellness ? `<span class="pro-valor" style="--c:${colorPro('wellness', r.wellness.valor)}">${caraPro('wellness', r.wellness.valor)}${r.wellness.valor}<small>/${WELLNESS_MAX}</small></span>` : pendiente, wellnessBody)}
        ${card('tqr', 'TQR', 'Qué tan recuperado estás',
            r.tqr ? `<span class="pro-valor" style="--c:${colorPro('tqr', r.tqr.valor)}">${caraPro('tqr', r.tqr.valor)}${r.tqr.valor}</span>` : pendiente, tqrBody)}
        <div class="pro-seccion">Después de entrenar</div>
        ${card('rpe', 'RPE', 'Qué tan duro fue el entrenamiento',
            r.rpes.length ? `<span class="pill pill-green">${r.rpes.length} ${r.rpes.length === 1 ? 'sesión' : 'sesiones'}</span>` : pendiente, rpeBody)}
        <div class="pro-seccion">Tus últimos 7 días</div>
        <div class="pro-card" style="padding:14px 14px 6px;">${tablaUltimosDiasPro(data, cliente.dni, hoy)}</div>
      </div>`;
  }

  // Abre o cierra una tarjeta de "Mi día". Al abrir una ya cargada, arranca
  // con los valores guardados para poder corregirlos.
  function toggleCardPro(tipo) {
    const hoy = isoDate(ahora());
    const r = resumenDiaPro(state.data, state.cliente.dni, hoy);
    const abiertoAhora = state.proAbierto || null;
    if (abiertoAhora === tipo) { state.proAbierto = null; renderApp(); return; }
    state.proAbierto = tipo;
    state.proDraft = {};
    if (tipo === 'wellness' && r.wellness) state.proDraft.wellness = Object.assign({}, r.wellness.detalle);
    if (tipo === 'tqr' && r.tqr) state.proDraft.tqr = r.tqr.valor;
    renderApp();
  }

  function mostrarErrorPro(msg) {
    const el = document.getElementById('proError');
    if (el) el.textContent = msg;
  }

  // Guarda un registro del día. Wellness y TQR son uno por día (si ya existe se
  // actualiza); RPE admite varias sesiones por día.
  async function guardarRegistroPro(tipo, valor, detalle, unoPorDia) {
    const hoy = isoDate(ahora());
    const dni = state.cliente.dni;
    const existente = unoPorDia ? registrosDe(state.data, dni, hoy, tipo)[0] : null;
    const res = existente
      ? await sb.from('registros_pro').update({ valor, detalle }).eq('id', existente.id)
      : await sb.from('registros_pro').insert({
          id: 'g' + Date.now() + Math.random().toString(36).slice(2, 7), dni, fecha: hoy, tipo, valor, detalle,
        });
    if (res.error) { mostrarErrorPro('No se pudo guardar. Probá de nuevo.'); console.error(res.error); return false; }
    await refreshData();
    return true;
  }

  async function guardarWellness() {
    const d = state.proDraft.wellness || {};
    if (!WELLNESS_ITEMS.every(i => d[i.id])) { mostrarErrorPro('Te falta responder alguna de las 5 preguntas.'); return; }
    const detalle = {};
    WELLNESS_ITEMS.forEach(i => { detalle[i.id] = d[i.id]; });
    const total = WELLNESS_ITEMS.reduce((sum, i) => sum + d[i.id], 0);
    if (!(await guardarRegistroPro('wellness', total, detalle, true))) return;
    state.proDraft = {};
    // Para seguir de corrido: si falta el TQR, se abre esa tarjeta
    state.proAbierto = resumenDiaPro(state.data, state.cliente.dni, isoDate(ahora())).tqr ? null : 'tqr';
    showToast('Wellness guardado');
    renderApp();
    window.scrollTo(0, 0);
  }

  async function guardarTqr() {
    const v = state.proDraft.tqr;
    if (v == null) { mostrarErrorPro('Elegí un número de la escala.'); return; }
    if (!(await guardarRegistroPro('tqr', v, {}, true))) return;
    state.proDraft = {};
    state.proAbierto = null;
    showToast('TQR guardado');
    renderApp();
    window.scrollTo(0, 0);
  }

  async function guardarRpe() {
    const v = state.proDraft.rpe;
    if (v == null) { mostrarErrorPro('Elegí un número de la escala.'); return; }
    const minTexto = document.getElementById('rpeMinutos').value.trim();
    const actividad = document.getElementById('rpeActividad').value.trim().slice(0, 60);
    let minutos = null;
    if (minTexto !== '') {
      minutos = parseInt(minTexto, 10);
      if (!/^\d+$/.test(minTexto) || minutos <= 0 || minutos > 600) { mostrarErrorPro('La duración tiene que ser un número de minutos (por ejemplo 60).'); return; }
    }
    const detalle = {};
    if (minutos) detalle.minutos = minutos;
    if (actividad) detalle.actividad = actividad;
    if (!(await guardarRegistroPro('rpe', v, detalle, false))) return;
    state.proDraft = {};
    state.proAbierto = null;
    showToast('Sesión guardada');
    renderApp();
    window.scrollTo(0, 0);
  }

  async function borrarRegistroPro(id) {
    const reg = (state.data.registrosPro || []).find(x => x.id === id);
    if (!reg || reg.dni !== state.cliente.dni) return;
    const { error } = await sb.from('registros_pro').delete().eq('id', id);
    if (error) { showToast('No se pudo borrar.'); console.error(error); return; }
    await refreshData();
    showToast('Sesión borrada');
    renderApp();
  }

  // ---------------- Render: Rutina ----------------
  function renderRutina(cliente) {
    const rutinas = cliente.rutinas || [];
    if (rutinas.length === 0) {
      return `
        <div class="view">
          ${tituloVista('rutina', 'Tu rutina', 'El plan que te armó tu profe')}
          <div class="empty-state">Todavía no tenés una rutina cargada.<br>Hablá con tu profe en ORIGO.</div>
        </div>`;
    }
    const items = rutinas.map(r => `
      <a class="rutina-card" href="${esc(r.url)}" target="_blank" rel="noopener">
        <div class="rutina-card-info">
          <div class="rutina-card-titulo">${esc(r.titulo)}</div>
          <div class="rutina-card-fecha">Cargada el ${formatFechaCorta(r.fecha)}</div>
        </div>
        <span class="rutina-card-arrow">Abrir</span>
      </a>`).join('');
    return `
      <div class="view">
        ${tituloVista('rutina', 'Tu rutina', 'El plan que te armó tu profe')}
        ${items}
      </div>`;
  }

  // ---------------- Render: Turnos ----------------
  // Los horarios se muestran agrupados por franja. Para cambiar dónde corta
  // cada una alcanza con tocar estas horas.
  const FRANJAS = [
    { nombre: 'Mañana', desde: 0,  hasta: 12 },
    { nombre: 'Tarde',  desde: 13, hasta: 18 },
    { nombre: 'Noche',  desde: 19, hasta: 23 },
  ];
  // Con esta cantidad de lugares libres (o menos) el horario se marca en ámbar ("últimos lugares")
  const POCOS_LUGARES = 2;
  // Cómo se muestran los horarios al cliente: 'grilla' (casilleros) o 'lista' (uno debajo del otro)
  const DISPOSICION_TURNOS = 'grilla';

  // Por qué el cliente no puede reservar ese horario (null = puede)
  function motivoNoReservar(cliente, data, fecha, hora) {
    if (!horarioAbierto(fecha, hora)) return 'Ese horario está cerrado';
    if (cliente.estado !== 'Activo') return 'Tu membresía no está activa';
    if (cuotaImpideReservar(data, cliente.dni)) return 'Tenés la cuota vencida';
    const mias = data.reservas.filter(r => r.dni === cliente.dni && r.fecha === fecha && r.estado !== 'cancelado');
    const choca = mias.find(r => seSuperponen(r.hora, hora));
    if (choca) return 'Se superpone con tu turno de las ' + choca.hora;
    if (mias.length >= MAX_TURNOS_POR_DIA) return 'Ya tenés ' + MAX_TURNOS_POR_DIA + ' turnos este día';
    if (reservasEnSemana(data, cliente.dni, fecha).length >= limiteSemanalDe(cliente)) return 'Ya usaste tus turnos de la semana';
    return null;
  }

  // Quiénes van a un turno, para que el cliente lo vea al tocar el horario.
  // Uno mismo aparece primero como "Vos"; los demás por orden de reserva. Los
  // usuarios de prueba no figuran para los demás (tampoco ocupan lugar).
  function anotadosEnTurno(data, fecha, hora, dniQueMira) {
    return data.reservas
      .filter(r => r.fecha === fecha && r.hora === hora && r.estado !== 'cancelado' && (!esPrueba(r.dni) || r.dni === dniQueMira))
      .sort((a, b) => (b.dni === dniQueMira) - (a.dni === dniQueMira) || (a.creadoEn || 0) - (b.creadoEn || 0))
      .map(r => {
        if (r.dni === dniQueMira) return { nombre: 'Vos', yo: true };
        const c = data.clientes.find(x => x.dni === r.dni);
        return { nombre: c ? c.nombre : esProspecto(r.dni) ? datosProspecto(r.dni).nombre : 'Otro cliente', yo: false };
      });
  }

  function fechaCompleta(iso) {
    const d = new Date(iso + 'T00:00:00');
    return DIAS_SEMANA[d.getDay()] + ' ' + d.getDate() + ' de ' + MESES[d.getMonth()].toLowerCase();
  }

  function renderTurnos(cliente, data, selectedDate) {
    const hoy = todayMidnight();
    const misActivas = data.reservas.filter(r => r.dni === cliente.dni && r.estado !== 'cancelado');
    const misDelDia = misActivas.filter(r => r.fecha === selectedDate);

    const diaHtml = (d) => {
      const iso = isoDate(d);
      const pasado = d < hoy;
      const esp = horarioEspecial(iso);
      const clases = [iso === selectedDate ? 'active' : '', pasado ? 'past' : '', d.getTime() === hoy.getTime() ? 'hoy' : '',
        misActivas.some(r => r.fecha === iso) ? 'conturno' : '', esp && esp.cerrado ? 'cerrado' : esp ? 'especial' : ''].filter(Boolean).join(' ');
      return `<button class="sem-dia ${clases}" ${pasado ? 'disabled' : `data-date="${iso}"`}>
                <span class="dow">${DIAS_CORTO[d.getDay()]}</span>
                <span class="dnum">${d.getDate()}</span>
                <span class="marca"></span>
              </button>`;
    };
    // Una fila por semana, con su nombre arriba
    const diasReservables = fullBookableWeek();
    let semana = '';
    for (let i = 0; i < diasReservables.length; i += 5) {
      const fila = diasReservables.slice(i, i + 5);
      const nombre = nombreSemana(isoDate(fila[0]));
      semana += `<div class="sem-titulo">${nombre.charAt(0).toUpperCase() + nombre.slice(1)}</div><div class="sem">${fila.map(diaHtml).join('')}</div>`;
    }

    // ¿Puede reservar otro turno este día? Si no, por qué.
    const bloqueado = cliente.estado !== 'Activo';
    const limiteSemanal = limiteSemanalDe(cliente);
    const usadosSemana = reservasEnSemana(data, cliente.dni, selectedDate).length;
    const limiteSemanalAlcanzado = usadosSemana >= limiteSemanal;
    const limiteDiarioAlcanzado = misDelDia.length >= MAX_TURNOS_POR_DIA;
    const cuotaVencida = !bloqueado && cuotaImpideReservar(data, cliente.dni);
    const puedeReservar = !bloqueado && !cuotaVencida && !limiteSemanalAlcanzado && !limiteDiarioAlcanzado;

    let estadoHtml = '';
    if (bloqueado) {
      estadoHtml = `<div class="banner" style="margin-top:10px;"><b>Membresía ${cliente.estado.toLowerCase()}</b>No podés reservar hasta regularizar tu membresía.</div>`;
    } else if (cuotaVencida) {
      estadoHtml = `<div class="banner" style="margin-top:10px;"><b>Cuota vencida</b>No podés reservar turnos hasta pagar la cuota. Pasá por recepción para regularizarla.</div>`;
    } else if (limiteSemanalAlcanzado) {
      estadoHtml = `<p class="turnos-estado aviso">Ya reservaste tus ${limiteSemanal} turnos de ${nombreSemana(selectedDate)}. Si necesitás uno más, hablalo con tu profe.</p>`;
    } else if (limiteDiarioAlcanzado) {
      estadoHtml = `<p class="turnos-estado aviso">Ya tenés ${MAX_TURNOS_POR_DIA} turnos este día. Cancelá uno si querés cambiarlo.</p>`;
    } else if (isFinite(limiteSemanal)) {
      const quedan = limiteSemanal - usadosSemana;
      estadoHtml = `<p class="turnos-estado">${quedan === 1 ? 'Te queda 1 turno' : 'Te quedan ' + quedan + ' turnos'} para reservar ${nombreSemana(selectedDate)}.</p>`;
    } else {
      estadoHtml = `<p class="turnos-estado">Tocá un horario para reservarlo y ver quién va.</p>`;
    }

    // Los horarios que ya empezaron no se muestran (solo afecta al día de hoy)
    const especial = horarioEspecial(selectedDate);
    const visibles = HORARIOS.filter(h => !turnoYaEmpezo(selectedDate, h) && horarioAbierto(selectedDate, h));
    // Todos los horarios se pueden tocar, aunque estén completos: así se ve quién va
    const infoSlot = (hora) => {
      const ocupados = ocupadosEnTurno(data, selectedDate, hora, cliente.dni);
      const libres = CUPO - ocupados;
      const mia = misDelDia.some(r => r.hora === hora);
      let clase, sub;
      if (mia) { clase = 'mio'; sub = 'Tu turno'; }
      else if (libres <= 0) { clase = 'lleno'; sub = 'Completo'; }
      else {
        clase = libres <= POCOS_LUGARES ? 'pocos' : 'libre';
        // Se ve siempre cuántos hay anotados sobre el cupo ("2 de 4"), sin tener que tocar el horario
        sub = ocupados + ' de ' + CUPO + ' anotados';
        // (en la grilla no entra "Se superpone" en una línea)
        if (misDelDia.some(r => seSuperponen(r.hora, hora))) { clase += ' nodisp'; sub = DISPOSICION_TURNOS === 'lista' ? 'Se superpone' : 'Se pisa'; }
        else if (!puedeReservar) clase += ' nodisp';
      }
      // En la grilla no entra en una línea: el número arriba y "anotados" abajo
      const subGrilla = /^\d+ de \d+ anotados$/.test(sub) ? sub.replace(' anotados', '<small>anotados</small>') : sub;
      return { clase, sub, subGrilla, ocupados, elegido: state.slotElegido === hora ? 'elegido' : '' };
    };
    const casillero = (hora) => {
      const i = infoSlot(hora);
      return `<button class="slot ${i.clase} ${i.elegido}" data-slot="${hora}">
                <span class="h">${hora}</span><span class="s">${i.subGrilla}</span>
              </button>`;
    };
    const renglon = (hora) => {
      const i = infoSlot(hora);
      const pct = Math.min(100, Math.round(i.ocupados / CUPO * 100));
      return `<button class="slot-fila ${i.clase} ${i.elegido}" data-slot="${hora}">
                <span class="sf-hora">${hora}</span>
                <span class="sf-barra" aria-hidden="true"><i style="width:${pct}%"></i></span>
                <span class="sf-estado">${i.sub}</span>
                <span class="sf-chev" aria-hidden="true">${ICONOS.der}</span>
              </button>`;
    };
    const enLista = DISPOSICION_TURNOS === 'lista';
    const grupos = FRANJAS.map(f => {
      const horas = visibles.filter(h => { const n = parseInt(h, 10); return n >= f.desde && n <= f.hasta; });
      if (!horas.length) return '';
      return `<div class="slots-grupo">${f.nombre}</div>` + (enLista
        ? `<div class="slots-lista">${horas.map(renglon).join('')}</div>`
        : `<div class="slots-grid">${horas.map(casillero).join('')}</div>`);
    }).join('');
    const quedanOtrosDias = fullBookableWeek().some(d => isoDate(d) > selectedDate);

    return `
      <div class="view">
        ${tituloVista('turnos', 'Turnos', 'Elegí el día y el horario')}
        ${semana}
        <p class="turnos-dia">${fechaCompleta(selectedDate)}</p>
        ${especial && especial.cerrado ? `<div class="dia-aviso cerrado"><b>Ese día ORIGO está cerrado</b>Elegí otro día para entrenar.</div>`
          : especial ? `<div class="dia-aviso"><b>Horario especial</b>Ese día abrimos de ${especial.desde} a ${especial.hasta} (último turno).</div>` : ''}
        ${especial && especial.cerrado ? '' : estadoHtml}
        ${especial && especial.cerrado ? '' : visibles.length > 0
          ? `${grupos}
             <div class="slots-leyenda">
               <span><i class="mio"></i>Tu turno</span>
               <span><i class="pocos"></i>Últimos lugares</span>
               <span><i class="lleno"></i>Completo</span>
             </div>`
          : `<div class="empty-state">Ya no quedan turnos para este día.<br>${quedanOtrosDias ? 'Elegí otro día.' : 'Desde el sábado se abren los turnos de una semana más.'}</div>`}
      </div>
    `;
  }

  // Barra que aparece al tocar un horario: muestra quién está anotado y desde
  // ahí se confirma la reserva (o la cancelación)
  function barraTurno(cliente, data) {
    const hora = state.slotElegido;
    const fecha = state.selectedDate;
    if (!hora || state.view !== 'turnos' || turnoYaEmpezo(fecha, hora)) return '';
    const d = new Date(fecha + 'T00:00:00');
    const cuando = DIAS_SEMANA[d.getDay()] + ' ' + d.getDate() + ' a las ' + hora;
    const anotados = anotadosEnTurno(data, fecha, hora, cliente.dni);
    const listaHtml = `
        <div class="tb-anotados">
          <div class="tb-titulo">${anotados.length ? `Anotados · ${anotados.length} de ${CUPO}` : 'Todavía no hay nadie anotado'}</div>
          ${anotados.length ? `<div class="tb-chips">${anotados.map(a => `<span class="tb-chip ${a.yo ? 'yo' : ''}">${esc(a.nombre)}</span>`).join('')}</div>` : ''}
        </div>`;
    const mia = data.reservas.find(r => r.dni === cliente.dni && r.fecha === fecha && r.hora === hora && r.estado !== 'cancelado');
    let detalle, accion = '', aviso = false;
    if (mia) {
      detalle = 'Ya tenés este turno';
      accion = `<button class="btn btn-ghost" id="cancelarTurnoBtn" data-id="${mia.id}">Cancelar turno</button>`;
    } else {
      const libres = CUPO - ocupadosEnTurno(data, fecha, hora, cliente.dni);
      const motivo = libres <= 0 ? 'Turno completo' : motivoNoReservar(cliente, data, fecha, hora);
      aviso = !!motivo;
      detalle = motivo || (libres === 1 ? 'Queda 1 lugar' : 'Quedan ' + libres + ' lugares');
      if (!motivo) accion = `<button class="btn btn-primary" id="confirmarTurnoBtn">Reservar turno</button>`;
    }
    return `
      <div class="turno-barra">
        <div class="tb-fila">
          <div><div class="tb1">${cuando}</div><div class="tb2 ${aviso ? 'aviso' : ''}">${detalle}</div></div>
          ${accion}
        </div>
        ${listaHtml}
      </div>`;
  }

  // ---------------- Render: Mis reservas ----------------
  // Semanas seguidas (lunes a domingo) con al menos una asistencia. Si en la
  // semana en curso todavía no vino, se cuenta desde la anterior para que la
  // racha no se "rompa" cada lunes.
  function rachaSemanas(asistencias) {
    const semanas = new Set(asistencias.map(r => isoDate(mondayOf(r.fecha))));
    const cursor = mondayOf(isoDate(ahora()));
    if (!semanas.has(isoDate(cursor))) cursor.setDate(cursor.getDate() - 7);
    let n = 0;
    while (semanas.has(isoDate(cursor))) { n++; cursor.setDate(cursor.getDate() - 7); }
    return n;
  }

  function mesShift(ym, delta) {
    const [y, m] = ym.split('-').map(Number);
    const d = new Date(y, m - 1 + delta, 1);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  }

  function fechaLarga(iso) {
    const d = new Date(iso + 'T00:00:00');
    return DIAS_SEMANA[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth() + 1);
  }

  // "Hoy", "Mañana" o el día con nombre
  function diaCercano(iso) {
    const hoy = todayMidnight();
    const d = new Date(iso + 'T00:00:00');
    const dif = Math.round((d - hoy) / 86400000);
    const texto = DIAS_SEMANA[d.getDay()].toLowerCase() + ' ' + d.getDate() + ' de ' + MESES[d.getMonth()].toLowerCase();
    if (dif === 0) return 'Hoy, ' + texto;
    if (dif === 1) return 'Mañana, ' + texto;
    return texto.charAt(0).toUpperCase() + texto.slice(1);
  }

  function renderMisReservas(cliente, data) {
    const mias = data.reservas.filter(r => r.dni === cliente.dni && r.estado !== 'cancelado');
    const proximas = mias.filter(r => estadoEfectivo(r) === 'reservado')
      .sort((a,b) => (a.fecha+a.hora).localeCompare(b.fecha+b.hora));
    const asistencias = mias.filter(r => estadoEfectivo(r) === 'asistio');

    const sig = proximas[0];
    const proximoHtml = sig ? `
        <div class="prox">
          <div>
            <div class="et">Tu próximo turno</div>
            <div class="hora">${String(sig.hora).slice(0, 5)}</div>
            <div class="dia">${diaCercano(sig.fecha)}${esTurnoFijo(sig) ? '<span class="tag-fijo">fijo</span>' : ''}</div>
          </div>
          <button class="cancel-link" data-cancelar-id="${sig.id}">Cancelar</button>
        </div>` : `
        <div class="prox-vacio">
          <p>No tenés turnos reservados.${cliente.estado === 'Activo' ? ' Elegí un día y un horario para tu próximo entrenamiento.' : ''}</p>
          ${cliente.estado === 'Activo' ? `<button class="btn btn-primary" id="irATurnosBtn" style="width:100%;">Reservar un turno</button>` : ''}
        </div>`;

    const misFijos = fijosDe(cliente.dni);
    const fijosHtml = misFijos.length ? `<div class="pago-detalle" style="margin:-4px 0 14px; line-height:1.5;">Tus días fijos: ${esc(textoFijos(misFijos))}. Se te reservan solos; si un día no podés, cancelalo o cambialo por otro horario.</div>` : '';
    const otrosHtml = proximas.slice(1).map(r => `
        <div class="res-card">
          <div class="info">
            <div class="date-line">${String(r.hora).slice(0,5)} hs</div>
            <div class="day-line">${diaCercano(r.fecha)}${esTurnoFijo(r) ? '<span class="tag-fijo">fijo</span>' : ''}</div>
          </div>
          <button class="cancel-link" data-cancelar-id="${r.id}">Cancelar</button>
        </div>`).join('');

    return `
      <div class="view">
        ${tituloVista('reservas', 'Mis reservas', 'Tus turnos y tu asistencia')}
        ${fijosHtml}
        ${proximoHtml}
        ${otrosHtml}
        <div class="reservas-seccion">Tu asistencia</div>
        ${renderReservasAsistencias(cliente, data, mias, asistencias, { compacto: true })}
      </div>`;
  }

  // 'opts.admin' = se está mirando desde la ficha del cliente en administración
  function renderReservasAsistencias(cliente, data, mias, asistencias, opts) {
    const admin = !!(opts && opts.admin);
    const compacto = !!(opts && opts.compacto); // vista del cliente: menos números, detalle plegado
    const hoyIso = isoDate(ahora());
    const mesHoy = hoyIso.slice(0, 7);

    // --- Números generales ---
    const esteMes = asistencias.filter(r => r.fecha.slice(0, 7) === mesHoy).length;
    const total = asistencias.length;
    const racha = rachaSemanas(asistencias);

    // --- Semana en curso contra el límite del plan ---
    const limite = limiteSemanalDe(cliente);
    const turnosSemana = reservasEnSemana(data, cliente.dni, hoyIso).length;
    const semanaHtml = isFinite(limite) && limite > 0 ? `
      <div class="asis-semana">
        <div class="asis-semana-top"><span>Turnos de esta semana</span><span>${turnosSemana} de ${limite}</span></div>
        <div class="asis-bar"><i style="width:${Math.min(100, Math.round(turnosSemana / limite * 100))}%"></i></div>
      </div>` : '';

    // --- Calendario del mes elegido ---
    const fechasMias = mias.map(r => r.fecha).sort();
    const mesMin = fechasMias.length ? (fechasMias[0].slice(0, 7) < mesHoy ? fechasMias[0].slice(0, 7) : mesHoy) : mesHoy;
    const ultimaFecha = fechasMias.length ? fechasMias[fechasMias.length - 1].slice(0, 7) : mesHoy;
    const mesMax = ultimaFecha > mesHoy ? ultimaFecha : mesHoy;
    let mes = (admin ? state.fichaMes : state.asistMes) || mesHoy;
    if (mes < mesMin) mes = mesMin;
    if (mes > mesMax) mes = mesMax;

    const [anio, mesNum] = mes.split('-').map(Number);
    const diasEnMes = new Date(anio, mesNum, 0).getDate();
    const offset = (new Date(anio, mesNum - 1, 1).getDay() + 6) % 7; // semana empieza en lunes

    const porDia = {};
    mias.filter(r => r.fecha.slice(0, 7) === mes).forEach(r => {
      (porDia[r.fecha] = porDia[r.fecha] || []).push(estadoEfectivo(r));
    });

    let celdas = ['L','M','M','J','V','S','D'].map(d => `<div class="cal-dow">${d}</div>`).join('');
    for (let i = 0; i < offset; i++) celdas += '<div></div>';
    for (let dia = 1; dia <= diasEnMes; dia++) {
      const iso = mes + '-' + String(dia).padStart(2, '0');
      const estados = porDia[iso] || [];
      const dow = new Date(anio, mesNum - 1, dia).getDay();
      let cls = '';
      if (estados.includes('asistio')) cls = 'asistio';
      else if (estados.includes('no_asistio')) cls = 'falto';
      else if (estados.includes('reservado')) cls = 'reservado';
      if (dow === 0 || dow === 6) cls += ' finde';
      if (iso === hoyIso) cls += ' hoy';
      celdas += `<div class="cal-day ${cls}">${dia}</div>`;
    }

    const calendarioHtml = `
      <div class="cal-card">
        <div class="cal-head">
          <button class="cal-nav" data-cal-mes="${mesShift(mes, -1)}" ${mes <= mesMin ? 'disabled' : ''} aria-label="Mes anterior">${ICONOS.izq}</button>
          <span class="cal-mes">${MESES[mesNum - 1]} ${anio}</span>
          <button class="cal-nav" data-cal-mes="${mesShift(mes, 1)}" ${mes >= mesMax ? 'disabled' : ''} aria-label="Mes siguiente">${ICONOS.der}</button>
        </div>
        <div class="cal-grid">${celdas}</div>
        <div class="cal-leyenda">
          <span><i class="asistio"></i>${admin ? 'Asistió' : 'Asististe'}</span>
          <span><i class="reservado"></i>Turno reservado</span>
          <span><i class="falto"></i>${admin ? 'Faltó' : 'Faltaste'}</span>
        </div>
      </div>`;

    // --- Detalle del mes elegido ---
    const delMes = mias
      .filter(r => r.fecha.slice(0, 7) === mes && estadoEfectivo(r) !== 'reservado')
      .sort((a,b) => (b.fecha+b.hora).localeCompare(a.fecha+a.hora));
    const asistDelMes = delMes.filter(r => estadoEfectivo(r) === 'asistio').length;
    const nombreMes = MESES[mesNum - 1].toLowerCase();
    const listaHtml = delMes.length
      ? `<div class="asis-lista-titulo">${asistDelMes} ${asistDelMes === 1 ? 'asistencia' : 'asistencias'} en ${nombreMes}</div>` +
        delMes.map(r => `
          <div class="asis-fila">
            <div>
              <div class="dia">${fechaLarga(r.fecha)}</div>
              <div class="hora">${String(r.hora).slice(0,5)} hs</div>
            </div>
            ${estadoEfectivo(r) === 'asistio'
              ? '<span class="pill pill-green">Asistió</span>'
              : '<span class="pill pill-red">No asistió</span>'}
          </div>`).join('')
      : `<div class="empty-state" style="padding:28px 20px;">No hay asistencias registradas en ${nombreMes}.</div>`;

    // --- Datos sueltos ---
    let extrasHtml = '';
    if (total > 0) {
      const conteoHoras = {};
      asistencias.forEach(r => { const h = String(r.hora).slice(0,5); conteoHoras[h] = (conteoHoras[h] || 0) + 1; });
      const horaFrecuente = Object.keys(conteoHoras).sort((a,b) => conteoHoras[b] - conteoHoras[a] || a.localeCompare(b))[0];
      const ultima = asistencias.slice().sort((a,b) => (b.fecha+b.hora).localeCompare(a.fecha+a.hora))[0];
      extrasHtml = `
        <div class="profile-card" style="padding:8px 16px; margin:18px 0 0;">
          <div class="kv-row"><span class="k">Último entrenamiento</span><span class="v">${fechaLarga(ultima.fecha)}</span></div>
          <div class="kv-row"><span class="k">${admin ? 'Horario más frecuente' : 'Tu horario más frecuente'}</span><span class="v">${horaFrecuente} hs</span></div>
        </div>`;
    }

    if (compacto) {
      return `
      <div class="asis-stats">
        <div class="asis-stat"><span class="num">${esteMes}</span><span class="lbl">${esteMes === 1 ? 'entrenamiento' : 'entrenamientos'} este mes</span></div>
        <div class="asis-stat"><span class="num">${racha}</span><span class="lbl">${racha === 1 ? 'semana seguida' : 'semanas seguidas'}</span></div>
      </div>
      ${calendarioHtml}
      ${semanaHtml}
      <details class="cuota-aldiacolapso" style="margin-top:6px;">
        <summary>Ver el detalle de ${nombreMes}</summary>
        ${listaHtml}
        ${extrasHtml}
        ${total > 0 ? `<div class="pago-detalle" style="margin-top:12px;">Desde que empezaste: ${total} ${total === 1 ? 'entrenamiento' : 'entrenamientos'}.</div>` : ''}
      </details>`;
    }

    return `
      <div class="asis-stats">
        <div class="asis-stat"><span class="num">${esteMes}</span><span class="lbl">este mes</span></div>
        <div class="asis-stat"><span class="num">${total}</span><span class="lbl">en total</span></div>
        <div class="asis-stat"><span class="num">${racha}</span><span class="lbl">${racha === 1 ? 'semana seguida' : 'semanas seguidas'}</span></div>
      </div>
      ${semanaHtml}
      ${calendarioHtml}
      ${listaHtml}
      ${extrasHtml}`;
  }

  function renderNav(view) {
    const items = [
      ...(CONTROL_PRO_ACTIVO && esPro(state.cliente) ? [{id:'midia', label:'Mi día'}] : []),
      {id:'perfil', label:'Perfil'},
      {id:'rutina', label:'Rutina'},
      {id:'turnos', label:'Turnos'},
      {id:'reservas', label:'Mis reservas'},
    ];
    return `
      <div class="bottom-nav">
        ${items.map(it => `
          <button class="nav-btn ${view===it.id?'active':''}" data-view="${it.id}">
            ${ICONOS[it.id]}<span>${it.label}</span>
          </button>`).join('')}
      </div>`;
  }

  function renderApp() {
    const root = document.getElementById('root');
    diaDibujado = isoDate(ahora());

    if (state.mode === 'adminPin') {
      root.innerHTML = renderAdminPin(state.pinError);
      document.getElementById('pinBtn').onclick = onPinSubmit;
      document.getElementById('pinInput').addEventListener('keydown', e => { if (e.key === 'Enter') onPinSubmit(); });
      document.getElementById('backToLoginBtn').onclick = () => { state.mode = 'login'; state.pinError = ''; renderApp(); };
      return;
    }

    if (state.mode === 'admin') {
      root.innerHTML = renderAdmin(state.data, state.adminFormError, state.adminFormNotice);

      root.querySelectorAll('[data-admin-tab]').forEach(btn => {
        btn.onclick = () => {
          cerrarFicha();
          state.fichaOrigen = 'clientes';
          state.verMontos = false; // al salir de Cuotas los montos se vuelven a ocultar
          state.adminTab = btn.dataset.adminTab;
          state.anotarEn = null;
          state.reservaAbierta = null;
          state.cobroAbierto = null;
          renderApp();
          window.scrollTo(0, 0);
          actualizarPorDetras();
        };
      });

      // La pestaña activa se acomoda moviendo solo la barra de pestañas hacia el
      // costado: así la pantalla no salta arriba cada vez que se toca un botón.
      const tabActiva = root.querySelector('.admin-tab.active');
      if (tabActiva) {
        const barra = tabActiva.parentElement;
        barra.scrollLeft = Math.max(0, (tabActiva.offsetLeft - barra.offsetLeft) - (barra.clientWidth - tabActiva.offsetWidth) / 2);
      }

      const salirAdmin = () => { state.mode = 'login'; state.verMontos = false; cerrarFicha(); state.fichaOrigen = 'clientes'; state.nuevoClienteAbierto = false; state.anotarEn = null; state.reservaAbierta = null; renderApp(); };
      document.getElementById('backToLoginBtn2').onclick = salirAdmin;
      document.getElementById('salirAdminBtn').onclick = salirAdmin;

      // Cualquier nombre o tarjeta de cliente abre su ficha
      root.querySelectorAll('[data-ficha-dni]').forEach(btn => {
        btn.onclick = () => {
          state.fichaOrigen = state.adminTab;
          state.listaScrollY = window.scrollY;
          abrirFicha(btn.dataset.fichaDni, 'resumen');
          renderApp();
          window.scrollTo(0, 0);
          actualizarPorDetras();
        };
      });

      if (state.adminTab === 'clientes') wireClientes(root);

      if (state.adminTab === 'asistencias') wireTurnosAdmin(root);

      if (state.adminTab === 'pro') {
        const proFechaInput = document.getElementById('proFechaInput');
        if (proFechaInput) proFechaInput.onchange = (e) => { state.proFecha = e.target.value || null; renderApp(); };
        root.querySelectorAll('[data-pro-fecha]').forEach(btn => {
          btn.onclick = () => { state.proFecha = btn.dataset.proFecha; renderApp(); };
        });
      }

      if (state.adminTab === 'cuotas') {
        wirePagos(root);
        const exportBtn = document.getElementById('exportPagosBtn');
        if (exportBtn) exportBtn.onclick = descargarPagosExcel;
        const verBtn = document.getElementById('verMontosBtn');
        if (verBtn) verBtn.onclick = () => { state.verMontos = !state.verMontos; redibujarConservando(); };
      }

      if (state.adminTab === 'planes') {
        root.querySelectorAll('[data-guardar-plan]').forEach(btn => {
          btn.onclick = () => {
            const id = btn.dataset.guardarPlan;
            const input = document.querySelector(`[data-plan-id="${id}"]`);
            guardarPrecioPlan(id, input.value);
          };
        });
        const diasBtn = document.getElementById('guardarDiasParaPagarBtn');
        if (diasBtn) diasBtn.onclick = () => guardarDiasParaPagar(document.getElementById('diasParaPagarInput').value);
        const toggleMatriculaBtn = document.getElementById('toggleMatriculaBtn');
        if (toggleMatriculaBtn) toggleMatriculaBtn.onclick = () => guardarMatriculaActiva(toggleMatriculaBtn.dataset.activar === '1');
        const matriculaBtn = document.getElementById('guardarMatriculaBtn');
        if (matriculaBtn) {
          matriculaBtn.onclick = () => {
            const input = document.getElementById('matriculaPrecioInput');
            guardarPrecioMatricula(input.value);
          };
        }
      }

      if (state.adminTab === 'resumen') {
        const backupBtn = document.getElementById('backupBtn');
        if (backupBtn) backupBtn.onclick = descargarBackup;
        root.querySelectorAll('[data-jump-tab]').forEach(btn => {
          btn.onclick = () => {
            state.adminTab = btn.dataset.jumpTab;
            if (btn.dataset.irHora) { state.asistenciasFecha = isoDate(ahora()); state.turnosVista = 'dia'; }
            renderApp();
            window.scrollTo(0, 0);
            const destino = btn.dataset.irHora && document.querySelector(`[data-th="${btn.dataset.irHora}"]`);
            if (destino) destino.scrollIntoView({ block: 'center' });
          };
        });
      }
      return;
    }

    // Si administración eliminó a este cliente mientras tenía la app abierta, se cierra su sesión
    if (state.cliente && state.data && !state.errorConexion && state.data.clientes.length && !state.data.clientes.some(c => c.dni === state.cliente.dni)) {
      state.cliente = null;
      state.loginError = 'Tu usuario ya no está disponible. Hablá con recepción.';

    if (!state.cliente) {
      root.innerHTML = renderLogin(state.loginError);
      document.getElementById('loginBtn').onclick = onLogin;
      const reintentar = document.getElementById('reintentarBtn');
      if (reintentar) reintentar.onclick = async () => { reintentar.disabled = true; reintentar.textContent = 'Probando…'; await refreshData(); renderApp(); };
      document.getElementById('passInput').addEventListener('keydown', e => { if (e.key === 'Enter') onLogin(); });
      document.getElementById('dniInput').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('passInput').focus(); });
      document.getElementById('adminLinkBtn').onclick = () => { state.mode = 'adminPin'; renderApp(); };
      return;

    if (state.view === 'midia' && !(CONTROL_PRO_ACTIVO && esPro(state.cliente))) state.view = 'perfil';

    if (state.view === 'perfil') body = renderPerfil(state.cliente, state.data);
    else if (state.view === 'midia') body = renderMiDia(state.cliente, state.data);
    else if (state.view === 'rutina') body = renderRutina(state.cliente);
    else if (state.view === 'turnos') body = renderTurnos(state.cliente, state.data, state.selectedDate);
    else body = renderMisReservas(state.cliente, state.data);

    root.innerHTML = `
      <div class="app-header">
        <div class="who">

      ${body}
      ${state.view === 'turnos' ? barraTurno(state.cliente, state.data) : ''}
      ${renderNav(state.view)}

    document.getElementById('logoutBtn').onclick = onLogout;

    root.querySelectorAll('.nav-btn').forEach(btn => {
      btn.onclick = () => {
        state.view = btn.dataset.view;
        state.slotElegido = null;
        // Si la app quedó abierta de un día para el otro, no dejar seleccionado un día que ya pasó
        if (state.view === 'turnos' && state.selectedDate < isoDate(ahora())) state.selectedDate = primerDiaConTurnos();
        renderApp();
        actualizarPorDetras();

      const gt = document.getElementById('guardarTqrBtn'); if (gt) gt.onclick = guardarTqr;
      const gr = document.getElementById('guardarRpeBtn'); if (gr) gr.onclick = guardarRpe;
      ['rpeMinutos', 'rpeActividad'].forEach(id => {
        const campo = document.getElementById(id);
        if (campo) campo.oninput = () => mostrarErrorPro('');
      });
      root.querySelectorAll('[data-del-registro]').forEach(btn => {
        btn.onclick = () => borrarRegistroPro(btn.dataset.delRegistro);
      });
    }

    if (state.view === 'perfil') {
      const cambiarBtn = document.getElementById('cambiarPassBtn');
      if (cambiarBtn) cambiarBtn.onclick = cambiarMiPassword;
    }

    if (state.view === 'turnos') {
      root.querySelectorAll('.sem-dia[data-date]').forEach(dia => {
        dia.onclick = () => { state.selectedDate = dia.dataset.date; state.slotElegido = null; renderApp(); };
      });
      // Tocar un horario solo lo elige; se reserva (o cancela) desde la barra de abajo
      root.querySelectorAll('[data-slot]').forEach(btn => {
        btn.onclick = () => { state.slotElegido = state.slotElegido === btn.dataset.slot ? null : btn.dataset.slot; renderApp(); };
      });
      const confirmar = document.getElementById('confirmarTurnoBtn');
      if (confirmar) confirmar.onclick = () => {
        const hora = state.slotElegido;
        confirmar.disabled = true;
        state.slotElegido = null;
        reservarTurno(hora);
      };
      const cancelar = document.getElementById('cancelarTurnoBtn');
      if (cancelar) cancelar.onclick = () => { cancelar.disabled = true; state.slotElegido = null; cancelarReserva(cancelar.dataset.id); };
    }
    if (state.view === 'reservas') {
      root.querySelectorAll('[data-cancelar-id]').forEach(btn => {
        btn.onclick = () => confirmarEnDosToques(btn, 'Tocá de nuevo para cancelar', () => cancelarReserva(btn.dataset.cancelarId));
      });
      const irATurnos = document.getElementById('irATurnosBtn');
      if (irATurnos) irATurnos.onclick = () => {
        state.view = 'turnos';
        if (state.selectedDate < isoDate(ahora())) state.selectedDate = primerDiaConTurnos();
        renderApp();
        window.scrollTo(0, 0);
      };
      root.querySelectorAll('[data-cal-mes]').forEach(btn => {
        btn.onclick = () => { state.asistMes = btn.dataset.calMes; renderApp(); };
      });
    }
  }

  async function cambiarMiPassword() {
    const actual = document.getElementById('passActual').value;
    const nueva = document.getElementById('passNueva').value;
    const repetir = document.getElementById('passNuevaRepetir').value;
    const errorEl = document.getElementById('cambiarPassError');

    const ok = await verifyPassword(actual, state.cliente.password);
    if (!ok) {
      errorEl.textContent = 'Tu contraseña actual no es correcta.';
      return;
    }
    if (!nueva || nueva.length < 4) {
      errorEl.textContent = 'La contraseña nueva tiene que tener al menos 4 caracteres.';
      return;
    }
    if (nueva !== repetir) {
      errorEl.textContent = 'Las dos contraseñas nuevas no coinciden.';
      return;
    }

    const nuevoHash = await hashPassword(nueva);
    const { error } = await sb.from('clientes').update({ password: nuevoHash }).eq('dni', state.cliente.dni);
    if (error) {
      errorEl.textContent = 'No se pudo guardar. Probá de nuevo.';
      console.error(error);
      return;
    }
    await refreshData();
    state.cliente = state.data.clientes.find(c => c.dni === state.cliente.dni) || state.cliente;
    errorEl.textContent = '';
    showToast('Contraseña actualizada');
    renderApp();
  }

  let ingresoEnCurso = false;
  async function onLogin() {
    if (ingresoEnCurso) return;
    ingresoEnCurso = true;
    try { await ingresar(); } finally { ingresoEnCurso = false; }
  }

  async function ingresar() {
    const dni = document.getElementById('dniInput').value.trim();
    const pass = document.getElementById('passInput').value;
    const btn = document.getElementById('loginBtn');
    if (btn) { btn.disabled = true; btn.textContent = 'Ingresando…'; }
    // Se vuelve a leer la base antes de entrar: así un cliente recién cargado
    // (o con la contraseña recién cambiada) entra aunque tuviera la página abierta.
    state.loginDni = dni; // si algo falla, el DNI queda escrito
    await refreshData();
    if (state.errorConexion) {
      state.loginError = 'No hay conexión con ORIGO. Revisá tu internet y probá de nuevo.';
      renderApp();
      return;
    }
    // Se busca tal cual y, si no aparece, comparando solo los números (por si
    // el DNI se cargó con puntos o el cliente lo escribe con espacios).
    const found = state.data.clientes.find(c => c.dni === dni)
      || (soloDigitos(dni) ? state.data.clientes.find(c => soloDigitos(c.dni) === soloDigitos(dni)) : undefined);
    if (!found) {
      state.loginError = 'No encontramos ese DNI. Verificalo o hablá con recepción.';
      renderApp();
      return;
    }
    // Un espacio de más al principio o al final (lo agregan algunos teclados) no cuenta
    let claveOk = pass;
    let ok = await verifyPassword(pass, found.password);
    if (!ok && pass !== pass.trim()) { claveOk = pass.trim(); ok = await verifyPassword(claveOk, found.password); }
    if (!ok) {
      state.loginError = 'Contraseña incorrecta.';
      renderApp();
      return;
    }
    // Si todavía tenía la contraseña vieja en texto plano, la protegemos ahora
    // que sabemos que es correcta, sin que el cliente note nada.
    if (!esPasswordHasheada(found.password)) {
      const nuevoHash = await hashPassword(claveOk);
      const { error: errUpgrade } = await sb.from('clientes').update({ password: nuevoHash }).eq('dni', found.dni);
      if (errUpgrade) {
        console.error('No se pudo proteger la contraseña automáticamente:', errUpgrade.message);
      } else {
        found.password = nuevoHash;
      }
    }
    state.cliente = found;
    state.loginError = '';
    state.loginDni = null;
    recordarDni(found.dni);
    // Los clientes PRO entran directo a su control diario
    state.view = CONTROL_PRO_ACTIVO && esPro(found) ? 'midia' : 'perfil';
    state.proAbierto = undefined;
    state.proDraft = {};
    state.selectedDate = primerDiaConTurnos();
    renderApp();
  }

  function wireAdminForm() {
    const planSel = document.getElementById('fPlan');
    const diasSel = document.getElementById('fDias');
    const preview = document.getElementById('fPrecioPreview');
    const especialInput = document.getElementById('fCuotaEspecial');
    const updatePreview = () => {
      const esPro = planSel.value === 'PRO';
      diasSel.disabled = esPro;
      const dias = esPro ? null : parseInt(diasSel.value, 10);
      const precioPlan = precioDe(planSel.value, dias);
      const especial = parseInt(String(especialInput ? especialInput.value : '').replace(/[^\d]/g, ''), 10) || 0;
      const precio = especial > 0 ? especial : precioPlan;
      preview.textContent = especial > 0
        ? money(especial) + ' / mes · especial' + (precioPlan ? ' (el plan vale ' + money(precioPlan) + ')' : '')
        : (precioPlan ? money(precioPlan) + ' / mes' : 'Combinación no válida');
      // Monto y período del pago inicial (solo en el alta)
      const durSel = document.getElementById('fDuracionPago');
      const montoEl = document.getElementById('fPagoInicialMonto');
      const detalleEl = document.getElementById('fPagoInicialDetalle');
      if (durSel && montoEl && detalleEl) {
        const dur = durSel.value ? duracionPorId(durSel.value) : null;
        const caja = document.getElementById('fMontoInicialCaja');
        const inp = document.getElementById('fMontoInicial');
        const dif = document.getElementById('fMontoInicialDif');
        if (dif) dif.textContent = '';
        if (!dur || !precio) {
          montoEl.textContent = dur ? '—' : 'Sin pago';
          montoEl.style.display = '';
          if (caja) caja.style.display = 'none';
          detalleEl.textContent = '';
        } else {
          const hoy = todayMidnight();
          const calc = montoDe(precio, dur, todayMidnight());
          // El monto calculado queda en la casilla; se puede cambiar a mano
          montoEl.style.display = 'none';
          if (caja && inp) { caja.style.display = ''; inp.dataset.calculado = calc; inp.value = formatoMiles(calc); }
          detalleEl.textContent = textoPeriodoPago(hoy, calcularVencimiento(hoy, dur), dur);
        }
      }
    };
    planSel.onchange = updatePreview;
    diasSel.onchange = updatePreview;
    const montoInicial = document.getElementById('fMontoInicial');
    if (montoInicial) {
      montoInicial.oninput = () => {
        const dif = document.getElementById('fMontoInicialDif');
        if (dif) dif.textContent = textoDiferencia(leerMonto(montoInicial.value), Number(montoInicial.dataset.calculado));
      };
      montoInicial.onblur = () => { const n = leerMonto(montoInicial.value); if (n != null) montoInicial.value = formatoMiles(n); };
    }
    const durPagoSel = document.getElementById('fDuracionPago');
    if (durPagoSel) durPagoSel.onchange = updatePreview;
    if (especialInput) especialInput.oninput = updatePreview;
    updatePreview();
    document.getElementById('addClienteBtn').onclick = onAddCliente;
  }

  // Muestra un error en el formulario de cliente sin redibujar la pantalla, para
  // que no se pierda nada de lo que ya estaba escrito.
  function errorFormCliente(msg) {
    state.adminFormError = msg;
    state.adminFormNotice = '';
    const el = document.getElementById('formClienteError');
    if (!el) { renderApp(); return; }
