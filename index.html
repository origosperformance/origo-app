  // ---------------- Admin: Cuotas ----------------
  function ultimoPagoDe(data, dni) {
    const pagos = data.pagos.filter(p => p.dni === dni).sort((a, b) => b.fechaVencimiento.localeCompare(a.fechaVencimiento));
    return pagos[0] || null;
  }

  // ---- Plazo de pago ----
  // Último día de cada mes para pagar la cuota. Con 10: la cuota del mes se
  // paga del 1 al 10 y el 11 figura vencido todo el que no tenga el mes pago,
  // llegue hasta donde llegue su último pago. Se cambia desde la pestaña Planes.
  // (En la base se sigue llamando "dias_para_pagar".)
  const DIAS_PARA_PAGAR_DEFECTO = 10;
  function diasParaPagar() {
    const fila = state.data && state.data.config ? state.data.config.find(c => c.clave === 'dias_para_pagar') : null;
    const n = fila ? parseInt(fila.valor, 10) : NaN;
    return n >= 1 ? n : DIAS_PARA_PAGAR_DEFECTO;
  }

  function sumarDias(fechaIso, n) {
    const d = new Date(fechaIso + 'T00:00:00');
    d.setDate(d.getDate() + n);
    return isoDate(d);
  }

  // Último día para pagar la cuota del mes de 'fecha' (si el mes es más corto
  // que el día configurado, es el último día de ese mes)
  function limiteDelMes(fecha) {
    const ultimoDia = new Date(fecha.getFullYear(), fecha.getMonth() + 1, 0).getDate();
    return isoDate(new Date(fecha.getFullYear(), fecha.getMonth(), Math.min(diasParaPagar(), ultimoDia)));
  }

  // Último día para hacer el pago que sigue a uno que llega hasta 'vencIso'.
  // El primer mes que ese pago no cubre entero es el mes de 'vencIso', así que
  // el límite es el día de pago de ese mismo mes: con pago hasta el 1/11 o hasta
  // el 18/11, hay que pagar antes del 10/11.
  function limitePago(vencIso) {
    return limiteDelMes(new Date(vencIso + 'T00:00:00'));
  }

  function formatFecha(iso) {
    const [y, m, d] = iso.split('-');
    return d + '/' + m + '/' + y;
  }

  function diasEntre(desdeIso, hastaIso) {
    return Math.round((new Date(hastaIso + 'T00:00:00') - new Date(desdeIso + 'T00:00:00')) / 86400000);
  }

  // La cuota de cada mes se paga del 1 al día de pago (10). El estado sale de
  // hasta dónde llega el último pago ('vencimiento') y de en qué parte del mes
  // estamos. El mes que hay que pagar es el del vencimiento, porque es el primero
  // que el último pago no cubre entero.
  //  'Sin pagos'          nunca pagó
  //  'Al día'             todavía no empezó el mes que tiene que pagar
  //  'En período de pago' estamos entre el 1 y el día de pago de ese mes
  //  'Vencido'            pasó el día de pago y no lo pagó, aunque su último
  //                       pago llegue hasta más adelante en el mes (ej. el 18)
  // 'inicioPlazo' y 'limite' son el primer y el último día para pagar.
  function estadoCuenta(data, dni) {
    const ultimo = ultimoPagoDe(data, dni);
    if (!ultimo) return { estado: 'Sin pagos', vencimiento: null, inicioPlazo: null, limite: null, ultimo: null };
    const hoy = isoDate(ahora());
    const vencimiento = ultimo.fechaVencimiento;
    const inicioPlazo = vencimiento.slice(0, 8) + '01';
    const limite = limitePago(vencimiento);
    let estado = 'Al día';
    if (hoy > limite) estado = 'Vencido';
    else if (hoy >= inicioPlazo) estado = 'En período de pago';
    return { estado, vencimiento, inicioPlazo, limite, ultimo };
  }

  // Con la cuota vencida (pasó el día de pago y no tiene el mes pago) el cliente
  // no puede reservar turnos nuevos. No alcanza al que nunca pagó ('Sin pagos'),
  // que solo figura para atender, ni a los usuarios de prueba. Los turnos que ya
  // tenía reservados quedan, y administración lo puede seguir anotando.
  function cuotaImpideReservar(data, dni) {
    return !esPrueba(dni) && estadoCuenta(data, dni).estado === 'Vencido';
  }

  const DIAS_AVISO_VENCIMIENTO = 7;

  // Como estadoCuenta pero con prioridad de atención: 0 = urgente (vencido/sin pagos),
  // 1 = por vencer o en período de pago, 2 = tranquilo (al día, con margen)
  function cuotaDisplay(data, dni) {
    const cuenta = estadoCuenta(data, dni);
    if (cuenta.estado === 'Vencido') return { ...cuenta, label: 'Vencido', pill: 'pill-red', prioridad: 0, diasRestantes: null };
    if (cuenta.estado === 'Sin pagos') return { ...cuenta, label: 'Sin pagos', pill: 'pill-red', prioridad: 0, diasRestantes: null };
    const hoyIso = isoDate(ahora());
    if (cuenta.estado === 'En período de pago') {
      return { ...cuenta, label: 'Para pagar', pill: 'pill-amber', prioridad: 1, diasRestantes: diasEntre(hoyIso, cuenta.limite) };
    }
    // Al día: los días que faltan para que empiece el mes que tiene que pagar
    const diasRestantes = diasEntre(hoyIso, cuenta.inicioPlazo);
    if (diasRestantes <= DIAS_AVISO_VENCIMIENTO) {
      return { ...cuenta, label: 'Vence pronto', pill: 'pill-amber', prioridad: 1, diasRestantes };
    }
    return { ...cuenta, label: 'Al día', pill: 'pill-green', prioridad: 2, diasRestantes };
  }

  // Desde qué fecha cuenta el próximo pago de un cliente:
  //  - si su último pago llega hasta este mes o más adelante, sigue desde ahí,
  //    esté o no vencido: no pierde los días que ya pagó, y si se atrasó paga
  //    desde donde terminó su pago (el que tenía hasta el día 1 paga el mes entero)
  //  - si nunca pagó o su último pago terminó en un mes anterior, cuenta desde
  //    hoy, como un cliente que arranca
  function baseProximoPago(data, dni) {
    const cuenta = estadoCuenta(data, dni);
    const hoy = todayMidnight();
    const inicioMes = isoDate(new Date(hoy.getFullYear(), hoy.getMonth(), 1));
    if (cuenta.ultimo && cuenta.vencimiento >= inicioMes) return new Date(cuenta.vencimiento + 'T00:00:00');
    return hoy;
  }

  // 'duracionId' puede venir con el prefijo "desde hoy" del desplegable
  function periodoNuevoPago(data, dni, duracionId) {
    const id = String(duracionId || '');
    const desdeHoy = id.startsWith(PREFIJO_DESDE_HOY);
    const dur = duracionPorId(desdeHoy ? id.slice(PREFIJO_DESDE_HOY.length) : id);
    const base = desdeHoy ? todayMidnight() : baseProximoPago(data, dni);
    const venc = dur ? calcularVencimiento(base, dur) : null;
    return { dur, base, venc };
  }

  // Inicio del período que cubre un pago ya registrado
  function inicioPeriodo(p) {
    return sumarDias(p.fechaVencimiento, -(p.dias || 0));
  }

  function pagosDe(data, dni) {
    return data.pagos.filter(p => p.dni === dni)
      .sort((a, b) => (b.fechaVencimiento + b.fechaPago).localeCompare(a.fechaVencimiento + a.fechaPago));
  }

  async function registrarNuevoPago(dni, duracionId, metodoPago, comprobante, montoEscrito) {
    const cliente = state.data.clientes.find(c => c.dni === dni);
    if (!cliente) return;
    const { dur, base, venc } = periodoNuevoPago(state.data, dni, duracionId);
    if (!dur) return;
    const diasReales = Math.round((venc - base) / 86400000);
    const calculado = montoDe(cliente.precio, dur, base);
    const monto = montoEscrito > 0 ? montoEscrito : calculado;
    const ajustado = monto !== calculado;
    const notaLibre = String(comprobante || '').trim().slice(0, 80);
    const nota = ajustado ? ('[calc:' + calculado + '] ' + notaLibre).trim() : notaLibre;
    const nuevoPago = {
      id: 'pago-' + dni + '-' + Date.now(),
      dni, fechaPago: isoDate(ahora()), duracionId: dur.id, dias: diasReales, monto, metodoPago,
      fechaVencimiento: isoDate(venc),
      comprobante: nota || null,
    };
    let { error } = await sb.from('pagos').insert(pagoJsToDb(nuevoPago));
    let comprobanteNoGuardado = false;
    if (error && nuevoPago.comprobante) {
      // Lo más probable: la columna "comprobante" todavía no existe. Se registra el pago igual.
      console.error(error);
      const reintento = await sb.from('pagos').insert(pagoJsToDb({ ...nuevoPago, comprobante: null }));
      error = reintento.error;
      comprobanteNoGuardado = !reintento.error;
    }
    if (error) { showToast('No se pudo registrar el pago' + (error.message ? ': ' + error.message : '.')); console.error(error); return; }
    await refreshData();
    showToast(comprobanteNoGuardado
      ? (ajustado ? 'Pago registrado por ' + money(monto) + '. No se pudo guardar la marca de ajuste ni el comprobante.' : 'Pago registrado. El comprobante no se pudo guardar.')
      : 'Pago registrado: ' + dur.label + ' · vence ' + formatFechaCorta(isoDate(venc)));
    renderApp();
  }

  async function guardarDiasParaPagar(valorTexto) {
    const valor = parseInt(String(valorTexto).replace(/[^\d]/g, ''), 10);
    if (!valor || valor < 1 || valor > 31) {
      showToast('Ingresá un día del mes entre 1 y 31.');
      return;
    }
    const existe = state.data.config.some(c => c.clave === 'dias_para_pagar');
    const { error } = existe
      ? await sb.from('config').update({ valor }).eq('clave', 'dias_para_pagar')
      : await sb.from('config').insert({ clave: 'dias_para_pagar', valor });
    if (error) { showToast('No se pudo guardar.'); console.error(error); return; }
    await refreshData();
    showToast('Plazo de pago actualizado');
    renderApp();
  }

  // Descarga todos los pagos en un archivo que abre Excel (CSV separado por punto y coma)
  function descargarPagosExcel() {
    const celda = (v) => {
      let t = String(v == null ? '' : v);
      if (/^[=+\-@]/.test(t)) t = "'" + t; // que Excel no lo tome como fórmula
      return /[;"\n\r]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
    };
    const filas = [['Fecha de pago', 'Cliente', 'DNI', 'Plan actual', 'Duración', 'Monto', 'Método de pago', 'Período desde', 'Período hasta', 'Comprobante']];
    pagosReales(state.data)
      .sort((a, b) => (a.fechaPago + a.id).localeCompare(b.fechaPago + b.id))
      .forEach(p => {
        const c = state.data.clientes.find(x => x.dni === p.dni);
        const dur = duracionPorId(p.duracionId);
        filas.push([
          formatFecha(p.fechaPago), c ? c.nombre : '(cliente eliminado)', p.dni, c ? c.plan : '',
          dur ? dur.label : (p.duracionId || ''), p.monto, p.metodoPago || '',
          formatFecha(inicioPeriodo(p)), formatFecha(p.fechaVencimiento), textoComprobante(p),
        ]);
      });
    const csv = '\uFEFF' + filas.map(f => f.map(celda).join(';')).join('\r\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'origo-pagos-' + isoDate(ahora()) + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Descargando historial de pagos...');
  }

  // Lista de pagos de un cliente (se usa en Cuotas del administrador y en el perfil del cliente)
  // ---- Monto ajustado a mano ----
  // Al registrar un pago se puede cambiar el monto que calculó la app. En ese
  // caso el comprobante del pago empieza con '[calc:<monto calculado>]', para
  // que en el historial se vea que fue un ajuste y cuánto daba la cuenta.
  const MARCA_AJUSTE = /^\[calc:(\d+)\]\s*/;
  function partesComprobante(p) {
    const t = String(p.comprobante || '');
    const m = MARCA_AJUSTE.exec(t);
    return { calculado: m ? parseInt(m[1], 10) : null, nota: t.replace(MARCA_AJUSTE, '') };
  }
  function textoComprobante(p) {
    const { calculado, nota } = partesComprobante(p);
    return [calculado != null ? 'Ajustado a mano (calculado: ' + money(calculado) + ')' : '', nota ? 'Comprobante: ' + nota : ''].filter(Boolean).join(' · ');
  }
  function leerMonto(t) { const n = parseInt(String(t || '').replace(/[^\d]/g, ''), 10); return isNaN(n) ? null : n; }
  function formatoMiles(n) { return (n || 0).toLocaleString('es-AR'); }
  // Texto bajo la casilla del monto: si se cambió, cuánto más o menos que lo calculado
  function textoDiferencia(monto, calculado) {
    if (monto == null) return 'Escribí el monto que pagó.';
    const dif = monto - calculado;
    if (!dif) return '';
    return 'Ajustado a mano: ' + money(Math.abs(dif)) + (dif < 0 ? ' menos' : ' más') + ' que lo calculado (' + money(calculado) + ').';
  }

  function filasHistorialPagos(pagos, conDeshacer) {
    return pagos.map((p, i) => {
      const dur = duracionPorId(p.duracionId);
      return `
        <div class="pago-fila">
          <div>
            <div class="p1">${formatFecha(p.fechaPago)} · ${dur ? dur.label : ''}</div>
            <div class="p2">${esc(p.metodoPago || '')} · cubre del ${formatFechaCorta(inicioPeriodo(p))} al ${formatFechaCorta(p.fechaVencimiento)}${p.comprobante ? '<br>' + esc(textoComprobante(p)) : ''}${(conDeshacer && i === 0) ? `<br><button class="cancel-link" data-eliminar-pago="${p.id}" style="color:var(--amber);">Corregir este pago (lo borra para volver a cargarlo)</button>` : ''}</div>
          </div>
          <span class="monto">${money(p.monto)}</span>
        </div>`;
    }).join('');
  }

  async function eliminarPago(pagoId) {
    const { error } = await sb.from('pagos').delete().eq('id', pagoId);
    if (error) { showToast('No se pudo eliminar el pago.'); console.error(error); return; }
    await refreshData();
    showToast('Pago borrado. Cargalo de nuevo con la opción que corresponde.');
    renderApp();
    // Se lleva la pantalla al formulario para volver a cargarlo
    const sel = document.querySelector('.duracion-select');
    if (sel) sel.scrollIntoView({ block: 'center' });
  }

  async function guardarPrecioPlan(id, valorTexto) {
    const precio = parseInt(String(valorTexto).replace(/[^\d]/g, ''), 10);
    if (!precio || precio <= 0) {
      showToast('Ingresá un precio válido.');
      return;
    }
    const plan = state.data.planes.find(p => p.id === id);
    const precioViejo = plan ? plan.precio : null;
    const { error } = await sb.from('planes').update({ precio }).eq('id', id);
    if (error) { showToast('No se pudo guardar.'); console.error(error); return; }
    // Los clientes de ese plan que pagaban el precio anterior pasan al nuevo.
    // Los que tienen una cuota especial (o una cuota distinta guardada) no se tocan.
    let cambiaron = 0, quedaron = 0;
    if (plan && precioViejo !== precio) {
      const delPlan = state.data.clientes.filter(c => c.plan === plan.plan && (c.dias == null ? null : c.dias) === (plan.dias == null ? null : plan.dias));
      for (const c of delPlan) {
        if (cuotaEspecialDe(c.dni) || (c.precio != null && c.precio !== precioViejo)) { quedaron++; continue; }
        const r = await sb.from('clientes').update({ precio }).eq('dni', c.dni);
        if (r.error) console.error(r.error); else cambiaron++;
      }
    }
    await refreshData();
    showToast('Precio actualizado.' + (cambiaron ? ` ${cambiaron === 1 ? '1 cliente pasa' : cambiaron + ' clientes pasan'} a pagar ${money(precio)}.` : '')
      + (quedaron ? ` ${quedaron === 1 ? '1 con cuota especial no cambia' : quedaron + ' con cuota especial no cambian'}.` : ''));
    renderApp();
  }

  async function guardarPrecioMatricula(valorTexto) {
    const valor = parseInt(String(valorTexto).replace(/[^\d]/g, ''), 10);
    if (!valor || valor <= 0) {
      showToast('Ingresá un precio válido.');
      return;
    }
    const { error } = await sb.from('config').update({ valor }).eq('clave', 'matricula_precio');
    if (error) { showToast('No se pudo guardar.'); console.error(error); return; }
    await refreshData();
    showToast('Precio de matrícula actualizado');
    renderApp();
  }

  // Renglones de vencimiento de una cuenta (pestaña Cuotas y ficha del cliente)
  function infoVencimientoHtml(cuenta) {
    const dias = (n) => n === 0 ? ' (hoy)' : ' (' + n + (n === 1 ? ' día)' : ' días)');
    if (!cuenta.ultimo) return `<div class="pago-detalle">Todavía no tiene ningún pago registrado.</div>`;
    // Hasta dónde llega lo que ya pagó: puede ser más adelante aunque figure vencido
    const hoyIso = isoDate(ahora());
    const pagoHasta = `<div class="kv-row"><span class="k">${cuenta.vencimiento >= hoyIso ? 'Tiene pago hasta' : 'Su pago terminó'}</span><span class="v">${formatFechaCorta(cuenta.vencimiento)}</span></div>`;
    if (cuenta.estado === 'En período de pago') {
      return `
          ${pagoHasta}
          <div class="kv-row"><span class="k">Puede pagar hasta</span><span class="v">${formatFechaCorta(cuenta.limite)}${dias(cuenta.diasRestantes)}</span></div>`;
    }
    if (cuenta.estado === 'Vencido') {
      return `
          ${pagoHasta}
          <div class="kv-row"><span class="k">El plazo para pagar terminó</span><span class="v">${formatFechaCorta(cuenta.limite)}</span></div>`;
    }
    return `
          ${pagoHasta}
          <div class="kv-row"><span class="k">Próxima cuota</span><span class="v">del ${formatFechaCorta(cuenta.inicioPlazo)} al ${formatFechaCorta(cuenta.limite)}${cuenta.diasRestantes ? ' (en ' + cuenta.diasRestantes + (cuenta.diasRestantes === 1 ? ' día)' : ' días)') : ''}</span></div>`;
  }

  // Controles para registrar un pago de un cliente (pestaña Cuotas y ficha del cliente)
  function formRegistrarPagoHtml(data, c) {
    // Si el período no arranca un día 1, queda elegido el pago que lo ordena
    const base = baseProximoPago(data, c.dni);
    const previo = periodoNuevoPago(data, c.dni, sugerenciaFinDeMes(base) || '1m');
    return `
          <div class="pago-registrar">
            <select class="duracion-select" data-duracion-dni="${c.dni}">
              ${opcionesDuracionHtml(base, c.precio || 0)}
            </select>
            <select class="metodo-select" data-metodo-dni="${c.dni}">
              ${METODOS_PAGO.map(m => `<option value="${m}">${m}</option>`).join('')}
            </select>
          </div>
          <input type="text" class="pago-nota-input" data-comprobante-dni="${c.dni}" maxlength="80" placeholder="Comprobante o nota (opcional)" autocomplete="off">
          <div class="pago-monto"><span>Cobrado <small>(podés cambiarlo)</small></span>
            <label class="monto-editable">$<input type="text" inputmode="numeric" class="monto-input" data-monto-input-dni="${c.dni}"
              data-calculado="${montoDe(c.precio, previo.dur, previo.base)}" value="${formatoMiles(montoDe(c.precio, previo.dur, previo.base))}" autocomplete="off"></label></div>
          <div class="pago-detalle monto-diff" data-diff-dni="${c.dni}"></div>
          <div class="pago-preview" data-preview-dni="${c.dni}" style="margin-top:2px;">${textoPeriodoPago(previo.base, previo.venc, previo.dur)}</div>
          <button class="slot-btn" data-registrar-pago="${c.dni}" style="width:100%; margin-top:8px;">Registrar pago</button>`;
  }

  // Cómo viene la cobranza del mes en curso: un activo "tiene el mes pago"
  // cuando su cuota llega hasta el día 1 del mes siguiente. No cuenta
  // pausados, bajas ni usuarios de prueba.
  function cobranzaDelMes(data) {
    const hoy = todayMidnight();
    const finDeMesIso = isoDate(primerDiaMesSiguiente(hoy));
    const activos = clientesReales(data).filter(c => c.estado === 'Activo');
    const faltan = [];
    activos.forEach(c => {
      const ultimo = ultimoPagoDe(data, c.dni);
      if (ultimo && ultimo.fechaVencimiento >= finDeMesIso) return;
      // El próximo pago que le corresponde
      const base = baseProximoPago(data, c.dni);
      const dur = duracionPorId(sugerenciaFinDeMes(base) || '1m');
      faltan.push({ c, dur, monto: montoDe(c.precio, dur, base), hasta: ultimo ? ultimo.fechaVencimiento : null });
    });
    const limiteIso = limiteDelMes(hoy);
    return {
      total: activos.length,
      pagaron: activos.length - faltan.length,
      faltan,
      faltaCobrar: faltan.reduce((sum, f) => sum + f.monto, 0),
      limiteIso,
      plazoCerrado: isoDate(hoy) > limiteIso,
    };
  }

  function renderAdminCuotas(data) {
    const card = (c) => {
      const cuenta = cuotaDisplay(data, c.dni);
      const pagos = pagosDe(data, c.dni);
      const totalPagado = pagos.reduce((sum, p) => sum + (p.monto || 0), 0);
      const historialHtml = pagos.length ? `
          <details class="pago-hist">
            <summary>Historial de pagos (${pagos.length})</summary>
            ${filasHistorialPagos(pagos, true)}
            <div class="pago-total"><span>Total pagado</span><span>${money(totalPagado)}</span></div>
          </details>` : '';

      return `
        <div class="cuota-card">
          <div class="cuota-top">
            <button class="nombre-link cuota-nombre" data-ficha-dni="${c.dni}">${esc(c.nombre)}</button>
            <span class="pill ${cuenta.pill}">${cuenta.label}</span>
          </div>
          ${infoVencimientoHtml(cuenta)}
          ${botonRecordatorioCuota(data, c) ? `<div class="cuota-acciones">${botonRecordatorioCuota(data, c)}</div>` : ''}
          ${historialHtml}
          ${formRegistrarPagoHtml(data, c)}
        </div>`;
    };

    // Los usuarios de prueba no aparecen acá ni suman en lo cobrado
    // Las listas de atención son solo de clientes activos; pausados y bajas van aparte
    const todos = clientesReales(data);
    const clientes = todos.filter(c => c.estado === 'Activo');
    const inactivos = todos.filter(c => c.estado !== 'Activo').sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
    const urgentes = clientes.filter(c => cuotaDisplay(data, c.dni).prioridad === 0);
    const proximos = clientes.filter(c => cuotaDisplay(data, c.dni).prioridad === 1);
    const alDia = clientes.filter(c => cuotaDisplay(data, c.dni).prioridad === 2);

    const seccion = (titulo, lista) => lista.length
      ? `<h2 style="font-size:15px; margin-top:20px;">${titulo} (${lista.length})</h2><div class="cuota-list">${lista.map(card).join('')}</div>`
      : '';

    const alDiaHtml = alDia.length
      ? `<details class="cuota-aldiacolapso">
           <summary>Al día — sin nada pendiente (${alDia.length})</summary>
           <div class="cuota-list" style="margin-top:10px;">${alDia.map(card).join('')}</div>
         </details>`
      : '';

    const vencidos = urgentes.length;

    // Cobrado en el mes en curso
    const mesHoy = isoDate(ahora()).slice(0, 7);
    const pagosMes = pagosReales(data).filter(p => p.fechaPago.slice(0, 7) === mesHoy);
    const cobradoMes = pagosMes.reduce((sum, p) => sum + (p.monto || 0), 0);
    // Lo cobrado, separado por forma de pago (efectivo y transferencia siempre; las otras si hubo)
    const porMetodo = {};
    pagosMes.forEach(p => { const m = p.metodoPago || 'Sin especificar'; porMetodo[m] = (porMetodo[m] || 0) + (p.monto || 0); });
    const metodos = ['Efectivo', 'Transferencia'].concat(Object.keys(porMetodo).filter(m => m !== 'Efectivo' && m !== 'Transferencia'));
    const ver = state.verMontos;
    const monto = (n) => ver ? money(n) : '<span class="monto-oculto">$ •••••</span>';

    const nombreMes = MESES[ahora().getMonth()].toLowerCase();
    const cob = cobranzaDelMes(data);
    const cobPill = cob.total === 0 ? ''
      : cob.faltan.length === 0 ? '<span class="pill pill-green">Todo liquidado</span>'
      : cob.plazoCerrado ? `<span class="pill pill-red">El plazo cerró el ${formatFechaCorta(cob.limiteIso)}</span>`
      : `<span class="pill pill-amber">Plazo: hasta el ${formatFechaCorta(cob.limiteIso)}</span>`;
    const faltanHtml = cob.faltan.length ? `
          <details class="pago-hist" style="margin-top:6px;">
            <summary>Ver quiénes faltan (${cob.faltan.length})</summary>
            ${cob.faltan.slice().sort((a, b) => a.c.nombre.localeCompare(b.c.nombre, 'es')).map(f => `
            <div class="pago-fila">
              <div>
                <button class="nombre-link p1" data-ficha-dni="${f.c.dni}">${esc(f.c.nombre)}</button>
                <div class="p2">${f.hasta ? 'Tiene pago hasta el ' + formatFechaCorta(f.hasta) : 'Sin pagos'} · le corresponde: ${f.dur.corto || f.dur.label}</div>
              </div>
              <span class="monto">${money(f.monto)}</span>
            </div>`).join('')}
          </details>` : '';

    return `
        <p class="sub">Estado de cuentas${vencidos ? ' — ' + vencidos + (vencidos === 1 ? ' necesita atención' : ' necesitan atención') : ''}</p>
        <div class="cuota-card" style="margin-bottom:12px;">
          <div class="cuota-top">
            <div class="cuota-nombre">Cobranza de ${nombreMes}</div>
            ${cobPill}
          </div>
          <div class="asis-semana-top" style="margin-top:10px;"><span>Activos con el mes pago</span><span>${cob.pagaron} de ${cob.total}</span></div>
          <div class="asis-bar"><i style="width:${cob.total ? Math.round(cob.pagaron / cob.total * 100) : 0}%"></i></div>
        </div>

        <div class="cuota-card recaudado-card">
          <div class="cuota-top">
            <div class="cuota-nombre">Cobrado en ${nombreMes}</div>
            <button class="ojo-btn ${ver ? 'on' : ''}" id="verMontosBtn">${ver ? 'Ocultar montos' : 'Mostrar montos'}</button>
          </div>
          ${metodos.map(m => `<div class="kv-row"><span class="k">${esc(m)}</span><span class="v">${monto(porMetodo[m] || 0)}</span></div>`).join('')}
          <div class="recaudado-total"><span class="k">Total cobrado</span><span class="v">${monto(cobradoMes)}</span></div>
          <div class="pago-detalle">${pagosMes.length} ${pagosMes.length === 1 ? 'pago registrado' : 'pagos registrados'} este mes. Solo cuenta lo que ya se cobró.</div>
        </div>

        ${cob.faltan.length ? `
        <div class="cuota-card pendiente-card">
          <div class="cuota-top">
            <div class="cuota-nombre">Pendiente de cobro</div>
            <span class="pill pill-amber">${cob.faltan.length} ${cob.faltan.length === 1 ? 'cliente' : 'clientes'}</span>
          </div>
          <div class="kv-row"><span class="k">Falta cobrar (aprox.)</span><span class="v">${monto(cob.faltaCobrar)}</span></div>
          <div class="pago-detalle">No está sumado en lo cobrado: es lo que todavía deben este mes.</div>
          ${ver ? faltanHtml : faltanHtml.replace(/<span class="monto">[^<]*<\/span>/g, '<span class="monto monto-oculto">$ •••••</span>')}
        </div>` : ''}
        <button class="btn btn-ghost" id="exportPagosBtn" style="width:100%;">Descargar historial de pagos (Excel)</button>
        ${seccion('Necesitan atención', urgentes)}
        ${seccion('Por vencer o para pagar', proximos)}
        ${alDiaHtml}
        ${inactivos.length ? `
        <details class="cuota-aldiacolapso" style="margin-top:6px;">
          <summary>Pausados y de baja (${inactivos.length})</summary>
          <div class="cuota-list" style="margin-top:10px;">${inactivos.map(card).join('')}</div>
        </details>` : ''}
    `;
  }

  // ---------------- Admin: Turnos (novedades, semana y día) ----------------
  // "Novedades" = reservas y cancelaciones posteriores a la última vez que se
  // tocó "Ya las vi" en este dispositivo (se guarda en el navegador).
  const CLAVE_NOVEDADES = 'origo_novedades_vistas';
  const NOVEDADES_DIAS_MAX = 7;

  function novedadesVistasHasta() {
    if (state.novedadesDesde) return state.novedadesDesde;
    let guardado = 0;
    try { guardado = parseInt(localStorage.getItem(CLAVE_NOVEDADES), 10) || 0; } catch (e) {}
    // Primera vez en este dispositivo: se empieza a contar desde ahora
    state.novedadesDesde = guardado > 0 ? guardado : Date.now();
    if (!guardado) { try { localStorage.setItem(CLAVE_NOVEDADES, String(state.novedadesDesde)); } catch (e) {} }
    return state.novedadesDesde;
  }

  function marcarNovedadesVistas() {
    state.novedadesDesde = Date.now();
    try { localStorage.setItem(CLAVE_NOVEDADES, String(state.novedadesDesde)); } catch (e) {}
  }

  function novedadesTurnos(data) {
    const desde = Math.max(novedadesVistasHasta(), Date.now() - NOVEDADES_DIAS_MAX * 86400000);
    const lista = [];
    reservasReales(data).forEach(r => {
      const cancelada = r.estado === 'cancelado';
      // Una reserva cancelada sin fecha de cancelación (la deshizo la app sola) no se avisa
      if (r.creadoEn && r.creadoEn > desde && !state.misAcciones['n-' + r.id] && !esTurnoFijo(r) && (!cancelada || r.canceladoEn)) {
        lista.push({ clave: 'n-' + r.id, tipo: r.porAdmin ? 'anotado' : 'reserva', t: r.creadoEn, r });
      }
      if (cancelada && r.canceladoEn && r.canceladoEn > desde && !state.misAcciones['c-' + r.id]) {
        lista.push({ clave: 'c-' + r.id, tipo: 'cancelacion', t: r.canceladoEn, r });
      }
    });
    return lista.sort((a, b) => b.t - a.t);
  }

  function nombreDeDni(data, dni) {
    const c = data.clientes.find(x => x.dni === dni);
    if (c) return c.nombre;
    return esProspecto(dni) ? datosProspecto(dni).nombre : 'DNI ' + dni;
  }

  function textoNovedad(data, e) {
    const verbo = e.tipo === 'cancelacion' ? 'canceló' : e.tipo === 'anotado' ? 'fue anotado desde administración' : 'reservó';
    return nombreDeDni(data, e.r.dni) + ' ' + verbo + ': ' + fechaLarga(e.r.fecha).toLowerCase() + ' a las ' + String(e.r.hora).slice(0, 5);
  }

  function haceCuanto(t) {
    const min = Math.round((Date.now() - t) / 60000);
    if (min < 1) return 'recién';
    if (min < 60) return 'hace ' + min + ' min';
    if (min < 60 * 24) return 'hace ' + Math.round(min / 60) + ' h';
    return formatFechaCorta(isoDate(new Date(t)));
  }

  // Cartel por las novedades que llegan mientras administración está abierta
  function avisarNovedades() {
    if (state.mode !== 'admin' || !state.data) return;
    const todas = novedadesTurnos(state.data);
    const nuevas = todas.filter(e => !state.novedadesAvisadas[e.clave]);
    todas.forEach(e => { state.novedadesAvisadas[e.clave] = true; });
    if (!state.novedadesListas) { state.novedadesListas = true; return; } // lo que ya estaba al entrar no se anuncia
    if (nuevas.length === 1) showToast(textoNovedad(state.data, nuevas[0]));
    else if (nuevas.length > 1) showToast(nuevas.length + ' novedades en Turnos');
  }

  // Sábado y domingo no hay turnos: se pasa al lunes siguiente
  function aDiaHabil(iso) {
    const d = new Date(iso + 'T00:00:00');
    if (d.getDay() === 6) d.setDate(d.getDate() + 2);
    if (d.getDay() === 0) d.setDate(d.getDate() + 1);
    return isoDate(d);
  }

  function fechaAdminTurnos() {
    return aDiaHabil(state.asistenciasFecha || isoDate(ahora()));
  }

  function renderAdminAsistencias(data) {
    const fecha = fechaAdminTurnos();
    const hoyIso = isoDate(ahora());
    const vista = state.turnosVista === 'semana' ? 'semana' : 'dia';
    const lunes = mondayOf(fecha);
    const dias = [0, 1, 2, 3, 4].map(i => { const d = new Date(lunes); d.setDate(lunes.getDate() + i); return d; });
    const activas = reservasReales(data).filter(r => r.estado !== 'cancelado');
    const cuantos = (iso, hora) => activas.filter(r => r.fecha === iso && (hora === undefined || r.hora === hora)).length;

    // ---- Novedades ----
    const novedades = novedadesTurnos(data);
    const NOV_MAX = 8;
    const novedadesHtml = novedades.length ? `
        <div class="cuota-card" style="margin-bottom:14px; border-left:3px solid var(--green);">
          <div class="cuota-top">
            <div class="cuota-nombre">${novedades.length === 1 ? '1 novedad' : novedades.length + ' novedades'}</div>
            <button class="cancel-link" id="novedadesVistasBtn">Ya las vi</button>
          </div>
          ${novedades.slice(0, NOV_MAX).map(e => `
          <button class="nov-fila ${e.tipo}" data-ir-dia="${e.r.fecha}" data-ir-hora="${String(e.r.hora).slice(0, 5)}">
            <span class="n1"><b>${esc(nombreDeDni(data, e.r.dni))}</b> ${e.tipo === 'cancelacion' ? 'canceló' : e.tipo === 'anotado' ? 'fue anotado desde administración' : 'reservó'}
              <span class="n2">${fechaLarga(e.r.fecha)} a las ${String(e.r.hora).slice(0, 5)}</span></span>
            <span class="cuando">${haceCuanto(e.t)}</span>
          </button>`).join('')}
          ${novedades.length > NOV_MAX ? `<div class="pago-detalle" style="padding-top:8px;">y ${novedades.length - NOV_MAX} más</div>` : ''}
        </div>` : '';
    const faltaSqlHtml = data.novedadesCompletas === false
      ? `<div class="pago-detalle" style="margin:-4px 0 14px; line-height:1.5;">Las cancelaciones todavía no se avisan acá: falta agregar unas columnas en Supabase.</div>` : '';

    // ---- Navegación de semana ----
    const ultimo = dias[4];
    const tituloSemana = dias[0].getMonth() === ultimo.getMonth()
      ? `${dias[0].getDate()} al ${ultimo.getDate()} de ${MESES[ultimo.getMonth()].toLowerCase()}`
      : `${dias[0].getDate()}/${dias[0].getMonth() + 1} al ${ultimo.getDate()}/${ultimo.getMonth() + 1}`;
    const navHtml = `
        <div class="turnos-nav">
          <button class="cal-nav" data-turnos-semana="-1" aria-label="Semana anterior">${ICONOS.izq}</button>
          <span class="titulo">${tituloSemana}</span>
          <button class="cal-nav" data-turnos-semana="1" aria-label="Semana siguiente">${ICONOS.der}</button>
        </div>`;
    const segHtml = `
        <div class="seg">
          <button class="seg-btn ${vista === 'dia' ? 'active' : ''}" data-turnos-vista="dia">Día</button>
          <button class="seg-btn ${vista === 'semana' ? 'active' : ''}" data-turnos-vista="semana">Semana</button>
        </div>`;

    if (vista === 'semana') {
      const cabecera = '<div></div>' + dias.map(d => `
          <div class="sg-head ${isoDate(d) === hoyIso ? 'hoy' : ''}">${DIAS_CORTO[d.getDay()]}<b>${d.getDate()}</b></div>`).join('');
      const filas = HORARIOS.map(hora => `<div class="sg-hora">${hora}</div>` + dias.map(d => {
        const iso = isoDate(d);
        const nn = cuantos(iso, hora);
        const alfa = nn === 0 ? 0 : Math.min(1, 0.14 + 0.86 * nn / CUPO);
        return `<button class="sg-celda ${nn >= CUPO ? 'lleno' : ''} ${turnoYaEmpezo(iso, hora) || !horarioAbierto(iso, hora) ? 'pasado' : ''}" data-ir-dia="${iso}" data-ir-hora="${hora}"
                  style="${nn ? `background:rgba(47,111,237,${alfa.toFixed(2)});` : ''}" aria-label="${fechaLarga(iso)} ${hora}: ${nn} de ${CUPO}">${nn || ''}</button>`;
      }).join('')).join('');
      const totalSemana = dias.reduce((sum, d) => sum + cuantos(isoDate(d)), 0);
      return `
        <p class="sub">Ocupación de cada horario. Tocá un casillero para ver quiénes son.</p>
        ${novedadesHtml}${faltaSqlHtml}
        ${segHtml}
        ${navHtml}
        <div class="sg">${cabecera}${filas}</div>
        <div class="pago-detalle" style="margin-top:12px;">${totalSemana} ${totalSemana === 1 ? 'turno reservado' : 'turnos reservados'} en la semana. El número es la cantidad de personas; cada horario tiene ${CUPO} lugares.</div>
      `;
    }

    // ---- Vista de día ----
    const tira = dias.map(d => {
      const iso = isoDate(d);
      const nn = cuantos(iso);
      return `<button class="sem-dia ${iso === fecha ? 'active' : ''} ${iso === hoyIso ? 'hoy' : ''}" data-turnos-dia="${iso}">
                <span class="dow">${DIAS_CORTO[d.getDay()]}</span>
                <span class="dnum">${d.getDate()}</span>
                <span class="cuenta">${nn ? nn + (nn === 1 ? ' turno' : ' turnos') : ''}</span>
              </button>`;
    }).join('');

    const delDia = activas.filter(r => r.fecha === fecha);
    const empezados = delDia.filter(r => estadoEfectivo(r) !== 'reservado');
    const nAsistieron = empezados.filter(r => estadoEfectivo(r) === 'asistio').length;
    const nFaltaron = empezados.filter(r => estadoEfectivo(r) === 'no_asistio').length;
    const resumenHtml = `
        <div class="asis-stats">
          <div class="asis-stat"><span class="num">${delDia.length}</span><span class="lbl">${delDia.length === 1 ? 'anotado' : 'anotados'}</span></div>
          <div class="asis-stat"><span class="num">${nAsistieron}</span><span class="lbl">${nAsistieron === 1 ? 'asistió' : 'asistieron'}</span></div>
          <div class="asis-stat"><span class="num">${nFaltaron}</span><span class="lbl">${nFaltaron === 1 ? 'faltó' : 'faltaron'}</span></div>
        </div>`;

    const candidatos = clientesReales(data).filter(c => c.estado === 'Activo').sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));

    const fila = (hora) => {
      const items = delDia.filter(r => r.hora === hora)
        .sort((a, b) => nombreDeDni(data, a.dni).localeCompare(nombreDeDni(data, b.dni), 'es'));
      const empezo = turnoYaEmpezo(fecha, hora);
      const lleno = items.length >= CUPO;
      const anotando = state.anotarEn === hora;

      const personas = items.map(r => {
        const ef = estadoEfectivo(r);
        const clase = ef === 'no_asistio' ? 'falto' : ef === 'reservado' ? 'porvenir' : '';
        const nuevo = esPrimeraClase(data, r);
        const marcas = (nuevo ? '<span class="marca">nuevo</span>' : '') + (esTurnoFijo(r) ? '<span class="marca">fijo</span>' : '');
        return `<button class="persona ${clase} ${nuevo ? 'nuevo' : ''} ${state.reservaAbierta === r.id ? 'abierta' : ''}" data-persona="${r.id}">${esc(nombreDeDni(data, r.dni))}${marcas}</button>`;
      }).join('');

      const abierta = items.find(r => r.id === state.reservaAbierta);
      let accionesHtml = '';
      if (abierta) {
        const ef = estadoEfectivo(abierta);
        const existe = data.clientes.some(c => c.dni === abierta.dni);
        const prospecto = esProspecto(abierta.dni) ? datosProspecto(abierta.dni) : null;
        const clienteAb = data.clientes.find(c => c.dni === abierta.dni) || null;
        const cuentaAb = clienteAb && !esPrueba(clienteAb.dni) && clienteAb.estado === 'Activo' ? cuotaDisplay(data, clienteAb.dni) : null;
        const telLimpio = prospecto ? prospecto.telefono.replace(/[^\d+]/g, '') : '';
        accionesHtml = `
          <div class="th-acciones">
            <span class="quien">${esc(nombreDeDni(data, abierta.dni))}${ef === 'reservado' ? '' : ef === 'no_asistio' ? ' · figura que faltó' : ' · figura que asistió'}${
              prospecto ? ` · cliente nuevo, todavía sin cuenta${prospecto.telefono ? ' · ' + esc(prospecto.telefono) : ''}` : esPrimeraClase(data, abierta) ? ' · primera clase' : ''}${
              esTurnoFijo(abierta) ? ' · turno fijo' : ''}</span>
            ${prospecto ? `${botonWhatsapp(prospecto.telefono, mensajeConfirmarTurno(prospecto.nombre, abierta), 'Confirmar turno')}
            ${telLimpio ? `<a class="asist-btn" href="tel:${esc(telLimpio)}" style="text-decoration:none;">Llamar</a>` : ''}
            <button class="asist-btn" data-alta-nuevo="${esc(abierta.dni)}" style="border-color:var(--nuevo); color:var(--nuevo);">Dar de alta</button>` : ''}
            ${clienteAb && ef === 'reservado' && esPrimeraClase(data, abierta) ? botonWhatsapp(clienteAb.telefono, mensajeConfirmarTurno(clienteAb.nombre, abierta), 'Confirmar turno') : ''}
            ${cuentaAb ? `<span class="pill ${cuentaAb.pill}">Cuota: ${cuentaAb.label}</span>` : ''}
            ${cuentaAb && cuentaAb.prioridad <= 1 ? `<button class="asist-btn" data-cobro-toggle="${abierta.id}" style="border-color:var(--amber); color:var(--amber);">${state.cobroAbierto === abierta.id ? 'Cerrar cobro' : 'Registrar pago'}</button>
            ${botonRecordatorioCuota(data, clienteAb)}` : ''}
            ${empezo ? `
            <button class="asist-btn asist-si ${ef==='asistio'?'active':''}" data-asist-id="${abierta.id}" data-asist-val="asistio">Asistió</button>
            <button class="asist-btn asist-no ${ef==='no_asistio'?'active':''}" data-asist-id="${abierta.id}" data-asist-val="no_asistio">No asistió</button>` : ''}
            <button class="asist-btn" data-cancelar-admin="${abierta.id}">Cancelar turno</button>
            ${existe ? `<button class="asist-btn" data-ficha-dni="${abierta.dni}">Ver ficha</button>` : ''}
            ${cuentaAb && cuentaAb.prioridad <= 1 && state.cobroAbierto === abierta.id ? `<div class="cobro-rapido">${formRegistrarPagoHtml(data, clienteAb)}</div>` : ''}
          </div>`;
      }

      let anotarHtml = '';
      if (anotando) {
        const yaEstan = items.map(r => r.dni);
        const opcionesNuevos = prospectosConTurnos(data).filter(p => !yaEstan.includes(p.dni)).map(p => `
                  <button class="anotar-op" data-anotar-dni="${esc(p.dni)}" data-buscar="${esc(p.nombre.toLowerCase())} ${esc(p.telefono)}">
                    <span>${esc(p.nombre)}</span><small class="nuevo">cliente nuevo</small>
                  </button>`).join('');
        const opciones = opcionesNuevos + candidatos.filter(c => !yaEstan.includes(c.dni)).map(c => {
          const limite = limiteSemanalDe(c);
          const enSemana = reservasEnSemana(data, c.dni, fecha).length;
          const enDia = delDia.filter(r => r.dni === c.dni).length;
          const pisa = delDia.find(r => r.dni === c.dni && seSuperponen(r.hora, hora));
          const aviso = pisa ? `ya tiene turno a las ${pisa.hora} (se pisan)`
            : enDia >= MAX_TURNOS_POR_DIA ? `ya tiene ${enDia} turnos este día`
            : (isFinite(limite) && enSemana >= limite) ? `ya usó sus ${limite} turnos de la semana` : '';
          return `<button class="anotar-op" data-anotar-dni="${c.dni}" data-buscar="${esc(c.nombre.toLowerCase())} ${c.dni}">
                    <span>${esc(c.nombre)}</span><small class="${aviso ? 'aviso' : ''}">${aviso || esc(c.plan)}</small>
                  </button>`;
        }).join('');
        anotarHtml = `
          <div class="anotar" data-anotar-panel="${hora}">
            <input type="text" id="anotarBuscar" placeholder="Buscar cliente por nombre o DNI" autocomplete="off">
            <div id="anotarLista">${opciones || '<div class="pago-detalle" style="padding:10px 0;">No hay más clientes activos para anotar.</div>'}</div>
            <div class="pago-detalle" id="anotarResto" style="padding-top:8px;"></div>
            <div class="anotar-nuevo">
              <div class="pago-detalle">¿Todavía no es cliente? Anotalo con nombre y teléfono; cuando arranque lo das de alta.</div>
              <div class="campos">
                <input type="text" id="nuevoNombre" placeholder="Nombre y apellido" autocomplete="off">
                <input type="text" id="nuevoTel" inputmode="tel" placeholder="Teléfono" autocomplete="off">
              </div>
              <div class="error-text" id="nuevoError"></div>
              <button class="slot-btn" id="anotarNuevoBtn">Anotar como cliente nuevo</button>
            </div>
          </div>`;
      }

      const cerradoH = !horarioAbierto(fecha, hora);
      const botonAnotar = (lleno || cerradoH) ? (cerradoH ? '<span class="pill pill-red">Cerrado</span>' : '')
        : `<button class="cancel-link" data-anotar-hora="${hora}">${anotando ? 'Cerrar' : '+ Anotar'}</button>`;
      if (items.length === 0) {
        return `
        <div class="th vacio" data-th="${hora}">
          <div class="th-top"><span class="th-hora">${hora}</span><span class="th-cuenta">Sin anotados</span>${botonAnotar}</div>
          ${anotarHtml}
        </div>`;
      }
      return `
        <div class="th" data-th="${hora}">
          <div class="th-top">
            <span class="th-hora">${hora}</span>
            <span class="th-bar"><i style="width:${Math.min(100, Math.round(items.length / CUPO * 100))}%"></i></span>
            <span class="th-cuenta">${items.length} de ${CUPO}</span>
            ${botonAnotar}
          </div>
          <div class="th-personas">${personas}</div>
          ${accionesHtml}
          ${anotarHtml}
        </div>`;
    };

    // Los horarios con gente (o en los que se está anotando) van completos; los
    // vacíos se juntan en una tira de botones chicos, para no ocupar la pantalla.
    // Los horarios cerrados y vacíos no se muestran.
    function filasCompactas() {
      let html = '', libres = [];
      const volcar = () => {
        if (libres.length) html += `<div class="th-libres"><span class="lbl">Libres</span>${libres.map(h =>
          `<button class="libre-chip ${turnoYaEmpezo(fecha, h) ? 'pasado' : ''}" data-anotar-hora="${h}" aria-label="Anotar a las ${h}">${h}</button>`).join('')}</div>`;
        libres = [];
      };
      horariosConExtras(delDia).forEach(h => {
        const conGente = delDia.some(r => String(r.hora).slice(0, 5) === h);
        if (!HORARIOS.includes(h)) { volcar(); html += fila(h); return; } // turno viejo fuera del horario
        if (!conGente && state.anotarEn !== h) {
          if (horarioAbierto(fecha, h)) libres.push(h);
          return;
        }
        volcar();
        html += fila(h);
      });
      volcar();
      return html || '<div class="empty-state">Este día está cerrado.</div>';
    }

    return `
        <p class="sub">Tocá un horario libre para anotar a alguien, o un nombre para marcar una falta o cancelarle el turno.</p>
        ${novedadesHtml}${faltaSqlHtml}
        ${segHtml}
        ${navHtml}
        <div class="sem">${tira}</div>
        <p class="turnos-dia" style="margin-bottom:10px;">${fechaCompleta(fecha)}${fecha === hoyIso ? ' (hoy)' : ''}</p>
        ${resumenHtml}
        ${horarioDiaAdminHtml(data, fecha)}
        ${delDia.some(r => esPrimeraClase(data, r)) ? `<div class="leyenda"><span><i style="background:var(--nuevo)"></i>Cliente nuevo: todavía no vino a ninguna clase</span></div>` : ''}
        ${filasCompactas()}
        <label class="pago-detalle" style="display:block; margin-top:16px;">Ir a otra fecha
          <input type="date" id="asistFechaInput" value="${fecha}" class="date-input" style="margin:6px 0 0;" />
        </label>
    `;
  }

  // Bloque "horario de este día" en Turnos: ver, cambiar y avisar a los afectados
  function horarioDiaAdminHtml(data, fecha) {
    const esp = horarioEspecial(fecha);
    const ed = state.diaEditando && state.diaEditando.fecha === fecha ? state.diaEditando : null;
    let html;
    if (ed) {
      const opcionesHora = (sel) => HORARIOS.map(h => `<option value="${h}" ${h === sel ? 'selected' : ''}>${h}</option>`).join('');
      html = `
        <div class="dia-editor">
          <div class="cuota-nombre" style="margin-bottom:10px;">Horario del ${fechaLarga(fecha).toLowerCase()}</div>
          <div class="seg" style="margin-bottom:10px;">
            <button class="seg-btn ${ed.tipo === 'normal' ? 'active' : ''}" data-dia-tipo="normal">Normal</button>
            <button class="seg-btn ${ed.tipo === 'especial' ? 'active' : ''}" data-dia-tipo="especial">Medio día</button>
            <button class="seg-btn ${ed.tipo === 'cerrado' ? 'active' : ''}" data-dia-tipo="cerrado">Cerrado</button>
          </div>
          ${ed.tipo === 'especial' ? `
          <div class="dia-franja">
            <label>Primer turno<select id="diaDesde">${opcionesHora(ed.desde)}</select></label>
            <label>Último turno<select id="diaHasta">${opcionesHora(ed.hasta)}</select></label>
          </div>` : ''}
          <div class="pago-detalle" style="margin:4px 0 10px; line-height:1.5;">${
            ed.tipo === 'cerrado' ? 'Nadie va a poder reservar ese día.'
            : ed.tipo === 'especial' ? 'Los clientes solo ven y reservan los horarios de esa franja.'
            : 'Se puede reservar en todos los horarios, como siempre.'}</div>
          <div class="error-text" id="diaError"></div>
          <div style="display:flex; gap:8px;">
            <button class="btn btn-primary" data-dia-guardar="${fecha}" style="flex:1;">Guardar</button>
            <button class="btn btn-ghost" data-dia-cancelar="1">Cancelar</button>
          </div>
        </div>`;
    } else {
      html = `
        <div class="dia-horario ${esp ? (esp.cerrado ? 'cerrado' : 'especial') : ''}">
          <span>${esc(textoHorarioEspecial(esp))}</span>
          <button class="cancel-link" data-dia-editar="${fecha}">${esp ? 'Cambiar' : 'Cerrar o medio día'}</button>
        </div>`;
    }
    // Turnos que quedaron fuera del horario: avisar y cancelar
    const fuera = turnosFueraDeHorario(data, fecha);
    if (fuera.length && !ed) {
      const que = esp && esp.cerrado ? 'ORIGO va a estar cerrado' : esp ? 'abrimos solo de ' + esp.desde + ' a ' + esp.hasta
        : 'el último turno es a las ' + ULTIMO_TURNO;
      html += `
        <div class="cuota-card pendiente-card" style="margin-top:8px;">
          <div class="cuota-nombre" style="margin-bottom:6px;">${fuera.length === 1 ? '1 turno quedó' : fuera.length + ' turnos quedaron'} fuera de horario</div>
          <div class="pago-detalle" style="margin-bottom:8px;">Avisales por WhatsApp y después cancelá sus turnos.</div>
          ${fuera.sort((a, b) => a.hora.localeCompare(b.hora)).map(r => {
            const c = data.clientes.find(x => x.dni === r.dni);
            const tel = c ? c.telefono : esProspecto(r.dni) ? datosProspecto(r.dni).telefono : '';
            const nombre = nombreDeDni(data, r.dni);
            const msg = 'Hola ' + primerNombre(nombre) + '! Te avisamos que el ' + fechaLarga(fecha).toLowerCase() + ' ' + que
              + ', así que tu turno de las ' + String(r.hora).slice(0, 5) + ' se cancela. Podés reservar otro horario desde la app. ¡Gracias!';
            return `<div class="pago-fila"><div><div class="p1">${esc(nombre)}</div><div class="p2">${String(r.hora).slice(0, 5)} hs</div></div>
              ${botonWhatsapp(tel, msg, 'Avisar') || '<span class="p2">sin teléfono</span>'}</div>`;
          }).join('')}
          <button class="slot-btn" data-cancelar-fuera="${fecha}" style="width:100%; margin-top:10px;">Cancelar ${fuera.length === 1 ? 'ese turno' : 'esos ' + fuera.length + ' turnos'}</button>
        </div>`;
    }
    return html;
  }

  async function guardarHorarioDesdeTurnos(fecha) {
    const ed = state.diaEditando;
    if (!ed || ed.fecha !== fecha) return;
    let e = null;
    if (ed.tipo === 'cerrado') e = { cerrado: true };
    else if (ed.tipo === 'especial') {
      if (ed.hasta < ed.desde) { document.getElementById('diaError').textContent = 'El último turno tiene que ser después del primero.'; return; }
      e = { desde: ed.desde, hasta: ed.hasta };
    }
    const ok = await guardarHorarioDia(fecha, e);
    await refreshData();
    state.diaEditando = null;
    showToast(!ok ? 'No se pudo guardar el horario. Probá de nuevo.' : (e ? textoHorarioEspecial(e) : 'Horario normal') + ' el ' + fechaLarga(fecha).toLowerCase());
    renderApp();
  }

  async function cancelarTurnosFuera(fecha) {
    const fuera = turnosFueraDeHorario(state.data, fecha);
    let fallaron = 0;
    for (const r of fuera) {
      state.misAcciones['c-' + r.id] = true;
      const { error } = await marcarCancelada(r.id);
      if (error) fallaron++;
    }
    await refreshData();
    showToast(fallaron ? 'No se pudieron cancelar ' + fallaron + ' turnos. Probá de nuevo.' : (fuera.length === 1 ? 'Turno cancelado.' : fuera.length + ' turnos cancelados.'));
    renderApp();
  }

  // Anota a un cliente en un turno desde administración. Respeta el cupo del
  // horario, pero no los límites del plan (si lo anota el profe es una excepción).
  async function anotarDesdeAdmin(dni, fecha, hora) {
    const cliente = state.data.clientes.find(c => c.dni === dni)
      || (esProspecto(dni) ? { dni, nombre: datosProspecto(dni).nombre } : null);
    if (!cliente) return;
    const frescas = await reservasFrescasDelDia(fecha);
    if (!frescas) { showToast('No se pudo comprobar el cupo. Probá de nuevo.'); return; }
    if (frescas.some(r => r.dni === dni && r.hora === hora && r.estado !== 'cancelado')) {
      state.anotarEn = null;
      await refreshData();
      showToast(cliente.nombre + ' ya estaba en ese turno.');
      renderApp();
      return;
    }
    if (ocupadosEnTurno({ reservas: frescas }, fecha, hora, null) >= CUPO) {
      state.anotarEn = null;
      await refreshData();
      showToast('Ese turno ya está completo.');
      renderApp();
      return;
    }
    const nueva = { id: 'r' + Date.now() + Math.random().toString(36).slice(2,7), dni, fecha, hora, estado: 'reservado' };
    // "por_admin" deja registrado que lo anotó administración (si la base ya tiene esa columna)
    let res = state.data.novedadesCompletas === false ? null : await sb.from('reservas').insert({ ...nueva, por_admin: true });
    if (!res || res.error) res = await sb.from('reservas').insert(nueva);
    if (res.error) { showToast('No se pudo anotar' + (res.error.message ? ': ' + res.error.message : '.')); console.error(res.error); return; }
    state.misAcciones['n-' + nueva.id] = true;
    state.anotarEn = null;
    await refreshData();
    showToast(cliente.nombre + ' anotado a las ' + hora);
    renderApp();
  }

  async function cancelarDesdeAdmin(id) {
    const r = state.data.reservas.find(x => x.id === id);
    if (!r) return;
    const { error } = await marcarCancelada(id);
    if (error) { showToast('No se pudo cancelar.'); console.error(error); return; }
    state.misAcciones['c-' + id] = true;
    state.reservaAbierta = null;
    await refreshData();
    showToast('Turno de ' + nombreDeDni(state.data, r.dni) + ' cancelado');
    renderApp();
  }

  // Botones de la pestaña Turnos de administración
  function wireTurnosAdmin(root) {
    const on = (sel, fn) => root.querySelectorAll(sel).forEach(el => { el.onclick = () => fn(el); });
    const cerrar = () => { state.anotarEn = null; state.reservaAbierta = null; state.cobroAbierto = null; state.diaEditando = null; };
    on('[data-turnos-vista]', el => { state.turnosVista = el.dataset.turnosVista; cerrar(); renderApp(); });
    on('[data-turnos-semana]', el => {
      const d = new Date(fechaAdminTurnos() + 'T00:00:00');
      d.setDate(d.getDate() + 7 * parseInt(el.dataset.turnosSemana, 10));
      state.asistenciasFecha = isoDate(d);
      cerrar(); renderApp();
    });
    on('[data-turnos-dia]', el => { state.asistenciasFecha = el.dataset.turnosDia; cerrar(); renderApp(); });
    // Casillero de la semana o novedad: abre ese día y lleva al horario
    on('[data-ir-dia]', el => {
      state.asistenciasFecha = el.dataset.irDia;
      state.turnosVista = 'dia';
      cerrar(); renderApp();
      const destino = document.querySelector(`[data-th="${el.dataset.irHora}"]`);
      if (destino) destino.scrollIntoView({ block: 'center' });
    });
    on('#novedadesVistasBtn', () => { marcarNovedadesVistas(); renderApp(); });
    const fechaInput = document.getElementById('asistFechaInput');
    if (fechaInput) fechaInput.onchange = (e) => { if (e.target.value) { state.asistenciasFecha = e.target.value; cerrar(); renderApp(); } };

    on('[data-persona]', el => {
      state.cobroAbierto = null;
      state.reservaAbierta = state.reservaAbierta === el.dataset.persona ? null : el.dataset.persona;
      state.anotarEn = null;
      renderApp();
    });
    on('.asist-btn[data-asist-id]', el => marcarAsistencia(el.dataset.asistId, el.dataset.asistVal));
    on('[data-dia-editar]', el => {
      const esp = horarioEspecial(el.dataset.diaEditar);
      state.diaEditando = { fecha: el.dataset.diaEditar,
        tipo: !esp ? 'especial' : esp.cerrado ? 'cerrado' : 'especial',
        desde: esp && esp.desde ? esp.desde : HORARIOS[0], hasta: esp && esp.hasta ? esp.hasta : '12:00' };
      renderApp();
    });
    on('[data-dia-tipo]', el => { state.diaEditando.tipo = el.dataset.diaTipo; renderApp(); });
    on('[data-dia-cancelar]', () => { state.diaEditando = null; renderApp(); });
    const diaDesde = document.getElementById('diaDesde'), diaHasta = document.getElementById('diaHasta');
    if (diaDesde) diaDesde.onchange = () => { state.diaEditando.desde = diaDesde.value; };
    if (diaHasta) diaHasta.onchange = () => { state.diaEditando.hasta = diaHasta.value; };
    on('[data-dia-guardar]', el => { el.disabled = true; guardarHorarioDesdeTurnos(el.dataset.diaGuardar); });
    on('[data-cancelar-fuera]', el => confirmarEnDosToques(el, 'Tocá de nuevo para cancelarlos', () => { el.disabled = true; cancelarTurnosFuera(el.dataset.cancelarFuera); }));
    on('[data-cobro-toggle]', el => { state.cobroAbierto = state.cobroAbierto === el.dataset.cobroToggle ? null : el.dataset.cobroToggle; renderApp(); });
    wirePagos(root);
    on('[data-cancelar-admin]', el => { el.disabled = true; cancelarDesdeAdmin(el.dataset.cancelarAdmin); });

    on('[data-anotar-hora]', el => {
      state.anotarEn = state.anotarEn === el.dataset.anotarHora ? null : el.dataset.anotarHora;
      state.reservaAbierta = null;
      renderApp();
      const campo = document.getElementById('anotarBuscar');
      if (campo) campo.focus();
    });
    // El buscador filtra la lista sin redibujar la pantalla (así no se pierde el foco)
    const buscar = document.getElementById('anotarBuscar');
    if (buscar) {
      const MAX = 6;
      const filtrar = () => {
        const q = buscar.value.trim().toLowerCase();
        let vistos = 0, total = 0;
        document.querySelectorAll('#anotarLista .anotar-op').forEach(op => {
          const coincide = !q || op.dataset.buscar.includes(q);
          if (coincide) total++;
          const mostrar = coincide && vistos < MAX;
          if (mostrar) vistos++;
          op.style.display = mostrar ? '' : 'none';
        });
        const resto = document.getElementById('anotarResto');
        if (resto) resto.textContent = total > vistos ? `Hay ${total - vistos} más: escribí para afinar la búsqueda.` : (total === 0 && q ? 'Ningún cliente activo coincide.' : '');
      };
      buscar.oninput = filtrar;
      filtrar();
    }
    on('[data-anotar-dni]', el => {
      const hora = el.closest('[data-anotar-panel]').dataset.anotarPanel;
      document.querySelectorAll('#anotarLista .anotar-op').forEach(b => { b.disabled = true; });
      anotarDesdeAdmin(el.dataset.anotarDni, fechaAdminTurnos(), hora);
    });
    // Cliente nuevo sin cuenta: se anota con nombre y teléfono
    on('#anotarNuevoBtn', el => {
      const nombre = document.getElementById('nuevoNombre').value.trim();
      const telefono = document.getElementById('nuevoTel').value.trim();
      const err = document.getElementById('nuevoError');
      if (nombre.length < 2) { err.textContent = 'Escribí al menos el nombre.'; return; }
      const hora = el.closest('[data-anotar-panel]').dataset.anotarPanel;
      el.disabled = true;
      anotarDesdeAdmin(codigoProspecto(nombre, telefono), fechaAdminTurnos(), hora);
    });
    // Dar de alta a un cliente nuevo: abre el alta con sus datos ya cargados
    on('[data-alta-nuevo]', el => {
      const codigo = el.dataset.altaNuevo;
      cerrarFicha();
      state.anotarEn = null;
      state.reservaAbierta = null;
      state.adminTab = 'clientes';
      state.fichaOrigen = 'clientes';
      state.nuevoClienteAbierto = true;
      state.altaProspecto = codigo;
      state.adminFormError = '';
      state.adminFormNotice = '';
      renderApp();
      window.scrollTo(0, 0);
    });
  }

  function formatFechaCorta(iso) {
    const [y,m,d] = iso.split('-');
    return d + '/' + m;
  }
  function renderPerfil(cliente, data) {

    const mesCuota = cuenta.limite ? MESES[parseInt(cuenta.limite.slice(5, 7), 10) - 1].toLowerCase() : '';
    const conPago = !!cuenta.vencimiento && cuenta.vencimiento >= isoDate(ahora());

  function renderMiDia(cliente, data) {
