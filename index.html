  }

  // ---------------- Cambio de DNI ----------------
  // El DNI es la llave del cliente: sus turnos, pagos, rutinas y registros del
  // control diario están guardados con ese número. Para cambiarlo sin perder
  // nada se hace en este orden: 1) se crea la ficha con el DNI nuevo, 2) se le
  // pasa todo lo suyo, tabla por tabla, comprobando en la base que pasó, y
  // 3) recién al final se borra la ficha con el DNI anterior. Si algo falla en
  // el camino se deshace lo hecho y el cliente queda como estaba. Y si se corta
  // justo en el medio (se cierra la app, se cae internet), volver a guardar el
  // mismo cambio lo termina: la ficha a medio pasar se reconoce porque tiene la
  // misma contraseña protegida, que es única de cada cliente.
  const TABLAS_CON_DNI = { reservas: 'los turnos', registros_pro: 'los registros del control diario', pagos: 'los pagos', rutinas: 'las rutinas' };
  // Tablas en las que, si la base no deja modificar una fila, se la puede pasar
  // copiándola y borrando la original (la app ya agrega y borra filas ahí).
  const TABLAS_COPIABLES = { registros_pro: true, pagos: true, rutinas: true };

  // Cuántas filas de una tabla tiene un DNI, mirado en la base en este momento (null = no se pudo saber)
  async function contarConDni(tabla, dni) {
    try {
      const r = await sb.from(tabla).select('id', { count: 'exact', head: true }).eq('dni', dni);
      if (!r.error && typeof r.count === 'number') return r.count;
    } catch (e) {}
    try {
      const r = await sb.from(tabla).select('id').eq('dni', dni);
      return (r.error || !r.data) ? null : r.data.length;
    } catch (e) { return null; }
  }

  // Id de la copia de una fila al pasarla de un DNI a otro. Ida y vuelta dan el
  // id original, así repetir el cambio nunca duplica filas.
  function idEspejo(id, desde, hasta) {
    id = String(id);
    const prefijo = 'pago-' + desde + '-';
    if (id.startsWith(prefijo)) return 'pago-' + hasta + '-' + id.slice(prefijo.length);
    return id.endsWith('-m') ? id.slice(0, -2) : id + '-m';
  }

  async function borrarPorIds(tabla, ids) {
    let ok = true;
    for (let i = 0; i < ids.length; i += 40) {
      const r = await sb.from(tabla).delete().in('id', ids.slice(i, i + 40));
      if (r.error) ok = false;
    }
    return ok;
  }

  // Pasa las filas de una tabla de un DNI a otro. Devuelve { ok, deshacer }:
  // "deshacer" (si viene) las devuelve al DNI de origen.
  async function moverTablaDni(tabla, desde, hasta) {
    const antes = await contarConDni(tabla, desde);
    if (antes === null) return { ok: false };
    if (antes === 0) return { ok: true };
    const volver = async () => {
      const r = await sb.from(tabla).update({ dni: desde }).eq('dni', hasta);
      return !r.error && (await contarConDni(tabla, hasta)) === 0;
    };
    const r = await sb.from(tabla).update({ dni: hasta }).eq('dni', desde);
    // No alcanza con que no haya dado error: si la base no deja modificar esa
    // tabla, contesta "bien" sin cambiar nada. Se comprueba que no quedó ninguna.
    const quedan = await contarConDni(tabla, desde);
    if (quedan === 0) return { ok: true, deshacer: volver };
    if (quedan === null || quedan !== antes) return { ok: false, deshacer: volver };
    if (r.error) console.error('No se pudo pasar ' + tabla + ' al DNI nuevo:', r.error);
    if (!TABLAS_COPIABLES[tabla]) return { ok: false };

    // Plan B: copiar las filas con el DNI nuevo y borrar las originales
    const viejas = await sb.from(tabla).select('*').eq('dni', desde);
    const yaEstan = await sb.from(tabla).select('id').eq('dni', hasta);
    if (viejas.error || !viejas.data || yaEstan.error || !yaEstan.data || viejas.data.length !== antes) return { ok: false };
    const idsYa = {};
    yaEstan.data.forEach(f => { idsYa[String(f.id)] = true; });
    const copias = viejas.data.map(f => ({ ...f, id: idEspejo(f.id, desde, hasta), dni: hasta })).filter(f => !idsYa[f.id]);
    if (copias.length) {
      const ins = await sb.from(tabla).insert(copias);
      if (ins.error) { console.error('No se pudo copiar ' + tabla + ':', ins.error); return { ok: false }; }
    }
    const idsCopias = copias.map(f => f.id);
    if ((await contarConDni(tabla, hasta)) !== yaEstan.data.length + copias.length) {
      await borrarPorIds(tabla, idsCopias);
      return { ok: false };
    }
    await sb.from(tabla).delete().eq('dni', desde);
    if ((await contarConDni(tabla, desde)) !== 0) {
      await borrarPorIds(tabla, idsCopias); // no se pudieron borrar las originales: se sacan las copias
      return { ok: false };
    }
    return { ok: true, deshacer: async () => {
      const ins = await sb.from(tabla).insert(viejas.data);
      if (ins.error) return false;
      return await borrarPorIds(tabla, idsCopias);
    } };
  }

  // Cambia el DNI de un cliente y guarda de paso el resto de sus datos
  // ("candidato"). Devuelve { ok: true, aviso } o { ok: false, mensaje }.
  async function cambiarDniCliente(dniViejo, dniNuevo, candidato) {
    const falla = (mensaje) => ({ ok: false, mensaje });
    const NADA = ' No se cambió nada.';
    const tablas = Object.keys(TABLAS_CON_DNI).filter(t => t !== 'registros_pro' || state.data.registrosProListo);

    // Las dos fichas, leídas en este momento
    const origen = await sb.from('clientes').select('*').eq('dni', dniViejo);
    const destino = await sb.from('clientes').select('*').eq('dni', dniNuevo);
    if (origen.error || !origen.data || destino.error || !destino.data) return falla('No se pudo leer al cliente. Revisá la conexión y probá de nuevo.' + NADA);
    if (origen.data.length !== 1) return falla('No se encontró al cliente con DNI ' + dniViejo + '. Volvé a abrir su ficha.' + NADA);
    const filaVieja = origen.data[0];
    const retoma = destino.data.length === 1 && esPasswordHasheada(filaVieja.password) && destino.data[0].password === filaVieja.password;
    if (destino.data.length && !retoma) return falla('Ya existe otro cliente con ese DNI.');
    if (!retoma) {
      // Un DNI que quedó con historial de un cliente eliminado no se reutiliza: se mezclarían los dos
      for (const t of tablas) {
        const n = await contarConDni(t, dniNuevo);
        if (n === null) return falla('No se pudo comprobar el DNI nuevo. Revisá la conexión y probá de nuevo.' + NADA);
        if (n > 0) return falla(`Con el DNI ${dniNuevo} siguen guardados en la base ${TABLAS_CON_DNI[t]} de un cliente que se eliminó, y se mezclarían con los de ${candidato.nombre}.` + NADA);
      }
    }

    // 1) Ficha con el DNI nuevo (con todos los datos que tenía la anterior)
    const datos = { ...clienteJsToDb(candidato), dni: dniNuevo };
    const deshacer = [];
    if (retoma) {
      const r = await sb.from('clientes').update(datos).eq('dni', dniNuevo);
      if (r.error) return falla('No se pudo guardar (' + r.error.message + ')');
    } else {
      let r = await sb.from('clientes').insert({ ...filaVieja, ...datos });
      if (r.error) r = await sb.from('clientes').insert(datos);
      if (r.error) return falla('No se pudo guardar el DNI nuevo (' + r.error.message + ').' + NADA);
      deshacer.push(async () => !(await sb.from('clientes').delete().eq('dni', dniNuevo)).error);
    }

    // 2) Todo lo del cliente pasa al DNI nuevo
    const pasarTodo = async () => {
      for (const t of tablas) {
        const res = await moverTablaDni(t, dniViejo, dniNuevo);
        if (res.deshacer) deshacer.push(res.deshacer);
        if (!res.ok) return t;
      }
      return null;
    };
    let fallo = await pasarTodo();
    if (fallo) {
      let limpio = true;
      for (const paso of deshacer.reverse()) {
        // si no se pudo devolver algo, no se borra la ficha nueva (ahí siguen esos datos)
        if (!limpio) break;
        try { limpio = await paso(); } catch (e) { limpio = false; }
      }
      return falla(limpio && !retoma
        ? `No se pudieron pasar ${TABLAS_CON_DNI[fallo]} al DNI nuevo, así que se dejó todo como estaba. Probá de nuevo.`
        : `El cambio quedó a medias: ${candidato.nombre} figura con los dos DNI (${dniViejo} y ${dniNuevo}). No borres ninguna de las dos fichas: abrí la del DNI ${dniViejo} y volvé a guardar el cambio para terminarlo.`);
    }

    // 3) Se borra la ficha anterior, comprobando antes que ya no le quede nada
    //    (por si el cliente reservó un turno justo en el medio)
    let quedaAlgo = false;
    for (const t of tablas) { if ((await contarConDni(t, dniViejo)) !== 0) quedaAlgo = true; }
    if (quedaAlgo) { fallo = await pasarTodo(); quedaAlgo = !!fallo; }
    let borrada = false;
    if (!quedaAlgo) {
      await sb.from('clientes').delete().eq('dni', dniViejo);
      const sigue = await sb.from('clientes').select('dni').eq('dni', dniViejo);
      borrada = !sigue.error && !!sigue.data && sigue.data.length === 0;
    }
    return { ok: true, aviso: borrada ? '' : ` Ojo: la ficha con el DNI anterior (${esc(dniViejo)}) no se pudo borrar y quedó duplicada. Abrila y volvé a guardar el cambio de DNI para terminarlo.` };
  }

  async function onAddCliente() {
    const dniField = document.getElementById('fDni');
    // El DNI se guarda sin puntos ni espacios. Al editar solo cuenta como
    // cambio si de verdad se tocó el campo (un DNI viejo cargado con puntos no
    // se "corrige" solo por guardar otro dato).
    const dniEscrito = dniField.value.trim();
    const dniLimpio = dniEscrito.replace(/[.\s]/g, '');
    const cambiaDni = !!state.editingDni && dniEscrito !== state.editingDni && dniLimpio !== state.editingDni;
    const dni = (state.editingDni && !cambiaDni) ? state.editingDni : dniLimpio;
    const password = document.getElementById('fPass').value.trim();
    const nombre = document.getElementById('fNombre').value.trim();
    const email = document.getElementById('fEmail').value.trim();
    const telefono = document.getElementById('fTelefono').value.trim();
    const plan = document.getElementById('fPlan').value;
    const esPro = plan === 'PRO';
    const dias = esPro ? null : parseInt(document.getElementById('fDias').value, 10);
    const fuerza = parseInt(document.getElementById('fFuerza').value, 10) || 0;
    const resistencia = parseInt(document.getElementById('fResistencia').value, 10) || 0;
    const velocidad = parseInt(document.getElementById('fVelocidad').value, 10) || 0;
    const estado = document.getElementById('fEstado').value;
    const limiteRaw = document.getElementById('fLimiteSemanal').value.trim();
    const limiteSemanalOverride = limiteRaw === '' ? null : parseInt(limiteRaw, 10);
    const marcarPrueba = document.getElementById('fPrueba').checked;
    const notaPrueba = (okMarca) => !okMarca
      ? ' Ojo: no se pudo guardar la marca de usuario de prueba, probá de nuevo.'
      : (marcarPrueba ? ' Quedó como usuario de prueba.' : '');

    if (!dni || !nombre || (!state.editingDni && !password)) {
      errorFormCliente(state.editingDni ? 'Completá al menos DNI y nombre.' : 'Completá al menos DNI, contraseña y nombre.');
      return;
    }

    // Cuota: la especial si se cargó una, si no la del plan
    const especialTexto = document.getElementById('fCuotaEspecial').value.trim();
    const cuotaEspecial = especialTexto === '' ? null : parseInt(especialTexto.replace(/[.\s$]/g, ''), 10);
    if (especialTexto !== '' && (!/^[\d.\s$]+$/.test(especialTexto) || !(cuotaEspecial > 0))) {
      errorFormCliente('La cuota especial tiene que ser un monto en pesos (por ejemplo 100000), o quedar vacía.');
      return;
    }
    const precio = cuotaEspecial || precioDe(plan, dias);
    if (!precio) {
      errorFormCliente('Ese plan no tiene precio para esa cantidad de días. Elegí otra combinación o cargale una cuota especial.');
      return;
    }
    const notaCuota = (ok, antes) => !ok ? ' Ojo: no se pudo guardar la cuota especial, probá de nuevo.'
      : (cuotaEspecial && cuotaEspecial !== antes) ? ` Cuota especial: ${money(cuotaEspecial)} por mes.`
      : (!cuotaEspecial && antes) ? ' Volvió a la cuota de su plan.' : '';
    const datosComunes = {
      nombre, email, telefono, plan, precio,
      dias: esPro ? null : dias,
      estimulos: esPro ? null : { fuerza, resistencia, velocidad },
      estado,
      limiteSemanalOverride,
    };

    if (state.editingDni) {
      const dniAnterior = state.editingDni;
      const cActual = state.data.clientes.find(x => x.dni === dniAnterior);
      // (una ficha con ese DNI que es copia de ésta es un cambio que quedó a medias: se deja pasar para terminarlo)
      const esCopiaAMedias = (c) => c.dni === dni && esPasswordHasheada(c.password) && c.password === cActual.password;
      if (cambiaDni && state.data.clientes.some(c => c.dni !== dniAnterior && !esCopiaAMedias(c) &&
          (c.dni === dni || (soloDigitos(dni) && soloDigitos(c.dni) === soloDigitos(dni))))) {
        errorFormCliente('Ya existe otro cliente con ese DNI.');
        return;
      }
      const estadoAnterior = cActual.estado;
      const nuevoPassword = password ? await hashPassword(password) : cActual.password;
      const candidato = { ...cActual, ...datosComunes, password: nuevoPassword };
      const nota = aplicarTransicionEstado(candidato, estadoAnterior, estado);
      const eraPrueba = esPrueba(dniAnterior);
      const cuotaAntes = cuotaEspecialDe(dniAnterior);
      let notaDni = '';
      if (cambiaDni) {
        // El DNI es la llave del cliente: se muda con todo lo suyo (ver cambiarDniCliente)
        const btn = document.getElementById('addClienteBtn');
        if (btn) { btn.disabled = true; btn.textContent = 'Cambiando el DNI…'; }
        let res;
        try { res = await cambiarDniCliente(dniAnterior, dni, candidato); }
        catch (e) { console.error(e); res = { ok: false, mensaje: 'Se cortó la conexión mientras se cambiaba el DNI. Revisá cómo quedó el cliente y volvé a guardar.' }; }
        if (!res.ok) {
          await refreshData();
          if (btn) { btn.disabled = false; btn.textContent = 'Guardar cambios'; }
          errorFormCliente(res.mensaje);
          return;
        }
        state.editingDni = dni;
        state.fichaDni = dni;
        await refreshData(); // la marca de prueba y la cuota especial se pasan mirando lo que hay ahora
        notaDni = ` El DNI pasó de ${esc(dniAnterior)} a ${esc(dni)}: desde ahora entra a la app con el nuevo (la contraseña es la misma) y conserva sus turnos, pagos y rutinas.${res.aviso || ''}`;
      } else {
        const { error } = await sb.from('clientes').update(clienteJsToDb(candidato)).eq('dni', dniAnterior);
        if (error) { errorFormCliente('No se pudo guardar (' + error.message + ')'); return; }
      }
      const dniEditado = dni;
      await guardarMarcaPrueba(dniEditado, marcarPrueba);
      await guardarCuotaEspecial(dniEditado, cuotaEspecial);
      if (cambiaDni) {
        // Lo que estaba anotado con el DNI anterior se quita, para que no lo herede nadie
        await guardarMarcaPrueba(dniAnterior, false);
        await guardarCuotaEspecial(dniAnterior, null);
        // Sus días fijos también pasan al DNI nuevo
        const fijosViejos = fijosDe(dniAnterior);
        if (fijosViejos.length && await guardarFijos(dniEditado, fijosViejos)) await guardarFijos(dniAnterior, []);
      }
      await refreshData();
      // Se confirma contra lo que realmente quedó guardado en la base
      const okMarca = esPrueba(dniEditado) === marcarPrueba;
      state.adminFormError = '';
      state.adminFormNotice = `${esc(nombre)} se actualizó correctamente.${notaDni}${nota}${
        !okMarca ? notaPrueba(false) : (marcarPrueba !== eraPrueba ? (marcarPrueba ? ' Quedó como usuario de prueba.' : ' Dejó de ser usuario de prueba.') : '')}${
        notaCuota(cuotaEspecialDe(dniEditado) === cuotaEspecial, cuotaAntes)}`;
      renderApp();
      window.scrollTo(0, 0); // el aviso de "Listo" está arriba del formulario
      return;
    }

    if (state.data.clientes.some(c => c.dni === dni || (soloDigitos(dni) && soloDigitos(c.dni) === soloDigitos(dni)))) {
      errorFormCliente('Ya existe un cliente con ese DNI.');
      return;
    }
    // La casilla solo existe si la matrícula se está cobrando
    const casillaMatricula = document.getElementById('fMatriculaPagada');
    const matriculaPagada = !!casillaMatricula && casillaMatricula.checked;
    const passwordHash = await hashPassword(password);
    const nuevoCliente = {
      dni, ...datosComunes, password: passwordHash,
      matricula: { pagada: matriculaPagada, fechaPago: matriculaPagada ? isoDate(ahora()) : null },
      pausadoDesde: estado === 'Pausado' ? isoDate(ahora()) : null,
    };
    const { error: errCliente } = await sb.from('clientes').insert(clienteJsToDb(nuevoCliente));
    if (errCliente) { errorFormCliente('No se pudo crear (' + errCliente.message + ')'); return; }

    // Si estaba anotado como cliente nuevo, sus turnos pasan a su DNI
    let notaTurnos = '';
    if (state.altaProspecto) {
      const codigo = state.altaProspecto;
      const { error: errTurnos } = await sb.from('reservas').update({ dni }).eq('dni', codigo);
      const quedan = await contarConDni('reservas', codigo);
      if (errTurnos || quedan !== 0) {
        console.error('No se pudieron pasar los turnos del cliente nuevo:', errTurnos);
        notaTurnos = ' Ojo: sus turnos anotados no se pudieron pasar a su ficha; anotalo de nuevo desde Turnos.';
      } else {
        notaTurnos = ' Sus turnos anotados quedaron en su ficha.';
      }
      state.altaProspecto = null;
    }

    let notaPago = '';
    const duracionPago = document.getElementById('fDuracionPago').value;
    if (duracionPago) {
      const dur = duracionPorId(duracionPago);
      const metodoPago = document.getElementById('fMetodoPago').value;
      const hoy = ahora();
      hoy.setHours(0, 0, 0, 0);
      const venc = calcularVencimiento(hoy, dur);
      const diasReales = Math.round((venc - hoy) / 86400000);
      const calculado = montoDe(precio, dur, hoy);
      const escrito = leerMonto((document.getElementById('fMontoInicial') || {}).value);
      const monto = escrito > 0 ? escrito : calculado;
      const nuevoPago = {
        id: 'pago-' + dni + '-' + Date.now(),
        dni, fechaPago: isoDate(hoy), duracionId: dur.id, dias: diasReales, monto, metodoPago,
        fechaVencimiento: isoDate(venc),
        comprobante: monto !== calculado ? '[calc:' + calculado + ']' : null,
      };
      let { error: errPago } = await sb.from('pagos').insert(pagoJsToDb(nuevoPago));
      // Si la base no tiene la columna del comprobante, se registra igual sin la marca de ajuste
      if (errPago && nuevoPago.comprobante) ({ error: errPago } = await sb.from('pagos').insert(pagoJsToDb({ ...nuevoPago, comprobante: null })));
      notaPago = errPago
        ? ' Ojo: el pago inicial no se pudo registrar, cargalo desde su ficha.'
        : ` Pago inicial registrado (${dur.label}, ${money(monto)}, vence ${formatFechaCorta(isoDate(venc))}).`;
      if (errPago) console.error(errPago);
    }

    if (marcarPrueba) await guardarMarcaPrueba(dni, true);
    if (cuotaEspecial) await guardarCuotaEspecial(dni, cuotaEspecial);
    await refreshData();
    state.adminFormError = '';
    state.nuevoClienteAbierto = false;
    state.adminFormNotice = `${esc(nombre)} se agregó correctamente.${notaTurnos}${notaPago}${marcarPrueba ? notaPrueba(esPrueba(dni)) : ''}${
      cuotaEspecial ? notaCuota(cuotaEspecialDe(dni) === cuotaEspecial, null) : ''}`;
    renderApp();
  }

  function descargarBackup() {
    const blob = new Blob([JSON.stringify(state.data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'origo-backup-' + isoDate(ahora()) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Descargando copia de seguridad...');
  }

  async function marcarAsistencia(reservaId, valor) {
    const r = state.data.reservas.find(x => x.id === reservaId);
    if (!r) return;
    // "No asistió" tocado de nuevo se deshace (vuelve a contar como asistencia automática).
    // "Asistió" deja la asistencia confirmada a mano.
    let nuevoEstado;
    if (valor === 'no_asistio') nuevoEstado = (r.estado === 'no_asistio') ? 'reservado' : 'no_asistio';
    else nuevoEstado = 'asistio';
    if (nuevoEstado === r.estado) return;
    const { error } = await sb.from('reservas').update({ estado: nuevoEstado }).eq('id', reservaId);
    if (error) { showToast('No se pudo actualizar.'); console.error(error); return; }
    await refreshData();
    renderApp();
  }

  async function eliminarCliente(dni) {
    state.confirmarEliminarDni = null;
    if (state.fichaDni === dni) { cerrarFicha(); state.fichaOrigen = 'clientes'; }
    const { error } = await sb.from('clientes').delete().eq('dni', dni);
    if (error) { showToast('No se pudo eliminar.'); console.error(error); return; }
    // Sus turnos que todavía no empezaron se cancelan, para que no sigan ocupando lugar
    const futuros = turnosFuturosDe(dni);
    for (const r of futuros) { await marcarCancelada(r.id); state.misAcciones['c-' + r.id] = true; }
    // Sus registros de control diario se borran con él (si la tabla existe)
    if (state.data.registrosProListo) await sb.from('registros_pro').delete().eq('dni', dni);
    // Y su cuota especial y su marca de usuario de prueba, para que no las herede otro cliente con el mismo DNI
    if (state.data.config.some(c => c.clave === CLAVE_CUOTA + dni)) {
      await sb.from('config').update({ valor: 0 }).eq('clave', CLAVE_CUOTA + dni);
      await sb.from('config').delete().eq('clave', CLAVE_CUOTA + dni);
    }
    if (state.data.config.some(c => c.clave === CLAVE_PRUEBA + dni)) {
      await sb.from('config').update({ valor: 0 }).eq('clave', CLAVE_PRUEBA + dni);
      await sb.from('config').delete().eq('clave', CLAVE_PRUEBA + dni);
    }
    // Y sus días fijos, para que no se le reserven turnos a nadie
    if (fijosDe(dni).length) await guardarFijos(dni, []);
    await refreshData();
    showToast('Cliente eliminado.' + (futuros.length ? ` Se ${futuros.length === 1 ? 'canceló su turno reservado' : 'cancelaron sus ' + futuros.length + ' turnos reservados'}.` : ''));
    renderApp();
  }

  // Turnos reservados de un cliente que todavía no empezaron
  function turnosFuturosDe(dni) {
    return state.data.reservas.filter(r => r.dni === dni && r.estado === 'reservado' && !turnoYaEmpezo(r.fecha, r.hora));
  }

  function aplicarTransicionEstado(c, estadoAnterior, nuevoEstado) {
    if (nuevoEstado === estadoAnterior) return '';
    // Al pausar o dar de baja no se le cancelan los turnos solos: se avisa
    const nFuturos = nuevoEstado === 'Activo' ? 0 : turnosFuturosDe(c.dni).length;
    const avisoTurnos = nFuturos ? ` Ojo: tiene ${nFuturos === 1 ? '1 turno reservado' : nFuturos + ' turnos reservados'}; cancelalo${nFuturos === 1 ? '' : 's'} desde Turnos si no va a venir.` : '';
    if (nuevoEstado === 'Baja') {
      c.pausadoDesde = null;
      if (!matriculaActiva()) return avisoTurnos;
      c.matricula = { pagada: false, fechaPago: null };
      return ' Se reinició su matrícula: va a tener que pagarla de nuevo si vuelve.' + avisoTurnos;
    }
    if (nuevoEstado === 'Pausado') {
      c.pausadoDesde = isoDate(ahora());
      return ' Empieza a correr el plazo de pausa (máximo 3 meses).' + avisoTurnos;
    }
    if (nuevoEstado === 'Activo') {
      c.pausadoDesde = null;
    }
    return '';
  }

  async function cambiarEstadoCliente(dni, nuevoEstado) {
    const cActual = state.data.clientes.find(x => x.dni === dni);
    if (!cActual) return;
    const estadoAnterior = cActual.estado;
    const candidato = { ...cActual, estado: nuevoEstado };
    const nota = aplicarTransicionEstado(candidato, estadoAnterior, nuevoEstado);
    const { error } = await sb.from('clientes').update(clienteJsToDb(candidato)).eq('dni', dni);
    if (error) { showToast('No se pudo actualizar.'); console.error(error); return; }
    await refreshData();
    showToast(cActual.nombre + ' ahora está ' + nuevoEstado.toLowerCase() + '.' + nota);
    renderApp();
  }

  async function registrarMatricula(dni) {
    const c = state.data.clientes.find(x => x.dni === dni);
    if (!c) return;
    const { error } = await sb.from('clientes')
      .update({ matricula_pagada: true, matricula_fecha_pago: isoDate(ahora()) })
      .eq('dni', dni);
    if (error) { showToast('No se pudo registrar.'); console.error(error); return; }
    await refreshData();
    showToast('Matrícula registrada para ' + c.nombre);
    renderApp();
  }

  async function agregarRutina(dni) {
    const tituloInput = document.getElementById('rutinaTitulo-' + dni);
    const urlInput = document.getElementById('rutinaUrl-' + dni);
    const titulo = tituloInput.value.trim();
    let url = urlInput.value.trim();
    if (!titulo || !url) {
      showToast('Completá el título y el link.');
      return;
    }
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
    const { error } = await sb.from('rutinas').insert({
      id: 'rutina-' + Date.now(), dni, titulo, url, fecha: isoDate(ahora()),
    });
    if (error) { showToast('No se pudo agregar la rutina.'); console.error(error); return; }
    await refreshData();
    showToast('Rutina agregada');
    renderApp();
  }

  async function eliminarRutina(dni, rutinaId) {
    const { error } = await sb.from('rutinas').delete().eq('id', rutinaId);
    if (error) { showToast('No se pudo eliminar.'); console.error(error); return; }
    state.confirmarRutinaId = null;
    await refreshData();
    showToast('Rutina eliminada');
    renderApp();
  }

  function diasPausado(c) {
    if (!c.pausadoDesde) return null;
    const hoy = ahora();
    hoy.setHours(0, 0, 0, 0);
    const desde = new Date(c.pausadoDesde + 'T00:00:00');
    return Math.round((hoy - desde) / 86400000);
  }

  // Reservas de un día leídas en ese momento desde la base (null si no se pudo leer)
  async function reservasFrescasDelDia(fecha) {
    const { data, error } = await sb.from('reservas').select('*').eq('fecha', fecha);
    if (error || !data) { console.error('No se pudo leer el cupo:', error); return null; }
    return data;
  }

  // Evita que dos toques seguidos en "Reservar" anoten dos veces
  let reservaEnCurso = false;
  async function reservarTurno(hora) {
    if (reservaEnCurso) return;
    reservaEnCurso = true;
    try { await reservarTurnoInterno(hora); } finally { reservaEnCurso = false; }
  }

  async function reservarTurnoInterno(hora) {
    if (!horarioAbierto(state.selectedDate, hora)) {
      showToast('Ese horario está cerrado. Elegí otro.');
      state.slotElegido = null;
      renderApp();
      return;
    }
    if (state.cliente.estado !== 'Activo') {
      showToast('Tu membresía no está activa: no podés reservar.');
      renderApp();
      return;
    }
    if (cuotaImpideReservar(state.data, state.cliente.dni)) {
      // Puede que recién haya pagado en recepción: se vuelve a leer antes de negarle el turno
      await refreshData();
      if (cuotaImpideReservar(state.data, state.cliente.dni)) {
        showToast('Tenés la cuota vencida: no podés reservar hasta pagarla.');
        renderApp();
        return;
      }
    }
    if (turnoYaEmpezo(state.selectedDate, hora)) {
      showToast('Ese turno ya empezó. Elegí uno más tarde.');
      renderApp();
      return;
    }
    const reservasHoy = state.data.reservas.filter(r =>
      r.dni === state.cliente.dni && r.fecha === state.selectedDate && r.estado !== 'cancelado');
    if (reservasHoy.length >= MAX_TURNOS_POR_DIA) {
      showToast('Ya reservaste ' + MAX_TURNOS_POR_DIA + ' turnos ese día. Desmarcá uno primero.');
      return;
    }
    const pisado = reservasHoy.find(r => seSuperponen(r.hora, hora));
    if (pisado) {
      showToast('Ese horario se superpone con tu turno de las ' + pisado.hora + '.');
      return;
    }
    const limiteSemanal = limiteSemanalDe(state.cliente);
    const reservasSemana = reservasEnSemana(state.data, state.cliente.dni, state.selectedDate);
    if (reservasSemana.length >= limiteSemanal) {
      showToast('Ya alcanzaste tu límite semanal de turnos según tu plan.');
      return;
    }
    // El cupo se vuelve a consultar en la base en este momento: lo que el
    // cliente ve en pantalla puede tener varios minutos.
    const dni = state.cliente.dni;
    const fecha = state.selectedDate;
    const antes = await reservasFrescasDelDia(fecha);
    if (!antes) { showToast('No se pudo comprobar el cupo. Probá de nuevo.'); return; }
    if (antes.some(r => r.dni === dni && r.hora === hora && r.estado !== 'cancelado')) {
      await refreshData();
      showToast('Ya tenías reservado ese turno.');
      renderApp();
      return;
    }
    const pisadoEnBase = antes.find(r => r.dni === dni && r.estado !== 'cancelado' && seSuperponen(r.hora, hora));
    if (pisadoEnBase) {
      await refreshData();
      showToast('Ese horario se superpone con tu turno de las ' + String(pisadoEnBase.hora).slice(0, 5) + '.');
      renderApp();
      return;
    }
    if (ocupadosEnTurno({ reservas: antes }, fecha, hora, dni) >= CUPO) {
      await refreshData();
      showToast('Ese turno se acaba de completar. Elegí otro horario.');
      renderApp();
      return;
    }
    const nueva = {
      id: 'r' + Date.now() + Math.random().toString(36).slice(2,7),
      dni,
      fecha,
      hora,
      estado: 'reservado',
    };
    const { error } = await sb.from('reservas').insert(nueva);
    if (error) { showToast('No se pudo reservar. Probá de nuevo.'); console.error(error); return; }
    // Segundo control: si otro cliente anotó en el mismo instante y el turno
    // quedó pasado de cupo, esta reserva se deshace. (El usuario de prueba no
    // ocupa lugar, así que no puede pasarse.)
    await refreshData();
    if (!esPrueba(dni) && !state.errorConexion && ocupadosEnTurno(state.data, fecha, hora, dni) > CUPO) {
      await sb.from('reservas').update({ estado: 'cancelado' }).eq('id', nueva.id);
      await refreshData();
      showToast('Ese turno se completó justo antes. Elegí otro horario.');
      renderApp();
      return;
    }
    showToast('Turno reservado: ' + hora + ' hs');
    renderApp();
  }

  async function cancelarReserva(id) {
    const reserva = state.data.reservas.find(x => x.id === id);
    if (reserva && turnoYaEmpezo(reserva.fecha, reserva.hora)) {
      showToast('Ese turno ya empezó y no se puede cancelar.');
      renderApp();
      return;
    }
    const { error } = await marcarCancelada(id);
    if (error) { showToast('No se pudo cancelar.'); console.error(error); return; }
    await refreshData();
    showToast('Turno cancelado');
    renderApp();
  }

  registrarNuevoPago = unaALaVez(registrarNuevoPago);
  eliminarPago = unaALaVez(eliminarPago);
  guardarDiasParaPagar = unaALaVez(guardarDiasParaPagar);
  guardarPrecioPlan = unaALaVez(guardarPrecioPlan);
  guardarPrecioMatricula = unaALaVez(guardarPrecioMatricula);
  guardarMatriculaActiva = unaALaVez(guardarMatriculaActiva);
  onAddCliente = unaALaVez(onAddCliente);
  eliminarCliente = unaALaVez(eliminarCliente);
  cambiarEstadoCliente = unaALaVez(cambiarEstadoCliente);
  registrarMatricula = unaALaVez(registrarMatricula);
  agregarRutina = unaALaVez(agregarRutina);
  eliminarRutina = unaALaVez(eliminarRutina);
  marcarAsistencia = unaALaVez(marcarAsistencia);
  anotarDesdeAdmin = unaALaVez(anotarDesdeAdmin);
  cancelarDesdeAdmin = unaALaVez(cancelarDesdeAdmin);
  cancelarReserva = unaALaVez(cancelarReserva);
  guardarWellness = unaALaVez(guardarWellness);
  guardarTqr = unaALaVez(guardarTqr);
  guardarRpe = unaALaVez(guardarRpe);
  borrarRegistroPro = unaALaVez(borrarRegistroPro);
  cambiarMiPassword = unaALaVez(cambiarMiPassword);
  reservarTurno = unaALaVez(reservarTurno);
  onLogin = unaALaVez(onLogin);
  onPinSubmit = unaALaVez(onPinSubmit);

  async function init() {
    await refreshData();
    renderApp();
  }

  init();
})();
</script>
</body>
