    -webkit-font-smoothing: antialiased;
  }
  .stat, .num, h1, h2 {
    font-family: 'Oswald', 'Arial Narrow', sans-serif;
  }
  #root {
    max-width: 480px; margin: 0 auto; min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column; position: relative;
    /* iPhone: deja libre la zona del reloj/notch cuando la app está instalada */
    padding-top: env(safe-area-inset-top, 0px);
  }

  /* ---------- Login ---------- */
  .login-screen {
    flex: 1; display: flex; flex-direction: column; justify-content: center;
    padding: 32px 28px; gap: 28px;
  }
  .login-screen .brand-block { text-align: left; }
  .brand-logo { width: 320px; max-width: 88%; height: auto; display: block; }
  .tagline { color: var(--text-muted); margin: 18px 0 0; font-size: 14px; letter-spacing: 0.3px; }
  .login-form { display: flex; flex-direction: column; gap: 12px; }
  .login-form label { font-size: 13px; color: var(--text-muted); }
  input[type=text], input[type=password] {
    background: var(--surface); border: 1px solid var(--line); color: var(--text);
    padding: 14px 14px; border-radius: var(--radius); font-size: 17px; font-family: inherit;
    outline: none;
  }
  input[type=text]:focus, input[type=password]:focus { border-color: var(--green); }
  .btn {
    border: none; border-radius: var(--radius); padding: 14px 18px; font-size: 15px;
    font-weight: 600; font-family: 'Inter', sans-serif; cursor: pointer;
    transition: transform 0.08s ease, background 0.15s ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--green); color: #F3F6F1; }
  .btn-primary:hover { background: #4A82F0; }
  .btn-primary:disabled { background: var(--green-dim); color: #5C6E93; cursor: not-allowed; }
  .btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
  .error-text { color: var(--red); font-size: 13px; min-height: 16px; }
  .link-btn {
    background: none; border: none; color: var(--text-muted); font-size: 13px;
    text-decoration: underline; cursor: pointer; padding: 0; text-align: left; font-family: 'Inter', sans-serif;
  }

  /* ---------- Admin ---------- */
  .admin-field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .admin-field-grid label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--text-muted); }
  .admin-field-grid label.span2 { grid-column: 1 / -1; }
  .admin-field-grid input, .admin-field-grid select {
    background: var(--surface-2); border: 1px solid var(--line); color: var(--text);
    padding: 10px 10px; border-radius: var(--radius); font-size: 14px; font-family: inherit; outline: none;
    width: 100%; min-width: 0;
  }
  .admin-field-grid input:focus, .admin-field-grid select:focus { border-color: var(--green); }
  .admin-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .admin-row {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px 14px; display: flex; justify-content: space-between; align-items: center;
  }
  .admin-row-name { font-size: 14px; font-weight: 500; }
  .admin-row-dni { font-size: 12px; color: var(--text-muted); font-weight: 400; }
  .admin-row-meta { font-size: 12px; color: var(--text-muted); margin-top: 4px; display: flex; align-items: center; gap: 8px; }
  .admin-row-asist { font-size: 11px; color: var(--text-muted); margin-top: 4px; opacity: 0.8; }
  .admin-row-actions { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .estado-select {
    font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; border-radius: 20px;
    padding: 5px 10px 5px 12px; border: 1px solid transparent; cursor: pointer; outline: none;
    appearance: none; -webkit-appearance: none;
  }
  .estado-select.estado-activo { background: rgba(47,111,237,0.18); color: var(--green); }
  .estado-select.estado-pausado { background: rgba(242,169,59,0.18); color: var(--amber); }
  .estado-select.estado-baja { background: rgba(225,88,79,0.18); color: var(--red); }
  .estado-select option { background: var(--surface-2); color: var(--text); }

  /* ---------- Admin tabs ---------- */
  .admin-tabs { display: flex; gap: 6px; margin: 4px 0 20px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .admin-tab {
    flex: 0 0 auto; white-space: nowrap;
    background: none; border: none; color: var(--text-muted); font-size: 13px; font-weight: 500;
    padding: 10px 4px; cursor: pointer; font-family: 'Inter', sans-serif; position: relative; margin-right: 10px;
  }
  .admin-tab.active { color: var(--text); }
  .admin-tab.active::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--green);
  }

  /* ---------- Resumen ---------- */
  .resumen-atencion-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
  .resumen-atencion-item {
    display: flex; align-items: center; gap: 12px; width: 100%;
    background: var(--surface); border: none; border-left: 3px solid var(--line);
    border-radius: var(--radius); padding: 12px 14px; cursor: pointer; text-align: left;
    font-family: 'Inter', sans-serif;
  }
  .resumen-atencion-item.sev-urgente { border-left-color: var(--red); }
  .resumen-atencion-item.sev-atencion { border-left-color: var(--amber); }
  .resumen-atencion-num {
    font-family: 'Oswald', sans-serif; font-size: 22px; font-weight: 700; color: var(--text);
    min-width: 28px;
  }
  .sev-urgente .resumen-atencion-num { color: var(--red); }
  .sev-atencion .resumen-atencion-num { color: var(--amber); }
  .resumen-atencion-label { flex: 1; font-size: 13px; color: var(--text); line-height: 1.35; }
  .resumen-atencion-arrow { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
  .resumen-todobien {
    background: rgba(47,111,237,0.08); border: 1px solid var(--line); border-left: 3px solid var(--green);
    border-radius: var(--radius); padding: 14px; font-size: 13px; color: var(--text-muted); margin-bottom: 20px;
  }
  .resumen-hero {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 20px; text-align: center; margin-bottom: 14px;
  }
  .resumen-hero-label { font-size: 12px; color: var(--text-muted); }
  .resumen-hero-num { font-family: 'Oswald', sans-serif; font-size: 38px; font-weight: 700; margin: 6px 0; }
  .resumen-hero-sub { font-size: 12px; color: var(--text-muted); }
  .resumen-hoy-card {
    display: block; width: 100%; text-align: left; cursor: pointer;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px 18px; font-family: 'Inter', sans-serif;
  }
  .resumen-hoy-card:hover { border-color: var(--green); }
  .resumen-hoy-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .resumen-hoy-titulo { font-size: 13px; color: var(--text-muted); }
  .resumen-hoy-ver { font-size: 12px; color: var(--green); font-weight: 600; }
  .resumen-hoy-stats { display: flex; gap: 28px; }
  .resumen-hoy-stat { display: flex; flex-direction: column; }
  .resumen-hoy-num { font-family: 'Oswald', sans-serif; font-size: 32px; font-weight: 700; line-height: 1.1; }
  .resumen-hoy-txt { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  /* ---------- Cuotas ---------- */
  .cuota-list { display: flex; flex-direction: column; gap: 10px; }
  .cuota-aldiacolapso { margin-top: 20px; }
  .cuota-aldiacolapso summary {
    font-size: 14px; color: var(--text-muted); cursor: pointer; padding: 10px 0;
    list-style: none; display: flex; align-items: center; gap: 6px;
  }
  .cuota-aldiacolapso summary::-webkit-details-marker { display: none; }
  .cuota-aldiacolapso summary::before { content: '▸'; font-size: 11px; }
  .cuota-aldiacolapso[open] summary::before { content: '▾'; }
  .cuota-aldiacolapso .cuota-card { opacity: 0.7; }
  .cuota-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .cuota-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .cuota-nombre { font-size: 14px; font-weight: 600; }
  .pago-detalle { font-size: 12px; color: var(--text-muted); }
  .pago-registrar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .pago-registrar .duracion-select { flex: 1 1 100%; }
  .pago-monto { display: flex; justify-content: space-between; align-items: baseline; margin-top: 10px; font-size: 13px; color: var(--text-muted); }
  .pago-monto b { font-family: 'Oswald', 'Arial Narrow', sans-serif; font-size: 22px; font-weight: 600; color: var(--text); }
  input[type=text].pago-nota-input {
    width: 100%; margin-top: 8px; background: var(--surface-2); border: 1px solid var(--line); color: var(--text);
    padding: 9px 10px; border-radius: var(--radius); font-size: 13px; font-family: inherit; outline: none;
  }
  input[type=text].pago-nota-input:focus { border-color: var(--green); }
  .pago-preview { font-size: 12px; color: var(--text-muted); margin-top: 8px; }
  .pago-hist { margin: 8px 0 2px; }
  .pago-hist summary { font-size: 12px; color: var(--green); cursor: pointer; padding: 4px 0; list-style: none; }
  .pago-hist summary::-webkit-details-marker { display: none; }
  .pago-hist summary::before { content: '▸ '; font-size: 10px; }
  .pago-hist[open] summary::before { content: '▾ '; }
  .pago-fila {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
    padding: 9px 0; border-top: 1px solid var(--line); font-size: 13px;
  }
  .pago-fila .p1 { font-weight: 500; }
  .pago-fila .p2 { font-size: 12px; color: var(--text-muted); margin-top: 2px; line-height: 1.5; overflow-wrap: anywhere; }
  .pago-fila .monto { font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .pago-total { display: flex; justify-content: space-between; padding: 9px 0 2px; border-top: 1px solid var(--line); font-size: 12px; color: var(--text-muted); }
  .plan-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .plan-row:last-child { border-bottom: none; }
  .plan-row-dias { flex: 1; font-size: 13px; color: var(--text-muted); }
  .plan-precio-input {
    width: 110px; background: var(--surface-2); border: 1px solid var(--line); color: var(--text);
    padding: 8px 10px; border-radius: var(--radius); font-size: 13px; font-family: inherit; text-align: right;
  }
  .metodo-select, .duracion-select {
    flex: 1; min-width: 0; background: var(--surface-2); border: 1px solid var(--line); color: var(--text);
    padding: 9px 8px; border-radius: var(--radius); font-size: 13px; font-family: inherit;
  }

  /* ---------- Asistencias ---------- */
  .date-input {
    background: var(--surface); border: 1px solid var(--line); color: var(--text);
    padding: 10px 12px; border-radius: var(--radius); font-size: 14px; font-family: inherit;
    margin-bottom: 16px; width: 100%;
  }
  .asist-list { display: flex; flex-direction: column; gap: 8px; }
  .asist-group {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 4px 14px 8px; margin-bottom: 12px;
  }
  .asist-group-header {
    font-family: 'Oswald', sans-serif; font-size: 17px; font-weight: 600;
    padding: 10px 0 8px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 8px;
  }
  .asist-group-count { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 400; color: var(--text-muted); }
  .asist-row {
    padding: 10px 0; display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid var(--line);
  }
  .asist-group .asist-row:last-child { border-bottom: none; }
  .asist-nombre-solo { font-size: 14px; }
  .asist-actions { display: flex; gap: 6px; }
  .asist-btn {
    font-size: 11px; font-weight: 600; padding: 7px 10px; border-radius: var(--radius);
    border: 1px solid var(--line); background: transparent; color: var(--text-muted); cursor: pointer;
  }
  .asist-btn.asist-si.active { background: rgba(47,111,237,0.18); border-color: var(--green); color: var(--green); }
  .asist-btn.asist-no.active { background: rgba(225,88,79,0.18); border-color: var(--red); color: var(--red); }

  /* ---------- App shell ---------- */
  .app-header {
    padding: 18px 20px 14px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
  }
  .app-header .who { display: flex; flex-direction: column; }
  .app-header .who .name { font-size: 15px; font-weight: 600; }
  .app-header .who .plan { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .logout-btn {
    background: none; border: 1px solid var(--line); color: var(--text-muted); font-size: 11px;
    padding: 5px 10px; border-radius: 20px; cursor: pointer; font-family: 'Inter', sans-serif;
  }
  .logout-btn:hover { border-color: var(--red); color: var(--red); }
  .pill {
    font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 20px;
    letter-spacing: 0.2px; white-space: nowrap;
  }
  .pill-green { background: rgba(47,111,237,0.18); color: var(--green); }
  .pill-amber { background: rgba(242,169,59,0.18); color: var(--amber); }
  .pill-red   { background: rgba(225,88,79,0.18); color: var(--red); }

  .view { flex: 1; overflow-y: auto; padding: 20px 20px 90px; }
  .view h2 { font-size: 22px; margin: 0 0 4px; font-weight: 600; }
  .view .sub { color: var(--text-muted); font-size: 13px; margin: 0 0 20px; }

  /* ---------- Título de pantalla con ícono ---------- */
  .view-title { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
  .view-title .view-ico {
    flex: 0 0 auto; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); color: var(--green);
  }
  .view-title .view-ico svg { width: 24px; height: 24px; }
  .view-title h2 { margin: 0 0 2px; }
  .view-title .sub { margin: 0; }
  .ico { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; display: block; }

  /* ---------- Perfil ---------- */
  .banner {
    border-left: 3px solid var(--red); background: rgba(225,88,79,0.1);
    padding: 12px 14px; border-radius: var(--radius); font-size: 13px; margin-bottom: 18px;
    line-height: 1.5;
  }
  .banner b { display: block; margin-bottom: 2px; color: var(--red); font-size: 13px; }
  .profile-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 20px; margin-bottom: 16px;
  }
  .profile-card .plan-name { font-size: 24px; font-weight: 600; margin: 0; }
  .profile-card .price { font-size: 32px; font-weight: 700; margin: 6px 0 2px; }
  .profile-card .price small { font-size: 14px; font-weight: 400; color: var(--text-muted); margin-left: 4px; }
  .divider { height: 1px; background: var(--line); margin: 16px 0; }
  .kv-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 14px; }
  .kv-row .k { color: var(--text-muted); }
  .kv-row .v { font-weight: 500; text-align: right; max-width: 60%; }
  .estimulos-grid { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
  .estimulo-chip {
    background: var(--surface-2); border-radius: var(--radius); padding: 8px 12px;
    font-size: 12px; color: var(--text-muted); flex: 1; min-width: 90px; text-align: center;
  }
  .estimulo-chip .num { display: block; font-size: 20px; color: var(--text); font-weight: 600; }

  /* ---------- Turnos ---------- */
  .date-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 18px; }
  .date-chip {
    flex: 0 0 auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 10px 14px; text-align: center; cursor: pointer; min-width: 58px;
  }
  .date-chip .dow { display: block; font-size: 11px; color: var(--text-muted); text-transform: lowercase; }
  .date-chip .dnum { display: block; font-size: 18px; font-weight: 600; font-family: 'Oswald', sans-serif; margin-top: 2px; }
  .date-chip.active { background: var(--green); border-color: var(--green); }
  .date-chip.active .dow, .date-chip.active .dnum { color: #F3F6F1; }
  .date-chip.past { cursor: default; opacity: 0.35; }
  .date-chip.past .dow, .date-chip.past .dnum { color: var(--text-muted); }
  .asist-atajos { display: flex; gap: 8px; margin-bottom: 14px; }
  .asist-atajos .date-chip {
    font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; color: var(--text);
    border: 1px solid var(--line); padding: 9px 16px;
  }
  .asist-atajos .date-chip.active { color: #F3F6F1; }

  .slot-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 4px; border-bottom: 1px solid var(--line);
  }
  .slot-row .hora { font-size: 20px; font-weight: 600; font-family: 'Oswald', sans-serif; min-width: 64px; }
  .slot-row .avail { font-size: 12px; color: var(--text-muted); }
  .slot-row .avail.full { color: var(--red); }
  .slot-btn {
    font-size: 13px; font-weight: 600; padding: 9px 16px; border-radius: var(--radius);
    border: 1px solid var(--green); background: transparent; color: var(--green); cursor: pointer;
  }
  .slot-btn:disabled { border-color: var(--line); color: var(--text-muted); cursor: not-allowed; }
  .slot-btn.booked { background: var(--surface-2); border-color: var(--line); color: var(--text-muted); cursor: pointer; }
  .slot-btn.booked:hover { border-color: var(--red); color: var(--red); }

  /* ---------- Mis reservas ---------- */
  .res-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
  }
  .res-card .info .date-line { font-size: 15px; font-weight: 600; }
  .res-card .info .day-line { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .res-card .right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .cancel-link { font-size: 12px; color: var(--text-muted); background: none; border: none; cursor: pointer; text-decoration: underline; padding: 0; }
  .empty-state { text-align: center; color: var(--text-muted); font-size: 14px; padding: 60px 20px; line-height: 1.6; }
  .slots-nota { font-size: 12px; color: var(--text-muted); margin: -6px 0 6px; }

  /* Selector Próximos / Asistencias */
  .seg { display: flex; border: 1px solid var(--line); border-radius: var(--radius); padding: 3px; gap: 3px; margin-bottom: 18px; background: var(--surface); }
  .seg-btn {
    flex: 1; background: none; border: none; color: var(--text-muted); font-family: 'Inter', sans-serif;
    font-size: 13px; font-weight: 600; padding: 10px 6px; border-radius: 2px; cursor: pointer;
  }
  .seg-btn.active { background: var(--green); color: #F3F6F1; }
  .seg-btn .seg-count { font-weight: 500; opacity: 0.75; margin-left: 4px; }

  /* Asistencias del cliente */
  .asis-stats { display: flex; gap: 8px; margin-bottom: 12px; }
  .asis-stat {
    flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px 10px 11px; text-align: center;
  }
  .asis-stat .num { display: block; font-size: 30px; font-weight: 600; line-height: 1.1; }
  .asis-stat .lbl { display: block; font-size: 11px; color: var(--text-muted); margin-top: 4px; line-height: 1.3; }
  .asis-semana {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 13px 16px 14px; margin-bottom: 12px;
  }
  .asis-semana-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; }
  .asis-semana-top span:first-child { color: var(--text-muted); }
  .asis-semana-top span:last-child { font-weight: 600; }
  .asis-bar { height: 5px; background: var(--surface-2); border-radius: 3px; margin-top: 10px; overflow: hidden; }
  .asis-bar i { display: block; height: 100%; background: var(--green); border-radius: 3px; }

  .cal-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 12px 14px; margin-bottom: 12px; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-mes { font-family: 'Oswald', sans-serif; font-size: 17px; font-weight: 600; }
  .cal-nav {
    width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
    background: none; border: 1px solid var(--line); border-radius: var(--radius); color: var(--text); cursor: pointer;
  }
  .cal-nav svg { width: 18px; height: 18px; }
  .cal-nav:disabled { opacity: 0.3; cursor: default; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-dow { text-align: center; font-size: 11px; color: var(--text-muted); padding-bottom: 4px; }
  .cal-day {
    aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: var(--text-muted); border-radius: 50%; border: 1px solid transparent;
  }
  .cal-day.finde { opacity: 0.45; }
  .cal-day.hoy { color: var(--text); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

  .cal-day.reservado { border-color: var(--green); color: var(--green); opacity: 1; }
  .cal-leyenda { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; font-size: 11px; color: var(--text-muted); }
  .cal-leyenda span { display: inline-flex; align-items: center; gap: 6px; }
  .cal-leyenda i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; border: 1px solid transparent; }
  .cal-leyenda i.asistio { background: var(--green); }
  .cal-leyenda i.falto { border-color: var(--red); }
  .cal-leyenda i.reservado { border-color: var(--green); }

  .asis-lista-titulo { font-size: 13px; color: var(--text-muted); margin: 18px 0 8px; }
  .asis-fila {
    display: flex; justify-content: space-between; align-items: center;
    padding: 11px 2px; border-bottom: 1px solid var(--line); font-size: 14px;
  }
  .asis-fila .dia { font-weight: 500; }
  .asis-fila .hora { color: var(--text-muted); font-size: 12px; margin-top: 2px; }

  /* ---------- Mi día (clientes PRO) ---------- */
  .pro-seccion { font-size: 12px; color: var(--text-muted); margin: 20px 0 8px; }
  .pro-seccion:first-of-type { margin-top: 0; }
  .pro-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 10px; }
  .pro-card-head {
    width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: none; border: none; color: var(--text); padding: 15px 16px; cursor: pointer;
    text-align: left; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent;
  }
  .pro-card-head .t { font-size: 15px; font-weight: 600; }
  .pro-card-head .d { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
  .pro-card-body { padding: 0 16px 16px; border-top: 1px solid var(--line); }
  .pro-ayuda { font-size: 12px; color: var(--text-muted); line-height: 1.5; margin: 12px 0 0; }
  .well-item { padding: 14px 0 12px; border-bottom: 1px solid var(--line); }
  .well-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  .well-label { font-size: 14px; font-weight: 600; }
  .well-desc { font-size: 12px; color: var(--green); text-align: right; min-height: 15px; }
  .well-opts { display: flex; gap: 6px; }
  .well-opt {
    flex: 1; height: 44px; background: var(--surface-2); border: 1px solid var(--line); color: var(--text);
    font-family: 'Oswald', sans-serif; font-size: 17px; font-weight: 600; border-radius: var(--radius); cursor: pointer;
  }
  .well-opt.active { background: var(--green); border-color: var(--green); color: #F3F6F1; }
  .well-anchors { display: flex; justify-content: space-between; gap: 12px; font-size: 11px; color: var(--text-muted); margin-top: 6px; }
  .well-anchors span:last-child { text-align: right; }
  .escala { display: flex; flex-direction: column; gap: 4px; margin: 12px 0 14px; }
  .escala-fila {
    display: flex; align-items: center; gap: 14px; width: 100%; min-height: 42px; padding: 6px 12px;
    background: var(--surface-2); border: 1px solid transparent; border-radius: var(--radius);
    color: var(--text); cursor: pointer; text-align: left; font-family: 'Inter', sans-serif; font-size: 13px;
  }
  .escala-fila .n { font-family: 'Oswald', sans-serif; font-size: 18px; font-weight: 600; min-width: 24px; text-align: center; }
  .escala-fila .txt { color: var(--text-muted); }
  .escala-fila.active { background: var(--green); border-color: var(--green); }
  .escala-fila.active .txt { color: #F3F6F1; }
  /* Caritas del wellness y números de color de TQR / RPE. El color de cada
     opción llega en la variable --c como "r,g,b". */
  .pro-card-head .flecha { flex: 0 0 auto; color: var(--text-muted); display: flex; transition: transform 0.15s ease; }
  .pro-card-head .flecha svg { width: 18px; height: 18px; }
  .pro-card-head[aria-expanded="true"] .flecha { transform: rotate(90deg); }
  .pro-card-head .estado { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
  .pro-valor { display: inline-flex; align-items: center; gap: 7px; color: rgb(var(--c)); font-family: 'Oswald', 'Arial Narrow', sans-serif; font-size: 22px; font-weight: 600; line-height: 1; }
  .pro-valor small { font-size: 13px; font-weight: 500; opacity: 0.75; }
  .pro-valor svg { width: 24px; height: 24px; }
  .cara { stroke-width: 1.7; }
  .caras { display: flex; gap: 6px; }
  .cara-btn {
    flex: 1; height: 54px; display: flex; align-items: center; justify-content: center; cursor: pointer;
    background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius);
    color: rgb(var(--c)); opacity: 0.7; -webkit-tap-highlight-color: transparent;
    transition: opacity 0.12s ease, background 0.12s ease, transform 0.12s ease;
  }
  .cara-btn svg { width: 30px; height: 30px; }
  .caras.elegida .cara-btn { opacity: 0.3; }
  .caras .cara-btn.active { opacity: 1; background: rgba(var(--c), 0.2); border-color: rgb(var(--c)); transform: scale(1.06); }
  .well-desc { color: var(--text-muted); }
  .well-desc.elegida { color: rgb(var(--c)); font-weight: 600; }
  .well-total { display: flex; align-items: center; gap: 14px; padding: 16px 0 6px; }
  .well-total .cara-total { flex: 0 0 auto; color: var(--text-muted); }
  .well-total .cara-total svg { width: 38px; height: 38px; }
  .well-total.listo .cara-total { color: rgb(var(--c)); }
  .well-total .datos { flex: 1; }
  .well-total .fila { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--text-muted); }
  .well-total .fila b { font-family: 'Oswald', 'Arial Narrow', sans-serif; font-size: 22px; font-weight: 600; color: var(--text); }
  .well-total .barra { height: 6px; background: var(--surface-2); border-radius: 3px; margin-top: 8px; overflow: hidden; }
  .well-total .barra i { display: block; height: 100%; width: 0; background: var(--text-muted); border-radius: 3px; transition: width 0.2s ease; }
  .well-total.listo .barra i { background: rgb(var(--c)); }
  .eleccion { display: flex; align-items: center; gap: 14px; margin: 14px 0 12px; min-height: 52px; color: var(--text-muted); }
  .eleccion .cara-total { flex: 0 0 auto; }
  .eleccion .cara-total svg { width: 44px; height: 44px; }
  .eleccion .num { font-family: 'Oswald', 'Arial Narrow', sans-serif; font-size: 40px; font-weight: 600; line-height: 1; min-width: 44px; }
  .eleccion .txt { font-size: 14px; line-height: 1.35; }
  .eleccion.listo { color: rgb(var(--c)); }
  .eleccion.listo .txt { color: var(--text); }
  .tiles { display: grid; gap: 6px; margin-bottom: 8px; }
  .tiles-5 { grid-template-columns: repeat(5, 1fr); }
  .tiles-6 { grid-template-columns: repeat(6, 1fr); }
  @media (max-width: 350px) { .tiles-6 { grid-template-columns: repeat(4, 1fr); } }
  .tile {
    height: 50px; border-radius: var(--radius); cursor: pointer; padding: 0;
    border: 1px solid rgba(var(--c), 0.5); background: rgba(var(--c), 0.13); color: rgb(var(--c));
    font-family: 'Oswald', 'Arial Narrow', sans-serif; font-size: 21px; font-weight: 600;
    -webkit-tap-highlight-color: transparent; transition: background 0.12s ease, transform 0.12s ease;
  }
  .tile.active { background: rgb(var(--c)); color: #10161A; border-color: rgb(var(--c)); transform: scale(1.08); box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px rgb(var(--c)); }
  .tile:focus-visible, .cara-btn:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .pro-tabla td .color, .asis-stat .num.color { color: rgb(var(--c)); }
  @media (prefers-reduced-motion: reduce) { .cara-btn, .tile, .pro-card-head .flecha, .well-total .barra i { transition: none; } }
  .pro-campos { display: grid; grid-template-columns: 104px 1fr; gap: 10px; margin-bottom: 14px; }
  .pro-campos label { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--text-muted); min-width: 0; }
  .pro-campos input {
    background: var(--surface-2); border: 1px solid var(--line); color: var(--text); width: 100%; min-width: 0;
    padding: 11px 10px; border-radius: var(--radius); font-size: 16px; font-family: inherit; outline: none;
  }
  .pro-campos input:focus { border-color: var(--green); }
  .pro-sesion {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 13px;
  }
  .pro-sesion .s1 { font-weight: 600; }
  .pro-sesion .s2 { color: var(--text-muted); font-size: 12px; margin-top: 2px; overflow-wrap: anywhere; }
  .pro-tabla { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  .pro-tabla th { font-size: 11px; font-weight: 500; color: var(--text-muted); text-align: right; padding: 0 4px 8px; }
  .pro-tabla td { text-align: right; padding: 9px 4px; border-top: 1px solid var(--line); }
  .pro-tabla th:first-child, .pro-tabla td:first-child { text-align: left; color: var(--text-muted); }
  .pro-tabla td.vacio { color: var(--text-muted); opacity: 0.45; }
  .pro-admin-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px; }
  .pro-admin-nombre { font-size: 15px; font-weight: 600; margin-bottom: 10px; }
  .pro-admin-linea { font-size: 12px; color: var(--text-muted); line-height: 1.6; overflow-wrap: anywhere; }
  .pro-admin-linea b { color: var(--text); font-weight: 600; }

  /* ---------- Rutina ---------- */
  .rutina-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
    text-decoration: none; color: inherit;
  }
  .rutina-card:hover { border-color: var(--green); }
  .rutina-card-titulo { font-size: 15px; font-weight: 600; color: var(--text); }
  .rutina-card-fecha { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
  .rutina-card-arrow { font-size: 12px; font-weight: 600; color: var(--green); white-space: nowrap; }

  /* ---------- Admin: Rutinas por cliente ---------- */
  .rutinas-panel {
    background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px 14px; margin-top: 10px;
  }
  .rutina-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px;
  }
  .rutina-row:last-of-type { border-bottom: none; }
  .rutina-row a { color: var(--green); text-decoration: none; }
  .rutina-add-form { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .rutina-add-form input {
    background: var(--surface); border: 1px solid var(--line); color: var(--text);
    padding: 9px 10px; border-radius: var(--radius); font-size: 13px; font-family: inherit;
  }

  /* ---------- Cambiar contraseña ---------- */
  .cambiar-pass-form { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
  .cambiar-pass-form label { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--text-muted); }
  .cambiar-pass-form input {
    background: var(--surface); border: 1px solid var(--line); color: var(--text);
    padding: 10px 10px; border-radius: var(--radius); font-size: 14px; font-family: inherit;
  }

  /* ---------- WhatsApp ---------- */
  .btn-whatsapp {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: #25D366; color: #06301A; text-decoration: none;
    font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px;
    padding: 13px 16px; border-radius: var(--radius); margin-bottom: 16px;
  }
  .btn-whatsapp:hover { background: #2FE070; }
  .btn-whatsapp-icon { display: flex; }

  /* ---------- Nav ---------- */
  .bottom-nav {
    position: sticky; bottom: 0; z-index: 5; display: flex; border-top: 1px solid var(--line);
    background: var(--bg);
    /* iPhone: el espacio de abajo queda reservado para la barra de inicio,
       así los botones no se pisan con el gesto de minimizar la app. */
    padding: 0 4px calc(4px + env(safe-area-inset-bottom, 0px));
  }
  .nav-btn {
    flex: 1; position: relative; background: none; border: none; color: var(--text-muted);
    min-height: 60px; padding: 10px 0 8px;
    font-size: 11px; font-family: 'Inter', sans-serif; cursor: pointer; display: flex;
    flex-direction: column; align-items: center; justify-content: center; gap: 5px; letter-spacing: 0.2px;
    -webkit-tap-highlight-color: transparent;
  }
  .nav-btn svg { width: 23px; height: 23px; }
  .nav-btn.active { color: var(--text); }
  .nav-btn.active svg { color: var(--green); }
  .nav-btn.active::before {
    content: ''; position: absolute; top: -1px; left: 26%; right: 26%; height: 2px; background: var(--green);
  }

  .toast {
    position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(10px);
    background: var(--surface-2); border: 1px solid var(--green); color: var(--text);
    padding: 10px 18px; border-radius: var(--radius); font-size: 13px; opacity: 0;
    transition: opacity 0.2s ease, transform 0.2s ease; pointer-events: none; white-space: nowrap;
    max-width: 90%; text-overflow: ellipsis; overflow: hidden;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- Turnos: semana y horarios en grilla ---------- */
  .sem { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 14px; }
  .sem-dia {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 9px 0 8px; text-align: center; cursor: pointer; color: var(--text);
    font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent;
  }
  .sem-dia .dow { display: block; font-size: 11px; color: var(--text-muted); }
  .sem-dia .dnum { display: block; font-family: 'Oswald', 'Arial Narrow', sans-serif; font-size: 21px; font-weight: 600; line-height: 1.2; margin-top: 1px; }
  .sem-dia .marca { display: block; width: 6px; height: 6px; border-radius: 50%; margin: 5px auto 0; }
  .sem-dia.conturno .marca { background: var(--green); }
  .sem-dia .cuenta { display: block; font-size: 11px; color: var(--text-muted); margin-top: 3px; min-height: 14px; }
  .sem-dia.hoy { border-color: var(--text-muted); }
  .sem-dia.active { background: var(--green); border-color: var(--green); }
  .sem-dia.active .dow, .sem-dia.active .cuenta { color: #DCE7FF; }
  .sem-dia.active.conturno .marca { background: #F3F6F1; }
  .sem-dia.past { opacity: 0.35; cursor: default; }
  .turnos-dia { font-family: 'Oswald', 'Arial Narrow', sans-serif; font-size: 19px; font-weight: 600; margin: 0 0 3px; }
  .turnos-estado { font-size: 13px; color: var(--text-muted); margin: 0 0 4px; line-height: 1.45; }
  .turnos-estado.aviso { color: var(--amber); }
  .slots-grupo { font-size: 13px; color: var(--text-muted); margin: 18px 0 8px; }
  .slots-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .slot {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px 4px 9px; min-height: 66px; text-align: center; color: var(--text); cursor: pointer;
    font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent;
    transition: border-color 0.12s ease, background 0.12s ease;
  }
  .slot .h { display: block; font-family: 'Oswald', 'Arial Narrow', sans-serif; font-size: 23px; font-weight: 600; line-height: 1.1; }
  .slot .s { display: block; font-size: 11px; color: var(--text-muted); margin-top: 4px; min-height: 14px; }
  .slot.pocos { border-color: rgba(242,169,59,0.5); }
  .slot.pocos .s { color: var(--amber); }
  .slot.lleno { opacity: 0.4; cursor: default; }
  .slot.nodisp { opacity: 0.5; cursor: default; }
  .slot.mio { background: var(--green); border-color: var(--green); }
  .slot.mio .s { color: #DCE7FF; }
  .slot.elegido { border-color: var(--green); box-shadow: inset 0 0 0 2px var(--green); }
  .slot.mio.elegido { box-shadow: inset 0 0 0 2px #F3F6F1; }
  .slot:focus-visible, .sem-dia:focus-visible, .persona:focus-visible, .sg-celda:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .slots-leyenda { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 18px; font-size: 11px; color: var(--text-muted); }
  .slots-leyenda span { display: inline-flex; align-items: center; gap: 6px; }
  .slots-leyenda i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; border: 1px solid var(--line); background: var(--surface); }
  .slots-leyenda i.mio { background: var(--green); border-color: var(--green); }
  .slots-leyenda i.pocos { border-color: var(--amber); }
  .slots-leyenda i.lleno { opacity: 0.4; }
  /* Barra para confirmar el horario elegido: queda pegada arriba del menú */
  .turno-barra {
    position: sticky; bottom: calc(66px + env(safe-area-inset-bottom, 0px)); z-index: 4;
    margin: 0 12px 8px; padding: 12px 12px 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--surface-2); border: 1px solid var(--green); border-radius: var(--radius);
    box-shadow: 0 10px 28px rgba(0,0,0,0.5);
  }
  .turno-barra .tb1 { font-size: 15px; font-weight: 600; }
  .turno-barra .tb2 { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .turno-barra .btn { padding: 12px 16px; font-size: 14px; white-space: nowrap; }

  /* ---------- Mis reservas: próximo turno ---------- */
  .prox {
    background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--green);
    border-radius: var(--radius); padding: 16px 18px; margin-bottom: 10px;
    display: flex; justify-content: space-between; align-items: flex-end; gap: 12px;
  }
  .prox .et { font-size: 12px; color: var(--text-muted); }
  .prox .hora { font-family: 'Oswald', 'Arial Narrow', sans-serif; font-size: 40px; font-weight: 600; line-height: 1.05; margin-top: 6px; }
  .prox .dia { font-size: 14px; margin-top: 4px; }
  .prox-vacio { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 18px; margin-bottom: 10px; }
  .prox-vacio p { margin: 0 0 14px; font-size: 14px; color: var(--text-muted); line-height: 1.5; }
  .reservas-seccion { font-family: 'Oswald', 'Arial Narrow', sans-serif; font-size: 17px; font-weight: 600; margin: 24px 0 10px; }

  /* ---------- Admin: Turnos (semana y día) ---------- */
  .tab-badge {
    display: inline-block; min-width: 18px; padding: 1px 5px; margin-left: 6px; border-radius: 10px;
    background: var(--green); color: #F3F6F1; font-size: 11px; font-weight: 600; text-align: center;
  }
  .turnos-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .turnos-nav .titulo { font-size: 14px; font-weight: 600; text-align: center; flex: 1; }
  .nov-fila {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; width: 100%; text-align: left;

  .nov-fila .n2 { display: block; font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  }
  .sg-celda.lleno { border-color: var(--green); }
  .sg-celda.pasado { opacity: 0.5; }
  .th { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 14px 12px; margin-bottom: 8px; }
  .th.vacio { background: transparent; padding: 5px 14px; }
  .th-top { display: flex; align-items: center; gap: 12px; }
  .th-hora { font-family: 'Oswald', 'Arial Narrow', sans-serif; font-size: 19px; font-weight: 600; min-width: 50px; }
  .th.vacio .th-hora { font-size: 15px; color: var(--text-muted); }

  const DURACIONES = [
    // "15 días" ya no se ofrece (lo reemplazan las semanas hasta fin de mes), pero
    // queda definido para que los pagos viejos de ese tipo se sigan mostrando bien.
    { id: '15d', label: '15 días', tipo: 'dias',  valor: 15, factor: 0.5, oculta: true },
    { id: '1m',  label: '1 mes',   tipo: 'meses', valor: 1,  factor: 1 },
    { id: '3m',  label: '3 meses', tipo: 'meses', valor: 3,  factor: 3 },
    { id: '6m',  label: '6 meses', tipo: 'meses', valor: 6,  factor: 6 },
  ];

  // ---- Pagos "hasta fin de mes": sirven para que todos queden venciendo el día 1 ----
  // Cubren desde la fecha base hasta el día 1 del mes siguiente. Se cobran por
  // semanas: cada semana vale un cuarto de la cuota, redondeado a REDONDEO_SEMANAS.
  // Para cambiar el redondeo o el valor de una semana alcanza con tocar acá.
  const REDONDEO_SEMANAS = 500;
  const DURACIONES_FIN_DE_MES = [
    { id: 'fm-mes', label: 'Mes en curso (cuota completa)', corto: 'Mes en curso', tipo: 'finmes', semanas: 4, factor: 1 },
    { id: 'fm-3s',  label: '3 semanas hasta fin de mes',    corto: '3 semanas',    tipo: 'finmes', semanas: 3, factor: 0.75 },
    { id: 'fm-2s',  label: '2 semanas hasta fin de mes',    corto: '2 semanas',    tipo: 'finmes', semanas: 2, factor: 0.5 },
    { id: 'fm-1s',  label: '1 semana hasta fin de mes',     corto: '1 semana',     tipo: 'finmes', semanas: 1, factor: 0.25 },
  ];

  function duracionPorId(id) {
    return DURACIONES.find(d => d.id === id) || DURACIONES_FIN_DE_MES.find(d => d.id === id) || null;
  }

  // Cuánto se cobra por una duración, según la cuota mensual del cliente
  function montoDe(precio, dur) {
    const bruto = (precio || 0) * dur.factor;
    if (dur.tipo === 'finmes' && dur.factor < 1) return Math.round(bruto / REDONDEO_SEMANAS) * REDONDEO_SEMANAS;
    return Math.round(bruto);
  }

  function primerDiaMesSiguiente(fecha) {
    return new Date(fecha.getFullYear(), fecha.getMonth() + 1, 1);
  }

  function diasHastaFinDeMes(base) {
    return Math.round((primerDiaMesSiguiente(base) - base) / 86400000);
  }

  // Qué pago "hasta fin de mes" corresponde si el período arranca en 'base':
  //  - si arranca un día 1 ya está ordenado: null (va el pago común de 1 mes)
  //  - dentro del plazo de pago (del 1 al 10): la cuota completa
  //  - después: 3, 2 o 1 semanas según lo que falte para fin de mes
  function sugerenciaFinDeMes(base) {
    if (base.getDate() === 1) return null;
    if (base.getDate() <= diasParaPagar()) return 'fm-mes';
    const semanas = Math.min(3, Math.max(1, Math.round(diasHastaFinDeMes(base) / 7)));
    return 'fm-' + semanas + 's';
  }

  // Opciones del desplegable de duración. 'precio' null = no mostrar montos.
  function opcionesDuracionHtml(base, precio) {
    const sugerida = sugerenciaFinDeMes(base);
    const conPrecio = precio !== null && precio !== undefined;
    const opcion = (d, elegida, extra) =>
      `<option value="${d.id}" ${elegida ? 'selected' : ''}>${d.label}${conPrecio ? ' — ' + money(montoDe(precio, d)) : ''}${extra || ''}</option>`;
    const comunes = DURACIONES.filter(d => !d.oculta).map(d => opcion(d, !sugerida && d.id === '1m')).join('');
    if (!sugerida) return comunes;
    const dias = diasHastaFinDeMes(base);
    // Solo las semanas que tienen sentido para lo que falta del mes
    const finDeMes = DURACIONES_FIN_DE_MES
      .filter(d => d.id === sugerida || (d.id === 'fm-mes' ? dias > 21 : (d.semanas - 1) * 7 < dias))
      .map(d => opcion(d, d.id === sugerida, d.id === sugerida ? ' · sugerido' : '')).join('');
    return `<optgroup label="Para quedar venciendo el día 1">${finDeMes}</optgroup><optgroup label="Otros períodos">${comunes}</optgroup>`;
  }

  // Texto que explica qué cubre un pago antes de registrarlo
  function textoPeriodoPago(base, venc, dur) {
    if (dur && dur.tipo === 'finmes') {
      const dias = Math.round((venc - base) / 86400000);
      return 'Cubre del ' + formatFechaCorta(isoDate(base)) + ' a fin de mes (' + dias + (dias === 1 ? ' día' : ' días') + '). '
        + 'La cuota siguiente vence el ' + formatFechaCorta(isoDate(venc)) + ' y se paga hasta el ' + formatFechaCorta(limitePago(isoDate(venc))) + '.';
    }
    return 'Este pago cubre del ' + formatFechaCorta(isoDate(base)) + ' al ' + formatFechaCorta(isoDate(venc)) + '.';
  }

  // Calcula la fecha de vencimiento según el tipo de duración (días corridos,
  // meses de calendario reales o hasta fin de mes) a partir de una fecha base.
  function calcularVencimiento(fechaBase, dur) {
    if (dur.tipo === 'finmes') return primerDiaMesSiguiente(new Date(fechaBase));
    if (dur.tipo === 'meses') return agregarMeses(fechaBase, dur.valor);
    const v = new Date(fechaBase);
    v.setDate(v.getDate() + dur.valor);
    return v;
  }

  function seedPlanesIniciales() {
    const tabla = {
      'START':          { 1: 55000, 2: 70000, 3: 80000,  4: 90000,  5: 100000 },
      'PERFORMANCE 2':  {           2: 85000, 3: 95000,  4: 105000, 5: 115000 },
      'PERFORMANCE 3':  {           2: 95000, 3: 105000, 4: 115000, 5: 120000 },
      'PRO':            { null: 125000 },
    };
    const filas = [];
    Object.entries(tabla).forEach(([plan, porDias]) => {
      Object.entries(porDias).forEach(([diasStr, precio]) => {
        const dias = diasStr === 'null' ? null : parseInt(diasStr, 10);
        filas.push({ id: plan + '-' + (dias ?? 'null'), plan, dias, precio });
      });
    });
    return filas;
  }

  function seedConfigInicial() {
    return [{ clave: 'matricula_precio', valor: 30000 }];
  }

  function precioDe(plan, dias) {
    if (!state.data || !state.data.planes) return null;
    const exacto = state.data.planes.find(p => p.plan === plan && p.dias === dias);
    if (exacto) return exacto.precio;
    const integral = state.data.planes.find(p => p.plan === plan && p.dias === null);
    return integral ? integral.precio : null;
  }

  function matriculaPrecio() {
    if (!state.data || !state.data.config) return 30000;
    const fila = state.data.config.find(c => c.clave === 'matricula_precio');
    return fila ? fila.valor : 30000;
  }

  // La matrícula (alta de membresía) se puede apagar desde Planes. Apagada no
  // aparece en ningún lado de la app. Se guarda en "config" como
  // 'matricula_activa' = 1; si la fila no existe, se toma como apagada.
  function matriculaActiva() {
    const fila = state.data && state.data.config ? state.data.config.find(c => c.clave === 'matricula_activa') : null;
    return !!fila && Number(fila.valor) === 1;
  }

  async function guardarMatriculaActiva(activar) {
    const valor = activar ? 1 : 0;
    const existe = state.data.config.some(c => c.clave === 'matricula_activa');
    const { error } = existe
      ? await sb.from('config').update({ valor }).eq('clave', 'matricula_activa')
      : await sb.from('config').insert({ clave: 'matricula_activa', valor });
    if (error) { showToast('No se pudo guardar.'); console.error(error); return; }
    await refreshData();
    showToast(activar ? 'La matrícula se vuelve a cobrar' : 'La matrícula dejó de cobrarse');
    renderApp();
  }

  // ---------------- Cuota especial ----------------
  // Un cliente puede pagar una cuota distinta a la de su plan (una excepción).
  // Se carga en Clientes > ficha > Editar y se guarda en "config" como
  // 'cuota_<dni>' con el monto mensual. Mientras exista, esa es su cuota aunque
  // se edite al cliente o cambien los precios de los planes.
  const CLAVE_CUOTA = 'cuota_';
  function cuotaEspecialDe(dni) {
    const fila = state.data && state.data.config ? state.data.config.find(c => c.clave === CLAVE_CUOTA + dni) : null;
    const v = fila ? Number(fila.valor) : 0;
    return v > 0 ? v : null;
  }

  // Guarda (monto) o quita (null) la cuota especial de un cliente. Devuelve false si falló.
  async function guardarCuotaEspecial(dni, monto) {
    if ((monto || null) === cuotaEspecialDe(dni)) return true;
    const clave = CLAVE_CUOTA + dni;
    const existe = state.data.config.some(c => c.clave === clave);
    let res;
    if (monto) {
      res = existe
        ? await sb.from('config').update({ valor: monto }).eq('clave', clave)
        : await sb.from('config').insert({ clave, valor: monto });
    } else {
      res = await sb.from('config').update({ valor: 0 }).eq('clave', clave);
      if (!res.error) await sb.from('config').delete().eq('clave', clave);
    }
    if (res.error) { console.error('No se pudo guardar la cuota especial:', res.error); return false; }
    return true;
  }

  // ---------------- Usuario de prueba ----------------
  // Un cliente marcado como "de prueba" sirve para mostrar la app: entra como
  // cualquier cliente, pero nunca figura con deuda y no cuenta en los números
  // del administrador (cuotas, facturación, asistencias, control PRO) ni ocupa
  // cupo en los turnos. La marca se guarda en la tabla "config" como una fila
  // 'prueba_<dni>' con valor 1, y se cambia desde Clientes > Editar.
  const CLAVE_PRUEBA = 'prueba_';
  function esPrueba(dni) {
    const cfg = state.data && state.data.config;
    return !!cfg && cfg.some(c => c.clave === CLAVE_PRUEBA + dni && Number(c.valor) === 1);
  }
  function clientesReales(data) { return data.clientes.filter(c => !esPrueba(c.dni)); }
  function reservasReales(data) { return data.reservas.filter(r => !esPrueba(r.dni)); }
  function pagosReales(data) { return data.pagos.filter(p => !esPrueba(p.dni)); }

  // Lugares ocupados de un turno. Las reservas de un usuario de prueba no
  // cuentan, salvo para él mismo (así ve su propio turno descontado).
  function ocupadosEnTurno(data, fecha, hora, dniQueMira) {
    return data.reservas.filter(r =>
      r.fecha === fecha && r.hora === hora && r.estado !== 'cancelado' &&
      (!esPrueba(r.dni) || r.dni === dniQueMira)).length;
  }

  // Marca o desmarca a un cliente como usuario de prueba. Devuelve false si falló.
  async function guardarMarcaPrueba(dni, marcar) {
    if (marcar === esPrueba(dni)) return true;
    const clave = CLAVE_PRUEBA + dni;
    const existe = state.data.config.some(c => c.clave === clave);
    let res;
    if (marcar) {
      res = existe
        ? await sb.from('config').update({ valor: 1 }).eq('clave', clave)
        : await sb.from('config').insert({ clave, valor: 1 });
    } else {
      // Primero se apaga (valor 0) y después se intenta borrar la fila: si la
      // base no deja borrar, igual queda desmarcado.
      res = await sb.from('config').update({ valor: 0 }).eq('clave', clave);
      if (!res.error) await sb.from('config').delete().eq('clave', clave);
    }
    if (res.error) { console.error('No se pudo guardar la marca de usuario de prueba:', res.error); return false; }
    return true;
  }

  let state = {
    data: null,
    cliente: null,
    view: 'perfil',
    selectedDate: null,
    mode: 'login', // login | adminPin | admin
    loginError: '',
    pinError: '',
    adminFormError: '',
    adminFormNotice: '',
    adminTab: 'resumen', // resumen | clientes | cuotas | asistencias
    editingDni: null,      // dni del cliente en edición (pestaña Editar de la ficha), null = alta nueva
    fichaDni: null,        // cliente cuya ficha está abierta en administración
    fichaTab: 'resumen',   // resumen | pagos | asistencias | rutinas | editar
    fichaMes: null,        // 'YYYY-MM' del calendario de asistencias de la ficha
    fichaOrigen: 'clientes', // pestaña desde la que se abrió la ficha (para volver ahí)
    listaScrollY: 0,       // dónde estaba la lista al abrir la ficha
    nuevoClienteAbierto: false,
    confirmarRutinaId: null,
    asistenciasFecha: null,
    clienteBusqueda: '',
    confirmarEliminarDni: null, // cliente al que se le está preguntando "¿eliminar?"
    slotElegido: null,       // horario tocado en Turnos, a la espera de confirmar
    turnosVista: 'dia',      // administración, pestaña Turnos: dia | semana
    anotarEn: null,          // hora en la que está abierto el buscador "+ Anotar"
    reservaAbierta: null,    // id de la reserva cuyo nombre se tocó en la vista de día
    misAcciones: {},         // reservas y cancelaciones hechas desde esta pantalla (no se avisan como novedad)
    novedadesAvisadas: {},   // novedades por las que ya se mostró el cartel
    novedadesListas: false,
    novedadesDesde: 0,
    asistMes: null,          // 'YYYY-MM' que se está mirando en el calendario de asistencias
    proAbierto: undefined,   // tarjeta abierta en "Mi día": 'wellness' | 'tqr' | 'rpe' | null (undefined = elegir sola la pendiente)
    proDraft: {},            // lo que el cliente va eligiendo antes de guardar
    proFecha: null,          // fecha que mira el administrador en la pestaña Pro
  };

  function isoDate(d) {
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  // Suma N meses de calendario a una fecha, respetando "mismo día del mes
  // siguiente". Si el mes destino no tiene ese día (ej: 31 de enero + 1 mes),
  // lo ajusta al último día real de ese mes (28/29 de febrero) en vez de
  // desbordar al mes de después.
  function agregarMeses(fechaBase, n) {
    const d = new Date(fechaBase);
    const diaOriginal = d.getDate();
    const mesDestino = d.getMonth() + n;
    const resultado = new Date(d.getFullYear(), mesDestino, diaOriginal);
    const mesEsperado = ((mesDestino % 12) + 12) % 12;
    if (resultado.getMonth() !== mesEsperado) {
      resultado.setDate(0); // retrocede al último día del mes destino correcto
    }
    return resultado;
  }

  // Momento exacto en que empieza un turno (hora local del dispositivo)
  function turnoInicio(fechaIso, hora) {
    return new Date(fechaIso + 'T' + String(hora).slice(0, 5) + ':00');
  }

  // true si el turno ya empezó (más la tolerancia): desde ahí no se puede
  // reservar ni cancelar, y pasa a contar como asistencia.
  function turnoYaEmpezo(fechaIso, hora) {
    return Date.now() >= turnoInicio(fechaIso, hora).getTime() + MINUTOS_GRACIA_TURNO * 60000;
  }

  // Estado "real" de una reserva para mostrar y contar:
  //  - reservado + el turno todavía no empezó  -> 'reservado'
  //  - reservado + el turno ya empezó          -> 'asistio' (asistencia automática)
  //  - asistio / no_asistio / cancelado        -> lo que marcó el administrador o el cliente
  // No se escribe nada extra en la base: la reserva guardada ES el registro de asistencia.
  function estadoEfectivo(r) {
    if (r.estado === 'reservado' && turnoYaEmpezo(r.fecha, r.hora)) return 'asistio';
    return r.estado;
  }

  // Primer día de la semana reservable que todavía tiene algún horario por delante
  function primerDiaConTurnos() {
    const dias = bookableWeekdays();
    const conTurnos = dias.find(d => HORARIOS.some(h => !turnoYaEmpezo(isoDate(d), h)));
    return isoDate(conTurnos || dias[0]);
  }

  // Lunes de la semana a la que pertenece una fecha (ISO string)
  function mondayOf(fechaIso) {
    const d = new Date(fechaIso + 'T00:00:00');
    const dow = d.getDay(); // 0 domingo .. 6 sábado
    const diff = dow === 0 ? -6 : 1 - dow;
    d.setDate(d.getDate() + diff);
    return d;
  }

  // Días hábiles reservables: de hoy a viernes de esta semana.
  // Si hoy es sábado o domingo, muestra la semana próxima completa (lunes a viernes).
  function bookableWeekdays() {
    return fullBookableWeek().filter(d => d >= todayMidnight());
  }

  function todayMidnight() {
    const t = new Date();
    t.setHours(0, 0, 0, 0);
    return t;
  }

  // Los 5 días (lunes a viernes) de la semana reservable, incluyendo los que ya pasaron
  function fullBookableWeek() {
    const today = todayMidnight();
    const dow = today.getDay();
    let monday = new Date(today);
    if (dow === 0) monday.setDate(today.getDate() + 1);
    else if (dow === 6) monday.setDate(today.getDate() + 2);
    else monday.setDate(today.getDate() - (dow - 1));

    const out = [];
    for (let i = 0; i < 5; i++) {
      const d = new Date(monday);
      d.setDate(monday.getDate() + i);
      out.push(d);
    }
    return out;
  }

  // Total de reservas activas de un cliente dentro de la semana (lun-vie) de 'fechaIso'
  function reservasEnSemana(data, dni, fechaIso) {
    const monday = mondayOf(fechaIso);
    const friday = new Date(monday);
    friday.setDate(monday.getDate() + 4);
    const mondayIso = isoDate(monday);
    const fridayIso = isoDate(friday);
    return data.reservas.filter(r =>
      r.dni === dni && r.estado !== 'cancelado' && r.fecha >= mondayIso && r.fecha <= fridayIso);
  }

  // Cuántos turnos por semana tiene derecho a reservar este cliente
  function limiteSemanalDe(cliente) {
    if (cliente.limiteSemanalOverride != null) return cliente.limiteSemanalOverride;
    if (!cliente.estimulos) return Infinity; // PRO u otros planes integrales
    return cliente.estimulos.fuerza + cliente.estimulos.resistencia + cliente.estimulos.velocidad;
  }

  // ---------------- Capa de datos (Supabase) ----------------

  // Los ids de reserva son 'r' + milisegundos + letras: de ahí sale cuándo se creó
  function momentoDeId(id) {
    const m = /^r(\d{13})/.exec(String(id || ''));
    return m ? parseInt(m[1], 10) : null;
  }

  // Cancela una reserva dejando anotado cuándo (si la base ya tiene esa columna)
  async function marcarCancelada(id) {
    if (state.data && state.data.novedadesCompletas !== false) {
      const r = await sb.from('reservas').update({ estado: 'cancelado', cancelado_en: new Date().toISOString() }).eq('id', id);
      if (!r.error) return r;
    }
    return sb.from('reservas').update({ estado: 'cancelado' }).eq('id', id);
  }

  function clienteDbToJs(row, rutinasPorDni) {
    return {
      dni: row.dni, password: row.password, nombre: row.nombre, email: row.email, telefono: row.telefono,
      plan: row.plan, precio: row.precio, dias: row.dias,
      estimulos: row.estimulo_fuerza === null ? null : {
        fuerza: row.estimulo_fuerza, resistencia: row.estimulo_resistencia, velocidad: row.estimulo_velocidad,
      },
      estado: row.estado,
      limiteSemanalOverride: row.limite_semanal_override,
      matricula: { pagada: row.matricula_pagada, fechaPago: row.matricula_fecha_pago },
      pausadoDesde: row.pausado_desde,
      rutinas: (rutinasPorDni && rutinasPorDni[row.dni]) || [],
    };
  }

  function clienteJsToDb(c) {
    return {
      dni: c.dni, password: c.password, nombre: c.nombre, email: c.email || null, telefono: c.telefono || null,
      plan: c.plan, precio: c.precio, dias: c.dias,
      estimulo_fuerza: c.estimulos ? c.estimulos.fuerza : null,
      estimulo_resistencia: c.estimulos ? c.estimulos.resistencia : null,
      estimulo_velocidad: c.estimulos ? c.estimulos.velocidad : null,
      estado: c.estado,
      limite_semanal_override: c.limiteSemanalOverride,
      matricula_pagada: !!(c.matricula && c.matricula.pagada),
      matricula_fecha_pago: c.matricula ? c.matricula.fechaPago : null,
      pausado_desde: c.pausadoDesde,
    };
  }

  function pagoDbToJs(p) {
    return {
      id: p.id, dni: p.dni, fechaPago: p.fecha_pago, duracionId: p.duracion_id, dias: p.dias,
      monto: p.monto, metodoPago: p.metodo_pago, fechaVencimiento: p.fecha_vencimiento,
      comprobante: p.comprobante || null,
    };
  }

  function pagoJsToDb(p) {
    const fila = {
      id: p.id, dni: p.dni, fecha_pago: p.fechaPago, duracion_id: p.duracionId, dias: p.dias,
      monto: p.monto, metodo_pago: p.metodoPago, fecha_vencimiento: p.fechaVencimiento,
    };
    // El comprobante solo se manda si se escribió algo, así la app sigue
    // funcionando aunque la columna todavía no exista en la base.
    if (p.comprobante) fila.comprobante = p.comprobante;
    return fila;
  }

  async function sembrarPlanesIniciales() {
    const planesSeed = seedPlanesIniciales();
    const configSeed = seedConfigInicial();
    await sb.from('planes').insert(planesSeed);
    await sb.from('config').insert(configSeed);
  }

  // Varias lecturas pueden cruzarse (una por detrás al cambiar de pestaña y otra
  // por una acción). Siempre vale la última que se pidió: una respuesta más
  // vieja que llega tarde se descarta, así nunca pisa datos más nuevos. Quien
  // espera a refreshData() sigue recién cuando los datos más nuevos ya están.
  let refreshTurno = 0;
  let refreshUltimo = null;
  let ultimaLectura = 0;   // momento de la última lectura aplicada o pedida por detrás

  function refreshData(silencioso) {
    const turno = ++refreshTurno;
    const pedido = leerBase(turno, silencioso).then(() => (turno === refreshTurno ? undefined : refreshUltimo));
    refreshUltimo = pedido;
    return pedido;
  }

  async function leerBase(turno, silencioso) {
    const [clientesRes, reservasRes, pagosRes, rutinasRes, planesRes, configRes, registrosProRes] = await Promise.all([
      sb.from('clientes').select('*'),
      sb.from('reservas').select('*'),
      sb.from('pagos').select('*'),
      sb.from('rutinas').select('*'),
      sb.from('planes').select('*'),
      sb.from('config').select('*'),
      sb.from('registros_pro').select('*'),
    ]);
    if (turno !== refreshTurno) return; // ya salió una lectura más nueva

    if (clientesRes.error || reservasRes.error || pagosRes.error || rutinasRes.error || planesRes.error || configRes.error) {
      const primerError = clientesRes.error || reservasRes.error || pagosRes.error || rutinasRes.error || planesRes.error || configRes.error;
      console.error('Error leyendo Supabase:', primerError.message || primerError);
      if (!silencioso) showToast('Error de base de datos: ' + (primerError.message || 'desconocido'));
      state.data = state.data || { clientes: [], reservas: [], pagos: [], planes: [], config: [] };
      return;
    }

    // Primera vez que se usa la tabla de planes: sembramos el catálogo de precios
    // (esto sí hace falta siempre — son datos reales, no de prueba)
    if (planesRes.data.length === 0) {
      await sembrarPlanesIniciales();
      return refreshData(silencioso);
    }

    const rutinasPorDni = {};
    rutinasRes.data.forEach(r => {
      (rutinasPorDni[r.dni] = rutinasPorDni[r.dni] || []).push({ id: r.id, titulo: r.titulo, url: r.url, fecha: r.fecha });
    });

    // Más nueva primero, tanto para el cliente como para administración
    Object.values(rutinasPorDni).forEach(lista => lista.sort((a, b) =>
      String(b.fecha || '').localeCompare(String(a.fecha || '')) || String(b.id).localeCompare(String(a.id))));

    state.data = {
      clientes: clientesRes.data.map(row => clienteDbToJs(row, rutinasPorDni)),
      reservas: reservasRes.data.map(r => ({
        id: r.id, dni: r.dni, fecha: r.fecha, hora: r.hora, estado: r.estado,
        // Momento en que se hizo la reserva: lo guarda la base (creado_en) o, si
        // todavía no existe esa columna, sale del número que lleva el id.
        creadoEn: (r.creado_en ? Date.parse(r.creado_en) : momentoDeId(r.id)) || null,
        canceladoEn: r.cancelado_en ? Date.parse(r.cancelado_en) : null,
        porAdmin: !!r.por_admin,
      })),
      // false = a la tabla de reservas le faltan las columnas nuevas (no se pueden avisar cancelaciones)
      novedadesCompletas: reservasRes.data.length ? ('cancelado_en' in reservasRes.data[0]) : null,
      pagos: pagosRes.data.map(pagoDbToJs),
      planes: planesRes.data.map(p => ({ id: p.id, plan: p.plan, dias: p.dias, precio: p.precio })),
      config: configRes.data.map(c => ({ clave: c.clave, valor: c.valor })),
      // Control diario PRO. Si la tabla todavía no existe en Supabase, el resto de
      // la app sigue funcionando igual y esta parte queda desactivada.
      registrosProListo: !registrosProRes.error,
      registrosPro: registrosProRes.error ? [] : registrosProRes.data.map(r => ({
        id: r.id, dni: r.dni, fecha: r.fecha, tipo: r.tipo, valor: Number(r.valor), detalle: r.detalle || {}, creadoEn: r.creado_en,
      })),
    };
    if (registrosProRes.error) console.warn('Tabla registros_pro no disponible:', registrosProRes.error.message || registrosProRes.error);
    ultimaLectura = Date.now();
    // El cliente que tiene la sesión abierta pasa a ser el de los datos nuevos
    // (si el administrador le cambió el plan, el estado o una rutina, lo ve).
    if (state.cliente) state.cliente = state.data.clientes.find(c => c.dni === state.cliente.dni) || state.cliente;
  }

  // ---------------- Actualización por detrás ----------------
  // La app vuelve a leer la base al cambiar de pestaña y al volver a primer
  // plano, sin frenar la pantalla. Como máximo una vez cada REFRESCO_MINIMO_MS.
  const REFRESCO_MINIMO_MS = 10000;
  let diaDibujado = null; // día en que se dibujó la pantalla por última vez

  // true si hay algo escrito o elegido en un formulario de la pantalla: en ese
  // caso no se redibuja, para no borrar lo que la persona está cargando.
  function hayAlgoEscrito() {
    const activo = document.activeElement;
    if (activo && /^(INPUT|TEXTAREA|SELECT)$/.test(activo.tagName)) return true;
    return Array.from(document.querySelectorAll('#root input, #root textarea, #root select')).some(el => {
      if (el.type === 'checkbox' || el.type === 'radio') return el.checked !== el.defaultChecked;
      if (el.tagName === 'SELECT') {
        const porDefecto = Array.from(el.options).findIndex(o => o.defaultSelected);
        return el.selectedIndex !== (porDefecto === -1 ? 0 : porDefecto);
      }
      return el.value !== el.defaultValue;
    });
  }

  async function actualizarPorDetras() {
    if (!state.data) return;
    const hoy = isoDate(new Date());
    const cambioElDia = !!diaDibujado && diaDibujado !== hoy;
    if (!cambioElDia && Date.now() - ultimaLectura < REFRESCO_MINIMO_MS) return;
    ultimaLectura = Date.now();
    const antes = JSON.stringify(state.data);
    await refreshData(true);
    avisarNovedades();
    if (!cambioElDia && JSON.stringify(state.data) === antes) return; // nada nuevo
    if (hayAlgoEscrito()) return; // los datos ya están; se ven en el próximo toque
    // Si la app quedó abierta de un día para el otro, no dejar elegido un día que ya pasó
    if (state.cliente && state.selectedDate && state.selectedDate < hoy) state.selectedDate = primerDiaConTurnos();
    // Los desplegables que estaban abiertos (historial de pagos, "Al día") siguen abiertos
    const abiertos = Array.from(document.querySelectorAll('#root details')).map(d => d.open);
    renderApp();
    const nuevos = document.querySelectorAll('#root details');
    if (nuevos.length === abiertos.length) nuevos.forEach((d, i) => { if (abiertos[i]) d.open = true; });
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') actualizarPorDetras();
  });

  // Con administración abierta se vuelve a mirar la base cada medio minuto,
  // para que las reservas y cancelaciones nuevas aparezcan solas.
  const REVISION_ADMIN_MS = 30000;
  setInterval(() => {
    if (state.mode === 'admin' && document.visibilityState === 'visible') actualizarPorDetras();
  }, REVISION_ADMIN_MS);

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  function pillForEstado(estado) {

    if (estado === 'Pausado') return '<span class="pill pill-amber">Pausado</span>';
    return '<span class="pill pill-red">Baja</span>';
  }

    return '$' + n.toLocaleString('es-AR');
  }
