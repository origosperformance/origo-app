      const b = base || todayMidnight();
      const total = habilesDelMes(b);
      const bruto = total ? (precio || 0) * habilesHastaFinDeMes(b) / total : 0;
      return Math.round(bruto / REDONDEO_PROPORCIONAL) * REDONDEO_PROPORCIONAL;
    }
    const bruto = (precio || 0) * dur.factor;
    if (dur.tipo === 'finmes' && dur.factor < 1) return Math.round(bruto / REDONDEO_SEMANAS) * REDONDEO_SEMANAS;
    return Math.round(bruto);
  }

  function primerDiaMesSiguiente(fecha) {
    return new Date(fecha.getFullYear(), fecha.getMonth() + 1, 1);
  }

  function diasHastaFinDeMes(base) {
    return Math.round((primerDiaMesSiguiente(base) - base) / 86400000);
  }

  // Semanas que se le cobran al que arranca en 'base' hasta fin de mes: los días
  // hábiles que quedan, de a 5 por semana, redondeando para arriba (el que
  // arranca un miércoles y viene esos días paga la semana entera).
  function semanasHastaFinDeMes(base) {
    return Math.ceil(habilesHastaFinDeMes(base) / 5);
  }

  // Qué pago "hasta fin de mes" corresponde si el período arranca en 'base':
  //  - si arranca un día 1 ya está ordenado: null (va el pago común de 1 mes)
  //  - si no: las semanas que le quedan al mes (o el mes completo si son 4 o más).
  //    El proporcional por días hábiles queda como opción para los casos en que
  //    no llega a cumplir sus días de esa semana.
  // 'base' es donde termina lo que el cliente ya tiene pago (o hoy si arranca).
  function sugerenciaFinDeMes(base) {
    if (base.getDate() === 1) return null;
    if (habilesHastaFinDeMes(base) === 0) return null; // no quedan días hábiles en el mes
    const semanas = semanasHastaFinDeMes(base);
    return semanas >= 4 ? 'fm-mes' : 'fm-' + semanas + 's';
  }

  function etiquetaProporcional(base) {
    const n = habilesHastaFinDeMes(base);
    return 'Proporcional: ' + n + (n === 1 ? ' día hábil' : ' días hábiles') + ' de ' + habilesDelMes(base);
  }

  // Las opciones "desde hoy" llevan este prefijo en el desplegable. Es solo para
  // saber desde qué fecha contar: en el pago se guarda la duración sin el prefijo.
  const PREFIJO_DESDE_HOY = 'hoy:';

  // Opciones del desplegable de duración. 'precio' null = no mostrar montos.
  function opcionesDuracionHtml(base, precio) {
    const sugerida = sugerenciaFinDeMes(base);
    const conPrecio = precio !== null && precio !== undefined;
    const opcion = (d, elegida, extra, label) =>
      `<option value="${d.id}" ${elegida ? 'selected' : ''}>${label || d.label}${conPrecio ? ' — ' + money(montoDe(precio, d, base)) : ''}${extra || ''}</option>`;
    const comunes = DURACIONES.filter(d => !d.oculta).map(d => opcion(d, !sugerida && d.id === '1m')).join('');

    // Cliente que venía pagando y se atrasó: el período sugerido arranca donde
    // terminó su pago anterior (antes de hoy). Pasado el plazo del mes se ofrece
    // además cobrarle el proporcional contando desde hoy, por si estuvo ausente.
    const hoy = todayMidnight();
    let desdeHoy = '';
    if (base < hoy && hoy.getDate() > diasParaPagar() && habilesHastaFinDeMes(hoy) > 0) {
      // Proporcional diario y, si entran, las semanas que le quedan al mes, contando desde hoy
      const opHoy = (d, label) => `<option value="${PREFIJO_DESDE_HOY}${d.id}">${label} desde hoy${conPrecio ? ' — ' + money(montoDe(precio, d, hoy)) : ''}</option>`;
      const semanasHoy = Math.min(3, semanasHastaFinDeMes(hoy));
      desdeHoy = `<optgroup label="Si estuvo ausente: contar desde hoy">${opHoy(DURACION_PROPORCIONAL, etiquetaProporcional(hoy))}${
        [1, 2, 3].filter(n => n <= semanasHoy).map(n => opHoy(duracionPorId('fm-' + n + 's'), n === 1 ? '1 semana' : n + ' semanas')).join('')}</optgroup>`;
    }

    if (!sugerida) return desdeHoy ? `<optgroup label="Períodos completos">${comunes}</optgroup>${desdeHoy}` : comunes;
    const marca = (id) => id === sugerida ? ' · sugerido' : '';
    const finDeMes = ['fm-1s', 'fm-2s', 'fm-3s', 'fm-mes'].map(id => opcion(duracionPorId(id), id === sugerida, marca(id))).join('')
      + opcion(DURACION_PROPORCIONAL, sugerida === DURACION_PROPORCIONAL.id, marca(DURACION_PROPORCIONAL.id), etiquetaProporcional(base));
    return `<optgroup label="Para quedar venciendo el día 1">${finDeMes}</optgroup><optgroup label="Otros períodos">${comunes}</optgroup>${desdeHoy}`;
  }

  // Texto que explica qué cubre un pago antes de registrarlo
  function textoPeriodoPago(base, venc, dur) {
    const vencIso = isoDate(venc);
    if (dur && dur.tipo === 'finmes') {
      const siguiente = 'La cuota siguiente vence el ' + formatFechaCorta(vencIso) + ' y se paga hasta el ' + formatFechaCorta(limitePago(vencIso)) + '.';
      if (dur.proporcional) {
        const n = habilesHastaFinDeMes(base);
        return 'Cubre del ' + formatFechaCorta(isoDate(base)) + ' a fin de mes: ' + n + (n === 1 ? ' día hábil' : ' días hábiles')
          + ' de los ' + habilesDelMes(base) + ' del mes. ' + siguiente;
      }
      const dias = Math.round((venc - base) / 86400000);
      if (dur.semanas && dur.semanas < 4) {
        return 'Cobra ' + dur.semanas + (dur.semanas === 1 ? ' semana' : ' semanas') + ' (cuota ÷ 4 por semana) y cubre del '
          + formatFechaCorta(isoDate(base)) + ' a fin de mes. ' + siguiente;
      }
      return 'Cubre del ' + formatFechaCorta(isoDate(base)) + ' a fin de mes (' + dias + (dias === 1 ? ' día' : ' días') + '). ' + siguiente;
    }
    const texto = 'Este pago cubre del ' + formatFechaCorta(isoDate(base)) + ' al ' + formatFechaCorta(vencIso) + '.';
    // Si no termina un día 1, el mes en que termina se le va a reclamar igual
    if (venc.getDate() !== 1) {
      return texto + ' Ojo: no queda venciendo el día 1. La cuota de ' + MESES[venc.getMonth()].toLowerCase()
        + ' se le va a pedir igual hasta el ' + formatFechaCorta(limitePago(vencIso)) + '.';
    }
    return texto;
  }

  // Calcula la fecha de vencimiento según el tipo de duración (días corridos,
  // meses de calendario reales o hasta fin de mes) a partir de una fecha base.
  function calcularVencimiento(fechaBase, dur) {
    if (dur.tipo === 'finmes') return primerDiaMesSiguiente(new Date(fechaBase));
    if (dur.tipo === 'meses') return agregarMeses(fechaBase, dur.valor);
    const v = new Date(fechaBase);
    v.setDate(v.getDate() + dur.valor);
    return v;
  }

  function seedPlanesIniciales() {
    const tabla = {
      'START':          { 1: 55000, 2: 70000, 3: 80000,  4: 90000,  5: 100000 },
      'PERFORMANCE 2':  {           2: 85000, 3: 95000,  4: 105000, 5: 115000 },
      'PERFORMANCE 3':  {           2: 95000, 3: 105000, 4: 115000, 5: 120000 },
      'PRO':            { null: 125000 },
    };
    const filas = [];
    Object.entries(tabla).forEach(([plan, porDias]) => {
      Object.entries(porDias).forEach(([diasStr, precio]) => {
        const dias = diasStr === 'null' ? null : parseInt(diasStr, 10);
        filas.push({ id: plan + '-' + (dias ?? 'null'), plan, dias, precio });
      });
    });
    return filas;
  }

  function seedConfigInicial() {
    return [{ clave: 'matricula_precio', valor: 30000 }];
  }

  function precioDe(plan, dias) {
    if (!state.data || !state.data.planes) return null;
    const exacto = state.data.planes.find(p => p.plan === plan && p.dias === dias);
    if (exacto) return exacto.precio;
    const integral = state.data.planes.find(p => p.plan === plan && p.dias === null);
    return integral ? integral.precio : null;
  }

  function matriculaPrecio() {
    if (!state.data || !state.data.config) return 30000;
    const fila = state.data.config.find(c => c.clave === 'matricula_precio');
    return fila ? fila.valor : 30000;
  }

  // La matrícula (alta de membresía) se puede apagar desde Planes. Apagada no
  // aparece en ningún lado de la app. Se guarda en "config" como
  // 'matricula_activa' = 1; si la fila no existe, se toma como apagada.
  function matriculaActiva() {
    const fila = state.data && state.data.config ? state.data.config.find(c => c.clave === 'matricula_activa') : null;
    return !!fila && Number(fila.valor) === 1;
  }

  async function guardarMatriculaActiva(activar) {
    const valor = activar ? 1 : 0;
    const existe = state.data.config.some(c => c.clave === 'matricula_activa');
    const { error } = existe
      ? await sb.from('config').update({ valor }).eq('clave', 'matricula_activa')
      : await sb.from('config').insert({ clave: 'matricula_activa', valor });
    if (error) { showToast('No se pudo guardar.'); console.error(error); return; }
    await refreshData();
    showToast(activar ? 'La matrícula se vuelve a cobrar' : 'La matrícula dejó de cobrarse');
    renderApp();
  }

  // ---------------- Cuota especial ----------------
  // Un cliente puede pagar una cuota distinta a la de su plan (una excepción).
  // Se carga en Clientes > ficha > Editar y se guarda en "config" como
  // 'cuota_<dni>' con el monto mensual. Mientras exista, esa es su cuota aunque
  // se edite al cliente o cambien los precios de los planes.
  const CLAVE_CUOTA = 'cuota_';
  function cuotaEspecialDe(dni) {
    const fila = state.data && state.data.config ? state.data.config.find(c => c.clave === CLAVE_CUOTA + dni) : null;
    const v = fila ? Number(fila.valor) : 0;
    return v > 0 ? v : null;
  }

  // Cuota especial que rige de hecho: la cargada como excepción o, si no hay,
  // la que el cliente tiene guardada cuando no coincide con el precio de su
  // plan (por ejemplo, si alguna vez se la cambiaron a mano en la base).
  function cuotaEspecialEfectiva(c) {
    const cargada = cuotaEspecialDe(c.dni);
    if (cargada) return cargada;
    const delPlan = precioDe(c.plan, c.dias);
    return (c.precio && c.precio !== delPlan) ? c.precio : null;
  }

  // Guarda (monto) o quita (null) la cuota especial de un cliente. Devuelve false si falló.
  async function guardarCuotaEspecial(dni, monto) {
    if ((monto || null) === cuotaEspecialDe(dni)) return true;
    const clave = CLAVE_CUOTA + dni;
    const existe = state.data.config.some(c => c.clave === clave);
    let res;
    if (monto) {
      res = existe
        ? await sb.from('config').update({ valor: monto }).eq('clave', clave)
        : await sb.from('config').insert({ clave, valor: monto });
    } else {
      res = await sb.from('config').update({ valor: 0 }).eq('clave', clave);
      if (!res.error) await sb.from('config').delete().eq('clave', clave);
    }
    if (res.error) { console.error('No se pudo guardar la cuota especial:', res.error); return false; }
    return true;
  }

  // ---------------- Usuario de prueba ----------------
  // Un cliente marcado como "de prueba" sirve para mostrar la app: entra como
  // cualquier cliente, pero nunca figura con deuda y no cuenta en los números
  // del administrador (cuotas, facturación, asistencias, control PRO) ni ocupa
  // cupo en los turnos. La marca se guarda en la tabla "config" como una fila
  // 'prueba_<dni>' con valor 1, y se cambia desde Clientes > Editar.
  const CLAVE_PRUEBA = 'prueba_';
  function esPrueba(dni) {
    const cfg = state.data && state.data.config;
    return !!cfg && cfg.some(c => c.clave === CLAVE_PRUEBA + dni && Number(c.valor) === 1);
  }
  function clientesReales(data) { return data.clientes.filter(c => !esPrueba(c.dni)); }
  function reservasReales(data) { return data.reservas.filter(r => !esPrueba(r.dni)); }
  function pagosReales(data) { return data.pagos.filter(p => !esPrueba(p.dni)); }

  // ---------------- Clientes nuevos (todavía sin cuenta) ----------------
  // Al que todavía no arrancó se lo anota desde Turnos solo con nombre y
  // teléfono. Sus turnos se guardan con un código en lugar del DNI:
  // 'nuevo|<id>|<nombre>|<teléfono>'. Cuando se lo da de alta como cliente, sus
  // turnos pasan a su DNI real. En Turnos se lo ve de otro color hasta su
  // primera clase (lo mismo que a un cliente que todavía no vino nunca).
  const PREFIJO_NUEVO = 'nuevo|';
  function esProspecto(dni) { return String(dni || '').startsWith(PREFIJO_NUEVO); }
  function codigoProspecto(nombre, telefono) {
    const limpio = t => String(t || '').replace(/\|/g, ' ').replace(/\s+/g, ' ').trim();
    return PREFIJO_NUEVO + Date.now().toString(36) + '|' + limpio(nombre) + '|' + limpio(telefono);
  }
  function datosProspecto(dni) {
    const partes = String(dni || '').split('|');
    return { nombre: partes[2] || 'Cliente nuevo', telefono: partes[3] || '' };
  }
  // Clientes nuevos que tienen algún turno activo (para volver a anotarlos)
  function prospectosConTurnos(data) {
    const vistos = {};
    data.reservas.forEach(r => { if (esProspecto(r.dni) && r.estado !== 'cancelado') vistos[r.dni] = true; });
    return Object.keys(vistos).map(dni => ({ dni, ...datosProspecto(dni) }))
      .sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
  }
  // true si este turno es la primera clase de la persona (todavía no vino a ninguna antes)
  function esPrimeraClase(data, r) {
    if (esProspecto(r.dni)) return true;
    const clave = r.fecha + ' ' + String(r.hora).slice(0, 5);
    return !data.reservas.some(x => x.dni === r.dni && x.id !== r.id && estadoEfectivo(x) === 'asistio'
      && (x.fecha + ' ' + String(x.hora).slice(0, 5)) < clave);
  }

  // ---------------- Días cerrados y horarios especiales ----------------
  // Administración puede cerrar un día entero o abrirlo solo en una franja
  // (por ejemplo, feriados a medio día). Se guarda en la tabla "config" como
  // una fila 'dia_<AAAA-MM-DD>' con valor 1 = cerrado todo el día, o con
  // valor HHMMHHMM = primer y último turno del día (8001200 = de 08:00 a 12:00).
  // Valor 0 o sin fila = horario normal.
  const CLAVE_DIA = 'dia_';
  function horarioEspecial(fechaIso) {
    const cfg = state.data && state.data.config;
    if (!cfg) return null;
    const fila = cfg.find(c => c.clave === CLAVE_DIA + fechaIso);
    const v = fila ? Number(fila.valor) : 0;
    if (!v) return null;
    if (v === 1) return { cerrado: true };
    const hhmm = (n) => { const t = String(n).padStart(4, '0'); return t.slice(0, 2) + ':' + t.slice(2); };
    return { desde: hhmm(Math.floor(v / 10000)), hasta: hhmm(v % 10000) };
  }
  function horarioAbierto(fechaIso, hora) {
    if (!HORARIOS.includes(String(hora).slice(0, 5))) return false; // fuera del horario de funcionamiento
    const e = horarioEspecial(fechaIso);
    if (!e) return true;
    if (e.cerrado) return false;
    const h = String(hora).slice(0, 5);
    return h >= e.desde && h <= e.hasta;
  }
  function textoHorarioEspecial(e) {
    if (!e) return 'Horario normal';
    return e.cerrado ? 'Cerrado todo el día' : 'Abierto de ' + e.desde + ' a ' + e.hasta + ' (último turno)';
  }
  // Guarda el horario de un día: null = normal, { cerrado: true } o { desde, hasta }
  async function guardarHorarioDia(fechaIso, e) {
    const clave = CLAVE_DIA + fechaIso;
    const existe = state.data.config.some(c => c.clave === clave);
    if (!e) {
      const res = await sb.from('config').update({ valor: 0 }).eq('clave', clave);
      if (!res.error) await sb.from('config').delete().eq('clave', clave);
      return !res.error;
    }
    const valor = e.cerrado ? 1 : parseInt(e.desde.replace(':', ''), 10) * 10000 + parseInt(e.hasta.replace(':', ''), 10);
    const res = existe
      ? await sb.from('config').update({ valor }).eq('clave', clave)
      : await sb.from('config').insert({ clave, valor });
    if (res.error) console.error('No se pudo guardar el horario del día:', res.error);
    return !res.error;
  }
  // Turnos activos de un día que quedaron fuera del horario (para avisarles)
  function turnosFueraDeHorario(data, fechaIso) {
    return data.reservas.filter(r => r.fecha === fechaIso && r.estado === 'reservado'
      && !horarioAbierto(fechaIso, r.hora) && !turnoYaEmpezo(r.fecha, r.hora));
  }

  // ---------------- Turnos fijos ----------------
  // Administración le marca a un cliente los días y horarios que viene fijo.
  // La app le reserva sola esos turnos en las semanas que se pueden reservar
  // (si hay lugar, está activo y no tiene la cuota vencida). Él puede cancelar
  // uno o cambiarlo por otro horario como cualquier reserva: el que canceló no
  // se le vuelve a reservar. Cada horario fijo se guarda en la tabla "config"
  // como una fila 'fijo_<dni>_<día 1-5>_<HHMM>' con valor 1, y cada turno
  // reservado así lleva un id 'fijo-<dni>-<fecha>-<HHMM>' (nunca se duplica).
  const CLAVE_FIJO = 'fijo_';
  function claveFijo(dni, dia, hora) { return CLAVE_FIJO + dni + '_' + dia + '_' + String(hora).replace(':', ''); }
  function fijosDe(dni) {
    const cfg = state.data && state.data.config;
    if (!cfg) return [];
    const pref = CLAVE_FIJO + dni + '_';
    return cfg.filter(c => String(c.clave).startsWith(pref) && Number(c.valor) === 1).map(c => {
      const [dia, hhmm] = String(c.clave).slice(pref.length).split('_');
      return { dia: parseInt(dia, 10), hora: String(hhmm).slice(0, 2) + ':' + String(hhmm).slice(2, 4) };
    }).filter(f => f.dia >= 1 && f.dia <= 5 && HORARIOS.includes(f.hora))
      .sort((a, b) => a.dia - b.dia || a.hora.localeCompare(b.hora));
  }
  function textoFijos(fijos) {
    return fijos.map(f => DIAS_SEMANA[f.dia] + ' ' + f.hora).join(' · ');
  }
  function idFijo(dni, fecha, hora) { return 'fijo-' + dni + '-' + fecha + '-' + String(hora).replace(':', ''); }
  function esTurnoFijo(r) { return String(r.id || '').startsWith('fijo-'); }

  // Guarda los horarios fijos de un cliente (lista de { dia, hora }). Devuelve false si algo falló.
  async function guardarFijos(dni, lista) {
    const quiero = {};
    lista.forEach(f => { quiero[claveFijo(dni, f.dia, f.hora)] = true; });
    const pref = CLAVE_FIJO + dni + '_';
    const filas = state.data.config.filter(c => String(c.clave).startsWith(pref));
    let ok = true;
    for (const clave of Object.keys(quiero)) {
      const fila = filas.find(c => c.clave === clave);
      if (fila && Number(fila.valor) === 1) continue;
      const res = fila
        ? await sb.from('config').update({ valor: 1 }).eq('clave', clave)
        : await sb.from('config').insert({ clave, valor: 1 });
      if (res.error) { ok = false; console.error('No se pudo guardar el día fijo:', res.error); }
    }
    for (const fila of filas) {
      if (quiero[fila.clave]) continue;
      // Primero se apaga (valor 0) y después se intenta borrar la fila
      const res = await sb.from('config').update({ valor: 0 }).eq('clave', fila.clave);
      if (res.error) { ok = false; console.error('No se pudo quitar el día fijo:', res.error); continue; }
      await sb.from('config').delete().eq('clave', fila.clave);
    }
    return ok;
  }

  // Reserva los turnos fijos que falten en las semanas reservables. Se llama
  // sola cada vez que se leen los datos (como mucho una vez por minuto).
  let generandoFijos = false;
  let ultimaGeneracionFijos = 0;
  async function generarTurnosFijos(forzar) {
    if (generandoFijos || !state.data || state.errorConexion) return;
    if (!forzar && Date.now() - ultimaGeneracionFijos < 60000) return;
    if (!state.data.config.some(c => String(c.clave).startsWith(CLAVE_FIJO))) return;
    generandoFijos = true;
    ultimaGeneracionFijos = Date.now();
    try {
      const data = state.data;
      const dias = bookableWeekdays();
      const nuevas = [];
      data.clientes.forEach(c => {
        if (c.estado !== 'Activo' || cuotaImpideReservar(data, c.dni)) return;
        const fijos = fijosDe(c.dni);
        if (!fijos.length) return;
        dias.forEach(d => {
          const fecha = isoDate(d);
          fijos.filter(f => f.dia === d.getDay()).forEach(f => {
            if (turnoYaEmpezo(fecha, f.hora) || !horarioAbierto(fecha, f.hora)) return;
            const id = idFijo(c.dni, fecha, f.hora);
            if (data.reservas.some(r => r.id === id)) return; // ya se reservó (o lo canceló)
            const delDia = data.reservas.filter(r => r.dni === c.dni && r.fecha === fecha);
            if (delDia.some(r => String(r.hora).slice(0, 5) === f.hora)) return; // ya tiene (o canceló) ese horario
            const activasDia = delDia.filter(r => r.estado !== 'cancelado');
            if (activasDia.some(r => seSuperponen(String(r.hora).slice(0, 5), f.hora))) return;
            if (activasDia.length + nuevas.filter(n => n.dni === c.dni && n.fecha === fecha).length >= MAX_TURNOS_POR_DIA) return;
            const yaEnCola = nuevas.filter(n => n.fecha === fecha && n.hora === f.hora).length;
            if (ocupadosEnTurno(data, fecha, f.hora, null) + yaEnCola >= CUPO) return; // sin lugar: se vuelve a probar más tarde
            nuevas.push({ id, dni: c.dni, fecha, hora: f.hora, estado: 'reservado' });
          });
        });
      });
      if (!nuevas.length) return;
      let hechas = 0;
      for (const n of nuevas) {
        let res = data.novedadesCompletas === false ? null : await sb.from('reservas').insert({ ...n, por_admin: true });
        if (!res || res.error) res = await sb.from('reservas').insert(n);
        if (!res.error) { hechas++; state.misAcciones['n-' + n.id] = true; }
      }
      if (hechas) {
        await refreshData(true);
        if (!hayAlgoEscrito()) redibujarConservando();
      }
    } catch (e) {
      console.error('No se pudieron reservar los turnos fijos:', e);
    } finally {
      generandoFijos = false;
    }
  }

  // Lugares ocupados de un turno. Las reservas de un usuario de prueba no
  // cuentan, salvo para él mismo (así ve su propio turno descontado).
  function ocupadosEnTurno(data, fecha, hora, dniQueMira) {
    return data.reservas.filter(r =>
      r.fecha === fecha && r.hora === hora && r.estado !== 'cancelado' &&
      (!esPrueba(r.dni) || r.dni === dniQueMira)).length;
  }

  // Marca o desmarca a un cliente como usuario de prueba. Devuelve false si falló.
  async function guardarMarcaPrueba(dni, marcar) {
    if (marcar === esPrueba(dni)) return true;
    const clave = CLAVE_PRUEBA + dni;
    const existe = state.data.config.some(c => c.clave === clave);
    let res;
    if (marcar) {
      res = existe
        ? await sb.from('config').update({ valor: 1 }).eq('clave', clave)
        : await sb.from('config').insert({ clave, valor: 1 });
    } else {
      // Primero se apaga (valor 0) y después se intenta borrar la fila: si la
      // base no deja borrar, igual queda desmarcado.
      res = await sb.from('config').update({ valor: 0 }).eq('clave', clave);
      if (!res.error) await sb.from('config').delete().eq('clave', clave);
    }
    if (res.error) { console.error('No se pudo guardar la marca de usuario de prueba:', res.error); return false; }
    return true;
  }

  let state = {
    data: null,
    cliente: null,
    view: 'perfil',
    selectedDate: null,
    mode: 'login', // login | adminPin | admin
    loginError: '',
    pinError: '',
    adminFormError: '',
    adminFormNotice: '',
    adminTab: 'resumen', // resumen | clientes | cuotas | asistencias
    editingDni: null,      // dni del cliente en edición (pestaña Editar de la ficha), null = alta nueva
    fichaDni: null,        // cliente cuya ficha está abierta en administración
    fichaTab: 'resumen',   // resumen | pagos | asistencias | rutinas | editar
    fichaMes: null,        // 'YYYY-MM' del calendario de asistencias de la ficha
    fichaOrigen: 'clientes', // pestaña desde la que se abrió la ficha (para volver ahí)

    altaProspecto: null,     // código del cliente nuevo (sin cuenta) que se está dando de alta
    fijosEditando: null,     // administración: días fijos que se están eligiendo en la ficha ({ 'w|hora': true })
    confirmarRutinaId: null,

    confirmarEliminarDni: null, // cliente al que se le está preguntando "¿eliminar?"

    loginDni: null,          // DNI escrito en la pantalla de ingreso (para no perderlo si la clave está mal)
    slotElegido: null,       // horario tocado en Turnos, a la espera de confirmar
    turnosVista: 'dia',      // administración, pestaña Turnos: dia | semana
    anotarEn: null,          // hora en la que está abierto el buscador "+ Anotar"
    reservaAbierta: null,    // id de la reserva cuyo nombre se tocó en la vista de día
    misAcciones: {},         // reservas y cancelaciones hechas desde esta pantalla (no se avisan como novedad)
    novedadesAvisadas: {},   // novedades por las que ya se mostró el cartel
    novedadesListas: false,
    novedadesDesde: 0,
    asistMes: null,          // 'YYYY-MM' que se está mirando en el calendario de asistencias
    proAbierto: undefined,   // tarjeta abierta en "Mi día": 'wellness' | 'tqr' | 'rpe' | null (undefined = elegir sola la pendiente)
    proDraft: {},            // lo que el cliente va eligiendo antes de guardar

  };

  // La app trabaja siempre con la fecha y la hora de Argentina (UTC-3, sin
  // horario de verano), aunque el celular esté configurado en otro país. Así
  // "hoy" y "ese turno ya empezó" valen lo mismo para todos.
  const HUSO_GIMNASIO_MIN = 180; // minutos al oeste de UTC
  function ahora() {
    const real = new Date();
    return new Date(real.getTime() + (real.getTimezoneOffset() - HUSO_GIMNASIO_MIN) * 60000);
  }

  function isoDate(d) {
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  // Suma N meses de calendario a una fecha, respetando "mismo día del mes
  // siguiente". Si el mes destino no tiene ese día (ej: 31 de enero + 1 mes),
  // lo ajusta al último día real de ese mes (28/29 de febrero) en vez de
  // desbordar al mes de después.
  function agregarMeses(fechaBase, n) {
    const d = new Date(fechaBase);
    const diaOriginal = d.getDate();
    const mesDestino = d.getMonth() + n;
    const resultado = new Date(d.getFullYear(), mesDestino, diaOriginal);
    const mesEsperado = ((mesDestino % 12) + 12) % 12;
    if (resultado.getMonth() !== mesEsperado) {
      resultado.setDate(0); // retrocede al último día del mes destino correcto
    }
    return resultado;
  }

  // Momento exacto en que empieza un turno (hora local del dispositivo)
  function turnoInicio(fechaIso, hora) {
    return new Date(fechaIso + 'T' + String(hora).slice(0, 5) + ':00');
  }

  // true si el turno ya empezó (más la tolerancia): desde ahí no se puede
  // reservar ni cancelar, y pasa a contar como asistencia.
  function turnoYaEmpezo(fechaIso, hora) {
    return ahora().getTime() >= turnoInicio(fechaIso, hora).getTime() + MINUTOS_GRACIA_TURNO * 60000;
  }

  // Estado "real" de una reserva para mostrar y contar:
  //  - reservado + el turno todavía no empezó  -> 'reservado'
  //  - reservado + el turno ya empezó          -> 'asistio' (asistencia automática)
  //  - asistio / no_asistio / cancelado        -> lo que marcó el administrador o el cliente
  // No se escribe nada extra en la base: la reserva guardada ES el registro de asistencia.
  function estadoEfectivo(r) {
    if (r.estado === 'reservado' && turnoYaEmpezo(r.fecha, r.hora)) return 'asistio';
    return r.estado;
  }

  // Primer día de la semana reservable que todavía tiene algún horario por delante
  function primerDiaConTurnos() {
    const dias = bookableWeekdays();
    const conTurnos = dias.find(d => HORARIOS.some(h => !turnoYaEmpezo(isoDate(d), h) && horarioAbierto(isoDate(d), h)));
    return isoDate(conTurnos || dias[0]);
  }

  // Lunes de la semana a la que pertenece una fecha (ISO string)
  function mondayOf(fechaIso) {
    const d = new Date(fechaIso + 'T00:00:00');
    const dow = d.getDay(); // 0 domingo .. 6 sábado
    const diff = dow === 0 ? -6 : 1 - dow;
    d.setDate(d.getDate() + diff);
    return d;
  }

  // Cuántas semanas (de lunes a viernes) pueden ver y reservar los clientes:
  // la actual y la que viene. Sábado y domingo, la "actual" pasa a ser la que
  // empieza el lunes. Para abrir más o menos semanas alcanza con cambiar este número.
  const SEMANAS_RESERVABLES = 2;

  // Días hábiles reservables: de hoy en adelante, dentro de las semanas reservables.
  function bookableWeekdays() {
    return fullBookableWeek().filter(d => d >= todayMidnight());
  }

  function todayMidnight() {
    const t = ahora();
    t.setHours(0, 0, 0, 0);
    return t;
  }

  // Lunes de la primera semana reservable
  function primerLunesReservable() {
    const today = todayMidnight();
    const dow = today.getDay();
    const monday = new Date(today);
    if (dow === 0) monday.setDate(today.getDate() + 1);
    else if (dow === 6) monday.setDate(today.getDate() + 2);
    else monday.setDate(today.getDate() - (dow - 1));
    return monday;
  }

  // Los días (lunes a viernes) de las semanas reservables, incluyendo los que ya pasaron
  function fullBookableWeek() {
    const monday = primerLunesReservable();
    const out = [];
    for (let s = 0; s < SEMANAS_RESERVABLES; s++) {
      for (let i = 0; i < 5; i++) {
        const d = new Date(monday);
        d.setDate(monday.getDate() + s * 7 + i);
        out.push(d);
      }
    }
    return out;
  }

  // "esta semana" / "la semana que viene" / "la semana del 2/11", según la fecha
  function nombreSemana(fechaIso) {
    const lunes = mondayOf(fechaIso);
    const lunesHoy = mondayOf(isoDate(ahora()));
    const dif = Math.round((lunes - lunesHoy) / (7 * 86400000));
    if (dif === 0) return 'esta semana';
    if (dif === 1) return 'la semana que viene';
    return 'la semana del ' + lunes.getDate() + '/' + (lunes.getMonth() + 1);
  }

  // Total de reservas activas de un cliente dentro de la semana (lun-vie) de 'fechaIso'
  function reservasEnSemana(data, dni, fechaIso) {
    const monday = mondayOf(fechaIso);
    const friday = new Date(monday);
    friday.setDate(monday.getDate() + 4);
    const mondayIso = isoDate(monday);
    const fridayIso = isoDate(friday);
    return data.reservas.filter(r =>
      r.dni === dni && r.estado !== 'cancelado' && r.fecha >= mondayIso && r.fecha <= fridayIso);
  }

  // Cuántos turnos por semana tiene derecho a reservar este cliente
  function limiteSemanalDe(cliente) {
    if (cliente.limiteSemanalOverride != null) return cliente.limiteSemanalOverride;
    if (!cliente.estimulos) return Infinity; // PRO u otros planes integrales
    return cliente.estimulos.fuerza + cliente.estimulos.resistencia + cliente.estimulos.velocidad;
  }

  // ---------------- Capa de datos (Supabase) ----------------

  // Los ids de reserva son 'r' + milisegundos + letras: de ahí sale cuándo se creó
  function momentoDeId(id) {
    const m = /^r(\d{13})/.exec(String(id || ''));
    return m ? parseInt(m[1], 10) : null;
  }

  function reservaDbToJs(r) {
    return {
      id: r.id, dni: r.dni, fecha: r.fecha, hora: r.hora, estado: r.estado,
      // Momento en que se hizo la reserva: lo guarda la base (creado_en) o, si
      // todavía no existe esa columna, sale del número que lleva el id.
      creadoEn: (r.creado_en ? Date.parse(r.creado_en) : momentoDeId(r.id)) || null,
      canceladoEn: r.cancelado_en ? Date.parse(r.cancelado_en) : null,
      porAdmin: !!r.por_admin,
    };
  }

  // Cancela una reserva dejando anotado cuándo (si la base ya tiene esa columna)
  async function marcarCancelada(id) {
    if (state.data && state.data.novedadesCompletas !== false) {
      const r = await sb.from('reservas').update({ estado: 'cancelado', cancelado_en: new Date().toISOString() }).eq('id', id);
      if (!r.error) return r;
    }
    return sb.from('reservas').update({ estado: 'cancelado' }).eq('id', id);
  }

  function clienteDbToJs(row, rutinasPorDni) {
    return {
      dni: row.dni, password: row.password, nombre: row.nombre, email: row.email, telefono: row.telefono,
      plan: row.plan, precio: row.precio, dias: row.dias,
      estimulos: row.estimulo_fuerza === null ? null : {
        fuerza: row.estimulo_fuerza, resistencia: row.estimulo_resistencia, velocidad: row.estimulo_velocidad,
      },
      estado: row.estado,
      limiteSemanalOverride: row.limite_semanal_override,
      matricula: { pagada: row.matricula_pagada, fechaPago: row.matricula_fecha_pago },
      pausadoDesde: row.pausado_desde,
      rutinas: (rutinasPorDni && rutinasPorDni[row.dni]) || [],
    };
  }

  function clienteJsToDb(c) {
    return {
      dni: c.dni, password: c.password, nombre: c.nombre, email: c.email || null, telefono: c.telefono || null,
      plan: c.plan, precio: c.precio, dias: c.dias,
      estimulo_fuerza: c.estimulos ? c.estimulos.fuerza : null,
      estimulo_resistencia: c.estimulos ? c.estimulos.resistencia : null,
      estimulo_velocidad: c.estimulos ? c.estimulos.velocidad : null,
      estado: c.estado,
      limite_semanal_override: c.limiteSemanalOverride,
      matricula_pagada: !!(c.matricula && c.matricula.pagada),
      matricula_fecha_pago: c.matricula ? c.matricula.fechaPago : null,
      pausado_desde: c.pausadoDesde,
    };
  }

  function pagoDbToJs(p) {
    return {
      id: p.id, dni: p.dni, fechaPago: p.fecha_pago, duracionId: p.duracion_id, dias: p.dias,
      monto: p.monto, metodoPago: p.metodo_pago, fechaVencimiento: p.fecha_vencimiento,
      comprobante: p.comprobante || null,
    };
  }

  function pagoJsToDb(p) {
    const fila = {
      id: p.id, dni: p.dni, fecha_pago: p.fechaPago, duracion_id: p.duracionId, dias: p.dias,
      monto: p.monto, metodo_pago: p.metodoPago, fecha_vencimiento: p.fechaVencimiento,
    };
    // El comprobante solo se manda si se escribió algo, así la app sigue
    // funcionando aunque la columna todavía no exista en la base.
    if (p.comprobante) fila.comprobante = p.comprobante;
    return fila;
  }

  async function sembrarPlanesIniciales() {
    const planesSeed = seedPlanesIniciales();
    const configSeed = seedConfigInicial();
    await sb.from('planes').insert(planesSeed);
    await sb.from('config').insert(configSeed);
  }

  // Varias lecturas pueden cruzarse (una por detrás al cambiar de pestaña y otra
  // por una acción). Siempre vale la última que se pidió: una respuesta más
  // vieja que llega tarde se descarta, así nunca pisa datos más nuevos. Quien
  // espera a refreshData() sigue recién cuando los datos más nuevos ya están.
  let refreshTurno = 0;
  let refreshUltimo = null;
  let ultimaLectura = 0;   // momento de la última lectura aplicada o pedida por detrás

  function refreshData(silencioso) {
    const turno = ++refreshTurno;
    const pedido = leerBase(turno, silencioso).then(() => (turno === refreshTurno ? undefined : refreshUltimo));
    refreshUltimo = pedido;
    return pedido;
  }

  // Lee una tabla entera. Supabase entrega como mucho 1000 filas por pedido,
  // así que se pide por páginas hasta tener todas (si no, al pasar las 1000
  // reservas empezarían a "desaparecer" turnos y asistencias).
  const FILAS_POR_PEDIDO = 1000;
  async function leerTabla(tabla, columnaOrden) {
    let filas = [];
    for (let vuelta = 0; vuelta < 200; vuelta++) {
      let res;
      try {
        res = await sb.from(tabla).select('*', { count: 'exact' }).order(columnaOrden).range(filas.length, filas.length + FILAS_POR_PEDIDO - 1);
      } catch (e) {
        return { data: null, error: { message: (e && e.message) || 'sin conexión' } };
      }
      if (res.error) {
        // Pedir una página que ya no existe no es un error: ahí se terminó la tabla
        if (filas.length > 0 && (res.status === 416 || res.error.code === 'PGRST103')) break;
        // Si la lectura por páginas no anduvo de entrada, se intenta la lectura simple de siempre
        if (vuelta === 0) {
          try { const simple = await sb.from(tabla).select('*'); if (!simple.error && simple.data) return { data: simple.data, error: null }; } catch (e) {}
        }
        return { data: null, error: res.error };
      }
      const pagina = res.data || [];
      filas = filas.concat(pagina);
      const total = typeof res.count === 'number' ? res.count : null;
      if (pagina.length === 0 || (total !== null ? filas.length >= total : pagina.length < FILAS_POR_PEDIDO)) break;
    }
    return { data: filas, error: null };
  }

  async function leerBase(turno, silencioso) {
    const [clientesRes, reservasRes, pagosRes, rutinasRes, planesRes, configRes, registrosProRes] = await Promise.all([
      leerTabla('clientes', 'dni'),
      leerTabla('reservas', 'id'),
      leerTabla('pagos', 'id'),
      leerTabla('rutinas', 'id'),
      leerTabla('planes', 'id'),
      leerTabla('config', 'clave'),
      leerTabla('registros_pro', 'id'),
    ]);
    if (turno !== refreshTurno) return; // ya salió una lectura más nueva

    if (clientesRes.error || reservasRes.error || pagosRes.error || rutinasRes.error || planesRes.error || configRes.error) {
      const primerError = clientesRes.error || reservasRes.error || pagosRes.error || rutinasRes.error || planesRes.error || configRes.error;
      console.error('Error leyendo Supabase:', primerError.message || primerError);
      if (!silencioso) showToast('No se pudo conectar con ORIGO. Revisá tu conexión.');
      state.errorConexion = true;
      state.data = state.data || { clientes: [], reservas: [], pagos: [], planes: [], config: [], registrosPro: [], registrosProListo: false, novedadesCompletas: null };
      return;
    }
    state.errorConexion = false;

    // Primera vez que se usa la tabla de planes: sembramos el catálogo de precios
    // (esto sí hace falta siempre — son datos reales, no de prueba)
    if (planesRes.data.length === 0) {
      await sembrarPlanesIniciales();
      return refreshData(silencioso);
    }

    const rutinasPorDni = {};
    rutinasRes.data.forEach(r => {
      (rutinasPorDni[r.dni] = rutinasPorDni[r.dni] || []).push({ id: r.id, titulo: r.titulo, url: r.url, fecha: r.fecha });
    });

    // Más nueva primero, tanto para el cliente como para administración
    Object.values(rutinasPorDni).forEach(lista => lista.sort((a, b) =>
      String(b.fecha || '').localeCompare(String(a.fecha || '')) || String(b.id).localeCompare(String(a.id))));

    state.data = {
      clientes: clientesRes.data.map(row => clienteDbToJs(row, rutinasPorDni)),
      reservas: reservasRes.data.map(reservaDbToJs),
      // false = a la tabla de reservas le faltan las columnas nuevas (no se pueden avisar cancelaciones)
      novedadesCompletas: reservasRes.data.length ? ('cancelado_en' in reservasRes.data[0]) : null,
      pagos: pagosRes.data.map(pagoDbToJs),
      planes: planesRes.data.map(p => ({ id: p.id, plan: p.plan, dias: p.dias, precio: p.precio })),
      config: configRes.data.map(c => ({ clave: c.clave, valor: c.valor })),
      // Control diario PRO. Si la tabla todavía no existe en Supabase, el resto de
      // la app sigue funcionando igual y esta parte queda desactivada.
      registrosProListo: !registrosProRes.error,
      registrosPro: registrosProRes.error ? [] : registrosProRes.data.map(r => ({
        id: r.id, dni: r.dni, fecha: r.fecha, tipo: r.tipo, valor: Number(r.valor), detalle: r.detalle || {}, creadoEn: r.creado_en,
      })),
    };
    if (registrosProRes.error) console.warn('Tabla registros_pro no disponible:', registrosProRes.error.message || registrosProRes.error);
    ultimaLectura = Date.now();
    // El cliente que tiene la sesión abierta pasa a ser el de los datos nuevos
    // (si el administrador le cambió el plan, el estado o una rutina, lo ve).
    if (state.cliente) state.cliente = state.data.clientes.find(c => c.dni === state.cliente.dni) || state.cliente;
    // Turnos fijos: se reservan solos los que falten (sin frenar la pantalla)
    setTimeout(() => generarTurnosFijos(false), 0);
  }

  // ---------------- Actualización por detrás ----------------
  // La app vuelve a leer la base al cambiar de pestaña y al volver a primer
  // plano, sin frenar la pantalla. Como máximo una vez cada REFRESCO_MINIMO_MS.
  const REFRESCO_MINIMO_MS = 10000;
  let diaDibujado = null; // día en que se dibujó la pantalla por última vez

  // true si hay algo escrito o elegido en un formulario de la pantalla: en ese
  // caso no se redibuja, para no borrar lo que la persona está cargando.
  function hayAlgoEscrito() {
    // Con el cursor en un campo de texto no se redibuja (se cerraría el teclado).
    // Un desplegable o un selector de fecha con foco pero sin cambios no cuenta.
    const activo = document.activeElement;
    if (activo && (activo.tagName === 'TEXTAREA' ||
        (activo.tagName === 'INPUT' && !/^(checkbox|radio|date|button|submit|range)$/.test(activo.type)))) return true;
    return Array.from(document.querySelectorAll('#root input, #root textarea, #root select')).some(el => {
      if (el.type === 'checkbox' || el.type === 'radio') return el.checked !== el.defaultChecked;
      if (el.tagName === 'SELECT') {
        const porDefecto = Array.from(el.options).findIndex(o => o.defaultSelected);
        return el.selectedIndex !== (porDefecto === -1 ? 0 : porDefecto);
      }
      return el.value !== el.defaultValue;
    });
  }

  async function actualizarPorDetras() {
    if (!state.data) return;
    const hoy = isoDate(ahora());
    const cambioElDia = !!diaDibujado && diaDibujado !== hoy;
    if (!cambioElDia && Date.now() - ultimaLectura < REFRESCO_MINIMO_MS) return;
    ultimaLectura = Date.now();
    const antes = JSON.stringify(state.data);
    await refreshData(true);
    avisarNovedades();
    if (!cambioElDia && JSON.stringify(state.data) === antes) return; // nada nuevo
    if (hayAlgoEscrito()) return; // los datos ya están; se ven en el próximo toque
    // Si la app quedó abierta de un día para el otro, no dejar elegido un día que ya pasó
    if (state.cliente && state.selectedDate && state.selectedDate < hoy) state.selectedDate = primerDiaConTurnos();
    redibujarConservando();
  }

  // Redibuja sin cerrar los desplegables que estaban abiertos (historial de pagos, "Al día")
  function redibujarConservando() {
    const abiertos = Array.from(document.querySelectorAll('#root details')).map(d => d.open);
    renderApp();
    const nuevos = document.querySelectorAll('#root details');
    if (nuevos.length === abiertos.length) nuevos.forEach((d, i) => { if (abiertos[i]) d.open = true; });
  }

  // Revisión liviana para administración: trae solo las reservas de la última
  // semana en adelante (que es donde puede haber novedades), no toda la base.
  async function refrescarReservasRecientes() {
    const turno = refreshTurno;
    const desde = sumarDias(isoDate(ahora()), -7);
    let res;
    try { res = await sb.from('reservas').select('*').gte('fecha', desde).order('id').range(0, FILAS_POR_PEDIDO - 1); }
    catch (e) { return false; }
    // Si mientras tanto salió una lectura completa, vale esa
    if (!res || res.error || !res.data || turno !== refreshTurno || !state.data) return false;
    if (res.data.length >= FILAS_POR_PEDIDO) return false; // demasiadas para una sola página: que lo resuelva la lectura completa
    state.data.reservas = state.data.reservas.filter(r => r.fecha < desde).concat(res.data.map(reservaDbToJs));
    return true;
  }

  // Con administración abierta se vuelve a mirar la base cada medio minuto,
  // para que las reservas y cancelaciones nuevas aparezcan solas.
  const REVISION_ADMIN_MS = 30000;
  setInterval(async () => {
    if (state.mode !== 'admin' || document.visibilityState !== 'visible' || !state.data) return;
    const antes = JSON.stringify(state.data.reservas);
    if (!(await refrescarReservasRecientes())) return;
    avisarNovedades();

  function money(n) {

  // Evita que un toque doble (o un segundo toque mientras se está guardando)
  // repita una acción: mientras la primera no termina, las siguientes se ignoran.
  let accionesEnCurso = 0;
  function unaALaVez(fn) {
    let enCurso = false;
    return async function (...args) {
      if (enCurso) return;
      enCurso = true;
      accionesEnCurso++;
      document.body.classList.add('ocupado');
      try { return await fn.apply(this, args); }
      finally {
        enCurso = false;
        accionesEnCurso--;
        if (accionesEnCurso <= 0) document.body.classList.remove('ocupado');
      }
    };
  }

  // Primer toque: el botón pide confirmar. Segundo toque (dentro de 4 segundos): se hace.
  function confirmarEnDosToques(btn, textoConfirmar, accion) {
    if (btn.dataset.confirmando === '1') { btn.dataset.confirmando = ''; btn.disabled = true; accion(); return; }
    const original = btn.textContent;
    btn.dataset.confirmando = '1';
    btn.textContent = textoConfirmar;
    btn.style.color = 'var(--red)';
    setTimeout(() => {
      if (btn.isConnected && btn.dataset.confirmando === '1') { btn.dataset.confirmando = ''; btn.textContent = original; btn.style.color = ''; }
    }, 4000);
  }

  // ---------------- Admin: Resumen ----------------
  function renderAdminResumen(data) {
    // Los usuarios de prueba no cuentan en ningún número del resumen
    const clientes = clientesReales(data);
    const reservas = reservasReales(data);
    const activos = clientes.filter(c => c.estado === 'Activo');
    const pausados = clientes.filter(c => c.estado === 'Pausado');
    const bajas = clientes.filter(c => c.estado === 'Baja');

    // Solo los activos: a un pausado o a una baja no hay cuota que reclamarle
    const cuentasDisplay = activos.map(c => cuotaDisplay(data, c.dni));
    const vencidos = cuentasDisplay.filter(e => e.estado === 'Vencido').length;
    const sinPagos = cuentasDisplay.filter(e => e.estado === 'Sin pagos').length;
    const vencePronto = cuentasDisplay.filter(e => e.prioridad === 1).length;

    const hoy = isoDate(ahora());
    const turnosHoy = reservas.filter(r => r.fecha === hoy && r.estado !== 'cancelado').length;
    const asistieronHoy = reservas.filter(r => r.fecha === hoy && estadoEfectivo(r) === 'asistio').length;

    // ---- Agenda: los próximos horarios de hoy con quiénes vienen ----
    const AGENDA_MAX = 4;
    const esFinde = [0, 6].includes(new Date(hoy + 'T00:00:00').getDay());
    const hoyActivas = reservas.filter(r => r.fecha === hoy && r.estado !== 'cancelado');
    // un horario sigue "en curso" mientras no pasó la duración del turno
    const enCurso = (hora) => turnoYaEmpezo(hoy, hora) && !turnoYaEmpezo(hoy, horaDeMinutos(minutosDe(hora) + DURACION_TURNO_MIN));
    const horasAgenda = horariosConExtras(hoyActivas).filter(h => hoyActivas.some(r => String(r.hora).slice(0, 5) === h) && (!turnoYaEmpezo(hoy, h) || enCurso(h)));
    const agendaTitulo = esFinde ? 'Hoy no hay turnos' : horasAgenda.length ? 'Próximos turnos de hoy' : 'Hoy';
    const agendaHtml = esFinde ? '' : `
        ${horasAgenda.length ? `<div class="agenda">${horasAgenda.slice(0, AGENDA_MAX).map(h => {
          const lista = hoyActivas.filter(r => String(r.hora).slice(0, 5) === h)
            .sort((a, b) => nombreDeDni(data, a.dni).localeCompare(nombreDeDni(data, b.dni), 'es'));
          return `
          <button class="agenda-fila ${enCurso(h) ? 'ahora' : ''}" data-jump-tab="asistencias" data-ir-hora="${h}">
            <span class="agenda-hora">${h}${enCurso(h) ? '<small>ahora</small>' : ''}</span>
            <span class="agenda-nombres">${lista.map(r => `<span class="${esPrimeraClase(data, r) ? 'nuevo' : ''}">${esc(nombreDeDni(data, r.dni))}</span>`).join('')}</span>
          </button>`;
        }).join('')}</div>` : `<div class="resumen-todobien" style="margin-bottom:12px;">No quedan turnos por hoy.</div>`}
        <div class="agenda-pie">
          <span>${turnosHoy} ${turnosHoy === 1 ? 'reservado' : 'reservados'} hoy · ${asistieronHoy} ${asistieronHoy === 1 ? 'asistió' : 'asistieron'}${horasAgenda.length > AGENDA_MAX ? ` · ${horasAgenda.length - AGENDA_MAX} horarios más` : ''}</span>
          <button class="cancel-link" data-jump-tab="asistencias">Ver todo →</button>
        </div>`;

    // ---- Clientes activos que dejaron de venir ----
    // Última clase hace más de DIAS_SIN_VENIR días y sin turnos reservados por delante.
    // (El que nunca vino no entra: no hay forma de saber desde cuándo es cliente.)
    const DIAS_SIN_VENIR = 14;
    const noVienen = activos.map(c => {
      const mias = reservas.filter(r => r.dni === c.dni && r.estado !== 'cancelado');
      if (mias.some(r => estadoEfectivo(r) === 'reservado')) return null;
      const ultima = mias.filter(r => estadoEfectivo(r) === 'asistio').map(r => r.fecha).sort().pop();
      if (!ultima) return null;
      const dias = diasEntre(ultima, hoy);
      return dias > DIAS_SIN_VENIR ? { c, ultima, dias } : null;
    }).filter(Boolean).sort((a, b) => b.dias - a.dias);
    const noVienenHtml = !noVienen.length ? '' : `
        <details class="cuota-card novienen-card">
          <summary><span class="resumen-atencion-num" style="color:var(--violeta);">${noVienen.length}</span>
            <span>${noVienen.length === 1 ? 'cliente no viene' : 'clientes no vienen'} hace más de 2 semanas</span><span class="resumen-atencion-arrow">Ver</span></summary>
          ${noVienen.map(x => `
          <div class="pago-fila">
            <div>
              <button class="nombre-link p1" data-ficha-dni="${x.c.dni}">${esc(x.c.nombre)}</button>
              <div class="p2">Última clase: ${formatFechaCorta(x.ultima)} · hace ${x.dias} días</div>
            </div>
            ${botonWhatsapp(x.c.telefono, 'Hola ' + primerNombre(x.c.nombre) + '! Te extrañamos en ORIGO. ¿Querés que te reservemos un turno esta semana? Avisanos qué día y horario te queda bien.', 'Escribirle')}
          </div>`).join('')}
        </details>`;

    const pausasVencidas = pausados.filter(c => diasPausado(c) > MAX_DIAS_PAUSA).length;
    const sinMatricula = matriculaActiva() ? activos.filter(c => !(c.matricula && c.matricula.pagada)).length : 0;

    // Lista de cosas que requieren una decisión o acción, ordenadas por urgencia
    const itemsAtencion = [
      { count: vencidos + sinPagos, label: (vencidos+sinPagos)===1 ? 'cliente con la cuenta vencida o sin pagos' : 'clientes con la cuenta vencida o sin pagos', tab: 'cuotas', sev: 'urgente' },
      { count: pausasVencidas, label: pausasVencidas===1 ? 'pausa superó el límite de 3 meses' : 'pausas superaron el límite de 3 meses', tab: 'clientes', sev: 'urgente' },
      { count: vencePronto, label: vencePronto===1 ? 'cliente con la cuota por vencer o para pagar' : 'clientes con la cuota por vencer o para pagar', tab: 'cuotas', sev: 'atencion' },
      { count: sinMatricula, label: sinMatricula===1 ? 'cliente sin matrícula pagada' : 'clientes sin matrícula pagada', tab: 'clientes', sev: 'atencion' },
    ].filter(i => i.count > 0);

    const atencionHtml = itemsAtencion.length
      ? itemsAtencion.map(i => `
          <button class="resumen-atencion-item sev-${i.sev}" data-jump-tab="${i.tab}">
            <span class="resumen-atencion-num">${i.count}</span>
            <span class="resumen-atencion-label">${i.label}</span>
            <span class="resumen-atencion-arrow">Ver →</span>
          </button>`).join('')
      : `<div class="resumen-todobien">Todo en orden — no hay nada urgente para hoy.</div>`;

    return `
        <p class="sub">${fechaCompleta(hoy)}</p>

        <div class="resumen-atencion-list">${atencionHtml}</div>
        ${noVienenHtml}

        <h2 style="font-size:16px; margin-top:4px;">${agendaTitulo}</h2>
        ${agendaHtml}
        <button class="resumen-hero" data-jump-tab="clientes" style="width:100%; text-align:left; cursor:pointer; font-family:inherit; color:inherit;">
          <div class="resumen-hero-label">Clientes activos</div>
          <div class="resumen-hero-num">${activos.length}</div>
          <div class="resumen-hero-sub">${pausados.length} pausados · ${bajas.length} de baja · lo cobrado está en Cuotas</div>
        </button>

        <h2 style="font-size:16px; margin-top:24px;">Datos</h2>
        <button class="btn btn-ghost" id="backupBtn" style="width:100%;">Descargar copia de seguridad (.json)</button>
    `;
  }

  function asistenciaMesResumen(data, dni) {
    const hoy = ahora();
    const mesActual = hoy.getMonth();
    const anioActual = hoy.getFullYear();
    const asistencias = data.reservas.filter(r => {
      if (r.dni !== dni || estadoEfectivo(r) !== 'asistio') return false;
      const d = new Date(r.fecha + 'T00:00:00');
      return d.getMonth() === mesActual && d.getFullYear() === anioActual;
    }).sort((a, b) => b.fecha.localeCompare(a.fecha));
    return { cantidad: asistencias.length, ultima: asistencias[0] ? asistencias[0].fecha : null };
  }

  // ---------------- Admin: Clientes (lista + ficha) ----------------
  function iniciales(nombre) {
    const p = String(nombre || '').trim().split(/\s+/).filter(Boolean);
    return ((p[0] || '?')[0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase();
  }

  function textoPlan(c) {
    return c.plan + ' · ' + (c.dias ? c.dias + (c.dias === 1 ? ' día/sem' : ' días/sem') : 'Integral');
  }

  function textoCuotaCorto(cuenta) {
    return ({ 'Al día': 'Cuota al día', 'Vence pronto': 'Cuota vence pronto', 'Para pagar': 'Cuota para pagar',
              'Vencido': 'Cuota vencida', 'Sin pagos': 'Sin pagos' })[cuenta.label] || cuenta.label;
  }

  function abrirFicha(dni, tab) {
    if (state.fichaDni !== dni) state.fichaMes = null;
    state.adminTab = 'clientes';
    if (state.fijosEditando && state.fijosEditando.dni !== dni) state.fijosEditando = null;
    state.fichaDni = dni;
    state.fichaTab = tab || 'resumen';
    state.editingDni = state.fichaTab === 'editar' ? dni : null;
    state.confirmarEliminarDni = null;
    state.confirmarRutinaId = null;
    state.adminFormError = '';
    state.adminFormNotice = '';
  }

  function cerrarFicha() {
    state.fijosEditando = null;
    state.fichaDni = null;
    state.fichaTab = 'resumen';
    state.fichaMes = null;
    state.editingDni = null;
    state.confirmarEliminarDni = null;
    state.confirmarRutinaId = null;
  }

  // Formulario de datos del cliente. Se usa para el alta (editing = null) y en la pestaña Editar de la ficha.
  function formClienteHtml(editing, formError) {
    // Alta de un cliente nuevo que ya estaba anotado en Turnos: nombre y teléfono ya cargados
    const pre = !editing && state.altaProspecto ? datosProspecto(state.altaProspecto) : null;
    const nTurnos = pre ? state.data.reservas.filter(r => r.dni === state.altaProspecto && r.estado !== 'cancelado').length : 0;
    return `
          ${pre ? `<div class="aviso-alta">Alta de <b>${esc(pre.nombre)}</b>, que estaba anotado como cliente nuevo.${nTurnos ? (nTurnos === 1 ? ' Su turno anotado pasa a su ficha.' : ` Sus ${nTurnos} turnos anotados pasan a su ficha.`) : ''} Completá DNI, contraseña y plan.</div>` : ''}
          <div class="admin-field-grid">
            <label>DNI<input type="text" id="fDni" inputmode="numeric" placeholder="Ej: 12345678" value="${editing?esc(editing.dni):''}" autocomplete="off"></label>
            <label>Contraseña<input type="text" id="fPass" placeholder="${editing?'Dejar en blanco para no cambiarla':'Elegí una contraseña'}" value=""></label>
            <label class="span2">Nombre y apellido<input type="text" id="fNombre" placeholder="Ej: María Gómez" value="${editing?esc(editing.nombre):pre?esc(pre.nombre):''}"></label>
            <label>Email<input type="text" id="fEmail" placeholder="Ej: maria@mail.com" value="${editing?esc(editing.email||''):''}"></label>
            <label>Teléfono<input type="text" id="fTelefono" placeholder="Ej: 341-1234567" value="${editing?esc(editing.telefono||''):pre?esc(pre.telefono):''}"></label>
            <label>Plan
              <select id="fPlan">
                <option value="START" ${editing&&editing.plan==='START'?'selected':''}>START</option>
                <option value="PERFORMANCE 2" ${editing&&editing.plan==='PERFORMANCE 2'?'selected':''}>PERFORMANCE 2</option>
                <option value="PERFORMANCE 3" ${editing&&editing.plan==='PERFORMANCE 3'?'selected':''}>PERFORMANCE 3</option>
                <option value="PRO" ${editing&&editing.plan==='PRO'?'selected':''}>PRO</option>
              </select>
            </label>
            <label>Días presenciales / sem
              <select id="fDias" ${editing&&editing.plan==='PRO'?'disabled':''}>
                <option value="1" ${editing&&editing.dias===1?'selected':''}>1</option>
                <option value="2" ${editing&&editing.dias===2?'selected':''}>2</option>
                <option value="3" ${(!editing&&true)||(editing&&editing.dias===3)?'selected':''}>3</option>
                <option value="4" ${editing&&editing.dias===4?'selected':''}>4</option>
                <option value="5" ${editing&&editing.dias===5?'selected':''}>5</option>
              </select>
            </label>
            <label>Estímulos Fuerza<input type="number" id="fFuerza" min="0" max="10" value="${editing&&editing.estimulos?editing.estimulos.fuerza:0}"></label>
            <label>Estímulos Resistencia<input type="number" id="fResistencia" min="0" max="10" value="${editing&&editing.estimulos?editing.estimulos.resistencia:0}"></label>
            <label>Estímulos Velocidad<input type="number" id="fVelocidad" min="0" max="10" value="${editing&&editing.estimulos?editing.estimulos.velocidad:0}"></label>
            <label>Estado
              <select id="fEstado">
                <option value="Activo" ${!editing||editing.estado==='Activo'?'selected':''}>Activo</option>
                <option value="Pausado" ${editing&&editing.estado==='Pausado'?'selected':''}>Pausado</option>
                <option value="Baja" ${editing&&editing.estado==='Baja'?'selected':''}>Baja</option>
              </select>
            </label>
            <label class="span2">Límite semanal de turnos (excepción)
              <input type="number" id="fLimiteSemanal" min="0" max="20" placeholder="Vacío = automático según estímulos contratados"
                value="${editing&&editing.limiteSemanalOverride!=null?editing.limiteSemanalOverride:''}">
            </label>
            <label class="span2">Cuota especial por mes (excepción)
              <input type="text" inputmode="numeric" id="fCuotaEspecial" placeholder="Vacío = el precio de su plan" autocomplete="off"
                value="${editing && cuotaEspecialEfectiva(editing) ? cuotaEspecialEfectiva(editing) : ''}">
            </label>
            <label class="span2" style="flex-direction:row; align-items:center; gap:8px;">
              <input type="checkbox" id="fPrueba" style="width:auto;" ${editing&&esPrueba(editing.dni)?'checked':''}>
              Usuario de prueba (para mostrar la app: nunca figura con deuda ni cuenta en los números)
            </label>
          </div>
          ${!editing ? `
          <div class="divider"></div>
          <div class="admin-field-grid">
            <label>Pago inicial
              <select id="fDuracionPago">
                <option value="">Sin pago inicial (registrar después)</option>
                ${opcionesDuracionHtml(todayMidnight(), null)}
              </select>
            </label>
            <label>Método de pago
              <select id="fMetodoPago">
                ${METODOS_PAGO.map(m => `<option value="${m}">${m}</option>`).join('')}
              </select>
            </label>
            ${matriculaActiva() ? `
            <label class="span2" style="flex-direction:row; align-items:center; gap:8px;">
              <input type="checkbox" id="fMatriculaPagada" style="width:auto;">
              Matrícula pagada (${money(matriculaPrecio())})
            </label>` : ''}
          </div>
          ` : ''}
          <div class="divider"></div>
          <div class="kv-row"><span class="k">Cuota calculada</span><span class="v" id="fPrecioPreview">—</span></div>
          ${!editing ? `<div class="kv-row"><span class="k">Pago inicial</span><span class="v"><span id="fPagoInicialMonto">—</span>
            <label class="monto-editable" id="fMontoInicialCaja" style="display:none;">$<input type="text" inputmode="numeric" class="monto-input" id="fMontoInicial" autocomplete="off"></label></span></div>
          <div class="pago-detalle monto-diff" id="fMontoInicialDif"></div>
          <div class="pago-detalle" id="fPagoInicialDetalle" style="margin-bottom:6px;"></div>` : ''}
          <div class="error-text" id="formClienteError">${formError || ''}</div>
          <div style="display:flex; gap:10px; margin-top:10px;">
            <button class="btn btn-primary" id="addClienteBtn" style="flex:1;">${editing ? 'Guardar cambios' : 'Agregar cliente'}</button>
            ${editing ? `<button class="btn btn-ghost" id="cancelEditBtn">Cancelar</button>` : ''}
          </div>`;
  }

  function avisoListoHtml(formNotice) {
    return formNotice ? `<div class="banner" style="border-color:var(--green); background:rgba(47,111,237,0.1);"><b style="color:var(--green);">Listo</b>${formNotice}</div>` : '';
  }

  function confirmarEliminarHtml(c) {
    return `
      <div class="banner" style="margin:0;">
        <b>¿Eliminar a ${esc(c.nombre)}?</b>Se borra el cliente con sus datos de acceso y no se puede deshacer. Si solo dejó de venir, conviene pasarlo a "Baja".
        <div style="display:flex; gap:10px; margin-top:12px;">
          <button class="btn btn-ghost" data-del-no="1" style="flex:1;">Cancelar</button>
          <button class="btn btn-primary" data-del-si="${c.dni}" style="flex:1; background:var(--red);">Sí, eliminar</button>
        </div>
      </div>`;
  }

  // Tarjeta de un cliente en la lista: toda la tarjeta abre su ficha
  function tarjetaCliente(data, c) {
    const asist = asistenciaMesResumen(data, c.dni);
    const asistTexto = asist.cantidad > 0
      ? `${asist.cantidad} ${asist.cantidad === 1 ? 'asistencia' : 'asistencias'} este mes · última ${formatFechaCorta(asist.ultima)}`
      : 'Sin asistencias este mes';

    const pills = [pillForEstado(c.estado)];
    if (esPrueba(c.dni)) {
      pills.push('<span class="pill pill-amber">Usuario de prueba</span>');
    } else if (c.estado !== 'Baja') {
      const cuenta = cuotaDisplay(data, c.dni);
      pills.push(`<span class="pill ${cuenta.pill}">${textoCuotaCorto(cuenta)}</span>`);
      if (matriculaActiva() && !(c.matricula && c.matricula.pagada)) pills.push('<span class="pill pill-red">Matrícula impaga</span>');
    }

    let pausaHtml = '';
    if (c.estado === 'Pausado' && c.pausadoDesde) {
      const dias = diasPausado(c);
      const vencida = dias > MAX_DIAS_PAUSA;
      pausaHtml = `<span class="cli-meta" style="${vencida ? 'color:var(--red); font-weight:600;' : ''}">${
        vencida ? `Pausado hace ${dias} días — superó el límite de 3 meses` : `Pausado hace ${dias} días (máximo ${MAX_DIAS_PAUSA})`}</span>`;
    }

    return `
      <button class="cli-card ${c.estado === 'Baja' ? 'baja' : ''}" data-ficha-dni="${c.dni}">
        <span class="cli-avatar">${esc(iniciales(c.nombre))}</span>
        <span class="cli-main">
          <span class="cli-nombre">${esc(c.nombre)}</span>
          <span class="cli-meta">${esc(textoPlan(c))} · ${asistTexto}</span>
          ${pausaHtml}
          <span class="cli-pills">${pills.join('')}</span>
        </span>
        <span class="cli-chevron">${ICONOS.der}</span>
      </button>`;
  }

  function renderAdminClientes(data, formError, formNotice) {
    if (state.fichaDni) {
      const cliente = data.clientes.find(c => c.dni === state.fichaDni);
      if (cliente) return renderFichaCliente(data, cliente, formError, formNotice);
      cerrarFicha(); // el cliente ya no existe
    }

    const q = state.clienteBusqueda.trim().toLowerCase();
    const orden = { Activo: 0, Pausado: 1, Baja: 2 };
    const clientesFiltrados = (q
      ? data.clientes.filter(c => c.nombre.toLowerCase().includes(q) || c.dni.includes(q))
      : data.clientes
    ).slice().sort((a, b) => (orden[a.estado] ?? 3) - (orden[b.estado] ?? 3) || a.nombre.localeCompare(b.nombre, 'es'));

    const tarjetas = clientesFiltrados.map(c => tarjetaCliente(data, c)).join('')
      || `<div class="empty-state">${q ? `Ningún cliente coincide con "${esc(state.clienteBusqueda)}".` : 'Todavía no hay clientes cargados.'}</div>`;

    const altaHtml = state.nuevoClienteAbierto ? `
        <div class="profile-card" style="margin-bottom:20px;">
          <div class="cuota-top" style="margin-bottom:14px;">
            <div class="cuota-nombre" style="font-size:16px;">Nuevo cliente</div>
            <button class="cancel-link" id="cerrarNuevoBtn">Cerrar</button>
          </div>
          ${formClienteHtml(null, formError)}
        </div>` : `
        <button class="btn btn-primary" id="nuevoClienteBtn" style="width:100%; margin-bottom:20px;">+ Nuevo cliente</button>`;

    return `
        <p class="sub">Tocá un cliente para ver su ficha completa</p>
        ${avisoListoHtml(formNotice)}
        ${altaHtml}
        <h2 style="font-size:16px;">Clientes (${clientesFiltrados.length}${q ? ' de ' + data.clientes.length : ''})</h2>
        <input type="text" id="clienteBuscar" class="date-input" placeholder="Buscar por nombre o DNI..." value="${esc(state.clienteBusqueda)}" style="margin-bottom:12px;">
        <div class="cli-list">${tarjetas}</div>
    `;
  }

  // ---------------- Admin: Ficha del cliente ----------------
  function renderFichaCliente(data, c, formError, formNotice) {
    const tab = state.fichaTab || 'resumen';
    const prueba = esPrueba(c.dni);
    const cuenta = cuotaDisplay(data, c.dni);
    const mias = data.reservas.filter(r => r.dni === c.dni && r.estado !== 'cancelado');
    const ctx = {
      prueba, cuenta, mias,
      pagos: pagosDe(data, c.dni),
      rutinas: c.rutinas || [],
      proximas: mias.filter(r => estadoEfectivo(r) === 'reservado').sort((a, b) => (a.fecha + a.hora).localeCompare(b.fecha + b.hora)),
      asistencias: mias.filter(r => estadoEfectivo(r) === 'asistio'),
    };

    const contacto = [
      c.telefono ? `<a href="tel:${esc(String(c.telefono).replace(/[^\d+]/g, ''))}">${esc(c.telefono)}</a>` : '',
      c.email ? `<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>` : '',
    ].filter(Boolean).join(' · ');

    const pills = [];
    if (prueba) pills.push('<span class="pill pill-amber">Usuario de prueba</span>');
    else if (c.estado !== 'Baja') {
      pills.push(`<span class="pill ${cuenta.pill}">${textoCuotaCorto(cuenta)}</span>`);
      if (matriculaActiva() && !(c.matricula && c.matricula.pagada)) pills.push('<span class="pill pill-red">Matrícula impaga</span>');
    }

    let pausaHtml = '';
    if (c.estado === 'Pausado' && c.pausadoDesde) {
      const dias = diasPausado(c);
      const vencida = dias > MAX_DIAS_PAUSA;
      pausaHtml = `<div class="cli-meta" style="margin:-6px 0 14px; ${vencida ? 'color:var(--red); font-weight:600;' : ''}">${
        vencida ? `Pausado hace ${dias} días — superó el límite de 3 meses` : `Pausado hace ${dias} días (máximo ${MAX_DIAS_PAUSA})`}</div>`;
    }

    const tabs = [['resumen', 'Resumen'], ['pagos', 'Pagos'], ['asistencias', 'Asistencias'], ['rutinas', 'Rutinas'], ['editar', 'Editar']];
    const nombresOrigen = { cuotas: 'Volver a Cuotas', asistencias: 'Volver a Turnos', pro: 'Volver a Pro' };

    let cuerpo;
    if (tab === 'pagos') cuerpo = fichaPagos(data, c, ctx);
    else if (tab === 'asistencias') cuerpo = fichaAsistencias(data, c, ctx);
    else if (tab === 'rutinas') cuerpo = fichaRutinas(data, c, ctx);
    else if (tab === 'editar') cuerpo = fichaEditar(data, c, formError, formNotice);
    else cuerpo = fichaResumen(data, c, ctx);

    return `
      <div class="ficha">
        <button class="link-btn" id="fichaVolverBtn">← ${nombresOrigen[state.fichaOrigen] || 'Todos los clientes'}</button>
        <div class="ficha-head">
          <span class="cli-avatar grande">${esc(iniciales(c.nombre))}</span>
          <div class="ficha-head-info">
            <div class="ficha-nombre">${esc(c.nombre)}</div>
            <div class="cli-meta">DNI ${esc(c.dni)} · ${esc(textoPlan(c))}</div>
            ${contacto ? `<div class="cli-meta ficha-contacto">${contacto}</div>` : ''}
          </div>
        </div>
        <div class="ficha-estado">
          <select class="estado-select estado-${c.estado.toLowerCase()}" data-estado-dni="${c.dni}" aria-label="Estado del cliente">
            <option value="Activo" ${c.estado==='Activo'?'selected':''}>Activo</option>
            <option value="Pausado" ${c.estado==='Pausado'?'selected':''}>Pausado</option>
            <option value="Baja" ${c.estado==='Baja'?'selected':''}>Baja</option>
          </select>
          ${pills.join('')}
        </div>
        ${pausaHtml}
        <div class="seg ficha-tabs">
          ${tabs.map(([id, label]) => `<button class="seg-btn ${tab === id ? 'active' : ''}" data-ficha-tab="${id}">${label}</button>`).join('')}
        </div>
        ${cuerpo}
      </div>`;
  }

  function rutinaHost(url) {
    try { return new URL(url).hostname.replace(/^www\./, ''); } catch (e) { return ''; }
  }

  function fichaResumen(data, c, ctx) {
    const hoyIso = isoDate(ahora());
    const esteMes = ctx.asistencias.filter(r => r.fecha.slice(0, 7) === hoyIso.slice(0, 7)).length;
    const limite = limiteSemanalDe(c);
    const turnosSemana = reservasEnSemana(data, c.dni, hoyIso).length;
    const racha = rachaSemanas(ctx.asistencias);
    const ultimoPago = ctx.pagos[0] || null;

    const matriculaHtml = !matriculaActiva() ? '' : (c.matricula && c.matricula.pagada)
      ? `<div class="kv-row"><span class="k">Matrícula</span><span class="v">Pagada el ${formatFechaCorta(c.matricula.fechaPago)}</span></div>`
      : `<div class="kv-row"><span class="k">Matrícula</span><span class="v" style="color:var(--red);">Sin pagar · <button class="cancel-link" data-matricula-dni="${c.dni}">Registrar (${money(matriculaPrecio())})</button></span></div>`;

    const turnosHtml = ctx.proximas.length
      ? ctx.proximas.slice(0, 3).map(r => `<div class="kv-row"><span class="k">${fechaLarga(r.fecha)}</span><span class="v">${String(r.hora).slice(0, 5)} hs${esTurnoFijo(r) ? '<span class="tag-fijo">fijo</span>' : ''}</span></div>`).join('')
        + (ctx.proximas.length > 3 ? `<div class="pago-detalle" style="margin-top:4px;">y ${ctx.proximas.length - 3} más</div>` : '')
      : `<div class="pago-detalle">No tiene turnos reservados.</div>`;

    const r0 = ctx.rutinas[0];
    const rutinaHtml = r0 ? `
          <div class="rutina-adm-top" style="margin-top:4px;">
            <div style="min-width:0;">
              <div class="rutina-card-titulo">${esc(r0.titulo)}</div>
              <div class="rutina-card-fecha">${r0.fecha ? 'Cargada el ' + formatFecha(r0.fecha) : ''}</div>
            </div>
            <a class="btn btn-primary rutina-abrir" href="${esc(r0.url)}" target="_blank" rel="noopener">Abrir</a>
          </div>` : `<div class="pago-detalle">Todavía no tiene rutinas cargadas.</div>`;

    const proHtml = !(CONTROL_PRO_ACTIVO && esPro(c)) ? '' : `
        <div class="cuota-card ficha-card">
          <div class="cuota-nombre" style="margin-bottom:10px;">Control diario · últimos 7 días</div>
          ${data.registrosProListo ? tablaUltimosDiasPro(data, c.dni, hoyIso) : '<div class="pago-detalle">El control diario todavía no está activado en la base.</div>'}
        </div>`;

    const estimulosHtml = c.estimulos ? `
          <div class="estimulos-grid" style="margin:6px 0 4px;">
            <div class="estimulo-chip"><span class="num">${c.estimulos.fuerza}</span>Fuerza / sem</div>
            <div class="estimulo-chip"><span class="num">${c.estimulos.resistencia}</span>Resist. / sem</div>
            <div class="estimulo-chip"><span class="num">${c.estimulos.velocidad}</span>Veloc. / sem</div>
          </div>` : '';

    return `
        <div class="asis-stats">
          <div class="asis-stat"><span class="num">${esteMes}</span><span class="lbl">${esteMes === 1 ? 'asistencia' : 'asistencias'} este mes</span></div>
          <div class="asis-stat"><span class="num">${turnosSemana}${isFinite(limite) ? `<small>/${limite}</small>` : ''}</span><span class="lbl">turnos esta semana</span></div>
          <div class="asis-stat"><span class="num">${racha}</span><span class="lbl">${racha === 1 ? 'semana seguida' : 'semanas seguidas'}</span></div>
        </div>

        <div class="cuota-card ficha-card">
          <div class="cuota-top">
            <div class="cuota-nombre">Cuota</div>
            <span class="pill ${ctx.cuenta.pill}">${ctx.cuenta.label}</span>
          </div>
          ${ctx.prueba ? `<div class="pago-detalle" style="margin-bottom:6px;">Usuario de prueba: no figura en Cuotas ni suma en lo cobrado.</div>` : ''}
          <div class="kv-row"><span class="k">Plan</span><span class="v">${esc(c.plan)} · ${money(c.precio || 0)} / mes</span></div>

  async function guardarFijosDesdeFicha(dni) {
    const ed = state.fijosEditando;
    if (!ed || ed.dni !== dni) return;
    const lista = Object.keys(ed.sel).filter(k => ed.sel[k]).map(k => {
      const [dia, hora] = k.split('|');
      return { dia: parseInt(dia, 10), hora };
    });
    const antes = fijosDe(dni);
    const ok = await guardarFijos(dni, lista);
    // Los turnos fijos ya reservados de horarios que se sacaron se cancelan
    const sigue = (r) => {
      const d = new Date(r.fecha + 'T00:00:00').getDay();
      return lista.some(f => f.dia === d && f.hora === String(r.hora).slice(0, 5));
    };
    const sacar = state.data.reservas.filter(r => r.dni === dni && esTurnoFijo(r) && r.estado === 'reservado'
      && !turnoYaEmpezo(r.fecha, r.hora) && !sigue(r));
    for (const r of sacar) { state.misAcciones['c-' + r.id] = true; await marcarCancelada(r.id); }
    await refreshData();
    state.fijosEditando = null;
    await generarTurnosFijos(true);
    const ahoraFijos = fijosDe(dni);
    const nuevos = state.data.reservas.filter(r => r.dni === dni && esTurnoFijo(r) && r.estado === 'reservado' && !turnoYaEmpezo(r.fecha, r.hora)).length;
    showToast(!ok ? 'No se pudieron guardar todos los días fijos. Probá de nuevo.'
      : !ahoraFijos.length ? (antes.length ? 'Ya no tiene días fijos.' + (sacar.length ? ' Se cancelaron sus turnos fijos reservados.' : '') : 'Sin días fijos.')
      : 'Días fijos guardados. Tiene ' + nuevos + (nuevos === 1 ? ' turno fijo reservado' : ' turnos fijos reservados') + ' en las semanas que se pueden reservar.');
    renderApp();
  }
